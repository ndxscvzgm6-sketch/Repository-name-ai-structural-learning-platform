const A=(t,c)=>`<div class="call ${c}"><span class="tag">${t}</span>`;
const E=`</div>`;
const CASE=(h,t)=>`<div class="case"><p class="ch">${h}</p><b class="t">${t}</b>`;

const COURSE=[
/* ================= UNIT A ================= */
{unit:"Unit A · The Discipline", id:"a1", n:"A1",
 title:"What mission-critical means",
 sub:"A consequence class, not a building type — and a discipline with its own physics, economics, and culture.",
 min:14,
 objectives:[
  "Define mission-critical by consequence of failure, not by facility type",
  "Map the family of mission-critical facilities and what each protects",
  "Understand the discipline's three pillars: design topology, physical infrastructure, operations"
 ],
 body:`
 <p><strong>Mission-critical facility engineering</strong> is the discipline of designing, building, and operating facilities where interruption is not an inconvenience but a catastrophe — measured in lives, in millions of dollars per hour, or in national consequence. The defining question is never "what does this building do?" It is: <strong>"what happens in the first sixty seconds after it stops?"</strong></p>
 <p>Answer that question honestly and everything else in this program follows: the redundancy, the generators, the commissioning rituals, the operating discipline, and the money.</p>

 <h3>The family of mission-critical facilities</h3>
 <div class="scroll"><table class="data">
  <tr><th>Facility</th><th>What stopping means</th><th>Signature systems</th></tr>
  <tr><td><b>Data centers</b> (hyperscale, colo, enterprise, edge)</td><td>Digital services down; for AI training, a multi-week run lost; SLA penalties; ~$1M+/hr for major operators</td><td>UPS, generators, chilled water/liquid cooling, fire suppression sized around live electronics</td></tr>
  <tr><td><b>Hospitals</b></td><td>Life support, ORs, imaging fail — people die; codes mandate essential power (NEC Art. 517, NFPA 99/110)</td><td>Essential electrical system with life-safety/critical/equipment branches, 10-second generator pickup</td></tr>
  <tr><td><b>Semiconductor fabs</b></td><td>A voltage sag of milliseconds scraps wafer batches worth millions; restart takes days</td><td>Ultra-clean power, vibration-isolated slabs (nm-level tools), ultrapure water, bulk gases</td></tr>
  <tr><td><b>Trading floors / financial processing</b></td><td>Market access lost; regulatory exposure; the 2023 Equinix Singapore outage froze 2.5M bank transactions</td><td>2N power chains, diverse network paths, tight change control</td></tr>
  <tr><td><b>Control centers</b> (grid, air traffic, 911, rail)</td><td>The operators who manage everyone else's emergency go blind</td><td>Hardened construction, redundant everything, human-factors design</td></tr>
  <tr><td><b>Labs / pharma / biobanks</b></td><td>Decades of samples or a production batch lost to hours of warm freezer</td><td>Redundant cooling/power for cold chains, environmental monitoring</td></tr>
 </table></div>
 <p>You are aiming at data centers, but hiring managers think of this as <em>one</em> discipline — the same reliability logic, the same commissioning culture, the same acronyms move across all of these. Fluency transfers, and so do careers.</p>

 ${A("The three pillars — hold this structure","pw")}
 <p>Everything in this program hangs on three pillars. <strong>1) Topology</strong>: the redundancy architecture on paper (N+1, 2N, concurrent maintainability) — Unit E. <strong>2) Physical infrastructure</strong>: the electrical and mechanical machines that implement the topology — Units B and C. <strong>3) Operations</strong>: the humans, procedures, and maintenance that keep the promise for 20 years — Unit E. Facilities fail when any one pillar is weak. The industry's dirty secret, which you'll see in the outage data (A3), is that the third pillar fails most often.</p>
 ${E}

 <h3>The economics that justify everything</h3>
 <p>Mission-critical infrastructure looks absurdly overbuilt until you price downtime. Industry surveys consistently put a majority of serious outages above <strong>$100,000 per incident</strong>, with a growing share above $1M. Single famous incidents run far higher: Delta Air Lines' 2016 Atlanta data center power failure grounded ~2,000 flights and was reported at <strong>~$150M</strong>; British Airways' 2017 power-handling error stranded 75,000 passengers over a holiday weekend. Against numbers like that, a second generator plant, a third chiller, and a permanent commissioning team are cheap insurance.</p>
 <p>That asymmetry — <em>infrastructure cost is trivial next to failure cost</em> — is the economic engine of the entire sector, and the reason its engineers are paid above the market for ordinary buildings.</p>

 ${A("Structural Angle","se")}
 <p>For the structural engineer, "mission-critical" translates to: the building itself is treated as a component of a machine whose availability is being purchased. Your Risk Category, your equipment anchorage, your vibration limits, and your maintainability provisions (removal paths, hoist beams) are all downstream of a business decision about consequence. Learn to trace every structural requirement back to the consequence it protects against — that's how owner's engineers argue for (or against) cost.</p>
 ${E}
 `,
 terms:[

 ],

  {q:"The three pillars of the discipline are:",
   o:["Steel, concrete, glass","Topology, physical infrastructure, operations","Power, water, gas","Design, permits, marketing"],a:1,

  {q:"Why does the economics justify seemingly overbuilt infrastructure?",
   o:["Materials are cheap","Failure cost (often $100k–$150M per incident) dwarfs infrastructure cost","Codes require gold plating","It doesn't"],a:1,
   e:"Delta's 2016 outage was reported near $150M. Against that, redundant plants are cheap insurance — the economic engine of the sector."},
  {q:"Which is NOT typically a mission-critical facility?",
   o:["A semiconductor fab","A hospital","A 911 control center","A suburban strip mall"],a:3,
   e:"Fabs, hospitals, and control centers all carry severe consequence of interruption; a strip mall does not."}
 ]
},
{unit:"Unit A · The Discipline", id:"a2", n:"A2",
 title:"The mathematics of availability",
 sub:"Nines, MTBF, and why topology beats better components every time.",
 min:15,
 objectives:[
  "Convert between availability percentages and downtime ('the nines')",
  "Use MTBF/MTTR to compute availability of a component",
  "Combine components in series and parallel — and see why redundancy is the only way up"
 ],
 body:`
 <p>Reliability talk sounds qualitative until someone opens a spreadsheet. This lesson gives you the four equations that underlie every Tier rating, every redundancy debate, and every "five nines" claim. They are simple — and once you can run them, you can out-argue most people in the room.</p>

 <h3>1. The nines</h3>
 <p><strong>Availability</strong> = fraction of time the service is up. The industry counts in "nines":</p>
 <div class="scroll"><table class="data">
  <tr><th>Availability</th><th>Name</th><th>Downtime per year</th></tr>
  <tr><td class="n">99%</td><td>two nines</td><td class="n">~3.65 days</td></tr>
  <tr><td class="n">99.9%</td><td>three nines</td><td class="n">~8.77 hours</td></tr>
  <tr><td class="n">99.99%</td><td>four nines</td><td class="n">~52.6 minutes</td></tr>
  <tr><td class="n">99.999%</td><td>five nines</td><td class="n">~5.26 minutes</td></tr>
  <tr><td class="n">99.9999%</td><td>six nines</td><td class="n">~31.6 seconds</td></tr>
 </table></div>
 <p>Each added nine costs roughly an order of magnitude more engineering and discipline. Knowing that 99.99% still allows nearly an hour a year reframes what "reliable" means.</p>

 <h3>2. Component availability: MTBF and MTTR</h3>
 <p><strong>MTBF</strong> (Mean Time Between Failures) is how long a component typically runs before failing. <strong>MTTR</strong> (Mean Time To Repair) is how long it stays broken. Then:</p>
 <p class="mono" style="font-size:16px;background:var(--amberSoft);padding:10px 14px;border-radius:8px;display:inline-block">A = MTBF / (MTBF + MTTR)</p>
 <p><em>Worked example:</em> a UPS with MTBF = 100,000 hours (~11.4 years) and MTTR = 8 hours: A = 100,000 / 100,008 = <strong>99.992%</strong>. Sounds superb — until you put it in series with everything else.</p>

 <h3>3. Series: the chain multiplies down</h3>
 <p>Systems in <strong>series</strong> (each one needed) multiply availabilities: <span class="mono">A_total = A₁ × A₂ × A₃…</span></p>
 <p><em>Worked example:</em> utility interface 99.98% × switchgear 99.99% × UPS 99.992% × PDU 99.995% × busway 99.999% ≈ <strong>99.956%</strong> — about 3.9 hours of expected downtime a year, from five individually excellent components. <strong>Chains only get worse.</strong> This is the mathematical reason a single-path facility can never be truly high-availability, no matter how premium its equipment.</p>

 <h3>4. Parallel: redundancy multiplies the failure probabilities</h3>
 <p>Redundant systems in <strong>parallel</strong> (either can carry the load) fail only if <em>both</em> fail: <span class="mono">A_pair = 1 − (1−A)²</span></p>
 <p><em>Worked example:</em> one 99.95% power path → ~4.4 hr/yr down. Two independent 99.95% paths → 1 − (0.0005)² = <strong>99.999975%</strong> — theoretical seconds per year. That leap, from hours to seconds, is why <strong>2N topology beats a better component every time</strong>. You cannot buy a 99.99997% UPS; you can buy two ordinary ones and independence.</p>

 ${A("Watch out — the fine print that separates pros from brochures","al")}
 <p>The parallel equation assumes <strong>independent failures</strong>. Real facilities violate that constantly: both paths pass through one room (fire), one control system (bad firmware), one operating team (human error), one utility. These <strong>common-mode failures</strong> are why real facilities never hit the theoretical numbers, why Tier IV requires <em>physical compartmentalization</em> of redundant systems, and why the outage data (next lesson) is dominated by causes the math above doesn't model. When someone quotes theoretical availability, ask: "independent how?"</p>
 ${E}

 ${A("Structural Angle","se")}
 <p>Compartmentalization is structural work: fire-rated separations between A-side and B-side electrical rooms, separated risers and duct routes, sometimes separate buildings for generator plants. When reliability engineers say "physically isolated," you are the one who draws what that means. And the maintainability half of MTTR is physical too — a chiller that takes 3 days to remove because nobody provided a removal path has tripled its MTTR and dragged down the whole facility's availability.</p>
 ${E}
 `,
 terms:[
  ["Availability","Uptime fraction, usually in 'nines'; 99.99% ≈ 52.6 min/yr of downtime."],
  ["MTBF","Mean Time Between Failures — average run time between component failures."],
  ["MTTR","Mean Time To Repair — average time a failed component stays down; maintainability shrinks it."],
  ["Series reliability","Chained dependencies multiply availabilities down; chains only get worse."],
  ["Parallel redundancy","Independent duplicates: A = 1−(1−A)ⁿ; the only way to add nines."],
  ["Common-mode failure","One event or dependency that defeats 'independent' redundant systems simultaneously."]
 ],
 quiz:[
  {q:"99.99% availability allows roughly how much downtime per year?",
   o:["5 minutes","52 minutes","8.8 hours","3.7 days"],a:1,
   e:"Four nines ≈ 52.6 minutes/year. Five nines ≈ 5.26 minutes. Each nine is ~10× harder."},
  {q:"A component with MTBF 100,000 hr and MTTR 8 hr has availability of about:",
   o:["99.2%","99.92%","99.992%","100%"],a:2,
   e:"A = 100,000/(100,008) ≈ 99.992%. MTBF/(MTBF+MTTR) is the workhorse equation."},
  {q:"Five components in series, each ~99.99%, give a system availability:",
   o:["Better than any component","Equal to the best component","Worse than any single component","Exactly 99.99%"],a:2,
   e:"Series availabilities multiply: the chain is always worse than its weakest link — the case for redundancy."},
  {q:"Two independent 99.95% paths in parallel are theoretically:",
   o:["99.90%","99.95%","99.999975%","Impossible to compute"],a:2,
   e:"1−(0.0005)² ≈ 99.999975%. Topology, not component quality, is how you add nines."},
  {q:"Why do real facilities miss theoretical parallel availability?",
   o:["Math error","Common-mode failures: shared rooms, controls, utilities, and humans break independence","Utilities forbid it","Components are fake"],a:1,
   e:"The equation assumes independence; fires, firmware, and people are shared. Hence Tier IV's physical compartmentalization."}
 ]
},
{unit:"Unit A · The Discipline", id:"a3", n:"A3",
 title:"Why facilities actually fail",
 sub:"The outage data — and the uncomfortable truth that people, not machines, break data centers.",
 min:13,
 objectives:[
  "Cite the real distribution of outage causes (Uptime Institute data)",
  "Explain why power — specifically UPS — leads the league table",
  "Internalize the human-error finding and what it implies for design and career"
 ],
 body:`
 <p>Everything so far is theory. This is the scoreboard. The Uptime Institute's <em>Annual Outage Analysis</em> (the industry's standard reference, most recently 2025) tracks what actually takes facilities down, and the results should reorganize your intuitions.</p>

 <h3>The league table of causes</h3>
 <div class="scroll"><table class="data">
  <tr><th>Cause family</th><th>Share of impactful outages</th><th>Notes</th></tr>
  <tr><td><b>Power</b></td><td class="n">~45% (2025 report)</td><td>The #1 cause year after year — most often <b>UPS failures</b>, then generators and transfer gear</td></tr>
  <tr><td><b>IT & networking</b></td><td class="n">~23%</td><td>Rising — configuration/change-management errors in ever-more-complex systems</td></tr>
  <tr><td><b>Cooling</b></td><td class="n">next tier</td><td>Less frequent than power but brutal at high density — minutes to overheat (see the Singapore case)</td></tr>
  <tr><td><b>Fire, water, external</b></td><td class="n">small but severe</td><td>Rare; catastrophic when they land (OVHcloud)</td></tr>
 </table></div>

 ${A("The irony to remember","pw")}
 <p>The single most common source of major outages is a failure of the <strong>UPS — the machine whose only job is preventing outages</strong>. The protection layer is itself the leading risk. That is not an argument against UPS; it is the argument for redundancy <em>of</em> the protection (2N UPS), for battery monitoring, and for rigorous maintenance — and it explains why interviewers light up when a candidate understands failure modes of the safety systems themselves.</p>
 ${E}

 <h3>The human factor</h3>
 <p>Across the Uptime data: <strong>nearly 40% of organizations suffered a major outage caused by human error in the past three years</strong>, and of those incidents, <strong>about 85% trace to staff failing to follow procedures — or the procedures themselves being wrong</strong>. In the 2025 report, procedure-related human error <em>rose</em> ten points over the prior year, likely a symptom of an industry growing faster than it can train people.</p>
 <p>Sit with that: the dominant failure mode of the world's most engineered buildings is <em>someone skipped a step</em>. The discipline's response is Unit E — procedures (MOPs/SOPs/EOPs), commissioning, drills, and designs that make the wrong action hard (interlocks, labeling, physical separation).</p>

 ${CASE("Case file · human error at scale","British Airways, May 2017 — ~75,000 passengers stranded")}
 <p>During work at a BA data center near Heathrow, power was interrupted and then — reportedly — <strong>reconnected improperly, causing a power surge</strong> that damaged servers and crippled BA's global operations over a holiday weekend. Reported costs ran to the tens of millions of pounds plus lasting reputational damage.</p>
 <p class="lesson"><b>Lesson:</b> the outage wasn't the failure — the <em>recovery</em> was. Restoration procedures are as critical as failure response; energization sequences must be engineered, written, and drilled. "Who is allowed to reconnect power, following what document?" is a real design-review question.</p>
 ${E}

 ${CASE("Case file · the protection became the fire","OVHcloud SBG2, Strasbourg, March 2021 — a data center destroyed")}
 <p>Fire destroyed the five-story SBG2 building and damaged neighbors; ~3.6 million websites went dark, and some customer data was permanently lost. Firefighters traced the seat of the blaze to a <strong>UPS room — one unit had been extensively serviced that same morning</strong>; investigators also noted the <strong>absence of automatic fire suppression</strong>, delayed electrical cutoff, and a free-cooling airflow design that helped feed the fire.</p>
 <p class="lesson"><b>Lesson:</b> layered causes, all preventable: maintenance as a risk window, no suppression in the highest-risk room, and building design that accelerated spread. Also the career lesson — post-incident, the entire industry tightened UPS-room fire protection. Failures write the next revision of the standards.</p>
 ${E}

 ${A("Structural Angle","se")}
 <p>Read the OVH case as a structural engineer: fire compartmentation, suppression coordination, and smoke/airflow paths are life-safety <em>and</em> availability systems. And read the human-error data as an owner's-engineer mandate: design so the dangerous states are physically hard to reach — separated rooms so one wrench can't touch both paths, clear equipment labeling sightlines, maintenance access that doesn't require working blind over live gear.</p>
 ${E}
 `,
 terms:[
  ["Uptime Annual Outage Analysis","The industry's standard yearly study of outage causes and severity."],
  ["Impactful outage","An outage with material service/financial consequence (Uptime's tracked category)."],
  ["Change management","The controlled process for modifying live systems; its failures drive the rising IT-cause share."],
  ["Maintenance risk window","The elevated failure probability during and immediately after service work."],
  ["Restoration procedure","The engineered, written sequence for safely returning systems to service — where BA failed."]
 ],

   e:"~85% — which is why operations discipline (Unit E) is a design input, not an afterthought."},

{unit:"Unit B · Electrical Systems", id:"b1", n:"B1",
 title:"Reading the one-line",
 sub:"The single drawing that explains the whole electrical facility — learn to walk it like a pro.",
 min:14,
 objectives:[
  "Read a one-line (single-line) diagram from utility to rack",
  "Name the function and physical reality of each block: substation, switchgear, transformers, boards",
  "Spot A/B path separation and redundancy on the drawing"
 ],
 body:`
 <p>Every electrical conversation in a mission-critical facility happens over one document: the <strong>one-line diagram</strong> (single-line). It compresses three-phase reality into a single line per circuit, showing sources, transformations, protection, and paths. When an interviewer slides a one-line across the table — and at hyperscalers they do — they are testing whether you can <em>walk the electron</em> and narrate what each block does.</p>

 <div class="diagram"><div class="flow">
  <div class="node"><b>Utility</b><span>HV/MV grid</span></div><div class="arr">▸</div>
  <div class="node"><b>Substation</b><span>50–100 MVA, step-down</span></div><div class="arr">▸</div>
  <div class="node"><b>MV swgr</b><span>11–33 kV breakers</span></div><div class="arr">▸</div>
  <div class="node"><b>Unit xfmr</b><span>~2.5–3 MVA → 415/480 V</span></div><div class="arr">▸</div>
  <div class="node"><b>LV swgr</b><span>480 V boards</span></div><div class="arr">▸</div>
  <div class="node"><b>UPS</b><span>+ battery</span></div><div class="arr">▸</div>
  <div class="node"><b>PDU/RPP</b><span>row distribution</span></div><div class="arr">▸</div>
  <div class="node"><b>Busway</b><span>overhead</span></div><div class="arr">▸</div>
  <div class="node"><b>Rack</b><span>A + B feeds</span></div>
 </div><div class="cap">The canonical path. On a real one-line you'd see this drawn twice — an A side and a B side — with generators teeing in at the switchgear.</div></div>

 <h3>Walking the blocks</h3>
 <ul>
  <li><strong>Substation:</strong> utility power arrives at high/medium voltage; large power transformers (tens of MVA) step it down. Outdoors, oil-filled, on massive pads with oil containment. Grid interconnection is usually the project's longest-lead item — "speed to power" decides sites.</li>
  <li><strong>Medium-voltage switchgear:</strong> lineups of vacuum breakers and protective relays distributing 11–33 kV around the campus. Long, heavy, floor-anchored cabinets in dedicated rooms.</li>
  <li><strong>Unit/distribution transformers:</strong> step MV down to utilization voltage — commonly <strong>415/480 V</strong> three-phase. Roughly one per 2.5–3 MVA block; dry-type indoors or oil-type outside.</li>
  <li><strong>LV switchgear/switchboards:</strong> thousands of amps of 480 V distribution to UPS systems, mechanical plants, and house loads. Front-and-rear-access lineups with strict working clearances (NEC 110.26).</li>
  <li><strong>Downstream:</strong> UPS (B2) → PDUs/RPPs which transform and branch power to rows → overhead <strong>busway</strong> with tap-off boxes at each rack → dual rack PDUs (A/B).</li>
 </ul>

 ${A("How to spot redundancy on the drawing","pw")}
 <p>Look for: <strong>two utility feeds</strong> (or utility + generator plant tying in through paralleling gear), <strong>bus ties</strong> (breakers linking A and B boards so one side can feed the other during maintenance), <strong>dual risers</strong> to every hall, and <strong>every IT rack fed twice</strong> (A-side and B-side cords). If you can point to the drawing and say "here's my concurrent-maintainability path when this breaker is racked out," you've passed the literacy test.</p>
 ${E}

 ${A("Emerging: the DC-power future","me")}
 <p>Hyperscalers are pushing past 480 V AC for AI loads: the OCP "Mt Diablo" collaboration (Microsoft/Meta/Google) is standardizing <strong>±400 V DC</strong> side-car power racks and disaggregated power to scale racks from 100 kW toward 1 MW. You don't need to design it — you need to recognize the term and its driver: at 1 MW per rack, conventional low-voltage AC distribution runs out of copper.</p>
 ${E}

 ${A("Structural Angle","se")}
 <p>Every block on the one-line is a load with a footprint you own: substation transformer pads with oil containment berms, switchgear rooms with long anchored lineups (seismic anchorage per Ch. 13), transformer vaults with fire separations, floor-standing PDUs at 5,000–10,000 lb, and busway hung from your roof steel with seismic bracing. A one-line is secretly a structural loading map — learn to read it as one.</p>
 ${E}
 `,
 terms:[
  ["One-line (single-line) diagram","The schematic showing an electrical system's sources, transformations, protection, and paths — one line per circuit."],
  ["Medium voltage (MV)","Campus distribution voltage class, typically 11–33 kV in data centers."],
  ["Unit substation / unit transformer","The MV→LV transformer block (~2.5–3 MVA) serving a lineup of low-voltage gear."],
  ["Bus tie","A breaker connecting two switchboard buses so either source can feed both — a maintainability workhorse."],
  ["Working clearance","Code-required clear space around electrical gear (NEC 110.26) that shapes room layout."],
  ["±400 VDC / Mt Diablo","OCP effort standardizing DC side-car power for 100 kW→1 MW racks."]
 ],
 quiz:[
  {q:"A one-line diagram shows:",
   o:["Only lighting circuits","Sources, transformations, protection, and paths — one line per circuit","The floor plan","Network cabling"],a:1,
   e:"It's the master schematic of the electrical system; walking it block-by-block is a standard interview literacy test."},
  {q:"Typical data center utilization voltage after the unit transformers is:",
   o:["12 V","120 V only","415/480 V three-phase","33 kV"],a:2,
   e:"MV (11–33 kV) distributes across campus; unit transformers (~2.5–3 MVA) step down to 415/480 V for use."},
  {q:"On a one-line, a 'bus tie' exists so that:",
   o:["Buses look tidy","Either source/board can feed both buses during maintenance or failure","Voltage increases","It's decorative"],a:1,
   e:"Bus ties are the drawing's concurrent-maintainability workhorse — one side can carry the other's load."},
  {q:"Why are hyperscalers exploring ±400 VDC distribution?",
   o:["Nostalgia","At ~1 MW racks, conventional LV AC distribution runs out of practical copper/space","DC is older","Code requires it"],a:1,
   e:"OCP 'Mt Diablo' standardizes DC side-car power as rack power heads from 100 kW toward 1 MW."}
 ]
},
{unit:"Unit B · Electrical Systems", id:"b2", n:"B2",
 title:"UPS and energy storage",
 sub:"The seconds that decide everything — and the #1 cause of outages, up close.",
 min:15,
 objectives:[
  "Explain double-conversion vs line-interactive vs rotary UPS topologies",
  "Compare VRLA vs lithium-ion batteries and their code/structural consequences (NFPA 855)",
  "Understand ride-through time, kW vs kWh, and why UPS fleets fail"
 ],
 body:`
 <p>Between a utility failure and stable generator power lie 10–60 undefended seconds. The <strong>UPS</strong> exists for exactly that window — and, as Lesson A3 showed, it is also the single most common cause of major outages. Respect both facts.</p>

 <h3>Static UPS topologies</h3>
 <ul>
  <li><strong>Double-conversion (VFI)</strong> — the mission-critical standard. Incoming AC is rectified to DC (charging the batteries), then inverted back to clean AC. The load <em>always</em> runs on the inverter, so utility disturbances never touch it; transfer time is zero. Cost: ~2–4% efficiency loss and heat. Modern "eco-mode" variants bypass conversion when the utility is clean, at a small risk trade.</li>
  <li><strong>Line-interactive / standby</strong> — cheaper topologies that switch to battery on failure (milliseconds of transfer). Fine for closets; rare for critical halls.</li>
  <li><strong>Modular static UPS</strong> — hyperscale standard: 200–400 kVA power modules paralleled into multi-MW systems, hot-swappable, N+1 within the frame itself.</li>
 </ul>

 <h3>Rotary and DRUPS</h3>
 <p><strong>Rotary UPS</strong> stores energy kinetically in a spinning mass (flywheel) — seconds of ride-through, no battery room, high power density. A <strong>DRUPS</strong> (Diesel Rotary UPS) couples flywheel + diesel engine in one machine: the flywheel rides through the gap while the engine clutches in. Popular in parts of Europe and some hyperscale designs; eliminates batteries entirely but concentrates rotating mass and vibration — and demands disciplined maintenance.</p>

 <h3>Batteries: the chemistry decision with structural consequences</h3>
 <div class="scroll"><table class="data">
  <tr><th>Attribute</th><th>VRLA (lead-acid)</th><th>Lithium-ion (typ. LFP)</th></tr>
  <tr><td>Weight / footprint</td><td>Very heavy — battery rooms at ~250–450 psf</td><td class="n">~60–80% lighter, ~50–80% less floor area</td></tr>
  <tr><td>Life / temperament</td><td>~4–6 yr, temperature-sensitive, needs cool rooms</td><td>~10–15 yr, tolerant, per-cell monitoring built in</td></tr>
  <tr><td>Code/safety</td><td>Hydrogen off-gassing → ventilation, spill containment</td><td><b>NFPA 855</b> siting/segregation, thermal-runaway protection, off-gas detection</td></tr>
  <tr><td>Trend</td><td>Legacy installed base</td><td>Default for new AI-era builds</td></tr>
 </table></div>

 ${A("kW vs kWh — a 10-second literacy check","pw")}
 <p><strong>kW is how hard you can push; kWh is how long you can push it.</strong> A UPS is rated in kW/kVA (power it can deliver) and its battery in minutes of <strong>ride-through at load</strong> — commonly 5–10 minutes in modern designs, just enough for generators to start, retry, and stabilize, with margin. Nobody sizes batteries to ride out a storm; that's the generator plant's job (B3).</p>
 ${E}

 ${A("Why UPS fleets actually fail","al")}
 <p>Patterns behind the #1-cause statistic: <strong>battery degradation</strong> (a string is only as good as its weakest cell — hence continuous battery monitoring), <strong>maintenance windows</strong> (the OVH fire started at a freshly serviced unit; bypass operations are the riskiest minutes of the year), <strong>control/firmware faults</strong> propagating across paralleled modules (a common-mode failure the 2N math doesn't see), and <strong>capacity creep</strong> — IT load grows until the ride-through you commissioned quietly isn't there anymore. An owner's engineer asks for battery-monitoring data and load-trend curves, not just nameplates.</p>
 ${E}

 ${A("Structural Angle","se")}
 <p>The battery decision rewrites your floor plan: VRLA rooms are among the heaviest floors in the building; lithium cuts the mass dramatically but brings <strong>NFPA 855</strong> — separation distances, fire-rated rooms, sometimes dedicated buildings for big energy-storage blocks, deflagration venting to coordinate. DRUPS swaps floor load for a large rotating machine on inertia bases with serious vibration isolation. Whichever way the electrical engineer goes, you inherit the consequences — ask early.</p>
 ${E}
 `,
 terms:[
  ["Double-conversion UPS","Rectify AC→DC→invert to AC continuously; the load always rides the inverter — zero transfer time."],
  ["Rotary UPS / DRUPS","Flywheel energy storage; DRUPS adds a coupled diesel engine, eliminating batteries."],
  ["Ride-through","The minutes a UPS carries load between utility loss and stable generator power (typically 5–10 min)."],
  ["VRLA","Valve-regulated lead-acid battery — heavy, shorter-lived, hydrogen off-gassing."],
  ["NFPA 855","The energy-storage-system standard governing lithium battery siting, separation, and protection."],
  ["Battery monitoring system","Per-cell/string health monitoring — the defense against the weakest-cell failure mode."],
  ["Eco-mode","UPS mode bypassing double conversion when utility is clean, trading a sliver of risk for efficiency."]
 ],
 quiz:[
  {q:"In a double-conversion UPS, the critical load normally runs on:",
   o:["Raw utility","The inverter output, always","The generator","The bypass"],a:1,
   e:"AC→DC→AC continuously; disturbances never touch the load and transfer time is zero — the mission-critical standard."},
  {q:"A DRUPS eliminates:",
   o:["Generators","The battery room (flywheel + coupled diesel instead)","Cooling","Switchgear"],a:1,
   e:"Kinetic ride-through plus an integral engine — no batteries, but concentrated rotating mass and vibration."},
  {q:"UPS batteries are sized for:",
   o:["Riding out a full storm","~5–10 minutes — the generator start window with margin","24 hours","One year"],a:1,
   e:"kWh buys minutes for the gensets to start and stabilize; long-duration backup is the generator plant's job."},
  {q:"Lithium-ion vs VRLA for the structural engineer means:",
   o:["No difference","~60–80% less weight but NFPA 855 separation/fire provisions to coordinate","Lithium is heavier","VRLA needs no ventilation"],a:1,
   e:"Chemistry choice can swing battery-room floor loads several-fold and changes the fire-protection architecture."},
  {q:"A firmware fault propagating across paralleled UPS modules is an example of:",
   o:["Independent failure","Common-mode failure defeating redundancy math","Utility failure","Operator error"],a:1,
   e:"Shared controls are shared fate — exactly the kind of dependency the parallel-availability equation doesn't model."}
 ]
},
{unit:"Unit B · Electrical Systems", id:"b3", n:"B3",
 title:"Generators and fuel systems",
 sub:"The long-duration backbone: engines, yards, day tanks, and 48 hours of diesel.",
 min:14,
 objectives:[
  "Size and count generators for a campus, including redundancy",
  "Explain the fuel chain: bulk tanks → day tanks → engines, and its regulations",
  "Understand start sequences, load acceptance, paralleling, and testing"
 ],
 body:`
 <p>When the grid goes away for hours or days, the facility becomes a power plant. Standby <strong>engine-generators</strong> — overwhelmingly diesel, with natural gas growing — are the long-duration layer beneath the UPS's minutes.</p>

 <h3>The fleet</h3>
 <p>Individual units cluster at <strong>2.0–2.5 MW</strong> (lineups run ~1.5–4 MW: Caterpillar C175-16 at 3,000 ekW, Cummins 2,500 kW, and peers). A hyperscale campus deploys them in ranks: <strong>Amazon's Manassas, VA site runs 93 × 2.5 MW units</strong>; Virginia alone had 10,500+ permitted data center generators (~27 GW) by end-2025. Redundancy applies here too — N+1 or N+2 fleets, or catcher-block schemes (E1).</p>

 <h3>The 10-second drama, step by step</h3>
 <ol>
  <li><strong>t = 0:</strong> utility fails. UPS inverters carry the critical load without a flicker; mechanical plant (not on UPS) coasts.</li>
  <li><strong>t ≈ 2 s:</strong> controls confirm the outage is real (not a blink) and signal engine start.</li>
  <li><strong>t ≈ 10–15 s:</strong> engines crank, fire, and reach speed/voltage. (NFPA 110 Level 1 systems — hospitals — mandate 10 seconds to load.)</li>
  <li><strong>t ≈ 15–60 s:</strong> <strong>paralleling switchgear</strong> synchronizes multiple units to one bus (matching voltage, frequency, phase), then <strong>ATS</strong>/breakers transfer load in blocks — big motor loads staged so the engines aren't slammed ("block loading" / load acceptance limits).</li>
  <li><strong>Return:</strong> when utility stabilizes, transfer back (open- or closed-transition) — the BA case's lesson: this direction is engineered and drilled too.</li>
 </ol>

 <h3>Fuel: the two-tier chain</h3>
 <p>Each engine has a <strong>day tank</strong> (hours of fuel, at or under the unit) automatically replenished from <strong>bulk storage</strong> — large tanks holding a campus target of <strong>24–48 hours at full load</strong> (some owners spec ~96). The chain includes transfer pumps (redundant), filtration and <strong>fuel polishing</strong> (diesel degrades — microbial growth and water are real outage causes), and level/leak monitoring. Regulations: EPA <strong>SPCC</strong> containment rules trigger at 1,320 gallons aggregate; air-quality permits cap run-hours and drive Tier 4 emissions packages or gas engines in strict jurisdictions.</p>

 ${CASE("Case file · fuel is a system, not a tank","Superstorm Sandy, NYC 2012 — hospitals and data centers")}
 <p>Multiple facilities had generators running — then failed anyway: <strong>fuel pumps and day-tank systems in flooded basements</strong> starved engines that sat safely above water; NYU Langone hospital evacuated patients down stairwells. One Manhattan data center famously survived on a bucket brigade carrying diesel up 17 flights.</p>
 <p class="lesson"><b>Lesson:</b> trace the <em>entire</em> dependency chain — engine, day tank, transfer pumps, controls, vents — against flood elevation. Any link below the waterline is the system's real elevation. This is simultaneously a reliability review and a structural/siting review.</p>
 ${E}

 ${A("Structural Angle","se")}
 <p>Your scope: engine pads (mass ≈ 2× machine weight is the classic vibration rule), 20–35-ton skids, exhaust stacks and radiators with wind loads, acoustic/screening enclosures, bulk-tank foundations (a 50,000-gal tank is ~350,000 lb of fuel alone) with containment berms, underground-tank buoyancy checks, and RC IV anchorage of every component — because backup power must survive the event it exists for. Fuel-chain elevation review after Sandy is now standard practice: know it, cite it.</p>
 ${E}
 `,
 terms:[
  ["Standby generator","Engine-generator providing long-duration backup power; data center units typically 2–3 MW."],

{unit:"Unit B · Electrical Systems", id:"b4", n:"B4",
 title:"Transfer, protection, and failing over gracefully",
 sub:"ATS vs STS, selective coordination, arc flash — the choreography of not going dark.",
 min:13,
 objectives:[
  "Distinguish ATS and STS and where each lives in the architecture",
  "Explain selective coordination — why one fault should trip one breaker",
  "Speak intelligently about arc flash, grounding, and EPO"
 ],
 body:`
 <p>Having two sources is worthless without flawless choreography for moving between them. This lesson is the choreography — and the protection engineering that keeps one fault from cascading into a facility-wide event.</p>

 <h3>ATS vs STS</h3>
 <div class="scroll"><table class="data">
  <tr><th></th><th>ATS — Automatic Transfer Switch</th><th>STS — Static Transfer Switch</th></tr>
  <tr><td>Mechanism</td><td>Electromechanical</td><td>Solid-state (thyristors)</td></tr>
  <tr><td>Speed</td><td class="n">~seconds</td><td class="n">~¼ cycle (&lt;8 ms)</td></tr>
  <tr><td>Role</td><td>Utility ↔ generator transfers, upstream, behind the UPS's ride-through</td><td>Downstream source-switching between two live UPS buses — lets even single-corded loads see 2N</td></tr>
  <tr><td>Transition</td><td>Open (break-before-make) or closed (brief overlap)</td><td>Seamless to the load</td></tr>
 </table></div>

 <h3>Selective coordination — the protection hierarchy</h3>
 <p>Every breaker/fuse has a time-current curve. <strong>Selective coordination</strong> means the curves are engineered so a fault trips <em>only the nearest upstream device</em> — a shorted server PSU blows its rack-level protection, not the PDU main, not the switchboard. Uncoordinated protection turns a $50 fault into a hall-wide outage. Code requires it for emergency systems (NEC 700.32); mission-critical owners demand a documented <strong>coordination study</strong> (plus short-circuit and arc-flash studies) and keep it updated as the system changes. As an owner's engineer, "show me the current coordination study" is a power question.</p>

 <h3>Arc flash, grounding, EPO — the safety layer</h3>
 <ul>
  <li><strong>Arc flash:</strong> a fault across energized conductors creates an explosion of plasma. Studies (IEEE 1584 / NFPA 70E) set incident-energy labels, PPE levels, and boundaries at every panel. Design responses: remote racking, arc-resistant switchgear, maintenance-mode settings. It shapes room layouts and procedures — and it's why nobody works a live 480 V board casually.</li>
  <li><strong>Grounding & bonding:</strong> the quiet foundation — fault-current return paths, lightning protection, and signal-reference grounding for sensitive electronics.</li>
  <li><strong>EPO (Emergency Power Off):</strong> the historical big red button that kills a whole room — famous for causing more outages (accidental or misguided presses) than it prevents. Modern codes/designs have relaxed and guarded it; knowing the EPO debate marks sector experience.</li>
 </ul>

 ${A("Watch out — transfers are the riskiest routine event","al")}
 <p>Most facility drama concentrates in transfer moments: monthly generator tests, UPS bypass for maintenance, utility return. The 2016 Delta Atlanta failure was a switchgear/transfer event; BA 2017 was botched restoration. Owner's engineers scrutinize transfer sequences, interlocks (making wrong breaker orders physically impossible), and the <em>written procedure</em> for every planned transfer. If a facility can't show you its transfer MOPs, its redundancy is theoretical.</p>
 ${E}

 ${A("Structural Angle","se")}
 <p>Arc-flash boundaries and NEC working clearances size your electrical rooms and egress paths. Arc-resistant switchgear vents blast energy upward — coordinate ceiling/room design for it. STS/ATS units are more anchored heavy cabinets on your list, and closed-transition schemes can briefly parallel utility and generators — the fault-current spike sizes gear (and its mass) upward. Room-by-room, protection engineering quietly writes your architectural-structural program.</p>
 ${E}
 `,
 terms:[
  ["ATS","Automatic Transfer Switch — electromechanical, seconds-scale source transfer (utility↔generator)."],
  ["STS","Static Transfer Switch — solid-state, sub-cycle switching between two live sources downstream."],
  ["Selective coordination","Protection curves staged so a fault clears at the nearest device only — no cascade."],
  ["Coordination / arc-flash study","The engineered analyses (time-current, IEEE 1584) behind breaker settings and PPE labels."],
  ["Arc-resistant switchgear","Gear built to channel arc-blast energy away from personnel — with structural venting implications."],
  ["EPO","Emergency Power Off — the guarded 'big red button' with a storied history of causing outages."],
  ["Interlock","Mechanical/electrical scheme making incorrect operating sequences physically impossible."]
 ],
 quiz:[
  {q:"The key difference between ATS and STS is:",
   o:["Color","ATS = mechanical/seconds (utility↔gen); STS = solid-state/quarter-cycle between live UPS buses","STS uses diesel","ATS is faster"],a:1,
   e:"UPS ride-through covers the ATS's seconds upstream; the STS gives seamless dual-source power downstream."},
  {q:"Selective coordination ensures that:",
   o:["All breakers trip together","Only the protective device nearest the fault operates","Nothing ever trips","Generators start faster"],a:1,
   e:"Staged time-current curves keep a rack-level fault from cascading into a hall-wide outage; owners demand current studies."},
  {q:"The EPO button is famous in the industry for:",
   o:["Preventing every outage","Causing outages via accidental or misguided activation","Cooling servers","Starting generators"],a:1,
   e:"The room-killing red button has a storied history of self-inflicted downtime — modern designs guard or eliminate it."},
  {q:"Why do owner's engineers obsess over transfer sequences?",
   o:["Habit","Most facility incidents concentrate in transfer/restoration moments (Delta 2016, BA 2017)","Transfers are rare","They don't"],a:1,
   e:"Routine transfers are the riskiest planned events; interlocks and written MOPs are the defense."}
 ]

{unit:"Unit C · Mechanical Systems", id:"c1", n:"C1",
 title:"Heat and the chilled-water plant",
 sub:"Every watt in is a watt to remove. Meet the plant that does it — and its pumping arithmetic.",
 min:14,
 objectives:[
  "Explain the two water loops (chilled water, condenser water) and what a chiller actually does",
  "Distinguish CRAC vs CRAH and the main pumping configurations",
  "Reason about plant redundancy the same way you do electrical"
 ],
 body:`
 <p>Thermodynamics runs the second half of the facility: essentially <strong>every watt delivered to IT becomes heat</strong>, continuously. A 48 MW facility is a 48 MW heater that must never warm up. The chilled-water plant is how big facilities move that river of heat.</p>

 <h3>The two loops</h3>
 <div class="diagram"><div class="flow">
  <div class="node"><b>IT heat</b><span>racks</span></div><div class="arr">▸</div>
  <div class="node"><b>CRAH coils</b><span>air→water</span></div><div class="arr">▸</div>
  <div class="node"><b>CHW loop</b><span>~7–20°C supply</span></div><div class="arr">▸</div>
  <div class="node"><b>Chiller</b><span>refrigeration cycle</span></div><div class="arr">▸</div>
  <div class="node"><b>CW loop</b><span>condenser water</span></div><div class="arr">▸</div>
  <div class="node"><b>Cooling tower</b><span>heat → sky</span></div>
 </div><div class="cap">Heat cascades: room air → chilled water → refrigerant → condenser water → atmosphere.</div></div>
 <ul>
  <li><strong>Chilled water (CHW) loop:</strong> cold supply (historically ~7°C/45°F; modern plants run warmer — 15–20°C — for efficiency) circulates to cooling coils; returns warm.</li>
  <li><strong>The chiller</strong> is a refrigeration machine (compressor, evaporator, condenser) pumping heat uphill from the CHW loop into the <strong>condenser-water (CW) loop</strong>. Data center banks commonly run ~500-ton units in N+1 sets; the largest reach ~20 MW of cooling each.</li>
  <li><strong>Cooling towers</strong> (C2) reject the heat to the sky, mostly by evaporation.</li>
 </ul>

 <h3>Room units: the CRAC/CRAH distinction (know it cold)</h3>
 <p><strong>CRA-C = Compressor onboard</strong>: a self-contained direct-expansion (DX) unit, its own little refrigeration plant. <strong>CRA-H = Hydronic</strong>: just a fan and a chilled-water coil — the "cold" is made centrally. Large facilities standardize on CRAHs + central plant for efficiency at scale; CRACs serve smaller rooms and edge sites.</p>

 <h3>Pumping configurations — the plant's circulation system</h3>
 <ul>
  <li><strong>Primary/secondary:</strong> a constant-flow primary loop through the chillers, decoupled from a variable-flow secondary loop to the loads. Classic, forgiving, more pumps.</li>
  <li><strong>Variable-primary:</strong> one set of variable-speed pumps does it all — more efficient, fewer machines, but demands smarter controls (minimum-flow protection for chillers). The modern default.</li>
  <li>Either way: <strong>pumps in N+1</strong>, headered so any pump can serve, on VFDs (variable-frequency drives). Redundancy thinking is identical to electrical — draw the water "one-line" and hunt single points of failure: a single shared header, one make-up water line, one BMS controller (see the Singapore case, C3).</li>
 </ul>

 ${A("Watch the fluid arithmetic","me")}
 <p>Rules of thumb worth owning: 1 ton of cooling = 3.517 kW of heat; a chilled-water system moves roughly <strong>2.4 gpm per ton</strong> at a standard 10°F ΔT — so a 5,000-ton plant circulates ~12,000 gpm through big pipes (18–30"+). Water weighs 62.4 lb/ft³: a 24-inch main runs about <strong>195 lb of water per foot</strong> before you count the steel. Pipe racks, anchors, and thrust blocks are real structure.</p>
 ${E}

 ${A("Structural Angle","se")}
 <p>The plant is your heaviest tenant: chillers (tens of tons each, operating weight), pump skids on inertia bases, and piping galleries whose <em>filled</em> weight, seismic bracing (yes, Ch. 13 covers distribution systems), thermal-expansion loops, and anchor/thrust forces all land on you. Design to <strong>operating weight</strong> — never shipping weight — and ask for the pump schedule early: vibration isolation on rotating equipment near sensitive halls is a coordination item you own jointly with mechanical.</p>
 ${E}
 `,
 terms:[
  ["Chilled-water (CHW) loop","The cold loop delivering cooling from chillers to coils; modern supply temps trending warmer for efficiency."],
  ["Condenser-water (CW) loop","The loop carrying chiller-rejected heat to cooling towers."],
  ["Chiller","Refrigeration machine pumping heat from CHW to CW; data center banks ~500-ton units, N+1."],
  ["CRAC vs CRAH","Compressor-onboard DX unit vs hydronic coil+fan on central chilled water; big sites standardize on CRAH."],
  ["Primary/secondary pumping","Decoupled constant-flow chiller loop + variable-flow load loop; the classic scheme."],
  ["Variable-primary flow","Single variable-speed pumping scheme — efficient, controls-dependent; the modern default."],
  ["Ton of cooling","3.517 kW of heat removal; chilled water flows ~2.4 gpm per ton at 10°F ΔT."]
 ],
 quiz:[
  {q:"A chiller's job is to:",
   o:["Make ice","Pump heat from the chilled-water loop into the condenser-water loop via a refrigeration cycle","Filter water","Generate power"],a:1,
   e:"It moves heat uphill: room air → CHW → refrigerant → CW → tower → atmosphere."},
  {q:"CRAH units differ from CRACs because they:",
   o:["Contain compressors","Are just fan + chilled-water coil — cooling is made centrally","Are outdoors","Use diesel"],a:1,
   e:"CRA-C = Compressor onboard (DX); CRA-H = Hydronic. Scale favors central plant + CRAHs."},
  {q:"A 5,000-ton plant at standard ΔT circulates roughly:",
   o:["120 gpm","1,200 gpm","12,000 gpm","1.2 million gpm"],a:2,
   e:"~2.4 gpm/ton × 5,000 tons — big pipes whose filled weight and anchors are structural work."},
  {q:"Redundancy thinking for the mechanical plant is:",
   o:["Unnecessary — water is reliable","The same SPOF-hunting as electrical: headered N+1 pumps, no single shared choke point","Only about chillers","Automatic"],a:1,
   e:"Draw the water one-line and hunt single points of failure — shared headers, one make-up line, one controller."}
 ]

{unit:"Unit C · Mechanical Systems", id:"c2", n:"C2",
 title:"Heat rejection: towers, dry coolers, and the water problem",
 sub:"Where the heat finally leaves — and the water-vs-energy trade the public now watches.",
 min:13,
 objectives:[
  "Compare evaporative towers, dry coolers, and hybrid/adiabatic rejection",
  "Explain economizers/free cooling and why climate picks sites",
  "Command the PUE and WUE numbers and their tension"
 ],
 body:`
 <p>All that cascaded heat must finally leave the property. How you throw it away sets your efficiency (PUE), your water bill (WUE), your community relations, and a large share of your structural roof/yard loads.</p>

 <h3>The rejection menu</h3>
 <div class="scroll"><table class="data">
  <tr><th>Technology</th><th>How</th><th>Trade</th></tr>
  <tr><td><b>Evaporative cooling tower</b></td><td>Sprays condenser water over fill; evaporation does the work</td><td>Best efficiency (approaches wet-bulb) but consumes water by design — the WUE driver</td></tr>
  <tr><td><b>Dry cooler / air-cooled chiller</b></td><td>Finned coils + big fans; no evaporation</td><td>Near-zero water, but worse efficiency in heat (limited by dry-bulb) and much larger airflow footprints</td></tr>
  <tr><td><b>Adiabatic / hybrid</b></td><td>Dry most of the year; wets pads only on peak days</td><td>The compromise increasingly chosen</td></tr>
 </table></div>

 <h3>Economizers — free cooling</h3>
 <p>When outdoor conditions allow, skip refrigeration entirely: <strong>air-side economizers</strong> bring filtered outside air straight in; <strong>water-side economizers</strong> use towers + heat exchangers to make cold water with chillers off. Thousands of free-cooling hours per year are why Nordic, Pacific-Northwest, and high-plains sites are prized, and why ASHRAE's allowable envelopes widened — running halls warmer (up to the A1–A2 limits) multiplies economizer hours.</p>

 <h3>The scoreboard: PUE and WUE</h3>
 <ul>
  <li><strong>PUE</strong> = total facility power ÷ IT power. Industry average <strong>~1.54 and flat for six years</strong> (Uptime 2025); Google and Meta fleets ~<strong>1.09</strong>; new hyperscale targets ~1.1–1.2. The 1.09-vs-1.54 gap is cooling strategy, climate, and containment.</li>
  <li><strong>WUE</strong> = liters of water per kWh of IT energy. Credible central figures: US average ~0.375–0.48 L/kWh, Microsoft fleet ~0.30; evaporative-heavy sites run far higher. A large campus can evaporate on the order of <strong>hundreds of thousands of gallons a day</strong> — which is now front-page news in drought regions.</li>
  <li><strong>The tension:</strong> evaporation lowers PUE but raises WUE; dry rejection reverses it. You cannot minimize both — every siting fight and sustainability pledge lives inside that trade. The 2025-26 direction: <strong>closed-loop, zero-evaporation designs</strong> (Microsoft's next-gen standard) that fill the loop once and reject heat dry, accepting the energy penalty.</li>
 </ul>

 ${A("Watch out — 'waterless' does not mean lighter","al")}
 <p>Engineering the water out means <em>bigger air-side hardware</em>: banks of dry coolers and air-cooled chillers with enormous fan decks and coil area. For you that's more roof/yard footprint, more concentrated and vibrating equipment, more screening walls catching wind. A sustainability pledge upstream becomes structural steel downstream.</p>
 ${E}

 ${A("Structural Angle","se")}
 <p>Rejection hardware is classic mission-critical structural scope: tower basins full of water (design at operating weight, check sloshing in seismic zones), fan-deck vibration, plume and wind on tall screens, snow drift behind them, and — for roof-mounted plant — thousands of tons of load your framing must love for 20 years. The technology choice (wet/dry/hybrid) changes your loads dramatically: be in that conversation early.</p>
 ${E}
 `,
 terms:[
  ["Cooling tower (evaporative)","Rejects heat by evaporating condenser water; efficient but water-consuming."],
  ["Dry cooler","Closed-coil, fan-driven rejection with no evaporation — near-zero water, larger footprint."],
  ["Adiabatic/hybrid cooling","Dry operation with evaporative assist only on peak days."],
  ["Air-side / water-side economizer","Free cooling using outside air directly, or towers+HX with chillers off."],
  ["PUE","Total ÷ IT power. Industry ~1.54 flat; best hyperscale fleets ~1.09."],
  ["WUE","Liters of water per kWh IT. ~0.3–0.48 credible averages; evaporative sites much higher."],
  ["Closed-loop / zero-evaporation design","Fill-once liquid loops with dry rejection — the 2025-26 answer to the water backlash."]
 ],
 quiz:[
  {q:"The fundamental water-vs-energy trade is:",
   o:["Nonexistent","Evaporative rejection lowers PUE but raises WUE; dry rejection reverses it","Water lowers both","Energy lowers both"],a:1,
   e:"You cannot minimize both simultaneously — this tension drives siting fights and the shift to closed-loop dry designs."},
  {q:"Industry-average PUE per Uptime's 2025 survey is about:",
   o:["1.05","1.2","1.54 — flat for six years","2.5"],a:2,
   e:"~1.54 average vs ~1.09 for the best hyperscale fleets; the gap is cooling strategy, climate, containment."},
  {q:"Free cooling (economization) is why:",
   o:["Sites cluster in hot deserts only","Cool/dry climates and warmer hall setpoints are prized — thousands of chiller-off hours","Chillers are obsolete","PUE doesn't matter"],a:1,
   e:"Air- and water-side economizers skip refrigeration when ambient allows; wider ASHRAE envelopes multiply those hours."},
  {q:"Going 'waterless' typically means, structurally:",
   o:["Lighter roofs","Bigger, heavier air-side rejection hardware — more footprint, fans, screens, and steel","No change","Fewer screens"],a:1,
   e:"Dry rejection needs far more coil/fan area; the sustainability decision lands as structural load."}
 ]
},
{unit:"Unit C · Mechanical Systems", id:"c3", n:"C3",
 title:"Continuous cooling and thermal ride-through",
 sub:"At AI density, cooling is critical load: the thermal battery problem.",
 min:12,
 objectives:[
  "Explain why high-density halls have only seconds-to-minutes of thermal inertia",
  "Describe the continuous-cooling toolkit: UPS-backed pumps/fans, thermal storage tanks",
  "Connect Tier IV's continuous-cooling requirement to real design"
 ],
 body:`
 <p>Here is the mechanical mirror of the UPS story. When utility power fails, the electrical side rides through on batteries. But what rides the <em>cooling</em> through? Chillers drop offline and take minutes to restart and re-stabilize after generators pick up ("chiller restart time," often 5–15 minutes with staging). Meanwhile the servers — still perfectly powered by UPS — keep converting every watt to heat.</p>

 ${A("The brutal arithmetic of thermal inertia","me")}
 <p>A legacy 5 kW/rack hall might coast many minutes on room air mass. A <strong>100+ kW/rack AI hall can push inlet temperatures past allowable limits in tens of seconds</strong> once airflow/waterflow stops. At high density, a cooling interruption <em>is</em> an outage — servers throttle, then emergency-shutdown, even though power never blinked. This is why the modern mantra: <strong>cooling is critical load</strong>.</p>
 ${E}

 <h3>The continuous-cooling toolkit</h3>
 <ul>
  <li><strong>UPS-backed mechanical:</strong> put CHW pumps, CRAH/fan-wall fans, and CDU pumps on UPS (or dedicated mechanical UPS) so circulation never stops. Fans and pumps are the cheap part; the cold is the hard part —</li>
  <li><strong>Chilled-water thermal storage:</strong> big insulated tanks of cold water plumbed so that on power loss, stored cold water keeps absorbing heat while chillers restart. Sized for the restart window (commonly several minutes to ~15 at design load). This is the "thermal battery."</li>
  <li><strong>Staged restart & quick-start chillers:</strong> plant sequenced to bring cooling back fastest; some modern chillers offer rapid-restart packages precisely for this market.</li>
  <li><strong>Tier IV's rule:</strong> the Uptime Tier IV standard explicitly requires <strong>continuous cooling</strong> consistent with fault tolerance — because at Tier IV, "the load never notices" applies to thermal, not just electrical.</li>
 </ul>

 ${CASE("Case file · when the water stopped","Equinix SG3, Singapore, October 2023 — 2.5M bank transactions frozen")}
 <p>During a planned system upgrade, a contractor <strong>erroneously signaled valves closed on the chilled-water buffer tanks</strong>. Temperatures in parts of the facility climbed past limits; DBS Bank and Citibank suffered roughly <strong>two days</strong> of degraded banking services, ~2.5 million transactions failed, ATMs and apps down — and Singapore's regulator ordered formal investigations.</p>
 <p class="lesson"><b>Lesson:</b> a cooling-controls error produced a national banking incident with power fully available. Note every theme converging: change management during maintenance (A3), controls as common-mode failure (D2), thermal ride-through margins (this lesson), and third-party/contractor procedure discipline (E3). One valve signal — two days of consequence.</p>
 ${E}

 ${A("Structural Angle","se")}
 <p>Thermal storage tanks are enormous water weights — hundreds of thousands of gallons in steel tanks, at grade or (worse for you) elevated; seismic sloshing, foundations, and containment are yours. UPS-backing mechanical gear grows the battery/electrical rooms you already carry. And "cooling is critical load" upgrades mechanical equipment anchorage to the same RC IV / Ip=1.5 seriousness as generators: the chilled-water system must survive the earthquake as surely as the power system.</p>
 ${E}
 `,
 terms:[
  ["Continuous cooling","Design ensuring heat removal never pauses through a power event — required for Uptime Tier IV."],
  ["Thermal ride-through","The window stored cooling covers while chillers restart after transfer to generators."],
  ["Chilled-water storage tank","The 'thermal battery': insulated tank of cold water sized for the chiller-restart window."],
  ["Chiller restart time","Minutes for the refrigeration plant to return after a power transfer — the gap storage must cover."],
  ["Buffer tank","Storage vessel smoothing chilled-water supply; the valves at the heart of the Singapore 2023 outage."],
  ["Cooling as critical load","The AI-era doctrine: at 100 kW/rack, losing cooling for seconds equals losing power."]
 ],
 quiz:[
  {q:"Why is 'cooling is critical load' the AI-era doctrine?",
   o:["Marketing","At 100+ kW/rack, inlet temps can exceed limits in tens of seconds without circulation","Chillers are cheap","It isn't"],a:1,
   e:"High density erased thermal inertia: a cooling pause is now an outage even with perfect UPS power."},
  {q:"The 'thermal battery' of a mission-critical plant is:",
   o:["Lithium cells","Chilled-water storage tanks sized for the chiller-restart window","The diesel tank","Room air"],a:1,
   e:"Stored cold water absorbs heat for the 5–15 minute restart gap while pumps/fans ride UPS."},
  {q:"Uptime Tier IV explicitly requires:",
   o:["Free cooling","Continuous cooling consistent with fault tolerance","Two lobbies","Diesel only"],a:1,
   e:"At Tier IV the load never notices a failure — thermally as well as electrically."},
  {q:"The Equinix Singapore 2023 outage began with:",
   o:["An earthquake","A contractor's erroneous signal closing chilled-water buffer-tank valves during an upgrade","A cyber attack","Grid collapse"],a:1,
   e:"One controls/change-management error → 2.5M failed transactions and ~2 days of banking disruption, with power available throughout."}
 ]
},
{unit:"Unit C · Mechanical Systems", id:"c4", n:"C4",
 title:"Liquid cooling systems engineering",
 sub:"TCS and FWS loops, CDUs, and ASHRAE's W-classes — the plumbing of the AI era.",
 min:14,
 objectives:[
  "Draw the two-loop architecture: facility water system vs technology cooling system",
  "Explain what a CDU does and its deployment forms",
  "Use ASHRAE W-classes and know why warm water is strategic"
 ],
 body:`
 <p>Lesson C1 ended at air. But GB200/GB300-class racks at 120–140 kW <strong>cannot be air-cooled</strong> (air's practical ceiling: ~40–50 kW/rack), so liquid now comes to the chip — and a new plumbing architecture comes with it.</p>

 <h3>The two-loop architecture</h3>
 <div class="diagram"><div class="flow">
  <div class="node"><b>Chip</b><span>cold plate</span></div><div class="arr">▸</div>
  <div class="node"><b>TCS loop</b><span>technology cooling system — clean, controlled coolant</span></div><div class="arr">▸</div>
  <div class="node"><b>CDU</b><span>heat exchanger + pumps</span></div><div class="arr">▸</div>
  <div class="node"><b>FWS loop</b><span>facility water system</span></div><div class="arr">▸</div>
  <div class="node"><b>Plant</b><span>chillers / dry coolers</span></div>
 </div><div class="cap">Two loops, one heat exchanger. The CDU is the customs checkpoint between IT-grade coolant and facility water.</div></div>
 <ul>
  <li><strong>TCS (technology cooling system):</strong> the inner loop touching the hardware — treated coolant, tight temperature/flow/pressure control, immaculate cleanliness (a clogged microchannel cold plate is a dead GPU).</li>
  <li><strong>FWS (facility water system):</strong> the outer loop — ordinary plant water headed for chillers or dry coolers.</li>
  <li><strong>CDU (coolant distribution unit):</strong> heat exchanger + variable-speed pumps + filtration + controls isolating the loops. Forms: in-rack sidecars, in-row units, or big floor-mounted plant CDUs (~20–150 gpm class and up). It is the new critical component — and its pumps join the "cooling is critical load" UPS conversation.</li>
 </ul>

 <h3>The technology ladder (recap + engineering view)</h3>
 <ul>
  <li><strong>Direct-to-chip cold plates (dominant):</strong> captures ~70–90% of rack heat in liquid (GB300-class ~90% liquid / ~10% residual air). You still design airflow for the remainder.</li>
  <li><strong>Rear-door heat exchangers:</strong> liquid coil as the rack's back door — a retrofit/bridge for 40–80 kW.</li>
  <li><strong>Immersion (single/two-phase):</strong> servers submerged in dielectric fluid. Highest heat flux, but tanks are extremely heavy, and two-phase faces PFAS-regulation headwinds on fluids. Niche in 2025-26 while cold plates win the mainstream.</li>
 </ul>

 <h3>ASHRAE W-classes — why "warm water" is strategic</h3>
 <p>ASHRAE classifies liquid-cooling facility supply temperature: <strong>W17, W27, W32, W40, W45, W+</strong> (the number = max supply °C). The strategic insight: chips don't need <em>cold</em> water, just <em>enough flow of warm-ish</em> water. If your hardware accepts <strong>W32–W45</strong>, you can reject heat with dry coolers alone in most climates — <strong>no chillers, no evaporation</strong> — and even reuse the heat (district heating). Warm-water DLC is how liquid cooling, paradoxically, can simplify the plant.</p>

 ${A("Watch out — liquid's new failure modes","al")}
 <p>New plumbing, new outage vectors: <strong>leaks over live electronics</strong> (leak-detection rope, drip trays, automatic isolation valves), <strong>coolant chemistry drift</strong> (corrosion/biological fouling killing cold plates fleet-wide — a slow common-mode failure), <strong>CDU pump failure</strong> (seconds of thermal ride-through at chip level — hence N+1 pumps and UPS), and <strong>quick-disconnect discipline</strong> during rack service. The reliability culture of Unit B now applies to plumbing.</p>
 ${E}

 ${A("Structural Angle","se")}
 <p>Liquid cooling redistributes weight: manifolds and filled piping down every row (hung or floor-routed — bracing per Ch. 13), CDU skids as new concentrated loads, slab trenches or overhead racks for distribution, containment curbs and drainage in halls that never had floor drains, and immersion tanks (if used) as extreme point loads demanding slab-on-grade. The floor that carried a 5 kW air-cooled world was never asked these questions — yours will be.</p>
 ${E}
 `,
 terms:[
  ["TCS (technology cooling system)","The clean, controlled inner coolant loop touching IT hardware."],
  ["FWS (facility water system)","The outer plant loop carrying heat from CDUs to chillers/dry coolers."],

 ],

{unit:"Unit D · Supporting Systems", id:"d1", n:"D1",
 title:"Fire protection and life safety",
 sub:"Protecting people and uptime at once — detection in seconds, suppression without collateral damage.",
 min:12,
 objectives:[
  "Explain very-early-warning detection (VESDA) and why it matters more than suppression",
  "Compare pre-action sprinklers, clean agents, and water mist",
  "Know the code map: NFPA 75/76, 855, and the OVH-shaped hole in it"
 ],
 body:`
 <p>Fire in a mission-critical facility is a double catastrophe: the fire itself, and a suppression response that can destroy the mission (water on megawatts of electronics). The discipline's answer is layered: detect absurdly early, verify, then suppress with the least collateral means.</p>

 <h3>Detection: buy minutes</h3>
 <ul>
  <li><strong>ASD / VESDA</strong> (air-sampling smoke detection): a pipe network continuously sniffs air through laser particle counters, detecting combustion products at concentrations <em>far</em> below visible smoke — often many minutes of warning while a fault is still a warm component. In a facility whose whole logic is intervening before consequence, ASD is the fire-side UPS.</li>
  <li>Spot detectors, heat detection in generator/battery areas, and — post-lithium — <strong>off-gas detection</strong> in ESS rooms that senses cell venting before thermal runaway.</li>
 </ul>

 <h3>Suppression: the menu</h3>
 <div class="scroll"><table class="data">
  <tr><th>System</th><th>How</th><th>Where / trade</th></tr>
  <tr><td><b>Pre-action sprinklers</b></td><td>Pipes stay dry; water enters only after detection event AND head fusing (double interlock)</td><td>The data hall standard — sprinkler code protection without accidental-discharge water risk</td></tr>
  <tr><td><b>Clean agents (NFPA 2001)</b></td><td>Gases (e.g., FM-200/Novec-class, inert blends) flood the room, suppressing chemically or by oxygen reduction — no residue</td><td>Electrical/UPS rooms, tape/archives; room must be sealed; agent cost & fluorinated-agent regulatory pressure</td></tr>
  <tr><td><b>Water mist</b></td><td>Ultra-fine droplets cool and displace oxygen locally with a fraction of sprinkler water</td><td>Generator rooms, turbines; growing niche</td></tr>
  <tr><td><b>Hypoxic (oxygen-reduction) systems</b></td><td>Keep the room's O₂ permanently too low for open flame</td><td>Emerging in some European DCs</td></tr>
 </table></div>

 <h3>The code map</h3>
 <p><strong>NFPA 75</strong> (IT equipment protection) and <strong>NFPA 76</strong> (telecom) govern the halls; <strong>NFPA 855</strong> governs lithium energy storage (separation distances, protection, off-gassing); NFPA 110 covers emergency power; and the OVH fire (A3) is the standing reminder of what happens when a UPS room has <em>no automatic suppression at all</em> — post-2021, owners tightened electrical-room protection industry-wide.</p>

 ${A("Uptime is a life-safety argument too","al")}
 <p>Fire protection in these buildings serves three masters: life safety (always first), asset protection, and <em>mission continuity</em> — including compartmentation so Side A's fire cannot take Side B (the structural expression of Tier IV fault tolerance). A suppression discharge that ends the fire but floods both power paths failed the third master. Design reviews ask: "after the discharge, what still runs?"</p>
 ${E}

 ${A("Structural Angle","se")}
 <p>Yours: fire-rated separations between redundant system rooms (walls you draw, penetrations you seal), clean-agent room integrity (the enclosure must hold gas concentration — door fans test <em>your</em> construction), water-mist/pre-action pipe loads and bracing, ESS deflagration vent panels per NFPA 855 (blast-relief construction is structural), and generator-room separation. Fire protection is the discipline where structural, mechanical, and reliability engineering literally share a wall.</p>
 ${E}
 `,
 terms:[
  ["ASD / VESDA","Air-sampling smoke detection — laser particle counting giving minutes of pre-smoke warning."],
  ["Pre-action sprinkler","Dry-pipe system requiring detection + head fusing before water flows; the data hall standard."],
  ["Clean agent (NFPA 2001)","Gaseous suppression leaving no residue — for electrical rooms and sealed spaces."],
  ["Water mist","Fine-droplet suppression using a fraction of sprinkler water; generator-room favorite."],
  ["NFPA 75 / 76","Standards for protecting IT equipment / telecom facilities."],
  ["Off-gas detection","Sensors catching lithium cell venting before thermal runaway — the ESS early warning."],
  ["Room integrity test","Door-fan pressurization proving an enclosure can hold clean-agent concentration."]
 ],
 quiz:[
  {q:"VESDA/ASD systems matter because they:",
   o:["Spray water faster","Detect combustion at invisible concentrations, buying minutes of intervention time","Are cheaper than detectors","Replace sprinklers"],a:1,
   e:"Air-sampling detection is the fire-side analog of the UPS: intervene before consequence."},
  {q:"A double-interlock pre-action system releases water only when:",
   o:["Anyone pulls an alarm","Detection confirms fire AND a sprinkler head fuses","The BMS reboots","Power fails"],a:1,
   e:"Two independent confirmations — sprinkler protection without accidental-discharge risk over electronics."},
  {q:"Clean-agent systems require the room to be:",
   o:["Open-air","Sealed well enough to hold gas concentration — verified by door-fan integrity tests","Underground","Refrigerated"],a:1,
   e:"The enclosure is part of the suppression system — and it's your construction being tested."},
  {q:"The mission-continuity test after any suppression event is:",
   o:["Was the fire out?","After the discharge, what still runs? (Compartmentation should protect the redundant path)","Was it loud?","Insurance paperwork"],a:1,
   e:"Life safety first, but design reviews also demand that one side's fire + suppression cannot take both power paths."}
 ]
},
{unit:"Unit D · Supporting Systems", id:"d2", n:"D2",
 title:"Controls, monitoring, and security",
 sub:"BMS, EPMS, DCIM — the nervous system that runs everything, and fails like software.",
 min:12,
 objectives:[
  "Distinguish BMS, EPMS, and DCIM and what each watches",
  "Understand sequences of operations and controls as a common-mode failure source",
  "Outline layered physical security"
 ],
 body:`
 <p>Thousands of devices — chillers, valves, breakers, CRAHs, CDUs — act in concert because a control layer conducts them. That layer is also, increasingly, where outages are born: the Singapore 2023 incident was a <em>signal</em>, not a broken machine.</p>

 <h3>The three-letter systems</h3>
 <div class="scroll"><table class="data">
  <tr><th>System</th><th>Domain</th><th>Watches / does</th></tr>
  <tr><td><b>BMS/BAS</b> (building management)</td><td>Mechanical & environment</td><td>Runs sequences: chiller staging, valve positions, fan speeds, setpoints, alarms</td></tr>
  <tr><td><b>EPMS</b> (electrical power monitoring)</td><td>Electrical</td><td>Meters every bus/breaker, captures waveform events, feeds post-incident forensics</td></tr>
  <tr><td><b>DCIM</b> (data center infrastructure management)</td><td>IT ↔ facility bridge</td><td>Rack-level power/thermal/capacity: where would the next 100 racks fit?</td></tr>
 </table></div>

 <h3>Sequences of operations — the facility's choreography, in prose</h3>
 <p>Every automated behavior is specified in a <strong>sequence of operations (SOO)</strong>: "On loss of utility, confirm outage 2 s → start engines → …". Commissioning (E2) exists largely to prove the sequences; incident reviews usually find reality diverged from the written sequence — or the sequence was wrong. Owner's engineers <em>read the SOOs</em>, and ask what happens in the corner cases: simultaneous failures, mid-transfer failures, sensor lies.</p>

 ${A("Controls are the ultimate common-mode failure","al")}
 <p>Redundant chillers obeying one BMS controller are not redundant against the BMS. Patterns to demand: <strong>redundant/segmented controllers</strong> (A-side and B-side controls as separate as the power paths), <strong>fail-safe positions</strong> (what does every valve do on loss of signal? The Singapore valves closed — the wrong answer), <strong>manual override</strong> at the equipment, <strong>hardwired safeties</strong> independent of networks, and <strong>OT cybersecurity</strong> (the control network is an attack surface; segmentation from IT networks is now table stakes).</p>
 ${E}

 <h3>Physical security in layers</h3>
 <p>Site perimeter (berms, fencing, vehicle standoff — often doubling as your screening walls) → building shell (limited openings, ballistic/forced-entry ratings at sensitive rooms) → lobby/mantrap (anti-tailgating vestibules) → hall access (badge+biometric) → rack/cage locks. Layered so each breach buys attackers another wall and defenders more time. Hyperscale sites treat security architecture with the same redundancy logic as power.</p>

 ${A("Structural Angle","se")}
 <p>Control rooms want uninterrupted sightlines and their own hardening; mantraps and ballistic assemblies carry real weight into your framing; vehicle-standoff design (bollards, reinforced perimeter elements) is structural anti-ram engineering; and every "hardwired safety" is another cable path to route and protect. Also: your equipment anchorage philosophy should assume the controls <em>will</em> someday command the wrong thing — physical fail-safes (gravity drains, spring-return valves) beat clever software.</p>
 ${E}
 `,
 terms:[
  ["BMS/BAS","Building management system executing mechanical sequences and alarms."],
  ["EPMS","Electrical power monitoring system — metering, event capture, forensics."],
  ["DCIM","Data center infrastructure management — rack-level power/thermal/capacity bridge between IT and facilities."],
  ["Sequence of operations (SOO)","The written specification of automated system behavior; commissioning proves it."],
  ["Fail-safe position","What a device does on loss of signal/power — the first question after Singapore 2023."],
  ["OT security","Protecting operational-technology (controls) networks; segmented from IT by design."],
  ["Mantrap","Interlocked double-door vestibule preventing tailgating into secure areas."]
 ],
 quiz:[
  {q:"The BMS / EPMS / DCIM division is:",
   o:["Random","Mechanical sequences / electrical monitoring / IT-facility capacity bridge","Three names for one tool","Marketing"],a:1,
   e:"Three overlapping nervous systems; knowing which watches what is basic fluency."},
  {q:"'What does this valve do on loss of signal?' is asking about:",
   o:["Paint spec","Its fail-safe position — the exact question the Singapore 2023 incident makes urgent","Warranty","Flow rate"],a:1,
   e:"Fail-safe positions, manual overrides, and hardwired safeties are the defenses against controls-driven outages."},
  {q:"Redundant chillers on a single BMS controller are:",
   o:["Fully redundant","Not redundant against the controller — a classic common-mode failure","Tier IV","Safer than manual"],a:1,
   e:"Segment controls as strictly as power paths; software is the modern shared dependency."},
  {q:"Layered physical security means:",
   o:["One strong door","Perimeter → shell → mantrap → hall → rack, each layer buying time","Guards only","Cameras only"],a:1,
   e:"Defense in depth, mirroring the redundancy philosophy of every other system."}
 ]
