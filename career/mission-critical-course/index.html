/* ================= UNIT E ================= */
{unit:"Unit E · Reliability & Operations", id:"e1", n:"E1",
 title:"Redundancy topologies masterclass",
 sub:"Beyond N+1 and 2N: distributed, block-redundant, catcher — how hyperscalers buy nines for less.",
 min:15,
 objectives:[
  "Command the full topology vocabulary: N, N+1, N+2, 2N, 2N+1, 3M2, block/catcher, isolated parallel",
  "Run the SPOF hunt and a basic FMEA",
  "Map topologies to Uptime Tiers and to cost/footprint"
 ],
 body:`
 <p>Unit A gave you the math; Units B–C gave you the machines. This lesson is the architecture layer where the two meet — and where hyperscalers have innovated hardest, because at 100+ MW, the difference between 2N and a smarter scheme is measured in hundreds of millions of dollars of gear (and, for you, in acres of equipment rooms).</p>

 <h3>The full vocabulary</h3>
 <div class="scroll"><table class="data">
  <tr><th>Scheme</th><th>Definition</th><th>Example (need 4 MW)</th><th>Character</th></tr>
  <tr><td class="n"><b>N</b></td><td>Exact capacity, zero margin</td><td>4 × 1 MW, all required</td><td>Any failure or maintenance drops load</td></tr>
  <tr><td class="n"><b>N+1</b></td><td>One spare component</td><td>5 × 1 MW</td><td>Cheapest real redundancy; shared path remains a SPOF</td></tr>
  <tr><td class="n"><b>N+2</b></td><td>Two spares</td><td>6 × 1 MW</td><td>Covers failure <em>during</em> maintenance</td></tr>
  <tr><td class="n"><b>2N</b></td><td>Two complete independent systems</td><td>2 × (4 MW)</td><td>Full A/B duality; doubles the gear</td></tr>
  <tr><td class="n"><b>2N+1</b></td><td>2N plus a spare</td><td>2 × (4 MW) + 1 MW</td><td>N+1 even after losing a whole side</td></tr>
  <tr><td class="n"><b>Distributed (3M2 / "3-to-make-2")</b></td><td>3+ systems share load at ≤2/3 each; any one can die</td><td>3 × 2 MW systems</td><td>~2N-like resilience at ~N+1-like cost — each system loafs until needed</td></tr>
  <tr><td class="n"><b>Block-redundant / "catcher" (e.g., 4M3)</b></td><td>Load blocks plus a reserve block; an STS swings any failed block's load to the catcher</td><td>3 active blocks + 1 catcher</td><td>Capital-efficient at campus scale; the catcher is shared insurance</td></tr>
  <tr><td class="n"><b>Isolated parallel</b></td><td>Ring of paralleled sources with reactors isolating faults</td><td>—</td><td>European hyperscale lineage; single bus, engineered fault isolation</td></tr>
 </table></div>
 <p>Real hyperscale practice mixes levels by system: commonly <strong>N+1 generators/transformers, 2N UPS/PDU</strong>, distributed or catcher schemes across blocks — reliability where it counts, capital saved where the math allows.</p>

 <h3>The SPOF hunt</h3>
 <p>A topology is a claim; the <strong>single-point-of-failure hunt</strong> is the audit. Method: walk every energy/fluid/signal path from source to rack and ask "if this one thing dies, who notices?" Classic finds: one make-up water line feeding all towers; A and B feeders sharing one duct bank (one backhoe = 2N defeated); both control networks through one switch; one fuel-polishing skid for every tank; a single fire panel authorized to trip both sides' EPO. Physical routing is where paper redundancy goes to die — <strong>diverse routing</strong> is the counter.</p>

 <h3>FMEA — the formal version</h3>
 <p><strong>Failure Modes & Effects Analysis</strong>: for each component, list its failure modes → effect on the system → detection → mitigation. Mission-critical FMEAs go a step further with the <em>"and then what?"</em> chain: UPS module fails → parallel modules absorb → do they alarm? → who responds, how fast, with what procedure? An owner's engineer who can chair an FMEA session is operating at exactly the altitude hyperscalers hire for.</p>

 ${A("Structural Angle","se")}
 <p>Topology is a floor-plan generator: 2N means two of every room, catcher schemes add reserve-block rooms and STS galleries, distributed schemes multiply medium rooms instead of duplicating giant ones, and every one implies different separation walls, duct-bank routes, and yard areas. And the SPOF hunt is partly structural: <em>diverse routing</em> means physically separated risers, trenches, and pathways — separation distances you draw. When the reliability architect changes the topology, your building changes; be in the room.</p>
 ${E}
 `,
 terms:[
  ["3M2 / distributed redundancy","Three-plus systems sharing load at partial capacity so any one can fail — ~2N resilience near N+1 cost."],
  ["Block-redundant / catcher","Active load blocks plus a shared reserve block that 'catches' any failed block via STS."],
  ["Isolated parallel","Paralleled-source ring with fault-isolating reactors; single-bus scheme with engineered isolation."],
  ["SPOF hunt","Systematic walk of every path asking 'if this dies, who notices?' — the audit behind topology claims."],
  ["Diverse routing","Physically separated redundant pathways so one event can't cut both — the backhoe defense."],
  ["FMEA","Failure Modes & Effects Analysis — component-by-component failure, effect, detection, mitigation."]
 ],
 quiz:[
  {q:"'3-to-make-2' (3M2) distributed redundancy delivers:",
   o:["Less than N","~2N-like resilience at ~N+1-like cost by running three systems at ≤2/3 load","Exactly 2N cost","No benefit"],a:1,
   e:"Any one system can fail and the survivors carry everything — the hyperscaler's favorite economics."},
  {q:"In a catcher/block-redundant scheme, the reserve block:",
   o:["Runs at full load always","Stands by to receive any failed block's load via static transfer switches","Is decorative","Replaces generators"],a:1,
   e:"Shared insurance across blocks — capital-efficient at campus scale (4M3 and similar)."},
  {q:"Two 'independent' feeders in one duct bank are:",
   o:["Fine","A classic SPOF — one excavation defeats the redundancy; diverse routing is the fix","Tier IV","More reliable"],a:1,
   e:"Physical routing is where paper redundancy dies; the SPOF hunt walks the actual paths."},
  {q:"Typical real hyperscale practice is:",
   o:["2N everything","Mixed: e.g., N+1 generators/transformers, 2N UPS/PDU, distributed/catcher across blocks","N everything","Random"],a:1,
   e:"Reliability where the math demands it, capital saved where it doesn't — topology per system, not one slogan."}
 ]
},
{unit:"Unit E · Reliability & Operations", id:"e2", n:"E2",
 title:"Commissioning: proving it works",
 sub:"Levels 1–5, the pull-the-plug test, and why owners spend millions to attack their own building.",
 min:12,
 objectives:[
  "Walk the five commissioning levels and what happens at each",
  "Explain integrated systems testing (IST) and load banks",
  "See commissioning as the owner's-engineer power tool"
 ],
 body:`
 <p>No mission-critical facility is trusted because it was designed well. It is trusted because it was <strong>attacked, on purpose, by its own commissioning team — and survived</strong>. Commissioning (Cx) is that structured assault, and it is one of the sector's most distinctive cultures (and career paths — commissioning leads are among the named shortage roles).</p>

 <h3>The five levels</h3>
 <div class="scroll"><table class="data">
  <tr><th>Level</th><th>Name</th><th>What actually happens</th></tr>
  <tr><td class="n">L1</td><td>Factory acceptance (FAT)</td><td>Witness the UPS/chiller/genset perform at the factory before shipping ("factory witness testing")</td></tr>
  <tr><td class="n">L2</td><td>Installation verification</td><td>On site, de-energized: is it installed right — torque, alignment, clearances, anchorage?</td></tr>
  <tr><td class="n">L3</td><td>Startup / energization</td><td>Each system powered and run individually per manufacturer procedure</td></tr>
  <tr><td class="n">L4</td><td>Functional performance</td><td>Each <em>system</em> proven against its sequence of operations — normal AND failure modes, alarms, failovers</td></tr>
  <tr><td class="n">L5</td><td>Integrated systems test (IST)</td><td>The whole facility together, at design load, through orchestrated disasters — including pulling utility power for real</td></tr>
 </table></div>

 <h3>L5, the main event</h3>
 <p>Since there are no servers yet, <strong>load banks</strong> — trailer- or rack-mounted resistor arrays — simulate megawatts of IT heat and draw. Then the scripts run: kill utility (watch UPS carry, engines start, transfer land), fail a chiller mid-test, fail a UPS module, drop a whole side of a 2N system, simulate a controls failure — while instrumented data streams to the Cx agent. Passing L5 ("white tag") is the moment the building becomes a mission-critical facility rather than an expensive shell. Owners rerun mini-ISTs after major changes; the Singapore case is what skipping that discipline during upgrades looks like.</p>

 ${A("Commissioning as career leverage","pw")}
 <p>For your interviews: commissioning is where owner's engineers earn their keep — witnessing tests, challenging pencil-whipped checklists, refusing to accept "it'll be fine" on a failed step. Your Falcon construction-administration and inspection background maps directly: you have professionally told contractors "show me, don't tell me." Say exactly that sentence; it is the commissioning ethos in seven words.</p>
 ${E}

 ${A("Structural Angle","se")}
 <p>Cx touches you more than most expect: L2 verifies <em>your anchorage</em> (torque on anchor bolts, isolator installation); load banks impose temporary floor/electrical loads and heat you may be asked to accommodate; IST failure scenarios validate the compartmentation you drew; and vibration baselining during L3–L4 (signatures of every rotating machine, new) becomes the reference for the facility's whole life. Ask for commissioning involvement in your first owner-side role — it is the fastest deep education in how the machine actually behaves.</p>
 ${E}
 `,
 terms:[
  ["Commissioning (Cx)","The staged, adversarial proving of a facility from factory tests through integrated systems testing."],
  ["FAT (factory acceptance test)","L1 witnessed performance testing at the manufacturer before shipment."],
  ["Functional performance test","L4 proof of each system against its sequence of operations, including failure modes."],
  ["IST (integrated systems test)","L5 whole-facility test at design load through scripted failures — the pull-the-plug event."],
  ["Load bank","Resistor arrays simulating megawatts of IT load and heat for testing before servers exist."],
  ["White tag","Informal term for equipment/systems having passed final integrated testing."],
  ["Cx agent","The independent commissioning authority scripting and witnessing the tests."]
 ],
 quiz:[
  {q:"The correct order of commissioning is:",
   o:["IST first to save time","Factory test → installation verification → startup → functional performance → integrated systems test","Random","Skip to occupancy"],a:1,
   e:"L1–L5: prove components, then installation, then systems, then everything together under attack."},
  {q:"Load banks exist because:",
   o:["Servers arrive early","You must simulate megawatts of IT load/heat to test a facility that has no IT yet","They cool the building","Code requires banks"],a:1,
   e:"Resistor arrays stand in for the mission during L4–L5 testing at design load."},
  {q:"The defining L5 moment is:",
   o:["Ribbon cutting","Pulling real utility power at load and watching the entire failover choreography perform","Painting","First invoice"],a:1,
   e:"Orchestrated disasters at design load — the facility earns trust by surviving its own team."},
  {q:"For structural engineers, L2 notably verifies:",
   o:["Nothing","Anchorage and isolator installation — your Ch. 13 work, physically checked","Only paint","Software"],a:1,
   e:"Installation verification includes anchor torque and vibration-isolator correctness — your details, audited."}
 ]
},
{unit:"Unit E · Reliability & Operations", id:"e3", n:"E3",
 title:"Operating the critical facility",
 sub:"MOPs, SOPs, EOPs; maintenance without downtime; and the human system that outlasts the design.",
 min:13,
 objectives:[
  "Distinguish SOPs, MOPs, and EOPs and why the paperwork is the safety system",
  "Explain maintenance strategy in a facility that can never stop",
  "Understand capacity management and Uptime's Operational Sustainability layer"
 ],
 body:`
 <p>Design gets a facility to day one. The next 7,300 days belong to operations — and the outage data (A3) says operations is where availability is actually won or lost: ~40% of organizations had a human-error major outage in three years, ~85% of those procedure-related.</p>

 <h3>The procedure trinity</h3>
 <ul>
  <li><strong>SOP — Standard Operating Procedure:</strong> how routine things are always done (shift rounds, valve lineups, escalation trees).</li>
  <li><strong>MOP — Method of Procedure:</strong> a step-by-step script for one specific planned activity — "UPS-2A annual service" — with prerequisites, back-out points, verification steps, and sign-offs. Critical facilities do <em>nothing</em> planned without an approved MOP; writing and challenging MOPs is a real job skill.</li>
  <li><strong>EOP — Emergency Operating Procedure:</strong> pre-decided responses to failures ("loss of CHW pressure, Hall 3"), drilled until they're reflex, because 3 a.m. is not when you want creativity.</li>
 </ul>
 <p>Add <strong>change management</strong> (formal review before anything touches a live system — the exact control that failed in Singapore) and <strong>drills</strong> (rehearsing EOPs like fire departments), and you have the human redundancy layer.</p>

 <h3>Maintenance without downtime</h3>
 <p>Concurrent maintainability (Tier III) exists so maintenance can happen at all. The strategy stack: <strong>preventive</strong> (calendar/runtime-based service — monthly generator runs under load, quarterly battery checks, annual IR thermography of every connection), <strong>predictive</strong> (condition monitoring: vibration signatures, oil analysis, battery impedance trending, thermal imaging — fix it because data says it's drifting), and <strong>reliability-centered</strong> (rank assets by consequence; spend attention accordingly). The maintenance-risk-window lesson from OVH applies: every open-panel hour is elevated risk, so MOPs, timing, and staging matter as much as the wrench work.</p>

 <h3>Capacity management — the slow-motion failure mode</h3>
 <p>Facilities fail slowly by <em>succeeding</em>: IT load creeps up; suddenly the N+1 chiller plant is N at peak, UPS ride-through is shorter than the generator start window, and nobody decided any of it. DCIM-driven capacity management — tracking actual vs design load per hall, per bus, per CRAH zone — is the defense. Owner's engineers ask for the capacity trend charts, not the nameplate.</p>

 ${A("Uptime's second standard","pw")}
 <p>The Tier Standard has a twin: <strong>Operational Sustainability</strong> — staffing/shift coverage, training, procedure quality, maintenance rigor, MOP discipline. Uptime rates it (Gold/Silver/Bronze) precisely because a Tier IV building run badly performs like a Tier II. In interviews, mentioning that operations certification exists — and that design should <em>enable</em> good operations (labeling, access, sightlines, working room) — signals maturity.</p>
 ${E}

 ${A("Structural Angle","se")}
 <p>Design-for-operations is partly yours: equipment access and removal paths (MTTR is physical), platforms and davits for safe rooftop maintenance, working clearances that make MOPs performable, labeling sightlines, and laydown space for the replacement chiller. A building that makes correct operation easy and wrong operation awkward is a reliability system — arguably the cheapest one on the project.</p>
 ${E}
 `,
 terms:[
  ["SOP / MOP / EOP","Routine procedures / scripted plans for specific planned work / drilled emergency responses."],
  ["Change management","Formal review-and-approval gate before touching live systems."],
  ["Preventive vs predictive maintenance","Calendar/runtime service vs condition-monitoring-driven intervention."],
  ["IR thermography","Infrared scanning of connections under load — loose lugs glow before they fail."],
  ["Capacity management","Tracking real load vs design margins so growth doesn't silently erase redundancy."],
  ["Operational Sustainability","Uptime's operations-quality standard (staffing, training, procedures) — the Tier standard's twin."]
 ],

{unit:"Unit F · Applied", id:"f1", n:"F1",
 title:"Case files: anatomy of real failures",
 sub:"Six incidents, six permanent lessons — the sector's shared scar tissue.",
 min:14,
 objectives:[
  "Analyze major real incidents using the full course vocabulary",
  "Extract the design and operations lesson each one wrote into practice",
  "Build your interview story bank"
 ],
 body:`
 <p>Mission-critical engineering is unusually shaped by named disasters — cite them fluently and you sound like you've been in the sector for years. You met OVHcloud, BA, Sandy, and Singapore earlier; here is the fuller dossier, organized by the lesson each teaches. (Details as publicly reported; use "reportedly" in interviews too — it signals discipline.)</p>

 ${CASE("Dossier 1 · transfer gear is the crux","Delta Air Lines, Atlanta, August 2016")}
 <p>A failure in aging power-control/switchgear equipment at Delta's data center — reportedly a fire in an ATS-associated lineup — cascaded: a portion of servers had no redundant power path, and the airline's global operation collapsed for days. ~2,000 flights cancelled; Delta publicly cited <strong>~$150M</strong> in costs.</p>
 <p class="lesson"><b>Lesson:</b> the 2N diagram is only as real as its worst-audited corner — post-incident review found single-corded equipment behind the redundancy. SPOF hunts (E1) exist because paper and reality drift apart over years of changes.</p>
 ${E}

 ${CASE("Dossier 2 · the recovery is a procedure too","British Airways, May 2017")}
 <p>Power interrupted at a Heathrow-area data center and then — reportedly — restored incorrectly, with a surge damaging systems. 75,000 passengers stranded; costs in the tens of millions of pounds.</p>
 <p class="lesson"><b>Lesson:</b> energization sequences are engineered, written, authorized, and drilled (E3). "Who may reconnect power, per what document?" is a design-review question.</p>
 ${E}

 ${CASE("Dossier 3 · the protection became the hazard","OVHcloud SBG2, March 2021")}
 <p>Fire seated in a UPS room (one unit serviced that morning) destroyed a five-story data center: no automatic suppression there, delayed cutoff, free-cooling airflow feeding spread. ~3.6M websites down; some customer data unrecoverable.</p>
 <p class="lesson"><b>Lesson:</b> maintenance windows are risk windows; the highest-energy rooms need detection + suppression + compartmentation (D1); and airflow paths are fire paths — a structural/mechanical joint problem.</p>
 ${E}

 ${CASE("Dossier 4 · dependency chains and elevation","Superstorm Sandy, NYC, 2012")}
 <p>Generators above flood level starved by fuel pumps and day tanks below it; NYU Langone evacuated patients; one data center ran on a stair-climbing diesel bucket brigade.</p>
 <p class="lesson"><b>Lesson:</b> a system's real flood rating is its lowest critical component (B3). Trace whole chains — power, fuel, controls, cooling make-up water — against hazard elevations. Now a standard siting/structural review.</p>
 ${E}

 ${CASE("Dossier 5 · cooling controls, national consequence","Equinix SG3, Singapore, October 2023")}
 <p>During a planned upgrade, a contractor's erroneous signal closed chilled-water buffer-tank valves; temperatures rose; DBS and Citibank lost ~2 days of normal service, ~2.5M transactions failed; the regulator intervened.</p>
 <p class="lesson"><b>Lesson:</b> controls are common-mode (D2); fail-safe positions matter; change management applies to <em>third parties</em>; and at modern density, thermal ride-through margins are measured in minutes (C3).</p>
 ${E}

 ${CASE("Dossier 6 · the grid itself fails regionally","Texas winter storm Uri, February 2021")}
 <p>A state-wide grid emergency took generation offline for days in single-digit temperatures. Facilities with fuel on site, winterized equipment, and disciplined load management rode through; others learned that "utility redundancy" within one grid is one dependency.</p>
 <p class="lesson"><b>Lesson:</b> regional common-mode events are real: fuel autonomy targets (24–48h+), winterization of gensets/fuel/water systems, and — for the biggest operators — geographic redundancy across grids. Resilience thinking extends past the fence line.</p>
 ${E}

 ${A("Structural Angle","se")}
 <p>Each dossier has a structural chapter: compartmentation and airflow (OVH), equipment elevation and flood-hardening (Sandy), anchorage and winterization of yard equipment (Uri), separation of redundant gear (Delta). In interviews, pairing a named incident with the design response you'd own is a signature move: "After Sandy, I'd review every fuel-chain elevation — that's a structural siting question as much as a mechanical one."</p>
 ${E}
 `,

  ["Fuel autonomy","On-site fuel duration target (24–48h+) sized against regional-event resupply risk."]

{unit:"Unit F · Applied", id:"f2", n:"F2",
 title:"The design review: a simulation",
 sub:"You're the owner's engineer. Here's the package. Find what's wrong.",
 min:15,
 objectives:[
  "Apply the whole program to a realistic design-review scenario",
  "Practice the owner's-engineer question set, discipline by discipline",
  "Rehearse flagging issues constructively"
 ],
 body:`
 <p><strong>Scenario:</strong> You've joined the owner's engineering team for <em>Project Sable</em> — a 48 MW, two-hall AI data center: tilt-up shell, steel roof, slab-on-grade halls at 300 psf, GB300-class racks at ~135 kW on direct-to-chip cooling, N+1 generators (20 × 3 MW), 2N UPS with lithium batteries, 3M2 chilled-water plant with thermal storage, W32 facility water. The design-build team has issued 60% documents. Work each exhibit before opening the reveal.</p>

 <h3>Exhibit A — Electrical one-line</h3>
 <p>The one-line shows A and B UPS systems in separate rooms… whose feeders leave the substation in <strong>a single shared duct bank</strong> for 300 ft before splitting. The lithium battery rooms sit <strong>back-to-back sharing a wall</strong>, each opening onto the same corridor.</p>
 <details class="reveal"><summary>Reveal: what do you flag?</summary><div class="body">
 <p>1) Shared duct bank = classic physical SPOF defeating 2N (one excavation, one fault, one flood). Require diverse routing with separation distance. 2) Back-to-back ESS rooms undermine compartmentation — an NFPA 855 review question and a fire-spread path between redundant systems; ask for rated separation, independent egress/ventilation, and deflagration vent paths that don't cross-contaminate. 3) Ask for the selective-coordination study at this milestone, not at the end.</p>
 </div></details>

 <h3>Exhibit B — Mechanical schematic</h3>
 <p>The 3M2 plant is elegant. But all three chilled-water systems draw make-up water from <strong>one municipal tap with one backflow preventer</strong>, and the thermal-storage tank's discharge valve is a <strong>single motorized valve, fail-closed on loss of signal</strong>.</p>
 <details class="reveal"><summary>Reveal: what do you flag?</summary><div class="body">
 <p>1) One make-up connection = the water-side SPOF hiding behind a redundant plant (towers/adiabatic assist die together in ~hours). Require dual connections or on-site storage. 2) A fail-<em>closed</em> valve between stored cooling and the load recreates Singapore 2023 by design — require fail-open (or fail-in-place with local manual override), plus hardwired opening on loss-of-cooling, plus a MOP for any work near it. 3) Ask: what rides UPS — CHW pumps, CDU pumps, hall fans? Show the thermal ride-through calc at 135 kW/rack.</p>
 </div></details>

 <h3>Exhibit C — Structural/equipment coordination</h3>
 <p>The roof plan shows 14 air-cooled chillers over Hall 2 with a continuous 14-ft screen wall; generator pads use the vendor's "standard" anchorage detail; the battery-room slab is designed for 150 psf "per code."</p>
 <details class="reveal"><summary>Reveal: what do you flag?</summary><div class="body">
 <p>1) Chillers over an operating hall: demand operating (filled) weights, vibration isolation selection coordinated with roof stiffness, and maintenance/removal paths (davits? crane zones?) — concurrent maintainability is physical. Screen wall = major wind element with drift/snow shadow: whose calc covers it? 2) "Vendor standard" anchorage ≠ site-specific ASCE 7-22 Ch. 13 design at RC IV / Ip 1.5 — require stamped, site-seismic anchorage calcs for every component over the threshold. 3) 150 psf battery room is likely wrong by 2–3×: lithium chosen, but demand the vendor rack point loads and design to actual — and confirm NFPA 855 provisions made it into the architecture. 4) Where do load banks sit during L5, and did anyone check that path/loading?</p>
 </div></details>

 <h3>Exhibit D — The schedule</h3>
 <p>The design-builder proposes compressing commissioning from 10 weeks to 5 by "overlapping L4 with early server installation in Hall 1."</p>
 <details class="reveal"><summary>Reveal: what do you flag?</summary><div class="body">
 <p>Functional failure testing over live customer IT is how test scripts become real outages (and how Singapore happened during an <em>upgrade</em>). Options an owner's engineer offers instead: phase-commission Hall 1 fully (through IST) before energizing Hall 2 work; add Cx staff/shifts; protect the L5 pull-the-plug test absolutely. Schedule pressure is normal; trading away commissioning integrity is not — say it with alternatives, not just a "no."</p>
 </div></details>

 ${A("The owner's-engineer question set — keep this card","pw")}
 <p><strong>Basis:</strong> What Risk Category, redundancy target, ride-through minutes, fuel autonomy, and Tier objective — in writing? <strong>Paths:</strong> Walk every A/B pair physically — where do they share a room, route, controller, or human? <strong>Failure:</strong> For each system: fail-safe positions, and-then-what chains, restoration procedure? <strong>Physical:</strong> Operating weights, anchorage calcs, removal paths, flood/hazard elevations? <strong>Proof:</strong> Coordination study current? Cx levels protected? Capacity trend plan? Ten questions, any package, any vendor.</p>
 ${E}
 `,
 terms:[
  ["Basis of design (BOD)","The written criteria (Risk Category, redundancy, ride-through, autonomy) every review anchors to."],
  ["60% documents","A mid-design milestone submission — the right moment to catch topology and coordination flaws."],
  ["Fail-open / fail-closed","A valve's loss-of-signal position; choosing wrong recreates Singapore 2023 by design."],
  ["Owner's-engineer question set","The reusable audit: basis, paths, failure behavior, physical reality, proof."]
 ],

  {q:"Two redundant feeders sharing 300 ft of duct bank is:",
   o:["Efficient design","A physical SPOF defeating 2N — require diverse routing","Tier IV","Unimportant"],a:1,
   e:"One excavation or fault takes both; diverse physical routing is the fix."},
  {q:"A single fail-closed valve between thermal storage and the load:",
   o:["Is safe","Recreates the Singapore 2023 failure mode by design — require fail-open/fail-in-place with manual override","Saves money harmlessly","Is required"],a:1,
   e:"Loss of signal should never lock away your stored cooling — fail-safe positions are a first-order review item."},

   o:["Is sufficient","Must be replaced by site-specific, stamped ASCE 7-22 Ch. 13 calcs at Ip = 1.5","Only matters in California","Applies to paint"],a:1,

  {q:"When the builder proposes overlapping failure testing with live IT:",
   o:["Approve to save schedule","Protect commissioning integrity and offer alternatives: phased Cx, more shifts, guard the IST","Cancel the project","Test on customers"],a:1,
   e:"Failure tests over live load are how scripts become outages; the OE's job is a constructive 'no' with options."}
 ]
},
{unit:"Unit F · Applied", id:"f3", n:"F3",
 title:"Capstone: fluency, credentials, and the map forward",
 sub:"Compress the program into interview-ready fluency and a 90-day continuation plan.",
 min:10,
 objectives:[
  "Consolidate the program into a mental model you can narrate in 90 seconds",
  "Choose credentials and deeper resources deliberately",
  "Leave with a concrete continuation plan"
 ],
 body:`
 <p>You now hold the full discipline: consequence economics and availability math (A), the electrical machine (B), the thermal machine (C), the systems protecting both (D), and the topology-commissioning-operations layer that makes it all real (E) — stress-tested against real failures and a simulated design review (F).</p>

 <h3>The 90-second narration (rehearse until effortless)</h3>
 <p>"A mission-critical facility is a machine for turning electricity into service without interruption. Reliability comes from topology, not components — parallel paths, no common modes. Electrically: utility to substation, MV to unit transformers at 480 V, UPS bridging the ten seconds to generator power, A-and-B all the way to the rack. Thermally: every watt becomes heat; chilled water or direct liquid carries it out through CDUs and plant to towers or dry coolers — and at AI density, cooling is critical load with its own ride-through. Fire, controls, and security wrap both. Then the part most people miss: commissioning proves it — five levels ending in pull-the-plug — and operations keeps it, because half of major outages are human and procedural. My structural work — anchorage, compartmentation, equipment support, elevations — is one of the load-bearing walls of that whole promise."</p>

 <h3>Credentials, chosen deliberately</h3>
 <div class="scroll"><table class="data">
  <tr><th>Credential</th><th>What / cost</th><th>Verdict for you</th></tr>
  <tr><td><b>Uptime ATD</b> (Accredited Tier Designer)</td><td>~16-hr course + exam, ~$5k, the sector's premier design credential</td><td>High signal for owner-side roles; ideal once an employer pays</td></tr>
  <tr><td><b>DCD Academy FMCI</b></td><td>Self-paced module library, paid</td><td>Good structured breadth; ops-flavored; optional after this program</td></tr>
  <tr><td><b>Uptime AOS / Ops courses</b></td><td>Operations-side accreditations</td><td>Later, if you drift toward Cx/ops leadership</td></tr>
  <tr><td><b>SE license</b></td><td>Your existing track</td><td>Still the core structural differentiator — keep the plan from the Command Center</td></tr>
 </table></div>

 <h3>Your 90-day continuation plan</h3>
 <ol>
  <li><strong>Weeks 1–2:</strong> Finish this program's final exam at 80%+. Read the free STRUCTURE Mag data center design-parameters article and the Palisade Ch. 13 guide (Resources) — they arm the structural specifics.</li>
  <li><strong>Weeks 3–6:</strong> Read Uptime's Tier Topology explainers and the current <em>Annual Outage Analysis</em>; skim OCP's Open Rack v3 and Mt Diablo announcements. Post two LinkedIn pieces from this program (the availability math; the Singapore case as a structural engineer reads it) — visibility flywheel.</li>
  <li><strong>Weeks 7–12:</strong> Join 7x24 Exchange's local chapter (meetings = hiring managers) and iMasons. Do one deep artifact: a one-page "owner's engineer review checklist" you author and publish — it's a portfolio piece interviewers remember. Then start the anchorage (Ch. 13) deep-dive course when ready.</li>
 </ol>

 ${A("Final Structural Angle — your positioning sentence","se")}
 <p>"I'm a licensed structural engineer who speaks the whole mission-critical machine — I can walk a one-line, challenge a fail-safe position, and audit a thermal-ride-through claim — and my own scope, from Ch. 13 anchorage to compartmentation to equipment elevations, is where half of those reliability promises physically live." That sentence, delivered with the fluency this program built, is the difference between a structural candidate and <em>the</em> structural candidate.</p>
 ${E}

const EXAM=[
 {q:"A facility needs 6 MW. It installs three 3 MW chilled-water systems, each loafing at ~67%. This topology is:",o:["N","N+1","2N","Distributed redundancy (3M2)"],a:3,e:"Three-to-make-two: any one system can fail and the survivors carry the full load — ~2N resilience at ~N+1 cost."},
 {q:"Utility fails. Which sequence is correct?",o:["Generators carry instantly; UPS starts later","UPS inverters carry immediately; engines start ~10–15 s; paralleling gear syncs; load transfers in blocks","ATS transfers in microseconds; UPS is backup to it","Batteries carry for 24 hours"],a:1,e:"UPS bridges the seconds-to-minutes; engines start, sync via paralleling switchgear, and accept load in stages."},
 {q:"Five series components at 99.99% each yield approximately:",o:["99.99%","99.95%","99.999%","100%"],a:1,e:"0.9999⁵ ≈ 99.95% — chains multiply down; the case for parallel paths."},
 {q:"Which is a common-mode failure the 2N math ignores?",o:["A failed fan bearing","One BMS controller commanding both 'independent' cooling paths","A blown fuse in one PDU","A single bad battery cell"],a:1,e:"Shared controls, rooms, routes, and humans break the independence assumption behind parallel availability."},
 {q:"The #1 cause family of impactful outages (Uptime 2025) is:",o:["Cooling","Cyber attack","Power — most often UPS","Fire"],a:2,e:"Power ≈ 45%, most often the UPS itself; human/procedural factors run through the majority of incidents."},
 {q:"Double-conversion UPS means:",o:["Two UPS units","Load always rides the rectifier→inverter chain; disturbances never touch it","It converts diesel twice","Eco-mode"],a:1,e:"AC→DC→AC continuously with zero transfer time — the mission-critical standard topology."},
 {q:"Lithium batteries vs VRLA, for the building:",o:["Heavier floors, no code changes","~60–80% lighter with NFPA 855 separation, protection, and off-gas provisions","Identical","Forbidden indoors"],a:1,e:"The chemistry swap slashes floor load but imports an energy-storage code regime you must coordinate."},
 {q:"Selective coordination guarantees:",o:["All breakers trip simultaneously","Only the device nearest the fault operates","No faults occur","Generators sync faster"],a:1,e:"Staged time-current curves stop a rack-level fault cascading into a facility event."},
 {q:"An STS differs from an ATS because it:",o:["Is slower","Switches between two live sources in under a quarter-cycle, downstream","Uses diesel","Is outdoors"],a:1,e:"Solid-state, ~8 ms, giving even single-corded loads effective 2N; the ATS handles utility↔generator in seconds."},
 {q:"CRAH vs CRAC:",o:["Identical","CRAH = chilled-water coil + fan (central plant); CRAC = onboard compressor DX unit","CRAH is outdoor","CRAC uses ammonia"],a:1,e:"CRA-H = hydronic, CRA-C = compressor — big sites standardize on CRAH + central plant."},
 {q:"A 5,000-ton plant at standard ΔT circulates roughly:",o:["500 gpm","1,200 gpm","12,000 gpm","No water"],a:2,e:"~2.4 gpm per ton — and a 24\" main carries ~195 lb of water per foot, which is structural load."},

 {q:"The thermal battery of a critical plant is:",o:["Lithium cells","Chilled-water storage sized for the chiller-restart window","The fuel tank","Ice cubes"],a:1,e:"Stored cold water absorbs heat for the 5–15 minute restart gap."},

/* ============================ APP ============================ */
(function(){
 const main=document.getElementById('main');
 const tocEl=document.getElementById('toc');
 const KEY='mcfe-program-v1';
 let store={};try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
 store.done=store.done||{};store.quiz=store.quiz||{};store.fc=store.fc||{};store.exam=store.exam||null;
 const save=()=>localStorage.setItem(KEY,JSON.stringify(store));

 const PAGES=COURSE.map(m=>({type:'lesson',m})).concat([{type:'exam'},{type:'flash'},{type:'gloss'},{type:'res'}]);
 let idx=(store.last!=null&&store.last<PAGES.length)?store.last:0;

 const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 const label2=pg=>pg.type==='exam'?'Final exam':pg.type==='flash'?'Flashcards':pg.type==='gloss'?'Glossary':'Resources';

 function buildTOC(){
  tocEl.innerHTML='';let last=null;
  COURSE.forEach((m,i)=>{
   if(m.unit!==last){last=m.unit;const g=document.createElement('div');g.className='grp';g.textContent=m.unit;tocEl.appendChild(g)}
   const b=document.createElement('button');
   b.innerHTML='<span class="n">'+m.n+'</span><span>'+m.title+'</span><span class="dot"></span>';
   if(store.done[m.id])b.classList.add('done');
   if(PAGES[idx].type==='lesson'&&PAGES[idx].m.id===m.id)b.setAttribute('aria-current','true');
   b.onclick=()=>go(i);tocEl.appendChild(b);
  });
  const g=document.createElement('div');g.className='grp';g.textContent='Assessment & Reference';tocEl.appendChild(g);
  [['Final exam (20 Q)',COURSE.length],['Flashcards',COURSE.length+1],['Glossary',COURSE.length+2],['Resources',COURSE.length+3]].forEach(([lab,pi])=>{
   const b=document.createElement('button');b.innerHTML='<span class="n">·</span><span>'+lab+'</span>';
   if(idx===pi)b.setAttribute('aria-current','true');b.onclick=()=>go(pi);tocEl.appendChild(b);
  });
  const done=COURSE.filter(m=>store.done[m.id]).length;
  document.getElementById('ovtext').textContent=done+' of '+COURSE.length+' complete'+(store.exam?(' · exam '+store.exam.correct+'/'+store.exam.total):'');
  document.getElementById('ovbar').style.width=(done/COURSE.length*100)+'%';
 }

 function quizHTML(qs){
  return qs.map((q,qi)=>{
   const opts=q.o.map((o,oi)=>'<label class="opt"><input type="radio" name="q'+qi+'" value="'+oi+'">'+esc(o)+'</label>').join('');
   return '<div class="q" data-qi="'+qi+'"><div class="stem">'+(qi+1)+'. '+esc(q.q)+'</div>'+opts+'<div class="exp">'+esc(q.e)+'</div></div>';
  }).join('');
 }
 function gradeQuiz(container,qs){
  let correct=0;
  qs.forEach((q,qi)=>{
   const qEl=container.querySelector('.q[data-qi="'+qi+'"]');
   const sel=qEl.querySelector('input:checked');
   qEl.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','wrong'));
   qEl.querySelectorAll('.opt')[q.a].classList.add('correct');
   if(sel){if(+sel.value===q.a)correct++;else qEl.querySelectorAll('.opt')[+sel.value].classList.add('wrong')}
   qEl.classList.add('answered');
  });
  return correct;
 }

 function renderLesson(m){
  const objs=m.objectives.map(o=>'<li>'+o+'</li>').join('');
  const terms=m.terms.length?'<h3>Key terms</h3><dl>'+m.terms.map(t=>'<div class="term"><dt>'+t[0]+'</dt><dd>'+t[1]+'</dd></div>').join('')+'</dl>':'';
  const quiz=m.quiz.length?
   '<div class="quiz"><p class="qh">Self-check · '+m.quiz.length+' questions</p><form>'+quizHTML(m.quiz)+'</form>'+
   '<div class="btnrow"><button class="act" id="check">Check answers</button><button class="act ghost" id="markdone">Mark complete</button><span class="score" id="qscore"></span></div></div>'
   :'<div class="btnrow"><button class="act ghost" id="markdone">Mark complete</button></div>';
  main.innerHTML='<p class="lead">'+m.n+' · '+m.unit+'</p><h2>'+m.title+'</h2><p class="sub">'+m.sub+'</p>'+
   '<div class="meta"><span>~'+m.min+' min</span><span>'+m.quiz.length+' questions</span><span>'+(store.done[m.id]?'✓ complete':'in progress')+'</span></div>'+
   '<div class="obj"><p class="h">Objectives</p><ul>'+objs+'</ul></div>'+m.body+terms+quiz+'<div class="pager"></div>';
  const cb=main.querySelector('#check');
  if(cb)cb.onclick=e=>{e.preventDefault();
   const c=gradeQuiz(main,m.quiz);
   store.quiz[m.id]={correct:c,total:m.quiz.length};save();
   main.querySelector('#qscore').textContent='Score: '+c+'/'+m.quiz.length;
   if(c===m.quiz.length)markDone(m);
  };
  const md=main.querySelector('#markdone');
  if(md)md.onclick=e=>{e.preventDefault();markDone(m);md.textContent='✓ Complete'};
  pager();
 }
 function markDone(m){store.done[m.id]=true;save();buildTOC();
  const meta=main.querySelector('.meta');if(meta)meta.lastElementChild.textContent='✓ complete'}

 function renderExam(){
  main.innerHTML='<p class="lead">Assessment</p><h2>Final exam</h2>'+
   '<p class="sub">20 questions across the whole program. 80% (16/20) is the fluency bar.'+(store.exam?' Last attempt: '+store.exam.correct+'/'+store.exam.total+'.':'')+'</p>'+
   '<div class="quiz"><form>'+quizHTML(EXAM)+'</form>'+
   '<div class="btnrow"><button class="act" id="grade">Grade exam</button><span class="score" id="xscore"></span></div></div><div class="pager"></div>';
  main.querySelector('#grade').onclick=e=>{e.preventDefault();
   const c=gradeQuiz(main,EXAM);
   store.exam={correct:c,total:EXAM.length};save();buildTOC();
   main.querySelector('#xscore').textContent='Score: '+c+'/'+EXAM.length+(c>=16?' — fluency bar cleared. Say it in interviews.':' — review the flagged lessons and retake.');
  };
  pager();
 }

 function allCards(){
  const cards=[];
  COURSE.forEach(m=>m.terms.forEach(t=>cards.push({f:t[0],b:t[1]})));
  EXTRA_TERMS.forEach(t=>cards.push({f:t[0],b:t[1]}));
  return cards;
 }
 function renderFlash(){
  const cards=allCards();
  let order=store.fc.order;
  if(!order||order.length!==cards.length){order=cards.map((_,i)=>i);store.fc={order:order,pos:0,known:{}};save()}
  let pos=store.fc.pos||0;
  function draw(){
   if(pos>=order.length)pos=0;
   const c=cards[order[pos]];
   const knownCount=Object.keys(store.fc.known).length;
   main.innerHTML='<p class="lead">Drill</p><h2>Flashcards</h2><p class="sub">'+cards.length+' cards from every lesson. Tap to flip; mark what you own.</p>'+
    '<div class="fc"><div class="fcCard" id="card" tabindex="0" role="button" aria-label="flashcard"><div class="front">'+esc(c.f)+'</div><div class="back">'+esc(c.b)+'</div></div>'+
    '<div class="fcnav"><button class="act ghost" id="again">↺ Again later</button><button class="act" id="got">✓ Got it</button></div>'+
    '<div class="fcmeta">Card '+(pos+1)+' / '+order.length+' · '+knownCount+' marked known</div></div><div class="pager"></div>';
   const card=main.querySelector('#card');
   card.onclick=()=>card.classList.toggle('flipped');
   card.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();card.classList.toggle('flipped')}};
   main.querySelector('#got').onclick=()=>{store.fc.known[order[pos]]=1;pos++;store.fc.pos=pos;save();draw()};
   main.querySelector('#again').onclick=()=>{const cur=order.splice(pos,1)[0];order.push(cur);store.fc.order=order;save();draw()};
   pager();
  }
  draw();
 }

 function renderGloss(){
  const all=[];
  COURSE.forEach(m=>m.terms.forEach(t=>all.push([t[0],t[1],m.n])));
  EXTRA_TERMS.forEach(t=>all.push(t));
  const seen=new Set();
  const uniq=all.filter(t=>{const k=t[0].toLowerCase();if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>a[0].localeCompare(b[0]));
  main.innerHTML='<p class="lead">Reference</p><h2>Glossary</h2><p class="sub">'+uniq.length+' terms of mission-critical fluency.</p>'+
   '<input class="search" id="gs" placeholder="Filter… (e.g. 2N, CDU, MOP, arc flash)">'+
   '<dl id="glist">'+uniq.map(t=>'<div class="term" data-t="'+esc((t[0]+' '+t[1]).toLowerCase())+'"><dt>'+esc(t[0])+'<span class="cat">'+esc(t[2])+'</span></dt><dd>'+esc(t[1])+'</dd></div>').join('')+'</dl><div class="pager"></div>';
  const gs=main.querySelector('#gs');
  gs.oninput=()=>{const v=gs.value.toLowerCase();main.querySelectorAll('#glist .term').forEach(el=>{el.style.display=el.dataset.t.includes(v)?'':'none'})};
  pager();
 }

 function renderRes(){
  main.innerHTML='<p class="lead">Reference</p><h2>Resources & sources</h2><p class="sub">The authorities behind this program, and the roads beyond it.</p>'+
   RESOURCES.map(g=>'<h3>'+g[0]+'</h3><div class="reslist">'+g[1].map(it=>'<div class="res"><a href="'+it[1]+'" target="_blank" rel="noopener">'+it[0]+' ↗</a><p>'+it[2]+'</p></div>').join('')+'</div>').join('')+
   '<div class="call pw" style="margin-top:20px"><span class="tag">Accuracy note</span><p>Figures herein (outage statistics, PUE/WUE, equipment sizes, case details) reflect the cited 2025–2026 sources and public reporting; case-study details are "as publicly reported." For design work or citations, confirm against the current primary source and code edition.</p></div><div class="pager"></div>';
  pager();
 }

 function pager(){
  const p=main.querySelector('.pager');if(!p)return;
  const prev=idx>0?PAGES[idx-1]:null,next=idx<PAGES.length-1?PAGES[idx+1]:null;
  const lab=pg=>pg.type==='lesson'?pg.m.title:label2(pg);
  p.innerHTML='<button '+(prev?'':'disabled')+' id="pv"><span class="lbl">◂ Previous</span>'+(prev?lab(prev):'—')+'</button>'+
   '<button class="next" '+(next?'':'disabled')+' id="nx"><span class="lbl">Next ▸</span>'+(next?lab(next):'—')+'</button>';
  if(prev)p.querySelector('#pv').onclick=()=>go(idx-1);
  if(next)p.querySelector('#nx').onclick=()=>go(idx+1);
 }

 function render(){
  const pg=PAGES[idx];
  if(pg.type==='lesson')renderLesson(pg.m);
  else if(pg.type==='exam')renderExam();
  else if(pg.type==='flash')renderFlash();
  else if(pg.type==='gloss')renderGloss();
  else renderRes();
  document.getElementById('mobcrumb').textContent=pg.type==='lesson'?(pg.m.n+' · '+pg.m.title):label2(pg);
  buildTOC();
  window.scrollTo({top:0,behavior:'auto'});
  if(window.innerWidth<960)document.getElementById('side').classList.add('hide');
 }
 function go(i){idx=i;store.last=i;save();render()}

 document.getElementById('menu').onclick=()=>document.getElementById('side').classList.toggle('hide');
 document.getElementById('theme').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
 };
 document.getElementById('lessonpill').textContent=COURSE.length+' lessons';
 render();
})();
</script>


<script>
(function(){
  var P={}; try{P=JSON.parse(localStorage.getItem('ttsPrefs')||'{}')}catch(e){}
  function save(){localStorage.setItem('ttsPrefs',JSON.stringify(P))}
  var fab=document.createElement('button'); fab.id='ttsFab'; fab.title='Listen to this page'; fab.textContent='🎧';
  document.body.appendChild(fab);
  var bar=document.createElement('div'); bar.id='ttsBar';
  bar.innerHTML='<div class="row">'+
   '<button class="primary" id="tPlay" title="Play/Pause">▶</button>'+
   '<button id="tPrev" title="Previous section">⏮</button>'+
   '<button id="tNext" title="Next section">⏭</button>'+
   '<span class="pos" id="tPos">–/–</span>'+
   '<select id="tSpeed" title="Speed"><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.3">1.3×</option><option value="1.5">1.5×</option></select>'+
   '<select id="tEng" title="Voice engine"><option value="dev">Device voice (free)</option><option value="el">ElevenLabs (key)</option></select>'+
   '<input id="tKey" type="password" placeholder="ElevenLabs API key" style="display:none">'+
   '<select id="tVoice" style="display:none"><option value="">voice…</option></select>'+
   '<button id="tClose" title="Close">✕</button>'+
   '<div class="hint" id="tHint">Reads every lesson aloud, section by section. Device voice works offline; ElevenLabs needs your own key (stored only on this device — works in the downloaded file; the hosted page may block it).</div></div>';
  document.body.appendChild(bar);
  var $=function(id){return document.getElementById(id)};
  var secs=[], idx=0, playing=false, curAudio=null, prefetch={}, engine=P.engine||'dev';
  $('tEng').value=engine; if(P.key)$('tKey').value=P.key; if(P.speed)$('tSpeed').value=P.speed;
  function showEl(){var el=engine==='el'; $('tKey').style.display=el?'':'none'; $('tVoice').style.display=el?'':'none';}
  showEl();
  function collect(){
    var main=document.getElementById('main'); if(!main)return [];
    var out=[], skip=function(n){return n.closest('.quiz,.pager,.fcnav,.search,#glist,form,nav')};
    var nodes=main.querySelectorAll('h2,.sub,h3,p,li,dt,dd,.stem');
    nodes.forEach(function(n){
      if(skip(n))return;
      if(n.querySelector('p,li,h3'))return; // container dupes
      var t=(n.innerText||'').replace(/\s+/g,' ').trim();
      if(t.length<3)return;
      out.push({node:n,text:t});
    });
    return out;
  }
  function mark(i){
    secs.forEach(function(s){s.node.classList.remove('tts-now')});
    if(secs[i]){secs[i].node.classList.add('tts-now');
      try{secs[i].node.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){secs[i].node.scrollIntoView()}}
    $('tPos').textContent=(i+1)+'/'+secs.length;
  }
  function stopAll(){
    playing=false;$('tPlay').textContent='▶';
    try{speechSynthesis.cancel()}catch(e){}
    if(curAudio){curAudio.pause();curAudio=null}
    secs.forEach(function(s){s.node.classList.remove('tts-now')});
  }
  /* device engine */
  function devSpeak(text,done){
    var parts=text.match(/[^.!?]+[.!?]*/g)||[text];
    var chunks=[],cur='';
    parts.forEach(function(p){if((cur+p).length>220){if(cur)chunks.push(cur);cur=p}else cur+=p});
    if(cur)chunks.push(cur);
    var k=0;
    (function next(){
      if(!playing)return;
      if(k>=chunks.length)return done();
      var u=new SpeechSynthesisUtterance(chunks[k++]);
      u.rate=parseFloat($('tSpeed').value);
      var vs=speechSynthesis.getVoices().filter(function(v){return /en[-_]/i.test(v.lang)});
      var pref=vs.find(function(v){return /Natural|Google US|Samantha|Aria/i.test(v.name)})||vs[0];
      if(pref)u.voice=pref;
      u.onend=next; u.onerror=next;
      speechSynthesis.speak(u);
    })();
  }
  /* elevenlabs engine */
  function elFetch(i){
    var key=$('tKey').value.trim(); if(!key)return Promise.reject('no-key');
    if(prefetch[i])return prefetch[i];
    var vid=$('tVoice').value||'JBFqnCBsd6RMkjVDRZzb';
    prefetch[i]=fetch('https://api.elevenlabs.io/v1/text-to-speech/'+vid+'?output_format=mp3_44100_64',{
      method:'POST',headers:{'xi-api-key':key,'Content-Type':'application/json'},
      body:JSON.stringify({text:secs[i].text,model_id:'eleven_flash_v2_5'})
    }).then(function(r){if(!r.ok)throw new Error('TTS '+r.status);return r.blob()})
      .then(function(b){return URL.createObjectURL(b)});
    return prefetch[i];
  }
  function elSpeak(i,done){
    elFetch(i).then(function(url){
      if(!playing)return;
      curAudio=new Audio(url); curAudio.playbackRate=parseFloat($('tSpeed').value);
      curAudio.onended=done; curAudio.onerror=done;
      curAudio.play();
      if(i+1<secs.length)elFetch(i+1).catch(function(){});
    }).catch(function(e){
      $('tHint').textContent='ElevenLabs failed ('+e+'). Check the key/credits — or the hosted page is blocking external audio: use the downloaded file, or switch to Device voice.';
      stopAll();
    });
  }
  function playFrom(i){
    idx=i; if(idx>=secs.length){stopAll();return}
    mark(idx);
    var done=function(){if(playing)playFrom(idx+1)};
    if(engine==='el')elSpeak(idx,done); else devSpeak(secs[idx].text,done);
  }
  function start(){
    secs=collect();
    if(!secs.length){$('tHint').textContent='Nothing readable on this page — open a lesson.';return}
    playing=true;$('tPlay').textContent='⏸';
    if(idx>=secs.length)idx=0;
    playFrom(idx);
  }
  fab.onclick=function(){bar.classList.toggle('on');
    if(bar.classList.contains('on')&&engine==='el'&&$('tKey').value)loadVoices()};
  $('tClose').onclick=function(){stopAll();bar.classList.remove('on')};
  $('tPlay').onclick=function(){if(playing){stopAll()}else start()};
  $('tNext').onclick=function(){if(!secs.length)return;stopAll();playing=true;$('tPlay').textContent='⏸';playFrom(Math.min(idx+1,secs.length-1))};
  $('tPrev').onclick=function(){if(!secs.length)return;stopAll();playing=true;$('tPlay').textContent='⏸';playFrom(Math.max(idx-1,0))};
  $('tEng').onchange=function(){engine=this.value;P.engine=engine;save();showEl();
    if(engine==='el'&&$('tKey').value)loadVoices()};
  $('tSpeed').onchange=function(){P.speed=this.value;save();if(curAudio)curAudio.playbackRate=parseFloat(this.value)};
  $('tKey').onchange=function(){P.key=this.value.trim();save();loadVoices()};
  $('tVoice').onchange=function(){P.voice=this.value;save();prefetch={}};
  function loadVoices(){
    var key=$('tKey').value.trim(); if(!key)return;
    fetch('https://api.elevenlabs.io/v1/voices',{headers:{'xi-api-key':key}})
     .then(function(r){return r.json()}).then(function(d){
       var sel=$('tVoice'); sel.innerHTML='';
       (d.voices||[]).forEach(function(v){
         var o=document.createElement('option');o.value=v.voice_id;o.textContent=v.name.split(' - ')[0];
         if((P.voice||'JBFqnCBsd6RMkjVDRZzb')===v.voice_id)o.selected=true;
         sel.appendChild(o)});
     }).catch(function(){$('tHint').textContent='Could not reach ElevenLabs (key or network/CSP). Device voice still works.'});
  }
  /* stop when user navigates lessons */
  var mo=new MutationObserver(function(){if(playing){stopAll()}prefetch={};idx=0;$('tPos').textContent='–/–'});
  var mainEl=document.getElementById('main'); if(mainEl)mo.observe(mainEl,{childList:true});
  if('speechSynthesis' in window)speechSynthesis.getVoices();
})();
</script>
