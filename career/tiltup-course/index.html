{unit:"Capstone · The Portfolio Calc", id:"c1", n:"C1",
 title:"Capstone A — design brief & loads",
 sub:"Panel P-7 of a data hall: establish every number before touching capacity.",
 min:15,
 objectives:[
  "Set up the design basis like a real calc package",
  "Compute all loads: C&C wind, seismic body & anchorage, eccentric gravity, self-weight",
  "Assemble the factored axial/moment inputs for the slender-wall check"
 ],
 body:`
 <p><strong>The artifact you're producing:</strong> a complete, defensible design calculation for one data center tilt-up panel — out-of-plane slender wall, in-plane summary, lifting check, bracing check — formatted like a professional calc package. Work every number yourself alongside these pages; the course numbers are your answer key. <em>(Round-off may shift your values ±2% — that's fine. This is a training artifact: verify against current code editions before any real use.)</em></p>

 <h3>Design brief — Panel P-7</h3>
 <div class="scroll"><table class="data">
  <tr><th>Parameter</th><th>Value</th><th>Notes</th></tr>
  <tr><td>Panel</td><td class="n">24'-0" wide × 36'-0" tall × 9¼" thick</td><td>Solid interior-zone panel (no openings) — the baseline before you attempt legs</td></tr>
  <tr><td>Clear vertical span ℓ<sub>c</sub></td><td class="n">32'-0" (384 in)</td><td>Bearing at footing to roof line; <b>4'-0" parapet</b> above the roof</td></tr>
  <tr><td>Materials</td><td class="n">f′<sub>c</sub> = 4,000 psi · f<sub>y</sub> = 60 ksi</td><td>β₁ = 0.85; normal weight (λ=1.0)</td></tr>
  <tr><td>Reinforcement (trial)</td><td class="n">#5 @ 12" vertical, single centered curtain</td><td>A<sub>s</sub> = 0.31 in²/ft · d = t/2 = 4.625 in</td></tr>
  <tr><td>Roof</td><td class="n">DL 16 psf · L<sub>r</sub> 20 psf · joist trib 25 ft</td><td>Seat eccentricity e = t/2 + 3.5" = <b>8.125 in</b></td></tr>
  <tr><td>Wind (C&C, ultimate)</td><td class="n">26 psf, Zone 4</td><td>115 mph Exp C class site; Zone 5 edge strips higher — extension exercise</td></tr>
  <tr><td>Seismic</td><td class="n">S<sub>DS</sub> = 0.50 · I<sub>e</sub> = 1.0</td><td>Flexible roof diaphragm, span L<sub>f</sub> = 200 ft</td></tr>
 </table></div>

 <h3>Step L1 — self-weight quantities (per 1-ft strip)</h3>
 ${EQ("Wall weight = (9.25/12)(150 pcf) = <b>115.6 psf</b> &nbsp;·&nbsp; Weight above midheight = (16 ft + 4 ft parapet)(115.6) = <b>2,312 plf = 2.31 k/ft</b>")}

 <h3>Step L2 — wind vs seismic body force (which governs flexure?)</h3>
 ${EQ("Seismic body: F<sub>p</sub> = 0.40 S<sub>DS</sub> I<sub>e</sub> W<sub>w</sub> = 0.40(0.50)(1.0)(115.6) = <b>23.1 psf</b> &lt; wind 26 psf → <b>wind governs</b> out-of-plane (1.0W vs 1.0E both ultimate-level)")}

 <h3>Step L3 — the anchorage force is a DIFFERENT, bigger number</h3>
 ${EQ("k<sub>a</sub> = 1 + L<sub>f</sub>/100 = 1 + 200/100 = 2.0 &nbsp;·&nbsp; W<sub>p</sub> = (ℓ<sub>c</sub>/2 + parapet)(115.6) = (16+4)(115.6) = 2,312 plf")}
 ${EQ("F<sub>anch</sub> = 0.4 S<sub>DS</sub> k<sub>a</sub> I<sub>e</sub> W<sub>p</sub> = 0.4(0.50)(2.0)(1.0)(2,312) = <b>925 plf</b> — the roof connection designs for ~0.93 k/ft, ~2× what the body force alone would suggest. File for Capstone C and Lesson 08's chain.")}

 <h3>Step L4 — gravity loads & the governing combo</h3>
 ${EQ("Roof: D = 16(25) = 400 plf · L<sub>r</sub> = 20(25) = 500 plf at e = 8.125 in")}
 ${EQ("Combo 1.2D + 1.0W + 0.5L<sub>r</sub>: &nbsp; P<sub>u,roof</sub> = 1.2(0.40)+0.5(0.50) = <b>0.73 k/ft</b> &nbsp;·&nbsp; P<sub>u,mid</sub> = 0.73 + 1.2(2.312) = <b>3.50 k/ft</b>")}
 ${EQ("Entry check: P<sub>u</sub>/A<sub>g</sub> = 3,500/(12×9.25) = <b>31.5 psi ≤ 0.06f′<sub>c</sub> = 240 psi ✓</b> — flexure-dominated, §11.8 applies")}

 <h3>Step L5 — first-order midheight moment</h3>
 ${EQ("Wind: w<sub>u</sub>ℓ<sub>c</sub>²/8 = (0.026)(32)²/8 = 3.33 k-ft = <b>39.9 k-in</b> &nbsp;·&nbsp; Ecc. roof: P<sub>u,roof</sub>·e/2 = 0.73(8.125)/2 = <b>3.0 k-in</b> &nbsp;·&nbsp; <b>M<sub>ua</sub> = 42.9 k-in</b> per ft strip")}

 ${A("Checkpoint before Capstone B","pw")}
 <p>Your sheet should now show: 115.6 psf wall · 2.31 k/ft above midheight · wind 26 psf governing body design · anchorage 925 plf filed separately · P<sub>u,mid</sub> = 3.50 k/ft · M<sub>ua</sub> = 42.9 k-in · entry checks passed. Also run combo 0.9D+1.0W yourself (P<sub>u,mid</sub> = 2.44 k/ft) — you'll need it in B to confirm 1.2D governs capacity here. If every number matches within rounding, proceed.</p>
 ${E}
 `,
 terms:[
  ["Design basis sheet","Page 1 of a real calc package: geometry, materials, loads, code editions, assumptions — reviewers read it first."],
  ["Body force vs anchorage force","23.1 psf on the panel vs 925 plf at the roof connection — the two-different-forces lesson in numbers."]
 ],
 quiz:[
  {q:"For P-7, out-of-plane flexure is governed by:",
   o:["Seismic (23.1 psf)","Wind C&C (26 psf)","They're identical","Gravity"],a:1,
   e:"At SDS = 0.50 the 0.4SDSIeWw body force (23.1 psf) sits just under the 26 psf C&C wind — always compare both."},
  {q:"The wall-anchorage design force came out to 925 plf because:",
   o:["It equals the body force","ka = 2.0 on the 200-ft flexible diaphragm doubled the base value on tributary Wp","Wind controls anchorage","The parapet was ignored"],a:1,
   e:"0.4(0.50)(2.0)(1.0)(2,312) = 925 plf — the Northridge amplification working exactly as intended."},
  {q:"Pu at midheight (3.50 k/ft) includes:",
   o:["Roof reaction only","Factored roof reaction + factored self-weight above midheight including the full parapet","Wind","The footing weight"],a:1,
   e:"Everything above the critical section rides the deflected shape — parapet included."}
 ]
},
{unit:"Capstone · The Portfolio Calc", id:"c2", n:"C2",
 title:"Capstone B — the slender-wall calculation",
 sub:"Ase, Icr, the magnifier, strength, and the iterated service deflection — every number shown.",
 min:16,
 objectives:[
  "Execute the complete §11.8 sequence on P-7 with real numbers",
  "Interpret each result the way a reviewer would",
  "Confirm the design and understand its margins"
 ],
 body:`
 <h3>Step B1 — constants</h3>
 ${EQ("E<sub>c</sub> = 57,000√4000 = 3.605×10⁶ psi (3,605 ksi) &nbsp;·&nbsp; n = 29,000/3,605 = <b>8.04</b> (≥6 ✓)")}
 ${EQ("S<sub>g</sub> = 12(9.25)²/6 = 171.1 in³ &nbsp;·&nbsp; f<sub>r</sub> = 7.5√4000 = 474 psi &nbsp;·&nbsp; <b>M<sub>cr</sub> = 81.1 k-in</b> &nbsp;·&nbsp; I<sub>g</sub> = 12(9.25)³/12 = 791.5 in⁴")}

 <h3>Step B2 — effective steel & capacity</h3>
 ${EQ("A<sub>se</sub> = A<sub>s</sub> + P<sub>u</sub>/f<sub>y</sub>·(h/2d) = 0.31 + 3.50/60·(1.0) = <b>0.368 in²/ft</b>")}
 ${EQ("a = 0.368(60)/(0.85·4·12) = <b>0.541 in</b> &nbsp;·&nbsp; c = 0.541/0.85 = <b>0.637 in</b>")}
 ${EQ("ε<sub>t</sub> = 0.003(4.625−0.637)/0.637 = <b>0.0188 ≥ 0.0075 ✓</b> tension-controlled, ϕ = 0.9")}
 ${EQ("M<sub>n</sub> = 0.368(60)(4.625 − 0.541/2) = <b>96.2 k-in</b> &nbsp;·&nbsp; <b>ϕM<sub>n</sub> = 86.6 k-in</b> &nbsp;·&nbsp; ϕM<sub>n</sub> ≥ M<sub>cr</sub> (86.6 ≥ 81.1) ✓ — barely; note how #4@12 would FAIL this check")}

 <h3>Step B3 — cracked stiffness</h3>
 ${EQ("I<sub>cr</sub> = nA<sub>se</sub>(d−c)² + bc³/3 = 8.04(0.368)(3.988)² + 12(0.637)³/3 = 47.1 + 1.0 = <b>48.1 in⁴/ft</b> &nbsp;&nbsp;(vs I<sub>g</sub> 791.5 — 6% ✓ expected range)")}

 <h3>Step B4 — magnified strength check</h3>
 ${EQ("5P<sub>u</sub>ℓ<sub>c</sub>² = 5(3.50)(384)² = 2.58×10⁶ &nbsp;·&nbsp; 0.75(48)E<sub>c</sub>I<sub>cr</sub> = 36(3,605)(48.1) = 6.24×10⁶ &nbsp;·&nbsp; ratio = 0.413")}
 ${EQ("Magnifier = 1/(1−0.413) = <b>1.70</b> &nbsp;·&nbsp; M<sub>u</sub> = 1.70(42.9) = <b>73.1 k-in ≤ ϕM<sub>n</sub> = 86.6 k-in ✓ (84% utilization)</b>")}
 <p>Read that like a reviewer: the second-order effect added <strong>70%</strong> to the first-order moment. A calc that skipped honest I<sub>cr</sub> would have reported 42.9 vs 86.6 = "50% utilized, lots of fat" — and been wrong by the entire margin.</p>

 <h3>Step B5 — service deflection (iterated)</h3>
 ${EQ("Service wind 0.6W = 15.6 psf → M<sub>sa</sub> = 0.0156(32)²/8 = 2.00 k-ft = 24.0 k-in; + service ecc. (0.40 k roof D at e/2) ≈ 1.6 → <b>25.6 k-in</b> &nbsp;·&nbsp; P<sub>s</sub> = 0.40+2.31 = 2.71 k/ft")}
 ${EQ("Δ<sub>cr</sub> = 5M<sub>cr</sub>ℓ<sub>c</sub>²/(48E<sub>c</sub>I<sub>g</sub>) = 5(81.1)(147,456)/(48·3,605·791.5) = <b>0.437 in</b>")}
 ${EQ("Iterate: Δ₀ = (25.6/81.1)(0.437) = 0.138 in → M<sub>a</sub> = 25.6+2.71(0.138) = 26.0 → Δ₁ = 0.140 in — <b>converged ≈ 0.14 in</b> (M<sub>a</sub> &lt; ⅔M<sub>cr</sub> = 54.1, uncracked branch)")}
 ${EQ("<b>Δ<sub>s</sub> = 0.14 in ≪ ℓ<sub>c</sub>/150 = 2.56 in ✓</b>")}

 ${A("Design summary — and the sentences you'll say about it","pw")}
 <p><strong>P-7: 9¼" panel, #5@12 centered — GOOD.</strong> Strength 84% (second-order added 70%), service deflection 5% of limit, ϕM<sub>n</sub>/M<sub>cr</sub> margin thin (the hidden governing check!). Interview sentences this buys you: "On my baseline panel the magnifier was 1.7 — I watched utilization live in the denominator, not the numerator." And: "Minimum-steel panels often fail ϕM<sub>n</sub> ≥ M<sub>cr</sub> before they fail strength — that's the check I audit first on thin panels." <strong>Extension exercises (do at least #1):</strong> (1) Zone 5 edge strip at 34 psf — show the same panel hits ~110% and pick the fix (spacing 10" vs thickness). (2) S<sub>DS</sub> = 1.0 site — seismic body force now 46 psf; redesign. (3) Stretch ℓ<sub>c</sub> to 40 ft (45-ft DC panel) — watch the magnifier blow past 2.5 and justify 11¼" + double curtains.</p>
 ${E}
 `,
 terms:[
  ["70% second-order amplification","P-7's magnifier of 1.70 — the honest Icr result a rosy-stiffness calc would have hidden."],
  ["ϕMn ≥ Mcr as hidden governor","On lightly reinforced panels the anti-brittleness check fails before strength — audit it first."],
  ["Uncracked service branch","Ma < ⅔Mcr → deflection on the Ig line; heavier panels/winds land on the interpolated branch."]
 ],
 quiz:[
  {q:"P-7's Icr of 48.1 in⁴ vs Ig of 791.5 in⁴ demonstrates:",
   o:["An arithmetic error","The cracked section is ~6% of gross stiffness — why P-Δ dominates slender panels","Ig is unsafe","Steel doesn't matter"],a:1,
   e:"That 16:1 stiffness ratio is the entire reason the slender-wall method exists."},
  {q:"The magnifier of 1.70 means:",
   o:["The panel failed","Second-order effects added 70% to the first-order moment — and honest utilization is 84%, not 50%","Wind was doubled","ϕ = 1.70"],a:1,
   e:"Skipping honest Icr would have misreported the margin by the entire P-Δ share."},
  {q:"The thin margin on P-7 that a sharp reviewer flags first is:",
   o:["Service deflection","ϕMn ≥ Mcr (86.6 vs 81.1) — the anti-brittleness check that #4@12 would fail","εt","Pu/Ag"],a:1,
   e:"Lightly reinforced panels fail this before strength — the classic hidden governor on thin tilt-up."},
  {q:"Stretching P-7 to a 40-ft clear span (45-ft DC panel) primarily:",
   o:["Reduces wind","Explodes the magnifier past ~2.5, forcing 11¼\" thickness and/or double curtains","Changes fy","Nothing"],a:1,
   e:"ℓc² sits in the magnifier's denominator term — height is quadratic poison; this is DC tilt-up's daily fight."}
 ]
},
{unit:"Capstone · The Portfolio Calc", id:"c3", n:"C3",
 title:"Capstone C — lifting, bracing & packaging the artifact",
 sub:"Stand P-7 up safely, hold it for six weeks, and turn the whole calc into interview ammunition.",
 min:15,
 objectives:[
  "Run the lifting check: weight, suction, rigging, cracking stress, inserts",
  "Design the temporary braces: force, geometry, anchor demand, removal criteria",
  "Package the complete calc as a portfolio artifact with a defense script"
 ],
 body:`
 <h3>Step C1 — the pick</h3>
 ${EQ("W = 24(36)(115.6 psf) = <b>99.9 kips</b> &nbsp;·&nbsp; with suction 1.4: initial-pick design load ≈ <b>140 kips</b> &nbsp;·&nbsp; f′<sub>ci</sub> = 2,500 psi → allowable lift tension ≈ 7.5√2500/1.5 = <b>250 psi</b>")}
 <p><strong>Rigging: 8-point face lift</strong> (4 rows × 2 columns, rows equalized by sheave blocks ≈ 0.13H / 0.38H / 0.62H / 0.87H). Hand-verify one critical region — the cantilever above the top row at the flat position (worst suction case):</p>
 ${EQ("Overhang = 0.13(36) = 4.68 ft &nbsp;·&nbsp; w = 115.6(1.4) = 162 psf &nbsp;·&nbsp; M = 162(4.68)²/2 = 1,774 lb-ft/ft = 21.3 k-in/ft")}
 ${EQ("σ = M/S<sub>g</sub> = 21,300/171.1 = <b>124 psi ≤ 250 psi ✓</b> — then software sweeps every tilt angle 0→90° and all spans between rows; your hand check anchors trust in the sweep")}
 <p><strong>Inserts:</strong> 8 inserts share ~140 k at worst equalization → ~17.5 k/insert working; select catalog insert with ultimate ≥ 2× (≥35 k) at 9¼" panel and f′<sub>ci</sub> 2,500, with hairpin bars per catalog. <em>(In practice the lifting engineer runs this; you're proving you can audit it.)</em></p>

 <h3>Step C2 — the braces</h3>
 ${EQ("TCA-basis construction wind ≈ 20 psf on the freestanding panel: resultant = 20(36)(24) = <b>17.3 kips at 18 ft</b> above base")}

 <ul>
  <li><strong>Compression case governs hardware:</strong> a ~40-ft pipe brace needs its knee + lateral bracing installed to be worth its rating at 8.4 k — Lesson 10's #1 field deficiency, now in your numbers.</li>
  <li><strong>Anchor end:</strong> 8.4 k axial at 55° → 4.8 k shear + 6.9 k tension (suction case) on the slab anchor — demands an engineered adhesive anchor group in ≥6" slab (or a deadman if slab isn't poured), cracked-concrete capacities, edge distances checked.</li>
  <li><strong>Removal:</strong> write the criteria sheet: deck welded per diaphragm design, chord/drag welds complete, panel-to-panel plates in, anchorage hardware torqued, closures cured — signed by the engineer of record for the bracing. Date-less. Load-path based.</li>
 </ul>

 <h3>Step C3 — packaging the artifact (do not skip)</h3>
 <ol>
  <li><strong>Format like a firm deliverable</strong> (10–14 pages): cover + basis of design → loads (Capstone A) → slender-wall design (B) → anchorage force summary → lifting check → bracing check → summary sheet with utilizations. Hand-written-then-scanned or typeset — either is respectable; sloppy is not.</li>

 </ol>

(function(){
 const main=document.getElementById('main');
 const tocEl=document.getElementById('toc');
 const KEY='tiltup-mastery-v1';
 let store={};try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
 store.done=store.done||{};store.quiz=store.quiz||{};store.fc=store.fc||{};store.exam=store.exam||null;
 const save=()=>localStorage.setItem(KEY,JSON.stringify(store));

 const PAGES=COURSE.map(m=>({type:'lesson',m})).concat([{type:'exam'},{type:'flash'},{type:'gloss'},{type:'res'}]);
 let idx=(store.last!=null&&store.last<PAGES.length)?store.last:0;

 const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 const label2=pg=>pg.type==='exam'?'Final exam':pg.type==='flash'?'Flashcards':pg.type==='gloss'?'Glossary':'Resources';

 function buildTOC(){
  tocEl.innerHTML='';let last=null;
  COURSE.forEach((m,i)=>{
   if(m.unit!==last){last=m.unit;const g=document.createElement('div');g.className='grp';g.textContent=m.unit;tocEl.appendChild(g)}
   const b=document.createElement('button');
   b.innerHTML='<span class="n">'+m.n+'</span><span>'+m.title+'</span><span class="dot"></span>';
   if(store.done[m.id])b.classList.add('done');
   if(PAGES[idx].type==='lesson'&&PAGES[idx].m.id===m.id)b.setAttribute('aria-current','true');
   b.onclick=()=>go(i);tocEl.appendChild(b);
  });
  const g=document.createElement('div');g.className='grp';g.textContent='Assessment & Reference';tocEl.appendChild(g);
  [['Final exam (15 Q)',COURSE.length],['Flashcards',COURSE.length+1],['Glossary',COURSE.length+2],['Resources',COURSE.length+3]].forEach(([lab,pi])=>{
   const b=document.createElement('button');b.innerHTML='<span class="n">·</span><span>'+lab+'</span>';
   if(idx===pi)b.setAttribute('aria-current','true');b.onclick=()=>go(pi);tocEl.appendChild(b);
  });
  const done=COURSE.filter(m=>store.done[m.id]).length;
  document.getElementById('ovtext').textContent=done+' of '+COURSE.length+' complete'+(store.exam?(' · exam '+store.exam.correct+'/'+store.exam.total):'');
  document.getElementById('ovbar').style.width=(done/COURSE.length*100)+'%';
 }

 function quizHTML(qs){
  return qs.map((q,qi)=>{
   const opts=q.o.map((o,oi)=>'<label class="opt"><input type="radio" name="q'+qi+'" value="'+oi+'">'+esc(o)+'</label>').join('');
   return '<div class="q" data-qi="'+qi+'"><div class="stem">'+(qi+1)+'. '+esc(q.q)+'</div>'+opts+'<div class="exp">'+esc(q.e)+'</div></div>';
  }).join('');
 }
 function gradeQuiz(container,qs){
  let correct=0;
  qs.forEach((q,qi)=>{
   const qEl=container.querySelector('.q[data-qi="'+qi+'"]');
   const sel=qEl.querySelector('input:checked');
   qEl.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','wrong'));
   qEl.querySelectorAll('.opt')[q.a].classList.add('correct');
   if(sel){if(+sel.value===q.a)correct++;else qEl.querySelectorAll('.opt')[+sel.value].classList.add('wrong')}
   qEl.classList.add('answered');
  });
  return correct;
 }

 function renderExam(){

 function renderFlash(){

  if(!order||order.length!==cards.length){order=cards.map((_,i)=>i);store.fc={order:order,pos:0,known:{}};save()}

   if(pos>=order.length)pos=0;
   const c=cards[order[pos]];
   const knownCount=Object.keys(store.fc.known).length;
   main.innerHTML='<p class="lead">Drill</p><h2>Flashcards</h2><p class="sub">'+cards.length+' cards from every lesson. Tap to flip; mark what you own.</p>'+

   main.querySelector('#got').onclick=()=>{store.fc.known[order[pos]]=1;pos++;store.fc.pos=pos;save();draw()};
   main.querySelector('#again').onclick=()=>{const cur=order.splice(pos,1)[0];order.push(cur);store.fc.order=order;save();draw()};

 function renderGloss(){
  const all=[];
  COURSE.forEach(m=>m.terms.forEach(t=>all.push([t[0],t[1],m.n])));
  EXTRA_TERMS.forEach(t=>all.push(t));

  const uniq=all.filter(t=>{const k=t[0].toLowerCase();if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>a[0].localeCompare(b[0]));

})();

  var bar=document.createElement('div'); bar.id='ttsBar';
  bar.innerHTML='<div class="row">'+
   '<button class="primary" id="tPlay" title="Play/Pause">▶</button>'+
   '<button id="tPrev" title="Previous section">⏮</button>'+
   '<button id="tNext" title="Next section">⏭</button>'+
   '<span class="pos" id="tPos">–/–</span>'+
   '<select id="tSpeed" title="Speed"><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.3">1.3×</option><option value="1.5">1.5×</option></select>'+
   '<select id="tEng" title="Voice engine"><option value="dev">Device voice (free)</option><option value="el">ElevenLabs (key)</option></select>'+
   '<input id="tKey" type="password" placeholder="ElevenLabs API key" style="display:none">'+
   '<select id="tVoice" style="display:none"><option value="">voice…</option></select>'+
   '<button id="tClose" title="Close">✕</button>'+
   '<div class="hint" id="tHint">Reads every lesson aloud, section by section. Device voice works offline; ElevenLabs needs your own key (stored only on this device — works in the downloaded file; the hosted page may block it).</div></div>';
  document.body.appendChild(bar);
  var $=function(id){return document.getElementById(id)};
  var secs=[], idx=0, playing=false, curAudio=null, prefetch={}, engine=P.engine||'dev';
  $('tEng').value=engine; if(P.key)$('tKey').value=P.key; if(P.speed)$('tSpeed').value=P.speed;
  function showEl(){var el=engine==='el'; $('tKey').style.display=el?'':'none'; $('tVoice').style.display=el?'':'none';}
  showEl();
  function collect(){
    var main=document.getElementById('main'); if(!main)return [];
    var out=[], skip=function(n){return n.closest('.quiz,.pager,.fcnav,.search,#glist,form,nav')};
    var nodes=main.querySelectorAll('h2,.sub,h3,p,li,dt,dd,.stem');
    nodes.forEach(function(n){
      if(skip(n))return;
      if(n.querySelector('p,li,h3'))return; // container dupes
      var t=(n.innerText||'').replace(/\s+/g,' ').trim();
      if(t.length<3)return;
      out.push({node:n,text:t});
    });
    return out;
  }
  function mark(i){
    secs.forEach(function(s){s.node.classList.remove('tts-now')});
    if(secs[i]){secs[i].node.classList.add('tts-now');
      try{secs[i].node.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){secs[i].node.scrollIntoView()}}
    $('tPos').textContent=(i+1)+'/'+secs.length;
  }
  function stopAll(){
    playing=false;$('tPlay').textContent='▶';
    try{speechSynthesis.cancel()}catch(e){}
    if(curAudio){curAudio.pause();curAudio=null}
    secs.forEach(function(s){s.node.classList.remove('tts-now')});
  }
  /* device engine */
  function devSpeak(text,done){
    var parts=text.match(/[^.!?]+[.!?]*/g)||[text];
    var chunks=[],cur='';
    parts.forEach(function(p){if((cur+p).length>220){if(cur)chunks.push(cur);cur=p}else cur+=p});
    if(cur)chunks.push(cur);
    var k=0;
    (function next(){
      if(!playing)return;
      if(k>=chunks.length)return done();
      var u=new SpeechSynthesisUtterance(chunks[k++]);
      u.rate=parseFloat($('tSpeed').value);
      var vs=speechSynthesis.getVoices().filter(function(v){return /en[-_]/i.test(v.lang)});
      var pref=vs.find(function(v){return /Natural|Google US|Samantha|Aria/i.test(v.name)})||vs[0];
      if(pref)u.voice=pref;
      u.onend=next; u.onerror=next;
      speechSynthesis.speak(u);
    })();
  }
  /* elevenlabs engine */
  function elFetch(i){
    var key=$('tKey').value.trim(); if(!key)return Promise.reject('no-key');
    if(prefetch[i])return prefetch[i];
    var vid=$('tVoice').value||'JBFqnCBsd6RMkjVDRZzb';
    prefetch[i]=fetch('https://api.elevenlabs.io/v1/text-to-speech/'+vid+'?output_format=mp3_44100_64',{
      method:'POST',headers:{'xi-api-key':key,'Content-Type':'application/json'},
      body:JSON.stringify({text:secs[i].text,model_id:'eleven_flash_v2_5'})
    }).then(function(r){if(!r.ok)throw new Error('TTS '+r.status);return r.blob()})
      .then(function(b){return URL.createObjectURL(b)});
    return prefetch[i];
  }
  function elSpeak(i,done){
    elFetch(i).then(function(url){
      if(!playing)return;
      curAudio=new Audio(url); curAudio.playbackRate=parseFloat($('tSpeed').value);
      curAudio.onended=done; curAudio.onerror=done;
      curAudio.play();
      if(i+1<secs.length)elFetch(i+1).catch(function(){});
    }).catch(function(e){
      $('tHint').textContent='ElevenLabs failed ('+e+'). Check the key/credits — or the hosted page is blocking external audio: use the downloaded file, or switch to Device voice.';
      stopAll();
    });
  }
  function playFrom(i){
    idx=i; if(idx>=secs.length){stopAll();return}
    mark(idx);
    var done=function(){if(playing)playFrom(idx+1)};
    if(engine==='el')elSpeak(idx,done); else devSpeak(secs[idx].text,done);
  }
  function start(){
    secs=collect();
    if(!secs.length){$('tHint').textContent='Nothing readable on this page — open a lesson.';return}
    playing=true;$('tPlay').textContent='⏸';
    if(idx>=secs.length)idx=0;
    playFrom(idx);
  }
  fab.onclick=function(){bar.classList.toggle('on');
    if(bar.classList.contains('on')&&engine==='el'&&$('tKey').value)loadVoices()};
  $('tClose').onclick=function(){stopAll();bar.classList.remove('on')};
  $('tPlay').onclick=function(){if(playing){stopAll()}else start()};
  $('tNext').onclick=function(){if(!secs.length)return;stopAll();playing=true;$('tPlay').textContent='⏸';playFrom(Math.min(idx+1,secs.length-1))};
  $('tPrev').onclick=function(){if(!secs.length)return;stopAll();playing=true;$('tPlay').textContent='⏸';playFrom(Math.max(idx-1,0))};
  $('tEng').onchange=function(){engine=this.value;P.engine=engine;save();showEl();
    if(engine==='el'&&$('tKey').value)loadVoices()};
  $('tSpeed').onchange=function(){P.speed=this.value;save();if(curAudio)curAudio.playbackRate=parseFloat(this.value)};
  $('tKey').onchange=function(){P.key=this.value.trim();save();loadVoices()};
  $('tVoice').onchange=function(){P.voice=this.value;save();prefetch={}};
  function loadVoices(){
    var key=$('tKey').value.trim(); if(!key)return;
    fetch('https://api.elevenlabs.io/v1/voices',{headers:{'xi-api-key':key}})
     .then(function(r){return r.json()}).then(function(d){
       var sel=$('tVoice'); sel.innerHTML='';
       (d.voices||[]).forEach(function(v){
         var o=document.createElement('option');o.value=v.voice_id;o.textContent=v.name.split(' - ')[0];
         if((P.voice||'JBFqnCBsd6RMkjVDRZzb')===v.voice_id)o.selected=true;
         sel.appendChild(o)});
     }).catch(function(){$('tHint').textContent='Could not reach ElevenLabs (key or network/CSP). Device voice still works.'});
  }
  /* stop when user navigates lessons */
  var mo=new MutationObserver(function(){if(playing){stopAll()}prefetch={};idx=0;$('tPos').textContent='–/–'});
  var mainEl=document.getElementById('main'); if(mainEl)mo.observe(mainEl,{childList:true});
  if('speechSynthesis' in window)speechSynthesis.getVoices();
})();
</script>
