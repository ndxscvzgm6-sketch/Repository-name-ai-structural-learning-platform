<style>
*{box-sizing:border-box}
body{margin:0;background:#FCFAF9;background-image:radial-gradient(1000px 560px at 88% -12%,rgba(212,67,107,.08),transparent 62%),radial-gradient(820px 520px at -12% 34%,rgba(124,107,214,.07),transparent 62%),radial-gradient(900px 560px at 62% 112%,rgba(224,112,74,.06),transparent 62%);background-attachment:fixed;-webkit-font-smoothing:antialiased;text-wrap:pretty}
a{color:#D4436B;text-decoration:none}
a:hover{color:#A82F52}
button{font:inherit;cursor:pointer}
::selection{background:#FBD9E3}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.05)}}

/* Hover states. The design medium expressed these as `style-hover` attributes;
   inline styles win over stylesheet rules, hence !important. */
.hv-pink:hover{background:#FBEEF3 !important}
.hv-blush:hover{background:#FDF6F8 !important}
.hv-mist:hover{background:#FEFBFC !important}
.hv-rose:hover{background:#FDF2F5 !important}
.hv-deep:hover{background:#B03A5E !important}
.hv-plum:hover{background:#7A2A50 !important}
.hv-b92:hover{filter:brightness(0.92)}
.hv-b93:hover{filter:brightness(0.93)}
.hv-b96:hover{filter:brightness(0.96)}
.hv-b97:hover{filter:brightness(0.97)}
.hv-outline:hover{border-color:#D4436B !important;color:#D4436B !important}
.hv-link:hover{color:#D4436B !important}
.hv-link2:hover{color:#B03A5E !important}
.hv-edge:hover{border-color:#EFC9D8 !important}
.hv-edge2:hover{border-color:#E4DBE0 !important}
.hv-lift:hover{border-color:#EFC9D8 !important;transform:translateY(-2px);box-shadow:0 14px 30px rgba(212,67,107,.12)}
.hv-pop:hover{transform:scale(1.12)}
.hv-pop2:hover{transform:scale(1.08)}

/* Keyboard focus — the mouse never sees this, the Tab key always does */
:focus-visible{outline:2px solid #D4436B;outline-offset:2px;border-radius:6px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

/* One breakpoint. The desktop layout is a fixed 252px rail beside the content;
   below it, the rail becomes a bottom tab bar and every multi-column grid
   stacks. Inline styles win the cascade, hence !important throughout. */
@media (max-width:820px){
  .app{display:block !important}
  .side{position:fixed !important;top:auto !important;left:0;right:0;bottom:0;height:auto !important;
        flex-direction:row !important;align-items:center;gap:8px !important;
        padding:8px 10px calc(8px + env(safe-area-inset-bottom)) !important;
        border-right:0 !important;border-top:1px solid #EFE6EA;
        background:rgba(255,255,255,.96) !important;z-index:50}
  .side > div:first-child{display:none !important}
  .side .testday{display:none !important}
  .side nav{flex-direction:row !important;flex:1;justify-content:space-around;gap:2px !important}
  .side nav button{flex:1;justify-content:center;padding:9px 4px !important;font-size:13px !important;white-space:nowrap}
  .scr{padding:26px 16px 110px !important;max-width:none !important}
  .mgrid{grid-template-columns:1fr !important}
  .mgrid2{grid-template-columns:1fr 1fr !important}
  .statbar{grid-template-columns:1fr !important;gap:6px !important}
  .mwrap{flex-wrap:wrap}
  .trow{flex-wrap:wrap}
  .hero-num{font-size:84px !important}
  .rhead{padding:10px 12px !important;gap:10px !important}
  .rdot{width:10px !important}
  .qcount{display:none}
  .qgrid{padding:18px 14px 120px !important;gap:24px !important}
  .ppanel{position:static !important;max-height:none !important}
  .mcell{min-height:60px !important;padding:4px 3px !important}
}
</style>

    title: "Humanities — conservation ethics",
    text: "When a restorer removes three centuries of varnish from a canvas, what emerges is not the painting the artist saw. Pigments have shifted; the ground has darkened; the varnish itself, applied within the artist's lifetime, was part of the intended surface. Conservation therefore cannot be a return. It is a choice among possible presents, made on behalf of a viewer who has not yet arrived.\n\nThe profession's ethic of reversibility — use only materials a later hand can undo — reads as modesty, and largely it is. But reversibility also postpones judgment indefinitely, and postponement is not neutral. A canvas left in its darkened state is also being interpreted: it is being read as a document rather than as a picture. Museums that decline to intervene are not abstaining from the argument; they have simply chosen the side that requires no defense.\n\nWhat restoration exposes, then, is that every act of preservation contains a theory of what the object is for. The cleaned ceiling and the deliberately unretouched fresco are not opposite policies. They are the same policy applied to different answers to a prior question — one the technical literature is remarkably reluctant to ask."
  },
  p2: {
    title: "Social sciences — evidence in historiography",
    text: "Historians once treated the written record as the floor beneath which evidence could not be trusted. Oral testimony was thought to decay: memory revised itself, communities flattered themselves, and the interval between event and telling introduced error at a rate no method could correct. The document, by contrast, sat still.\n\nThe objection was never wrong about memory. It was wrong about documents. A tax roll is not a neutral deposit; it records what an administration wished to count, in the categories it found convenient, about people who had reason to misreport. Its stillness is not accuracy but finality — the error, once made, stops moving.\n\nOral tradition errs differently. It drifts, but it drifts under supervision: a version that offends a community's sense of itself is contested aloud, and the contest leaves traces a careful listener can hear. Where the archive gives us one account with its assumptions hidden, testimony often gives us several with the disagreement intact.\n\nNone of this makes speech more reliable than paper. It makes the reliability of paper a claim to be argued rather than a premise to begin from."
  }
};

      whys: ["Cholesterol stabilizes rather than dissolves bilayers", "Below the transition temperature, cholesterol keeps tails from crystallizing", "That describes cholesterol's effect at high temperature", "Cholesterol measurably modulates fluidity in both directions"] },
    { tid: "biology-11", stem: "Human red blood cells placed in 0.45% saline (roughly half-isotonic) will:",
      options: ["Swell and may lyse as water enters", "Pump sodium inward to compensate", "Shrink as water leaves the cell", "Remain unchanged in volume"], answer: 0,
      why: "0.9% saline is isotonic to red cells; half that concentration is hypotonic, so water flows in by osmosis.",
      whys: ["Water moves toward the higher intracellular solute concentration, swelling the cell", "RBCs cannot counteract a strong osmotic influx by pumping ions inward", "Shrinking (crenation) happens in hypertonic solutions", "Only ~0.9% saline leaves red cell volume unchanged"] },
    { tid: "biology-11", stem: "Uptake of a solute into a cell increases with concentration but plateaus at high concentrations. This kinetic behavior indicates:",
      options: ["Bulk-phase endocytosis of the solute", "Carrier-mediated transport that saturates", "Simple diffusion through the lipid bilayer", "Osmotic flow driven by the gradient"], answer: 1,
      why: "Saturation kinetics are the signature of a finite number of transport proteins; simple diffusion increases linearly with the gradient.",
      whys: ["Bulk endocytosis is nonspecific and roughly proportional to concentration", "A limited pool of carriers saturates, capping the transport rate", "Simple diffusion shows no plateau — flux keeps rising with concentration", "Osmosis is water movement, not solute uptake kinetics"] },
    { tid: "biology-12", stem: "A neuron must move synaptic vesicle precursors from the soma down the axon toward the terminal. This anterograde transport is driven primarily by:",
      options: ["Myosin moving along actin toward the nucleus", "Kinesin walking toward microtubule plus ends", "Passive diffusion along neurofilaments", "Dynein walking toward microtubule minus ends"], answer: 1,
      why: "Axonal microtubules are oriented plus-end-out, so plus-end-directed kinesins carry cargo away from the soma.",
      whys: ["Myosin/actin transport is short-range, not axon-length delivery", "Kinesin is the plus-end motor, and axon plus ends point to the terminal", "Diffusion is far too slow over axonal distances; neurofilaments are structural", "Dynein powers retrograde transport back toward the soma"] },
    { tid: "biology-12", stem: "Cardiac muscle cells contract in near-synchrony because ions and small signaling molecules pass directly between neighboring cells through:",
      options: ["Gap junctions", "Hemidesmosomes", "Desmosomes", "Tight junctions"], answer: 0,
      why: "Gap junctions are connexon channels linking adjacent cytoplasms, electrically coupling cardiomyocytes.",
      whys: ["Connexon pores let current and small molecules flow directly between cells", "Hemidesmosomes anchor cells to the basement membrane", "Desmosomes are mechanical rivets resisting shear", "Tight junctions seal the space between cells; nothing passes cell-to-cell"] },
    { tid: "biology-13", stem: "Growth factors drive a cell past the restriction point in part by activating cyclin D–CDK4/6, which phosphorylates Rb. Hyperphosphorylated Rb then:",
      options: ["Binds E2F more tightly, blocking S phase", "Releases E2F, allowing S-phase transcription", "Activates p53 and triggers apoptosis", "Degrades cyclin E and arrests the cell"], answer: 1,
      why: "Rb is a brake that sequesters E2F; phosphorylation releases the brake and commits the cell to DNA replication.",
      whys: ["Hypophosphorylated Rb is the E2F-binding, growth-suppressing form", "Freed E2F transcribes cyclin E, DNA polymerase, and other S-phase genes", "p53 responds to DNA damage through a separate pathway", "Rb phosphorylation actually leads to cyclin E accumulation"] },
    { tid: "biology-13", stem: "After ionizing radiation, cells with functional p53 arrest in G1 or undergo apoptosis. Tumor cells lacking p53 instead:",
      options: ["Keep cycling with damaged DNA", "Repair the damage faster than normal cells", "Arrest permanently in G0 instead", "Become unable to replicate DNA at all"], answer: 0,
      why: "p53 is the guardian of the genome; without it, damage checkpoints fail and genomic instability accelerates tumor evolution.",
      whys: ["No G1 checkpoint means damaged templates are replicated and inherited", "Repair is impaired or unchanged — never enhanced — without p53 signaling", "Loss of p53 removes, not enforces, arrest signals", "Replication machinery works fine; the surveillance is what's missing"] },
    { tid: "biology-14", stem: "Which two processes are the principal sources of genetic variation among the gametes of a single individual?",
      options: ["Replication and transcription of DNA", "Cytokinesis and karyokinesis in meiosis", "Crossing over and independent assortment", "DNA proofreading and mismatch repair"], answer: 2,
      why: "Recombination shuffles alleles within chromosomes; independent assortment shuffles whole chromosomes — together generating enormous gamete diversity.",
      whys: ["Replication and transcription copy information rather than recombine it", "Cell-division mechanics distribute chromosomes but do not diversify them", "These two meiosis-I events independently randomize allele combinations", "Repair systems reduce variation by fixing errors"] },
    { tid: "biology-14", stem: "At ovulation, the released human oocyte is arrested at which stage, completing meiosis only if fertilization occurs?",
      options: ["Metaphase II", "Metaphase I", "Telophase II", "Prophase I"], answer: 0,
      why: "Oocytes arrest in prophase I from fetal life until each cycle's ovulation, then arrest again at metaphase II until sperm entry triggers completion.",
      whys: ["The ovulated egg waits at metaphase II for fertilization", "Metaphase I is passed just before the first polar body forms", "Telophase II occurs only after the sperm triggers anaphase II", "Prophase I arrest is the long dictyate arrest before ovulation"] },
    { tid: "biology-15", stem: "Epinephrine binding a β-adrenergic receptor raises intracellular cAMP. The correct order of events is:",
      options: ["Receptor → Gs → adenylyl cyclase → cAMP → PKA", "Receptor → adenylyl cyclase phosphorylates Gs → PKA → cAMP", "Receptor → phospholipase C → cAMP → protein kinase C", "Receptor → cAMP opens a receptor channel → PKA → Gs"], answer: 0,
      why: "β-receptors are GPCRs coupled to Gs: GTP-bound αs stimulates adenylyl cyclase, and cAMP activates PKA.",
      whys: ["This is the canonical Gs–cyclase–cAMP–PKA cascade", "Adenylyl cyclase makes cAMP; it does not phosphorylate G proteins", "PLC generates IP₃ and DAG for the Gq pathway, not cAMP", "β-receptors are not ligand-gated channels"] },
    { tid: "biology-15", stem: "Release of cytochrome c from mitochondria into the cytosol commits a cell to apoptosis by:",
      options: ["Directly digesting the genomic DNA", "Opening death channels in the plasma membrane", "Blocking ATP synthesis, causing necrosis", "Forming the apoptosome and activating caspase-9"], answer: 3,
      why: "Cytochrome c binds Apaf-1 to form the apoptosome, activating caspase-9 and the executioner caspase cascade — the intrinsic pathway.",
      whys: ["DNA fragmentation is done later by caspase-activated nucleases", "The intrinsic pathway begins at mitochondria, not surface channels", "Apoptosis is ATP-dependent and orderly; necrosis is the uncontrolled alternative", "The apoptosome converts mitochondrial permeabilization into caspase activation"] },
    { tid: "biology-15", stem: "A growth factor receptor that dimerizes and cross-phosphorylates tyrosine residues on its partner upon ligand binding is a:",
      options: ["Receptor tyrosine kinase", "Nuclear hormone receptor", "G protein-coupled receptor", "Ligand-gated ion channel"], answer: 0,
      why: "Dimerization plus trans-autophosphorylation on tyrosines is the defining activation mechanism of RTKs (e.g., insulin, EGF receptors).",
      whys: ["Cross-phosphorylated tyrosines recruit SH2-domain signaling proteins", "Nuclear receptors are intracellular transcription factors", "GPCRs signal through heterotrimeric G proteins, not autophosphorylation", "Channel receptors pass ions rather than phosphorylate"] },
    { tid: "biology-16", stem: "2,4-Dinitrophenol (DNP) carries protons across the inner mitochondrial membrane. In treated cells, oxygen consumption ______ while ATP synthesis ______.",
      options: ["decreases; decreases", "decreases; increases", "increases; increases", "increases; decreases"], answer: 3,
      why: "Uncouplers dissipate the proton gradient as heat: the ETC runs faster (more O₂ used) but ATP synthase loses its driving force.",
      whys: ["O₂ consumption falls only with direct ETC inhibitors, not uncouplers", "Electron transport speeds up when the back-pressure of the gradient is lost", "ATP synthesis cannot rise without a proton-motive force", "Classic uncoupling: respiration up, phosphorylation down, energy lost as heat"] },
    { tid: "biology-16", stem: "The primary purpose of converting pyruvate to lactate in exercising muscle is to:",
      options: ["Regenerate NAD⁺ so glycolysis can continue", "Produce additional ATP directly", "Store energy as lactate for later use", "Reduce the acidity of the cytoplasm"], answer: 0,
      why: "Fermentation exists to reoxidize NADH; without NAD⁺, the glyceraldehyde-3-phosphate step of glycolysis stalls.",
      whys: ["Reducing pyruvate reoxidizes NADH to NAD⁺, keeping glycolysis running", "The lactate step itself yields no ATP", "Lactate is a byproduct exported to the liver, not an energy store in muscle", "Lactate production accompanies, and does not relieve, cytosolic acidification"] },
    { tid: "biology-16", stem: "Cyanide blocks cytochrome c oxidase (complex IV). Which statement describes the immediate consequence?",
      options: ["The chain backs up and the proton gradient falls", "Glycolysis halts immediately in the cytosol", "Electrons reach O₂ via an alternative complex", "ATP synthase reverses and pumps protons"], answer: 0,
      why: "With the terminal electron acceptor step blocked, upstream carriers stay reduced, pumping stops, and oxidative ATP production fails.",
      whys: ["No electron flow means no proton pumping — the gradient dissipates", "Glycolysis continues (even accelerates) anaerobically", "Mammalian mitochondria have no bypass to O₂ around complex IV", "Running synthase in reverse consumes ATP; it cannot restore respiration"] },
    { tid: "biology-18", stem: "Gram-negative bacteria are distinguished from gram-positive bacteria by having:",
      options: ["A membrane-bound nucleus and organelles", "No cell wall and no peptidoglycan at all", "An outer membrane with LPS and thin peptidoglycan", "A thick peptidoglycan wall that retains crystal violet"], answer: 2,
      why: "The gram-negative envelope is a thin peptidoglycan layer plus an LPS-rich outer membrane (endotoxin), which excludes the stain.",
      whys: ["No bacterium has a membrane-bound nucleus", "Wall-less bacteria (Mycoplasma) are a separate category entirely", "The LPS outer membrane over thin peptidoglycan is the gram-negative signature", "Thick, stain-retaining walls define gram-positive organisms"] },
    { tid: "biology-18", stem: "A bacterium with a 20-minute doubling time starts as a single cell in ideal medium. After 2 hours of exponential growth, the population is:",
      options: ["6 cells", "12 cells", "64 cells", "120 cells"], answer: 2,
      why: "2 hours = 6 doublings; 2⁶ = 64.",
      whys: ["6 is the number of doublings, not the cell count", "12 would be linear growth (6 × 2), but growth is exponential", "Six doublings of one cell give 2⁶ = 64 cells", "120 confuses minutes with the exponential result"] },
    { tid: "biology-19", stem: "After conjugation between an F⁺ and an F⁻ bacterium, the typical outcome is:",
      options: ["The recipient receives chromosomal genes and stays F⁻", "The donor loses its chromosome to the recipient", "The recipient gains the F plasmid and becomes F⁺", "Both cells lyse after pilus contact"], answer: 2,
      why: "F⁺ × F⁻ crosses transfer the F plasmid itself via the pilus; chromosomal transfer requires Hfr donors.",
      whys: ["Chromosomal gene transfer is the Hfr scenario, not simple F⁺ crosses", "Transfer is replicative — the donor keeps its DNA", "A copy of the F plasmid moves across, converting the recipient to F⁺", "Conjugation is nonlethal to both partners"] },
    { tid: "biology-20", stem: "A bacteriophage integrates its genome into the host chromosome and is passively replicated for many generations before stress triggers virion production. The initial state describes:",
      options: ["Abortive infection of the host", "Transformation of the host cell", "Lysogeny, with the genome as a prophage", "The lytic cycle, with immediate lysis"], answer: 2,
      why: "Lysogeny is dormant integration as a prophage; induction (e.g., by UV or stress) flips the switch to the lytic program.",
      whys: ["Abortive infection produces no stable association at all", "Transformation is uptake of naked environmental DNA", "Integrated, silently inherited phage DNA is the definition of a prophage", "The lytic cycle is the productive, cell-bursting phase that comes later"] },
    { tid: "biology-20", stem: "A virus with a positive-sense single-stranded RNA genome can, upon entry into the cytoplasm:",
      options: ["Only replicate inside the nucleus", "Serve directly as a template for DNA synthesis by host polymerases", "Integrate into the host genome without any enzymes", "Be translated directly by host ribosomes"], answer: 3,
      why: "(+)ssRNA is effectively mRNA — ribosomes translate it immediately, producing the viral replicase.",
      whys: ["Most (+)ssRNA viruses replicate entirely in the cytoplasm", "Host cells have no RNA-dependent DNA polymerase; retroviruses must carry one", "Integration requires reverse transcriptase and integrase", "Positive-sense RNA has mRNA polarity and is read directly"] },
    { tid: "biology-21", stem: "Prion diseases propagate without any nucleic acid because the infectious agent is:",
      options: ["A naked circular RNA molecule", "A heat-stable bacterial exotoxin", "A defective virus requiring a helper virus", "A misfolded protein that templates refolding"], answer: 3,
      why: "PrPSc converts normal PrPC into the protease-resistant β-sheet-rich conformation, propagating the misfold protein-to-protein.",
      whys: ["Naked circular RNAs are viroids, plant pathogens", "Toxins poison cells but do not self-propagate", "Defective helper-dependent agents (like hepatitis D) still use nucleic acid", "Conformational templating by misfolded PrP is the prion mechanism"] },
    { tid: "biology-22", stem: "The sickle-cell allele remains at high frequency in malaria-endemic regions primarily because:",
      options: ["Heterozygotes are fitter than either homozygote", "The sickle allele arises by unusually frequent mutation", "Genetic drift favors the allele in large populations", "The sickle allele is dominant to the normal allele"], answer: 0,
      why: "Heterozygote advantage (overdominance) maintains both alleles: HbAS resists malaria without sickle-cell disease.",
      whys: ["Balancing selection through heterozygote advantage preserves the polymorphism", "Mutation pressure alone is far too weak to hold an allele at these frequencies", "Drift is strongest in small populations and is directionless", "Dominance describes expression, not why selection retains the allele"] },
    { tid: "biology-22", stem: "A river permanently divides a rodent population; over many generations the two groups become unable to interbreed. This is an example of:",
      options: ["Convergent evolution", "Sympatric speciation", "Artificial selection", "Allopatric speciation"], answer: 3,
      why: "Geographic isolation followed by independent divergence to reproductive isolation is allopatric speciation.",
      whys: ["Convergence is unrelated lineages evolving similar traits", "Sympatric speciation happens without a geographic barrier", "No human selective breeding is involved", "A physical barrier splitting the range is the allopatric mechanism"] },
    { tid: "biology-24", stem: "Immediately after a sperm fuses with the egg membrane, polyspermy is blocked most durably by:",
      options: ["The cortical reaction, which modifies the zona pellucida", "Fusion of all remaining sperm with each other", "Ejection of the second polar body", "Depolarization of the egg membrane lasting for days"], answer: 0,
      why: "Cortical granule enzymes harden the zona and destroy sperm receptors — the slow, permanent block; membrane depolarization is only the fast, transient block.",
      whys: ["Cortical granule release remodels the zona so no further sperm can bind", "Sperm do not fuse with one another", "Polar body ejection completes meiosis and is unrelated to sperm entry", "The electrical fast block lasts seconds to minutes, not days"] },
    { tid: "biology-25", stem: "During gastrulation, cells migrating through the primitive streak establish the three germ layers. The notochord that subsequently forms is derived from:",
      options: ["Mesoderm", "Ectoderm", "Trophoblast", "Endoderm"], answer: 0,
      why: "The notochord is axial mesoderm; it later induces the overlying ectoderm to form the neural plate.",
      whys: ["Axial mesoderm condenses into the notochord along the midline", "Ectoderm forms epidermis and the nervous system, including what the notochord induces", "Trophoblast builds the placenta, not embryonic structures", "Endoderm lines the gut tube and its outgrowths"] },
    { tid: "biology-26", stem: "Transplanting the dorsal lip of the blastopore to the opposite side of an amphibian embryo induces a second body axis. This experiment demonstrates:",
      options: ["Induction: one tissue directs a neighbor's fate", "Genomic equivalence does not hold in embryos", "Gastrulation proceeds without any signaling", "Cytoplasmic determinants act cell-autonomously"], answer: 0,
      why: "Spemann and Mangold's organizer experiment showed that secreted signals from one region instruct surrounding cells — the paradigm of embryonic induction.",
      whys: ["The graft recruited host cells into a new axis — instruction between tissues", "Genomic equivalence (all cells share the genome) is supported, not refuted", "The result is direct evidence that signaling drives gastrulation patterning", "Cell-autonomous determinants cannot explain re-patterning of host tissue"] },
    { tid: "biology-27", stem: "Cells of the inner cell mass of a blastocyst can form every embryonic tissue but cannot alone form a viable embryo, because they cannot make trophoblast derivatives. They are therefore described as:",
      options: ["Totipotent", "Pluripotent", "Multipotent", "Unipotent"], answer: 1,
      why: "Pluripotent cells form all three germ layers but not extraembryonic placenta; only the zygote and early blastomeres are totipotent.",
      whys: ["Totipotency includes the trophoblast lineage — only the earliest cells qualify", "All-germ-layer potential minus extraembryonic tissue defines pluripotency", "Multipotent cells (like hematopoietic stem cells) are limited to one lineage family", "Unipotent cells produce a single cell type"] }
  ],
  genchem: [
    { tid: "genchem-18", stem: "A solution contains 0.20 M HA and 0.020 M A⁻. If the pKa of HA is 4.8, the pH is closest to:",
      options: ["2.8", "3.8", "4.8", "5.8"], answer: 1,
      why: "Henderson–Hasselbalch: pH = pKa + log([A⁻]/[HA]) = 4.8 + log(0.1) = 4.8 − 1 = 3.8." },
    { tid: "genchem-19", stem: "A weak diprotic acid is titrated with standardized NaOH. At the first half-equivalence point:",
      options: ["[H₂A] = [A²⁻]", "pH = 7.0", "pH = pKa1", "pH = pKa2"], answer: 2,
      why: "Half-way to the first equivalence point, [H₂A] = [HA⁻], so the log term vanishes and pH = pKa1 — the point of maximum buffering for the first proton." },
    { tid: "genchem-2", stem: "The first ionization energy of aluminum is lower than that of magnesium. The best explanation is that:",
      options: ["Al has a smaller atomic radius than Mg does", "Al has a larger effective nuclear charge than Mg", "Al loses a 3p electron; Mg loses one from a filled 3s", "Mg is a transition metal, and Al is a main-group metal"], answer: 2,
      why: "Removing the single 3p electron of Al is easier than breaking into Mg's stable filled 3s² subshell — one of the standard breaks in the left-to-right ionization energy trend." },
    { tid: "genchem-21", stem: "A reaction has ΔH = +30 kJ/mol and ΔS = +100 J/(mol·K), both temperature-independent. Above approximately what temperature does it become spontaneous?",
      options: ["3 K", "30 K", "300 K", "It is never spontaneous"], answer: 2,
      why: "ΔG = ΔH − TΔS < 0 requires T > ΔH/ΔS = 30,000 J / 100 J·K⁻¹ = 300 K. Watch the kJ→J conversion." },
    { tid: "genchem-10", stem: "For the reaction A + B → C, doubling [A] quadruples the initial rate while doubling [B] leaves it unchanged. The rate law is:",
      options: ["rate = k[A][B]", "rate = k[A][B]²", "rate = k[A]²", "rate = k[A]²[B]"], answer: 2,
      why: "Rate ∝ [A]² (2² = 4) and is zero order in B, so rate = k[A]². Overall order is 2." },
    { tid: "genchem-12", stem: "For N₂(g) + 3H₂(g) ⇌ 2NH₃(g), ΔH < 0. Which change shifts the equilibrium toward NH₃?",
      options: ["Increasing the temperature of the system", "Adding a finely divided platinum catalyst", "Adding an inert gas at constant volume", "Raising total pressure by reducing volume"], answer: 3,
      why: "Compression favors the side with fewer moles of gas (4 → 2), so NH₃ increases. Heating an exothermic reaction shifts it left; catalysts and inert gas at constant volume do not shift equilibrium." },
    { tid: "genchem-24", stem: "In a galvanic cell built from Zn/Zn²⁺ and Cu/Cu²⁺ half-cells (E°Zn²⁺/Zn = −0.76 V, E°Cu²⁺/Cu = +0.34 V), which statement is correct?",
      options: ["Electrons flow through the external circuit from the copper electrode to the zinc electrode", "Zinc is oxidized at the anode, which is the negative terminal", "Zinc is the cathode and gains mass", "The cell reaction has a positive ΔG°"], answer: 1,
      why: "The more negative reduction potential is oxidized: Zn → Zn²⁺ at the anode, which is negative in a galvanic cell. Electrons travel Zn → Cu externally and ΔG° = −nFE°cell < 0." },
    { tid: "genchem-14", stem: "The molar solubility of AgCl (Ksp = 1.8 × 10⁻¹⁰) in 0.10 M NaCl is approximately:",
      options: ["1.3 × 10⁻⁵ M", "1.8 × 10⁻⁹ M", "1.8 × 10⁻¹¹ M", "Unchanged from pure water"], answer: 1,
      why: "With [Cl⁻] fixed at 0.10 M by the common ion, s = Ksp/[Cl⁻] = 1.8 × 10⁻¹⁰ / 0.10 = 1.8 × 10⁻⁹ M — far below the 1.3 × 10⁻⁵ M solubility in pure water." },
    { tid: "genchem-23", stem: "Helium and oxygen gas are held at the same temperature. The ratio of the root-mean-square speed of He to that of O₂ is closest to:",
      options: ["8:1", "2.8:1", "1:1", "1:2.8"], answer: 1,
      why: "v_rms ∝ √(1/M), so the ratio is √(32/4) = √8 ≈ 2.8. Lighter gas, faster molecules at equal temperature." },
    { tid: "genchem-28", stem: "An unknown compound shows a strong IR absorption near 1710 cm⁻¹ and a very broad band spanning 2500–3300 cm⁻¹. The compound most likely contains:",
      options: ["A primary alcohol only", "A carboxylic acid", "A secondary amine", "An aldehyde"], answer: 1,
      why: "The C=O stretch near 1710 cm⁻¹ combined with the characteristically broad, low O–H stretch of a hydrogen-bonded dimer is the carboxylic acid signature." }
  ],
  psych: [
    { tid: "psych-0", stem: "A participant can reliably detect a change in the weight of a 100 g object at 102 g, and a change in a 200 g object at 204 g. This pattern is described by:",
      options: ["Weber's law", "Signal detection theory", "Sensory adaptation", "The absolute threshold"], answer: 0,
      why: "Weber's law states the just-noticeable difference is a constant proportion of the original stimulus — here 2%." },
    { tid: "psych-12", stem: "In a free-recall task, participants remember the last few list items best when tested immediately, but this advantage disappears after a 30-second distractor task. This finding is most consistent with the recency effect depending on:",
      options: ["Long-term consolidation in the hippocampus", "Semantic encoding depth", "Proactive interference", "Short-term/working memory storage"], answer: 3,
      why: "Recency reflects items still held in short-term memory; a filled delay displaces them. Primacy, which survives delay, reflects rehearsal into long-term memory." },
    { tid: "psych-10", stem: "A rat receives food after an unpredictable number of lever presses. Its responding is rapid, steady, and highly resistant to extinction. The schedule is:",
      options: ["Fixed interval", "Fixed ratio", "Variable interval", "Variable ratio"], answer: 3,
      why: "Variable-ratio reinforcement produces the highest, steadiest response rates and the greatest resistance to extinction because reinforcement timing is unpredictable." },
    { tid: "psych-18", stem: "A student's heart pounds during an exam; noticing the racing heart and the exam context, she concludes she is anxious. Which theory of emotion best accounts for this sequence?",
      options: ["James–Lange theory of emotion", "Schachter–Singer two-factor theory", "Cannon–Bard theory of emotion", "The Yerkes–Dodson arousal law"], answer: 1,
      why: "Two-factor theory requires physiological arousal plus a cognitive label drawn from context. James–Lange omits the appraisal step; Cannon–Bard has arousal and emotion occur simultaneously and independently." },
    { tid: "psych-6", stem: "Which EEG finding characterizes REM sleep?",
      options: ["Dominant alpha activity with eyes closed", "Low-amplitude, high-frequency activity", "Sleep spindles and K-complexes", "High-amplitude delta waves throughout"], answer: 1,
      why: "REM is 'paradoxical sleep': cortical activity resembles waking (beta-like, with sawtooth waves) while skeletal muscle is atonic. Spindles/K-complexes mark stage 2; delta marks stage 3." },
    { tid: "psych-31", stem: "A driver is cut off in traffic and immediately concludes the other driver is reckless, without considering that the driver might be responding to an emergency. This illustrates:",
      options: ["Fundamental attribution error", "The self-serving bias", "The halo effect in impressions", "Cognitive dissonance"], answer: 0,
      why: "Attributing another person's behavior to disposition while discounting situational causes is the fundamental attribution error." },
    { tid: "psych-27", stem: "An 8-year-old understands that pouring water into a taller glass does not change its volume but cannot reason about a hypothetical world with different physical laws. She is best placed in which Piagetian stage?",
      options: ["Preoperational", "Sensorimotor", "Concrete operational", "Formal operational"], answer: 2,
      why: "Conservation marks the concrete operational stage (roughly 7–11); abstract and hypothetical reasoning emerges with formal operations." },
    { tid: "psych-15", stem: "After extensive news coverage of an airline crash, people overestimate the risk of flying relative to driving. This judgment error reflects:",
      options: ["The representativeness heuristic", "Belief perseverance", "Functional fixedness", "The availability heuristic"], answer: 3,
      why: "Availability substitutes ease of recall for actual frequency; vivid, well-publicized events feel more probable." },
    { tid: "psych-24", stem: "A researcher measures participants on conscientiousness, neuroticism, and openness to predict job performance. This approach belongs to which theoretical tradition?",
      options: ["Psychoanalytic", "Behaviorist", "Humanistic", "Trait"], answer: 3,
      why: "Quantifying stable dispositional dimensions (the Five Factor Model) is the trait approach. Humanistic theory emphasizes self-actualization; behaviorism rejects internal dispositions as explanations." },
    { tid: "psych-20", stem: "In Selye's general adaptation syndrome, which stage is characterized by depleted physiological resources and heightened susceptibility to illness?",
      options: ["Resistance", "Exhaustion", "Appraisal", "Alarm"], answer: 1,
      why: "Alarm is the initial sympathetic/HPA surge, resistance sustains elevated cortisol, and exhaustion follows when reserves are depleted — the stage linked to immunosuppression and disease." }
  ],
  anatphys: [
    { tid: "anatphys-1", stem: "Tetrodotoxin selectively blocks voltage-gated Na⁺ channels. In a treated axon, the most direct consequence is:",
      options: ["Failure to reach threshold or propagate", "Prolonged depolarization from delayed repolarization", "Continuous neurotransmitter release at the terminal", "Immediate loss of the resting membrane potential"], answer: 0,
      why: "The rising phase of the action potential requires Na⁺ influx. Blocking those channels prevents depolarization and propagation; the resting potential, set largely by K⁺ leak and the Na⁺/K⁺ ATPase, persists." },
    { tid: "anatphys-10", stem: "During isovolumetric ventricular contraction, which valves are closed?",
      options: ["Only the atrioventricular valves", "Only the aortic and pulmonary valves", "Both the AV and the semilunar valves", "Neither the AV nor the semilunar valves"], answer: 2,
      why: "All four valves are shut, so ventricular volume is constant while pressure rises. The semilunar valves open only once ventricular pressure exceeds aortic/pulmonary pressure." },
    { tid: "anatphys-24", stem: "Increased secretion of antidiuretic hormone raises urine osmolarity primarily by:",
      options: ["Inhibiting the Na⁺/K⁺/2Cl⁻ cotransporter", "Dilating the afferent arteriole to raise GFR", "Increasing Na⁺ reabsorption in the distal tubule", "Inserting aquaporin-2 into the collecting duct"], answer: 3,
      why: "ADH acts on V2 receptors to traffic aquaporin-2 to the collecting duct apical membrane, permitting water reabsorption down the medullary osmotic gradient. Aldosterone drives distal Na⁺ reabsorption; loop diuretics block NKCC2." },
    { tid: "anatphys-13", stem: "Which change shifts the oxygen–hemoglobin dissociation curve to the right?",
      options: ["Increased 2,3-bisphosphoglycerate", "Hypothermia", "Replacement of adult hemoglobin with fetal hemoglobin", "Respiratory alkalosis"], answer: 0,
      why: "2,3-BPG stabilizes the T (deoxy) state, lowering O₂ affinity and promoting unloading in tissue. Alkalosis, cold, and HbF all increase affinity (left shift)." },
    { tid: "anatphys-8", stem: "A patient takes high-dose exogenous glucocorticoids for several weeks. Expected laboratory findings include:",
      options: ["Unchanged ACTH with adrenal hypertrophy", "Elevated ACTH and elevated CRH", "Elevated ACTH with low cortisol", "Suppressed ACTH and adrenal cortical atrophy"], answer: 3,
      why: "Exogenous glucocorticoid feeds back negatively on the hypothalamus and anterior pituitary, suppressing CRH and ACTH; without ACTH trophic support the adrenal cortex atrophies." },
    { tid: "anatphys-25", stem: "In the cross-bridge cycle, binding of a new ATP molecule to myosin causes:",

<script>
(function () {
'use strict';

var root = document.getElementById('root');

/* ------------------------------------------------------------------
   Constants
   ------------------------------------------------------------------ */

var ACCENTS = {
  biology:  { a: '#D4436B', deep: '#B03A5E', soft: '#FDEFF4', bd: '#F5D3DF' },
  genchem:  { a: '#7C6BD6', deep: '#6656BE', soft: '#F1EFFB', bd: '#DFD9F4' },
  anatphys: { a: '#E0704A', deep: '#C05834', soft: '#FDF1EC', bd: '#F6D9CC' },
  psych:    { a: '#B84FA4', deep: '#9C3D89', soft: '#FAEFF8', bd: '#EFD5EA' },
  cars:     { a: '#3F8F7B', deep: '#337663', soft: '#EDF6F2', bd: '#D2E8DF' }
};
var NEUTRAL = { a: '#B8A0AE', deep: '#9C8797', soft: '#F6F2F4', bd: '#E9E1E5' };
function acc(id) { return ACCENTS[id] || NEUTRAL; }

var SPECIAL = { final: 'Full syllabus', review: 'Review queue', misses: 'Error log', carsdaily: 'Daily CARS' };
function isSpecial(id) { return !!SPECIAL[id]; }
function homeOf(id) { return id === 'final' ? 'subjects' : 'today'; }

var KEY = 'hnoo-mcat-v1';
var PER_Q = 95;                    // seconds per question in timed sittings
var MIN_ROUND = 3;                 // fewest questions that can honestly be called a round
var REVIEW_INTERVALS = [1, 3, 7, 14, 28];   // spaced-repetition ladder, in days
/* Why a question was missed. The five causes have five different remedies,
   which is why the score report insists on one. */
var CAUSES = [
  ['gap', "Didn't know it"],
  ['misread', 'Misread it'],
  ['trap', 'Fell for a trap'],
  ['careless', 'Careless slip'],
  ['time', 'Ran out of time']
];
function causeLabel(key) {
  for (var i = 0; i < CAUSES.length; i++) if (CAUSES[i][0] === key) return CAUSES[i][1];
  return '';
}

/* ------------------------------------------------------------------
   State
   ------------------------------------------------------------------ */

var state = {
  view: 'today', subjectId: null, session: null, report: null,
  save: null, calView: 'month', calCursor: 0, ed: null
};

function setState(patch) { for (var k in patch) state[k] = patch[k]; render(); syncHash(); }

/* ------------------------------------------------------------------
   URL routing
   The five stable screens live in the hash so the browser's Back button
   moves between screens instead of leaving the app. Rounds and reports are
   transient and stay under their parent's URL — Back during a round returns
   to the screen it was started from.
   ------------------------------------------------------------------ */

var STABLE_VIEWS = ['today', 'subjects', 'calendar', 'stats'];

function hashFor() {
  if (state.view === 'subject' && state.subjectId) return '#/subject/' + state.subjectId;
  if (STABLE_VIEWS.indexOf(state.view) > -1) return '#/' + state.view;
  return null;
}
function parseHash(h) {
  var p = String(h || '').replace(/^#\/?/, '').split('/');
  if (p[0] === 'subject' && subject(p[1])) return { view: 'subject', subjectId: p[1] };
  if (STABLE_VIEWS.indexOf(p[0]) > -1) return { view: p[0], subjectId: null };
  return { view: 'today', subjectId: null };
}
var expectedHash = null;
function syncHash() {
  var h = hashFor();
  if (h && location.hash !== h) { expectedHash = h; location.hash = h; }
}
window.addEventListener('hashchange', function () {
  if (location.hash === expectedHash) { expectedHash = null; return; }
  var t = parseHash(location.hash);
  stopTimer();
  setState({ view: t.view, subjectId: t.subjectId, session: null, report: null, ed: null });
});

/* ------------------------------------------------------------------
   Persistence
   ------------------------------------------------------------------ */

function blank() {
  return { schema: 2, done: {}, rounds: {}, log: {}, events: {}, misses: {}, topicStats: {}, history: [], carsLog: {}, plan: { h: 14, days: [1, 1, 1, 1, 1, 1, 1] } };
}
function load() {
  try {
    var r = JSON.parse(localStorage.getItem(KEY));
    if (r && r.done) {
      var wasOld = r.schema !== 2;
      r = migrate(r);                       // before defaults are filled in, or
      var b = blank();                      // blank()'s schema marker would mask it
      Object.keys(b).forEach(function (k) { if (r[k] === undefined) r[k] = b[k]; });
      if (wasOld) { try { localStorage.setItem(KEY, JSON.stringify(r)); } catch (e) {} }
      return r;
    }
  } catch (e) {}
  return blank();
}

/* Saves written before questions carried syllabus topic ids tagged their
   analytics with free-text topic names. Misses can be re-tagged exactly, since
   the question id identifies the item; topic accuracy keyed by an old name has
   nothing to map onto, so it is dropped rather than shown against the wrong
   topic. Rounds, streaks, the study log and the calendar are untouched. */
function migrate(d) {
  if (d.schema === 2) return d;
  Object.keys(d.misses || {}).forEach(function (k) {
    var m = d.misses[k];
    var q = bankOf(m.subj)[parseInt(k.split('#')[1], 10)];
    m.tid = q ? q.tid : '';
    delete m.topic;
  });
  var kept = {};
  Object.keys(d.topicStats || {}).forEach(function (k) {
    if (TOPIC_NAME[k.split('|')[1]]) kept[k] = d.topicStats[k];
  });
  d.topicStats = kept;
  d.schema = 2;
  return d;
}
function save() { return state.save || blank(); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function persist(next) {
  try { localStorage.setItem(KEY, JSON.stringify(next)); } catch (e) {}
  setState({ save: next });
}

/* ------------------------------------------------------------------
   Dates
   ------------------------------------------------------------------ */

function dateKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseDate(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function examDate() { return parseDate(CONFIG.examDate || '2027-05-29'); }
function passMark() { return CONFIG.passMark || 70; }
function roundLen() { return CONFIG.roundLength || 10; }
function fmtTime(m) {
  m = parseInt(m, 10);
  var h12 = ((Math.floor(m / 60) + 11) % 12) + 1, mm = m % 60;
  return h12 + (mm ? ':' + String(mm).padStart(2, '0') : '') + (m < 720 ? ' AM' : ' PM');
}

/* ------------------------------------------------------------------
   Syllabus lookups
   ------------------------------------------------------------------ */

var TOPIC_NAME = {};       // syllabus topic id -> its name
var GROUP_OF = {};         // syllabus topic id -> the concept group it sits in

SUBJECTS.forEach(function (s) {
  var n = 0;
  s.groups.forEach(function (g, gi) {
    g.id = s.id + '-g' + gi;
    g.items = g.topics.map(function (t) { return { id: s.id + '-' + (n++), name: t }; });
    g.items.forEach(function (t) { TOPIC_NAME[t.id] = t.name; GROUP_OF[t.id] = g.id; });
  });
  s.topicCount = n;
});
function topicName(tid) { return TOPIC_NAME[tid] || tid || 'Untagged'; }
function short(str, n) { str = String(str == null ? '' : str); return str.length > n ? str.slice(0, n - 1).trim() + '\u2026' : str; }
function isGroupScope(scopeId) { return /-g\d+$/.test(scopeId); }
function isExamScope(scopeId) { return scopeId.indexOf('#exam') > -1; }

function subject(id) { return SUBJECTS.find(function (s) { return s.id === id; }); }
function allTopics(s) { var out = []; s.groups.forEach(function (g) { (g.items || []).forEach(function (t) { out.push(t); }); }); return out; }

var _banks = {};
function bankOf(id) {
  if (!_banks[id]) {
    var b = (window.MCAT_BANK || {})[id];
    if (!b) return [];
    _banks[id] = b.map(function (q, i) {
      var copy = { _k: id + '#' + i, _subj: id };
      for (var f in q) copy[f] = q[f];
      return copy;
    });
  }
  return _banks[id];
}

/* A round draws from a scope: one syllabus topic, one concept group, or the
   whole subject (the subject exam). Anything narrower than MIN_ROUND questions
   does not get offered at all — serving another topic's questions under this
   topic's name is what the old build did, and it made every per-topic score
   meaningless. */
var _pools = {};
function poolFor(subjId, scopeId) {
  var key = subjId + '|' + scopeId;
  if (!_pools[key]) {
    var bank = bankOf(subjId);
    _pools[key] = isExamScope(scopeId) ? bank
      : isGroupScope(scopeId) ? bank.filter(function (q) { return GROUP_OF[q.tid] === scopeId; })
      : bank.filter(function (q) { return q.tid === scopeId; });
  }
  return _pools[key];
}
function roundsFor(n) {
  var len = roundLen();
  if (n >= len) return Math.min(5, Math.floor(n / len));
  return n >= MIN_ROUND ? 1 : 0;
}
function scopeRounds(subjId, scopeId) { return roundsFor(poolFor(subjId, scopeId).length); }

function roundRec(tid, r) { return save().rounds[tid + '#' + r]; }
function topicRounds(subjId, scopeId) {
  var sv = save(), n = 0, best = 0;
  var avail = scopeRounds(subjId, scopeId);
  for (var r = 1; r <= avail; r++) {
    var rec = sv.rounds[scopeId + '#' + r];
    if (rec) { n++; best = Math.max(best, Math.round(rec.c / rec.t * 100)); }
  }
  return { n: n, best: best, avail: avail };
}
/* every round the bank can currently support for a subject */
function availableRounds(s) {
  var total = 0;
  s.groups.forEach(function (g) {
    g.items.forEach(function (t) { total += scopeRounds(s.id, t.id); });
    total += scopeRounds(s.id, g.id);
  });
  return total;
}
/* A topic is mastered when every round its questions support has been passed.
   That is the earned number; the self-ticked "covered in class" checkbox is
   kept, but only as a coursework marker — it no longer drives any headline. */
function topicMastered(subjId, tid) {
  var avail = scopeRounds(subjId, tid);
  if (!avail) return false;
  for (var r = 1; r <= avail; r++) {
    var rec = roundRec(tid, r);
    if (!rec || Math.round(rec.c / rec.t * 100) < passMark()) return false;
  }
  return true;
}
function subjStats(s) {
  var topics = allTopics(s), sv = save();
  var done = 0, mast = 0, rounds = 0, c = 0, t = 0;
  topics.forEach(function (tp) {
    if (sv.done[tp.id]) done++;
    if (topicMastered(s.id, tp.id)) mast++;
  });
  Object.keys(sv.rounds).forEach(function (k) {
    if (k.indexOf(s.id + '-') === 0 || k.indexOf(s.id + '#exam') === 0) {
      var r = sv.rounds[k]; rounds++; c += r.c; t += r.t;
    }
  });
  var total = topics.length || 1;
  return { done: done, mast: mast, total: topics.length, pct: Math.round(mast / total * 100), rounds: rounds, acc: t ? Math.round(c / t * 100) : null };
}
/* the next thing she can actually practise in this subject: an unfinished
   topic first, then an unfinished concept-group mix. null when the bank
   cannot support anything yet. */
function nextScopeFor(s) {
  var scopes = [];
  s.groups.forEach(function (g) {
    g.items.forEach(function (t) { scopes.push({ id: t.id, name: t.name, kind: 'topic' }); });
  });
  s.groups.forEach(function (g) { scopes.push({ id: g.id, name: g.concept, kind: 'group' }); });
  var fallback = null;
  for (var i = 0; i < scopes.length; i++) {
    var sc = scopes[i], tr = topicRounds(s.id, sc.id);
    if (!tr.avail) continue;
    if (tr.n < tr.avail) return { scope: sc, round: tr.n + 1, avail: tr.avail };
    if (!fallback) fallback = { scope: sc, round: tr.avail, avail: tr.avail };
  }
  return fallback;   // everything cleared — offer the first scope again
}
function streakDays() {
  var log = save().log, n = 0, d = new Date();
  if (!log[dateKey(d)]) d.setDate(d.getDate() - 1);
  while (log[dateKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function totals() {
  var sv = save(), c = 0, t = 0, n = 0;
  Object.keys(sv.rounds).forEach(function (k) { var r = sv.rounds[k]; c += r.c; t += r.t; n++; });
  return { c: c, t: t, n: n, acc: t ? Math.round(c / t * 100) : null };
}
function isDue(m, todayKey) {
  var d = parseDate(m.last);
  d.setDate(d.getDate() + REVIEW_INTERVALS[Math.min(m.streak || 0, 4)]);
  return dateKey(d) <= todayKey;
}

/* ------------------------------------------------------------------
   Round engine
   ------------------------------------------------------------------ */

/* Seeded Fisher-Yates, so a given topic + round always deals the same
   questions in the same order — a retake is a genuine retake. */
function seedShuffle(arr, seedStr) {
  var h = 2166136261;
  for (var i = 0; i < seedStr.length; i++) { h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619); }
  var out = arr.slice();
  for (var j = out.length - 1; j > 0; j--) {
    h = (Math.imul(h, 1103515245) + 12345) & 0x7fffffff;
    var k = h % (j + 1), tmp = out[j]; out[j] = out[k]; out[k] = tmp;
  }
  return out;
}

var qTimer = null;
function stopTimer() { if (qTimer) { clearInterval(qTimer); qTimer = null; } }
function startTimer() { stopTimer(); qTimer = setInterval(tickQ, 1000); }
function tickQ() {
  var s = state.session;
  if (!s || !s.timed) { stopTimer(); return; }
  if (s.remaining > 1) {
    s.remaining--;
    paintClock();          // patch the clock in place; a full repaint every
    return;                // second would fight the user's scroll position
  }
  if (s.i + 1 < s.qs.length) setState({ session: assign(s, { i: s.i + 1, remaining: PER_Q }) });
  else finish(s);
}
function paintClock() {
  var s = state.session, el = document.getElementById('dc-clock');
  if (!el || !s) return;
  el.textContent = Math.floor(s.remaining / 60) + ':' + String(s.remaining % 60).padStart(2, '0');
  el.style.background = s.remaining <= 15 ? '#FDF2F5' : '#F7F1F4';
  el.style.color = s.remaining <= 15 ? '#C33F68' : '#6E5266';
}
function assign(a, b) { var o = {}; for (var k in a) o[k] = a[k]; for (var k2 in b) o[k2] = b[k2]; return o; }

function launch(part, subjectId) {
  stopTimer();
  var sess = assign({ i: 0, picks: {}, revealed: false, flags: {}, elim: {}, remaining: PER_Q }, part);
  setState({ view: 'round', subjectId: subjectId, report: null, session: sess });
  if (sess.timed) startTimer();
}

function startRound(subjId, scopeId, scopeName, round) {
  var pool = poolFor(subjId, scopeId);
  if (round < 1 || round > roundsFor(pool.length)) return;
  var len = Math.min(roundLen(), pool.length);
  var qs = pool.length >= len * 2
    ? seedShuffle(pool, subjId + scopeId).slice((round - 1) * len, round * len)
    : seedShuffle(pool, subjId + scopeId + round).slice(0, len);
  // keep questions on a shared passage adjacent, the way the real exam sets them
  if (subjId === 'cars') qs = qs.slice().sort(function (a, b) { return (a.passage || '').localeCompare(b.passage || ''); });
  launch({ subjId: subjId, topicId: scopeId, topicName: scopeName, round: round, qs: qs, timed: isExamScope(scopeId) }, subjId);
}

function startSpecial(kind) {
  var sv = save(), tk = dateKey(new Date());
  if (kind === 'carsdaily') {
    var bank = bankOf('cars');
    if (!bank.length) return;
    var daily = seedShuffle(bank, 'cars' + tk).slice(0, 3).sort(function (a, b) { return (a.passage || '').localeCompare(b.passage || ''); });
    launch({ subjId: 'carsdaily', topicId: 'carsdaily', topicName: 'Daily CARS', round: 1, qs: daily, timed: false }, null);
    return;
  }
  var items = Object.keys(sv.misses || {}).map(function (k) { return assign({ k: k }, sv.misses[k]); });
  var pick = kind === 'review' ? items.filter(function (m) { return isDue(m, tk); }) : items;
  pick.sort(function (a, b) { return (a.last || '').localeCompare(b.last || ''); });
  // serve the concept, not the memorised card: rotate to a different question
  // sharing the missed item's topic when the bank has one
  var used = {};
  var qs = pick.slice(0, 10).map(function (m) {
    var bank = bankOf(m.subj);
    var orig = bank[parseInt(m.k.split('#')[1], 10)];
    if (!orig) return null;
    var mates = bank.filter(function (b) { return b.tid === orig.tid; });
    var start = mates.indexOf(orig) + 1 + (m.streak || 0);
    var served = orig;
    for (var j = 0; j < mates.length; j++) {
      var cand = mates[(start + j) % mates.length];
      if (!used[cand._k]) { served = cand; break; }
    }
    if (used[served._k]) return null;
    used[served._k] = 1;
    return assign(served, { _for: m.k });
  }).filter(Boolean);
  if (!qs.length) return;
  launch({ subjId: kind, topicId: kind, topicName: SPECIAL[kind], round: 1, qs: qs, timed: false }, null);
}

function startFinal(round) {
  var active = SUBJECTS.filter(function (s) { return s.status === 'active'; });
  var qs = [];
  active.forEach(function (s) { qs = qs.concat(seedShuffle(bankOf(s.id), 'final' + round + s.id).slice(0, 4)); });
  if (!qs.length) return;
  qs = seedShuffle(qs, 'finalmix' + round);
  var withP = qs.filter(function (q) { return q.passage; });
  var noP = qs.filter(function (q) { return !q.passage; });
  withP.sort(function (a, b) { return a.passage.localeCompare(b.passage); });
  launch({ subjId: 'final', topicId: 'final', topicName: 'Final exam ' + round, round: round, qs: noP.concat(withP), timed: true }, null);
}

function choose(i) {
  var s = state.session;
  if (!s || s.revealed) return;
  var picks = assign(s.picks, {}); picks[s.i] = i;
  var elim = assign(s.elim, {});
  if (elim[s.i] && elim[s.i][i]) { var e2 = assign(elim[s.i], {}); delete e2[i]; elim[s.i] = e2; }
  setState({ session: assign(s, { picks: picks, elim: elim }) });
}
function toggleElim(i) {
  var s = state.session;
  if (!s || s.revealed) return;
  var elim = assign(s.elim, {}), cur = assign(elim[s.i] || {}, {});
  if (cur[i]) delete cur[i]; else cur[i] = 1;
  elim[s.i] = cur;
  var picks = assign(s.picks, {});
  if (cur[i] && picks[s.i] === i) delete picks[s.i];
  setState({ session: assign(s, { elim: elim, picks: picks }) });
}
function toggleFlag() {
  var s = state.session;
  if (!s) return;
  var flags = assign(s.flags, {});
  if (flags[s.i]) delete flags[s.i]; else flags[s.i] = 1;
  setState({ session: assign(s, { flags: flags }) });
}
function primary() {
  var s = state.session;
  if (!s) return;
  if (s.timed) {
    if (s.i + 1 < s.qs.length) { setState({ session: assign(s, { i: s.i + 1, remaining: PER_Q }) }); return; }
    finish(s); return;
  }
  if (!s.revealed) {
    if (s.picks[s.i] === undefined) return;
    setState({ session: assign(s, { revealed: true }) }); return;
  }
  if (s.i + 1 < s.qs.length) { setState({ session: assign(s, { i: s.i + 1, revealed: false }) }); return; }
  finish(s);
}
function exitRound() {
  var s = state.session;
  var touched = s && (s.i > 0 || Object.keys(s.picks).length > 0);
  if (touched && !window.confirm('Leave this round? Its answers are discarded.')) return;
  stopTimer();
  setState({
    view: isSpecial(s.subjId) ? homeOf(s.subjId) : 'subject',
    subjectId: isSpecial(s.subjId) ? null : s.subjId,
    session: null
  });
}
function finish(s) {
  stopTimer();
  var c = 0;
  s.qs.forEach(function (q, i) { if (s.picks[i] === q.answer) c++; });
  var k = dateKey(new Date());
  var next = clone(save());
  // the review queue and the error log are drills, not scored rounds
  if (s.subjId !== 'review' && s.subjId !== 'misses') next.rounds[s.topicId + '#' + s.round] = { c: c, t: s.qs.length, at: k };
  next.log[k] = (next.log[k] || 0) + 1;
  if (s.subjId === 'carsdaily') { next.carsLog = next.carsLog || {}; next.carsLog[k] = 1; }
  next.misses = next.misses || {}; next.topicStats = next.topicStats || {}; next.history = next.history || [];
  var causes = {};
  s.qs.forEach(function (q, i) {
    if (!q._k) return;
    var ok = s.picks[i] === q.answer;
    // a review-queue stand-in credits the concept it was served for
    var key = q._for || q._k;
    var m = next.misses[key];
    if (ok) {
      // retire a miss after three clears on separate days — the review queue's
      // spacing means those days sit at least one interval apart, and rotation
      // means they are usually different questions on the same concept
      if (m && m.lastClear !== k) {
        m.streak = (m.streak || 0) + 1; m.last = k; m.lastClear = k;
        if (m.streak >= 3) delete next.misses[key];
      }
    } else {
      next.misses[key] = {
        subj: m ? m.subj : q._subj, tid: m ? m.tid : q.tid,
        count: (m ? m.count : 0) + 1, streak: 0, last: k,
        cause: m ? m.cause : undefined
      };
      // the score report asks why; a cause tagged on an earlier miss carries over
      if (next.misses[key].cause) causes[i] = next.misses[key].cause;
    }
    var tkey = q._subj + '|' + q.tid;
    var ts = next.topicStats[tkey] || { c: 0, t: 0 };
    ts.t++; if (ok) ts.c++;
    next.topicStats[tkey] = ts;
  });
  next.history.push({ d: k, s: s.subjId, p: Math.round(c / s.qs.length * 100) });
  if (next.history.length > 60) next.history = next.history.slice(-60);
  try { localStorage.setItem(KEY, JSON.stringify(next)); } catch (e) {}
  setState({ save: next, view: 'report', report: { session: s, correct: c, causes: causes } });
}

/* Tag why question i of the reported round was missed. Writes through to the
   miss record so the error log can aggregate remedies. */
function setCause(i, key) {
  var rep = state.report;
  if (!rep) return;
  var q = rep.session.qs[i];
  var causes = assign(rep.causes || {}, {});
  causes[i] = key;
  var next = clone(save());
  var mk = q._for || q._k;
  if (next.misses[mk]) {
    next.misses[mk].cause = key;
    try { localStorage.setItem(KEY, JSON.stringify(next)); } catch (e) {}
    state.save = next;
  }
  setState({ report: assign(rep, { causes: causes }) });
}
function toggleTopic(tid) {
  var next = clone(save());
  if (next.done[tid]) delete next.done[tid]; else next.done[tid] = 1;
  persist(next);
}
function setPlan(h, days) {
  var next = clone(save());
  next.plan = { h: h, days: days };
  persist(next);
}

/* ------------------------------------------------------------------
   Calendar
   ------------------------------------------------------------------ */

function calCursorDate() {
  var d = state.calCursor ? new Date(state.calCursor) : new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}
function calGo(dir) {
  var d = calCursorDate();
  if (state.calView !== 'week') { d.setDate(1); d.setMonth(d.getMonth() + dir); }
  else d.setDate(d.getDate() + dir * 7);
  setState({ calCursor: d.getTime() });
}
function openEditor(dk, time, id) {
  var ev = id ? (save().events || {})[id] : null;
  setState({ ed: {
    id: id || null, dateKey: dk,
    time: ev ? String(ev.time) : (time || 'all'),
    dur: ev ? (ev.dur || 60) : 60,
    title: ev ? ev.title : '',
    subjId: ev ? (ev.subjId || '') : ''
  } });
}
function saveEvent() {
  var ed = state.ed;
  if (!ed) return;
  var next = clone(save());
  if (!next.events) next.events = {};
  var id = ed.id || 'e' + Date.now();
  var subj = ed.subjId && subject(ed.subjId) ? subject(ed.subjId).name : '';
  next.events[id] = {
    d: ed.dateKey, time: ed.time, dur: ed.dur,
    title: (ed.title || '').trim() || (subj ? subj + ' study' : 'Study session'),
    subjId: ed.subjId
  };
  try { localStorage.setItem(KEY, JSON.stringify(next)); } catch (e) {}
  setState({ save: next, ed: null });
}
function deleteEvent() {
  var ed = state.ed;
  if (!ed || !ed.id) return;
  var next = clone(save());
  if (next.events) delete next.events[ed.id];
  try { localStorage.setItem(KEY, JSON.stringify(next)); } catch (e) {}
  setState({ save: next, ed: null });
}

/* ------------------------------------------------------------------
   Backup
   localStorage is per-browser and one cleared cache from gone, so the save
   file has to be something she can hold onto.
   ------------------------------------------------------------------ */

var dataNote = '';
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

function exportSave() {
  var payload = { app: 'mcat-tracker', version: 1, exportedAt: new Date().toISOString(), data: save() };
  var url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }));
  var a = document.createElement('a');
  a.href = url;
  a.download = 'mcat-tracker-' + dateKey(new Date()) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  dataNote = 'Backup downloaded as ' + a.download;
  render();
}

function importSave(e) {
  var file = e.target.files && e.target.files[0];
  e.target.value = '';                       // so the same file can be picked twice
  if (!file) return;
  var reader = new FileReader();
  reader.onerror = function () { dataNote = 'Could not read that file.'; render(); };
  reader.onload = function () {
    var incoming;
    try { incoming = JSON.parse(reader.result); }
    catch (err) { dataNote = 'That file is not valid JSON.'; render(); return; }
    var d = incoming && incoming.data ? incoming.data : incoming;
    if (!d || typeof d !== 'object' || !d.rounds || !d.done) {
      dataNote = 'That does not look like an MCAT Tracker backup.'; render(); return;
    }
    var counts = plural(Object.keys(d.rounds).length, 'round', 'rounds') + ', ' +
                 plural(Object.keys(d.done).length, 'topic', 'topics') + ' marked ready';
    if (!window.confirm('Replace all current progress with this backup (' + counts + ')?\n\nThis cannot be undone.')) {
      dataNote = 'Restore cancelled \u2014 nothing changed.'; render(); return;
    }
    var b = blank();
    Object.keys(b).forEach(function (k) { if (d[k] === undefined) d[k] = b[k]; });
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (err) {}
    dataNote = 'Restored ' + counts + ' from ' + file.name + '.';
    setState({ save: d });
  };
  reader.readAsText(file);
}

/* ------------------------------------------------------------------
   Derived view model
   One pass over state produces everything the screens draw.
   ------------------------------------------------------------------ */

/* One pip per round the scope can actually support — never five by default. */
function pipsFor(s, scopeId, scopeName, tr, A, titlePrefix) {
  var locked = s.status === 'locked';
  var out = [];
  for (var r = 1; r <= tr.avail; r++) {
    (function (r) {
      var rec = roundRec(scopeId, r);
      var pctv = rec ? Math.round(rec.c / rec.t * 100) : null;
      var passed = pctv !== null && pctv >= passMark();
      out.push({
        label: r,
        bg: locked ? '#F6F2F4' : passed ? A.a : rec ? A.soft : '#FFFFFF',
        fg: locked ? '#968D92' : passed ? '#FFFFFF' : rec ? A.deep : '#776A73',
        bd: locked ? '#EFE9EC' : passed ? A.a : rec ? A.bd : '#E9DFE4',
        title: locked ? 'Unlocks with the course' : rec ? titlePrefix + r + ' · ' + pctv + '%' : titlePrefix + r,
        start: function () { if (!locked) startRound(s.id, scopeId, scopeName, r); }
      });
    })(r);
  }
  return out;
}

function computeVals() {
  var S = state, sv = save();
  var active = SUBJECTS.filter(function (s) { return s.status === 'active'; });
  var locked = SUBJECTS.filter(function (s) { return s.status === 'locked'; });
  var exam = examDate();
  var now = new Date(); now.setHours(0, 0, 0, 0);
  var daysLeft = Math.max(0, Math.round((exam - now) / 86400000));
  var start = parseDate(CONFIG.prepStart || '2026-08-24');
  var span = Math.max(1, Math.round((exam - start) / 86400000));
  var timePct = Math.min(100, Math.max(2, Math.round((span - daysLeft) / span * 100)));
  var tot = totals();
  var streak = streakDays();

  var tDone = 0, tMast = 0, tAll = 0;
  active.forEach(function (s) { var st = subjStats(s); tDone += st.done; tMast += st.mast; tAll += st.total; });
  var overallPct = tAll ? Math.round(tMast / tAll * 100) : 0;
  var weeksLeft = Math.max(1, Math.ceil(daysLeft / 7));
  var perWeek = Math.ceil(Math.max(0, tAll - tDone) / weeksLeft);
  var plan = sv.plan || { h: 14, days: [1, 1, 1, 1, 1, 1, 1] };
  var capacity = plan.h * 3;                     // ~20 min a round
  var totalRounds = 0, practiceable = 0;
  active.forEach(function (s) {
    totalRounds += availableRounds(s);
    s.groups.forEach(function (g) {
      g.items.forEach(function (t) { if (scopeRounds(s.id, t.id)) practiceable++; });
    });
  });
  var roundsNeeded = Math.ceil(Math.max(0, totalRounds - tot.n) / weeksLeft);

    dayChips: ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(function (nm, i) {
      return {
        label: nm,
        bg: plan.days[i] ? '#4E2140' : '#FFFFFF',
        fg: plan.days[i] ? '#FFF6F9' : '#7D6774',
        bd: plan.days[i] ? '#4E2140' : '#E9DFE4',
        toggle: function () { var d2 = plan.days.slice(); d2[i] = d2[i] ? 0 : 1; setPlan(plan.h, d2); }
      };
    }),
    agToday: agList, agEmpty: agList.length === 0,
    plan: planTopics.map(function (p) {
      var A2 = acc(p.sid);
      return { short: p.short, acc: A2.a, soft: A2.soft, topic: p.topic,
        subject: p.subject + ' · round ' + p.round + ' of ' + p.avail,
        start: function () { startRound(p.sid, p.tid, p.topic, p.round); } };
    })
  };

  // ---- session editor ----
  var edd = S.ed;
  vals.ed = edd ? {
    open: true,
    heading: edd.id ? 'Edit session' : 'New study session',
    saveLabel: edd.id ? 'Save changes' : 'Add to calendar',
    dateLabel: parseDate(edd.dateKey).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }),
    title: edd.title,
    time: edd.time,
    dur: String(edd.dur),
    // typing must not repaint the app, or the caret jumps out of the field
    setTitle: function (e) { edd.title = e.target.value; },
    setTime: function (e) { edd.time = e.target.value; },
    setDur: function (e) { edd.dur = parseInt(e.target.value, 10); },
    timeOptions: [{ value: 'all', label: 'All day' }].concat(
      Array.from({ length: 30 }, function (x, i) { var t = 420 + i * 30; return { value: String(t), label: fmtTime(t) }; })),
    durOptions: [{ value: '30', label: '30 min' }, { value: '60', label: '1 hour' }, { value: '90', label: '1.5 hours' }, { value: '120', label: '2 hours' }],
    subjects: [{ id: '', name: 'General' }].concat(active.map(function (x) { return { id: x.id, name: x.name }; })).map(function (o) {
      var on = (edd.subjId || '') === o.id, A2 = acc(o.id);
      return {
        name: o.name, bg: on ? A2.a : '#FFFFFF', fg: on ? '#FFFFFF' : '#6E5266', bd: on ? A2.a : '#E9DFE4',
        pick: function () { setState({ ed: assign(edd, { subjId: o.id }) }); }
      };
    }),
    isEdit: !!edd.id,
    stop: function (e) { e.stopPropagation(); },
    save: saveEvent, cancel: function () { setState({ ed: null }); }, del: deleteEvent
  } : { open: false };

  // ---- progress ----
  var heat = [];
  for (var w = 11; w >= 0; w--) {
    var hcells = [];
    for (var dd = 0; dd < 7; dd++) {
      var d3 = new Date(mon); d3.setDate(mon.getDate() - w * 7 + dd);
      var cnt3 = sv.log[dateKey(d3)] || 0;
      hcells.push({
        bg: cnt3 >= 3 ? '#B03A5E' : cnt3 === 2 ? '#D4436B' : cnt3 === 1 ? '#F2AEC4' : '#F6F0F3',
        title: d3.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' · ' + cnt3 + ' rounds'
      });
    }
    heat.push({ cells: hcells });
  }
  vals.st = {
    rounds: tot.n, roundsNote: 'of ' + totalRounds + ' the bank supports',
    questions: tot.t, correctNote: tot.c + ' correct',
    accNote: tot.acc === null ? 'after the first round' : tot.acc >= passMark() ? 'above her ' + passMark() + '% bar' : 'below her ' + passMark() + '% bar',
    bars: active.map(function (sub) {
      var stt = subjStats(sub);
      return {
        name: sub.name, pct: stt.acc === null ? 0 : stt.acc,

        labelColor: stt.acc === null ? '#776A73' : '#40293A'
      };
    }),
    heat: heat
  };
  var hist = (sv.history || []).slice(-20);
  var pts = hist.map(function (h2, i) {
    var x = hist.length === 1 ? 280 : 8 + i * (544 / (hist.length - 1));
    var y = 8 + (100 - h2.p) * (94 / 100);
    return {
      x: Math.round(x), y: Math.round(y),

    };
  });
  vals.st.trendPts = pts.map(function (p) { return p.x + ',' + p.y; }).join(' ');
  vals.st.trendDots = pts;
  vals.st.hasTrend = pts.length > 1;
  vals.st.trendNote = hist.length ? 'Last ' + hist.length + ' scored sessions — every round, exam and drill.' : 'Scores plot here after her first round.';

  var wt = Object.keys(sv.topicStats || {}).map(function (k2) {
    var v2 = sv.topicStats[k2], sp = k2.split('|');
    return { subj: sp[0], topic: sp[1], a2: Math.round(v2.c / v2.t * 100), t: v2.t };
  }).filter(function (w2) { return w2.t >= 3; }).sort(function (a2, b2) { return a2.a2 - b2.a2; }).slice(0, 6);
  vals.st.weak = wt.map(function (w2) {
    var A2 = acc(w2.subj);
    return { topic: topicName(w2.topic), label: w2.a2 + '%', pct: w2.a2, acc: A2.a,
      meta: (subject(w2.subj) || { name: 'Mixed' }).name + ' · ' + w2.t + ' answered' };
  });
  vals.st.hasWeak = wt.length > 0;
  vals.st.noWeak = wt.length === 0;

  var missItems2 = Object.keys(sv.misses || {}).map(function (k3) { return assign({ k: k3 }, sv.misses[k3]); });
  missItems2.sort(function (a3, b3) { return (b3.count || 0) - (a3.count || 0); });
  vals.st.missCount = missItems2.length + (missItems2.length === 1 ? ' question' : ' questions');
  vals.st.hasMisses = missItems2.length > 0;
  vals.st.noMisses = missItems2.length === 0;
  vals.st.missList = missItems2.slice(0, 8).map(function (m3) {
    var A3 = acc(m3.subj);
    var q3 = bankOf(m3.subj)[parseInt(m3.k.split('#')[1], 10)] || {};
    return {
      stem: (q3.stem || '').slice(0, 110) + ((q3.stem || '').length > 110 ? '…' : ''),
      topic: short(topicName(m3.tid), 30), meta: 'missed ' + m3.count + '×', acc: A3.a, soft: A3.soft,
      cause: m3.cause ? causeLabel(m3.cause) : ''
    };
  });
  // where the misses come from decides the remedy: re-drill a content gap,
  // slow down for a misread, build stamina for timing

  missItems2.forEach(function (m3) { var ck = m3.cause || 'untagged'; causeCounts[ck] = (causeCounts[ck] || 0) + 1; });
  vals.st.causeSummary = CAUSES.map(function (cz) { return causeCounts[cz[0]] ? causeLabel(cz[0]) + ' ' + causeCounts[cz[0]] : null; })
    .filter(Boolean)
    .concat(causeCounts.untagged ? ['untagged ' + causeCounts.untagged] : [])
    .join(' · ');
  vals.st.redoMisses = function () { startSpecial('misses'); };

  var sv2 = save();
  vals.data = {
    summary: plural(tot.n, 'round', 'rounds') + ' · ' +
             plural(tDone, 'topic', 'topics') + ' marked ready · ' +
             Object.keys(sv2.misses || {}).length + ' in the error log · ' +

        start: function () { startFinal(r); }
      };
    })
  };

  return vals;
}
