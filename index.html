<style>
*{box-sizing:border-box}
body{margin:0;background:#FCFAF9;background-image:radial-gradient(1000px 560px at 88% -12%,rgba(212,67,107,.08),transparent 62%),radial-gradient(820px 520px at -12% 34%,rgba(124,107,214,.07),transparent 62%),radial-gradient(900px 560px at 62% 112%,rgba(224,112,74,.06),transparent 62%);background-attachment:fixed;-webkit-font-smoothing:antialiased;text-wrap:pretty}
a{color:#D4436B;text-decoration:none}
a:hover{color:#A82F52}
button{font:inherit;cursor:pointer}
::selection{background:#FBD9E3}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.05)}}

/* Hover states. The design medium expressed these as `style-hover` attributes;
   inline styles win over stylesheet rules, hence !important. */
.hv-pink:hover{background:#FBEEF3 !important}
.hv-blush:hover{background:#FDF6F8 !important}
.hv-mist:hover{background:#FEFBFC !important}
.hv-rose:hover{background:#FDF2F5 !important}
.hv-deep:hover{background:#B03A5E !important}
.hv-plum:hover{background:#7A2A50 !important}
.hv-b92:hover{filter:brightness(0.92)}
.hv-b93:hover{filter:brightness(0.93)}
.hv-b96:hover{filter:brightness(0.96)}
.hv-b97:hover{filter:brightness(0.97)}
.hv-outline:hover{border-color:#D4436B !important;color:#D4436B !important}
.hv-link:hover{color:#D4436B !important}
.hv-link2:hover{color:#B03A5E !important}
.hv-edge:hover{border-color:#EFC9D8 !important}
.hv-edge2:hover{border-color:#E4DBE0 !important}
.hv-lift:hover{border-color:#EFC9D8 !important;transform:translateY(-2px);box-shadow:0 14px 30px rgba(212,67,107,.12)}
.hv-pop:hover{transform:scale(1.12)}
.hv-pop2:hover{transform:scale(1.08)}

/* Keyboard focus — the mouse never sees this, the Tab key always does */
:focus-visible{outline:2px solid #D4436B;outline-offset:2px;border-radius:6px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

/* One breakpoint. The desktop layout is a fixed 252px rail beside the content;
   below it, the rail becomes a bottom tab bar and every multi-column grid
   stacks. Inline styles win the cascade, hence !important throughout. */
@media (max-width:820px){
  .app{display:block !important}
  .side{position:fixed !important;top:auto !important;left:0;right:0;bottom:0;height:auto !important;

        padding:8px 10px calc(8px + env(safe-area-inset-bottom)) !important;
        border-right:0 !important;border-top:1px solid #EFE6EA;

  .side > div:first-child{display:none !important}
  .side .testday{display:none !important}
  .side nav{flex-direction:row !important;flex:1;justify-content:space-around;gap:2px !important}
  .side nav button{flex:1;justify-content:center;padding:9px 4px !important;font-size:13px !important;white-space:nowrap}
  .scr{padding:26px 16px 110px !important;max-width:none !important}
  .mgrid{grid-template-columns:1fr !important}
  .mgrid2{grid-template-columns:1fr 1fr !important}
  .statbar{grid-template-columns:1fr !important;gap:6px !important}
  .mwrap{flex-wrap:wrap}

  .hero-num{font-size:84px !important}

  .ppanel{position:static !important;max-height:none !important}
  .mcell{min-height:60px !important;padding:4px 3px !important}
}

    title: "Humanities — conservation ethics",
    text: "When a restorer removes three centuries of varnish from a canvas, what emerges is not the painting the artist saw. Pigments have shifted; the ground has darkened; the varnish itself, applied within the artist's lifetime, was part of the intended surface. Conservation therefore cannot be a return. It is a choice among possible presents, made on behalf of a viewer who has not yet arrived.\n\nThe profession's ethic of reversibility — use only materials a later hand can undo — reads as modesty, and largely it is. But reversibility also postpones judgment indefinitely, and postponement is not neutral. A canvas left in its darkened state is also being interpreted: it is being read as a document rather than as a picture. Museums that decline to intervene are not abstaining from the argument; they have simply chosen the side that requires no defense.\n\nWhat restoration exposes, then, is that every act of preservation contains a theory of what the object is for. The cleaned ceiling and the deliberately unretouched fresco are not opposite policies. They are the same policy applied to different answers to a prior question — one the technical literature is remarkably reluctant to ask."

  p8: {
    title: "Humanities — on translation",
    text: "The complaint against translation is always the same: something is lost. The idiom that resists carriage, the rhythm native to one tongue, the pun that dies in transit — these losses are real, and the translator who denies them has not been paying attention. But the ledger metaphor itself deserves suspicion. It assumes the original is a fixed sum from which the translation can only subtract.\n\nNo reader, though, receives a 'fixed sum.' The Athenian who heard Homer recited and the modern student who reads him silently at a desk are not having the same experience minus some percentage. Each reading is a performance staged with whatever instruments the reader owns. The translator differs from other readers not in kind but in candor: she writes her reading down.\n\nThis is why the periodic call for one definitive translation of a classic mistakes the enterprise. Translations age faster than originals, it is said, and this is offered as their indictment. It would be better offered as their function. Each generation's translation is that generation's reading made audible; to fix one forever would be to silence every generation after it. The original endures precisely because its translations keep dying.\n\nNone of this licenses carelessness. The translator who invents freely has stopped reading and begun ventriloquizing. The discipline lies in the tether: the translation must remain answerable to the original at every point where the two can be compared. But answerable is not identical, and the space between those two words is where the art lives."

    { tid: "biology-7", stem: "Patients with xeroderma pigmentosum develop skin cancers from sunlight exposure because they cannot repair UV-induced pyrimidine dimers. The defective pathway is:",
      options: ["Mismatch repair", "Base excision repair", "Non-homologous end joining", "Nucleotide excision repair"], answer: 3,
      why: "NER excises bulky, helix-distorting lesions such as thymine dimers; its loss causes XP.",
      whys: ["Mismatch repair fixes replication errors, and its loss causes Lynch syndrome", "BER removes small, non-distorting base lesions like deaminated cytosine", "NHEJ rejoins double-strand breaks, not intrastrand dimers", "NER removes an oligonucleotide containing the bulky dimer and fills the gap"] },
    { tid: "biology-7", stem: "A tumor shows expansion and contraction of short repetitive DNA sequences throughout the genome (microsatellite instability). This pattern points to a defect in:",
      options: ["Photoreactivation", "Nucleotide excision repair", "Mismatch repair", "Homologous recombination"], answer: 2,
      why: "Slipped-strand errors at microsatellites are normally corrected by mismatch repair; MMR loss (as in Lynch syndrome) produces microsatellite instability.",
      whys: ["Photoreactivation is a bacterial/plant UV-repair mechanism absent in humans", "NER handles bulky adducts, not replication slippage", "MMR corrects polymerase slippage at repeats; without it repeats mutate freely", "HR repairs double-strand breaks using a sister template"] },
    { tid: "biology-9", stem: "In agarose gel electrophoresis of DNA fragments, the band closest to the positive electrode after a run contains:",
      options: ["The most positively charged fragment", "The smallest fragment", "The largest fragment", "The most methylated fragment"], answer: 1,
      why: "DNA is uniformly negative and migrates toward the anode; small fragments sieve through the gel fastest and travel farthest.",
      whys: ["All DNA carries the same charge-to-mass ratio from its phosphate backbone", "Smallest fragments migrate farthest toward the anode", "Large fragments are retarded by the gel matrix and stay near the well", "Methylation does not meaningfully change electrophoretic mobility here"] },
    { tid: "biology-9", stem: "To insert a gene into a plasmid so the ends anneal before ligation, a researcher should cut both the insert and the vector with:",
      options: ["DNase I followed by DNA ligase", "Two different blunt-cutting enzymes", "One sticky-end enzyme on both molecules", "Reverse transcriptase, then DNA ligase"], answer: 2,
      why: "Cutting both molecules with the same sticky-end enzyme creates complementary overhangs that base-pair, positioning the fragments for ligase.",
      whys: ["DNase I degrades DNA nonspecifically", "Different enzymes generally leave incompatible overhangs", "Identical palindromic cuts give mutually complementary single-stranded ends", "Reverse transcriptase copies RNA into cDNA; it does not cut vectors"] },
    { tid: "biology-9", stem: "Sanger (chain-termination) sequencing depends on the incorporation of dideoxynucleotides because they:",
      options: ["Block primer annealing to the template", "Lack a 3′-OH, halting elongation", "Are fluorescent only when unincorporated", "Cannot base-pair with the template strand"], answer: 1,
      why: "Without a 3′-OH, no phosphodiester bond can form with the next nucleotide, so synthesis stops at known bases, generating a ladder of fragments.",
      whys: ["ddNTPs act during elongation, after the primer has annealed", "No 3′-OH means the chain cannot be extended past the ddNTP", "Labeling works because incorporated ddNTPs mark fragment ends", "ddNTPs pair normally with the template — that's why they incorporate"] },
    { tid: "biology-10", stem: "A pancreatic cell dedicated to secreting digestive enzymes would be expected to contain especially prominent:",
      options: ["Lysosomes and centrioles", "Rough ER and Golgi apparatus", "Smooth ER and peroxisomes", "Free ribosomes only"], answer: 1,
      why: "Secreted proteins are synthesized on rough ER, then modified and packaged by the Golgi — the secretory pathway.",
      whys: ["Lysosomes digest material; centrioles organize spindles", "Rough ER makes secretory proteins; the Golgi sorts and ships them", "Smooth ER serves lipid synthesis and detoxification, not protein export", "Free ribosomes make cytosolic proteins, not secreted ones"] },
    { tid: "biology-10", stem: "In I-cell disease, hydrolases that belong in the lysosome are found secreted outside the cell. The defect is a failure to:",
      options: ["Translate the hydrolase mRNAs correctly", "Add the mannose-6-phosphate tag in the Golgi", "Form autophagosomes around the hydrolases", "Acidify the lysosomal lumen with V-ATPase"], answer: 1,
      why: "M6P is the address label that routes hydrolases from the Golgi to lysosomes; without it they follow the default secretory path.",
      whys: ["The enzymes are made normally — they are simply missorted", "Missing M6P tags means no receptor capture, so hydrolases are secreted", "Autophagosome formation is separate from hydrolase trafficking", "Acidification failures impair enzyme activity, not their destination"] },
    { tid: "biology-10", stem: "A disorder is transmitted from affected mothers to all of their children, while affected fathers never transmit it. The causative mutation most likely resides in:",
      options: ["Mitochondrial DNA", "An imprinted autosomal gene", "An X-linked dominant gene", "A Y-linked gene"], answer: 0,
      why: "Mitochondria — and their DNA — come from the egg, so inheritance is strictly maternal.",
      whys: ["Only oocytes contribute mitochondria to the zygote", "Imprinting alters expression by parent-of-origin but both sexes transmit alleles", "X-linked dominant fathers would pass the trait to all daughters", "Y-linked traits pass exclusively father to son"] },
    { tid: "biology-10", stem: "A protein destined for secretion is directed to the endoplasmic reticulum by:",
      options: ["Ubiquitination of a lysine", "A mannose-6-phosphate tag", "A nuclear localization sequence", "An N-terminal signal sequence"], answer: 3,
      why: "The signal recognition particle binds the emerging N-terminal signal peptide and docks the ribosome on the ER translocon.",
      whys: ["Ubiquitin marks proteins for proteasomal degradation", "M6P sorts lysosomal enzymes after they are already in the pathway", "NLS motifs route proteins into the nucleus through nuclear pores", "SRP pauses translation and delivers the ribosome to the ER membrane"] },
    { tid: "biology-11", stem: "At low temperature, adding cholesterol to a phospholipid bilayer primarily:",
      options: ["Causes the bilayer to disassemble into micelles", "Increases fluidity by preventing tight tail packing", "Decreases fluidity by packing between the tails", "Has no measurable effect on membrane fluidity"], answer: 1,
      why: "Cholesterol is a fluidity buffer: at low temperature it disrupts tail packing (raising fluidity); at high temperature it restrains motion.",
      whys: ["Cholesterol stabilizes rather than dissolves bilayers", "Below the transition temperature, cholesterol keeps tails from crystallizing", "That describes cholesterol's effect at high temperature", "Cholesterol measurably modulates fluidity in both directions"] },
    { tid: "biology-11", stem: "Human red blood cells placed in 0.45% saline (roughly half-isotonic) will:",
      options: ["Swell and may lyse as water enters", "Pump sodium inward to compensate", "Shrink as water leaves the cell", "Remain unchanged in volume"], answer: 0,
      why: "0.9% saline is isotonic to red cells; half that concentration is hypotonic, so water flows in by osmosis.",
      whys: ["Water moves toward the higher intracellular solute concentration, swelling the cell", "RBCs cannot counteract a strong osmotic influx by pumping ions inward", "Shrinking (crenation) happens in hypertonic solutions", "Only ~0.9% saline leaves red cell volume unchanged"] },
    { tid: "biology-11", stem: "Uptake of a solute into a cell increases with concentration but plateaus at high concentrations. This kinetic behavior indicates:",
      options: ["Bulk-phase endocytosis of the solute", "Carrier-mediated transport that saturates", "Simple diffusion through the lipid bilayer", "Osmotic flow driven by the gradient"], answer: 1,
      why: "Saturation kinetics are the signature of a finite number of transport proteins; simple diffusion increases linearly with the gradient.",
      whys: ["Bulk endocytosis is nonspecific and roughly proportional to concentration", "A limited pool of carriers saturates, capping the transport rate", "Simple diffusion shows no plateau — flux keeps rising with concentration", "Osmosis is water movement, not solute uptake kinetics"] },
    { tid: "biology-12", stem: "A neuron must move synaptic vesicle precursors from the soma down the axon toward the terminal. This anterograde transport is driven primarily by:",
      options: ["Myosin moving along actin toward the nucleus", "Kinesin walking toward microtubule plus ends", "Passive diffusion along neurofilaments", "Dynein walking toward microtubule minus ends"], answer: 1,
      why: "Axonal microtubules are oriented plus-end-out, so plus-end-directed kinesins carry cargo away from the soma.",
      whys: ["Myosin/actin transport is short-range, not axon-length delivery", "Kinesin is the plus-end motor, and axon plus ends point to the terminal", "Diffusion is far too slow over axonal distances; neurofilaments are structural", "Dynein powers retrograde transport back toward the soma"] },
    { tid: "biology-12", stem: "Cardiac muscle cells contract in near-synchrony because ions and small signaling molecules pass directly between neighboring cells through:",
      options: ["Gap junctions", "Hemidesmosomes", "Desmosomes", "Tight junctions"], answer: 0,
      why: "Gap junctions are connexon channels linking adjacent cytoplasms, electrically coupling cardiomyocytes.",
      whys: ["Connexon pores let current and small molecules flow directly between cells", "Hemidesmosomes anchor cells to the basement membrane", "Desmosomes are mechanical rivets resisting shear", "Tight junctions seal the space between cells; nothing passes cell-to-cell"] },
    { tid: "biology-13", stem: "Growth factors drive a cell past the restriction point in part by activating cyclin D–CDK4/6, which phosphorylates Rb. Hyperphosphorylated Rb then:",
      options: ["Binds E2F more tightly, blocking S phase", "Releases E2F, allowing S-phase transcription", "Activates p53 and triggers apoptosis", "Degrades cyclin E and arrests the cell"], answer: 1,
      why: "Rb is a brake that sequesters E2F; phosphorylation releases the brake and commits the cell to DNA replication.",
      whys: ["Hypophosphorylated Rb is the E2F-binding, growth-suppressing form", "Freed E2F transcribes cyclin E, DNA polymerase, and other S-phase genes", "p53 responds to DNA damage through a separate pathway", "Rb phosphorylation actually leads to cyclin E accumulation"] },
    { tid: "biology-13", stem: "After ionizing radiation, cells with functional p53 arrest in G1 or undergo apoptosis. Tumor cells lacking p53 instead:",
      options: ["Keep cycling with damaged DNA", "Repair the damage faster than normal cells", "Arrest permanently in G0 instead", "Become unable to replicate DNA at all"], answer: 0,
      why: "p53 is the guardian of the genome; without it, damage checkpoints fail and genomic instability accelerates tumor evolution.",
      whys: ["No G1 checkpoint means damaged templates are replicated and inherited", "Repair is impaired or unchanged — never enhanced — without p53 signaling", "Loss of p53 removes, not enforces, arrest signals", "Replication machinery works fine; the surveillance is what's missing"] },
    { tid: "biology-14", stem: "Which two processes are the principal sources of genetic variation among the gametes of a single individual?",
      options: ["Replication and transcription of DNA", "Cytokinesis and karyokinesis in meiosis", "Crossing over and independent assortment", "DNA proofreading and mismatch repair"], answer: 2,
      why: "Recombination shuffles alleles within chromosomes; independent assortment shuffles whole chromosomes — together generating enormous gamete diversity.",
      whys: ["Replication and transcription copy information rather than recombine it", "Cell-division mechanics distribute chromosomes but do not diversify them", "These two meiosis-I events independently randomize allele combinations", "Repair systems reduce variation by fixing errors"] },
    { tid: "biology-14", stem: "At ovulation, the released human oocyte is arrested at which stage, completing meiosis only if fertilization occurs?",
      options: ["Metaphase II", "Metaphase I", "Telophase II", "Prophase I"], answer: 0,
      why: "Oocytes arrest in prophase I from fetal life until each cycle's ovulation, then arrest again at metaphase II until sperm entry triggers completion.",
      whys: ["The ovulated egg waits at metaphase II for fertilization", "Metaphase I is passed just before the first polar body forms", "Telophase II occurs only after the sperm triggers anaphase II", "Prophase I arrest is the long dictyate arrest before ovulation"] },
    { tid: "biology-15", stem: "Epinephrine binding a β-adrenergic receptor raises intracellular cAMP. The correct order of events is:",
      options: ["Receptor → Gs → adenylyl cyclase → cAMP → PKA", "Receptor → adenylyl cyclase phosphorylates Gs → PKA → cAMP", "Receptor → phospholipase C → cAMP → protein kinase C", "Receptor → cAMP opens a receptor channel → PKA → Gs"], answer: 0,
      why: "β-receptors are GPCRs coupled to Gs: GTP-bound αs stimulates adenylyl cyclase, and cAMP activates PKA.",
      whys: ["This is the canonical Gs–cyclase–cAMP–PKA cascade", "Adenylyl cyclase makes cAMP; it does not phosphorylate G proteins", "PLC generates IP₃ and DAG for the Gq pathway, not cAMP", "β-receptors are not ligand-gated channels"] },
    { tid: "biology-15", stem: "Release of cytochrome c from mitochondria into the cytosol commits a cell to apoptosis by:",
      options: ["Directly digesting the genomic DNA", "Opening death channels in the plasma membrane", "Blocking ATP synthesis, causing necrosis", "Forming the apoptosome and activating caspase-9"], answer: 3,
      why: "Cytochrome c binds Apaf-1 to form the apoptosome, activating caspase-9 and the executioner caspase cascade — the intrinsic pathway.",
      whys: ["DNA fragmentation is done later by caspase-activated nucleases", "The intrinsic pathway begins at mitochondria, not surface channels", "Apoptosis is ATP-dependent and orderly; necrosis is the uncontrolled alternative", "The apoptosome converts mitochondrial permeabilization into caspase activation"] },
    { tid: "biology-15", stem: "A growth factor receptor that dimerizes and cross-phosphorylates tyrosine residues on its partner upon ligand binding is a:",
      options: ["Receptor tyrosine kinase", "Nuclear hormone receptor", "G protein-coupled receptor", "Ligand-gated ion channel"], answer: 0,
      why: "Dimerization plus trans-autophosphorylation on tyrosines is the defining activation mechanism of RTKs (e.g., insulin, EGF receptors).",
      whys: ["Cross-phosphorylated tyrosines recruit SH2-domain signaling proteins", "Nuclear receptors are intracellular transcription factors", "GPCRs signal through heterotrimeric G proteins, not autophosphorylation", "Channel receptors pass ions rather than phosphorylate"] },
    { tid: "biology-16", stem: "2,4-Dinitrophenol (DNP) carries protons across the inner mitochondrial membrane. In treated cells, oxygen consumption ______ while ATP synthesis ______.",
      options: ["decreases; decreases", "decreases; increases", "increases; increases", "increases; decreases"], answer: 3,
      why: "Uncouplers dissipate the proton gradient as heat: the ETC runs faster (more O₂ used) but ATP synthase loses its driving force.",
      whys: ["O₂ consumption falls only with direct ETC inhibitors, not uncouplers", "Electron transport speeds up when the back-pressure of the gradient is lost", "ATP synthesis cannot rise without a proton-motive force", "Classic uncoupling: respiration up, phosphorylation down, energy lost as heat"] },
    { tid: "biology-16", stem: "The primary purpose of converting pyruvate to lactate in exercising muscle is to:",
      options: ["Regenerate NAD⁺ so glycolysis can continue", "Produce additional ATP directly", "Store energy as lactate for later use", "Reduce the acidity of the cytoplasm"], answer: 0,
      why: "Fermentation exists to reoxidize NADH; without NAD⁺, the glyceraldehyde-3-phosphate step of glycolysis stalls.",
      whys: ["Reducing pyruvate reoxidizes NADH to NAD⁺, keeping glycolysis running", "The lactate step itself yields no ATP", "Lactate is a byproduct exported to the liver, not an energy store in muscle", "Lactate production accompanies, and does not relieve, cytosolic acidification"] },
    { tid: "biology-16", stem: "Cyanide blocks cytochrome c oxidase (complex IV). Which statement describes the immediate consequence?",
      options: ["The chain backs up and the proton gradient falls", "Glycolysis halts immediately in the cytosol", "Electrons reach O₂ via an alternative complex", "ATP synthase reverses and pumps protons"], answer: 0,
      why: "With the terminal electron acceptor step blocked, upstream carriers stay reduced, pumping stops, and oxidative ATP production fails.",
      whys: ["No electron flow means no proton pumping — the gradient dissipates", "Glycolysis continues (even accelerates) anaerobically", "Mammalian mitochondria have no bypass to O₂ around complex IV", "Running synthase in reverse consumes ATP; it cannot restore respiration"] },
    { tid: "biology-18", stem: "Gram-negative bacteria are distinguished from gram-positive bacteria by having:",
      options: ["A membrane-bound nucleus and organelles", "No cell wall and no peptidoglycan at all", "An outer membrane with LPS and thin peptidoglycan", "A thick peptidoglycan wall that retains crystal violet"], answer: 2,
      why: "The gram-negative envelope is a thin peptidoglycan layer plus an LPS-rich outer membrane (endotoxin), which excludes the stain.",
      whys: ["No bacterium has a membrane-bound nucleus", "Wall-less bacteria (Mycoplasma) are a separate category entirely", "The LPS outer membrane over thin peptidoglycan is the gram-negative signature", "Thick, stain-retaining walls define gram-positive organisms"] },
    { tid: "biology-18", stem: "A bacterium with a 20-minute doubling time starts as a single cell in ideal medium. After 2 hours of exponential growth, the population is:",
      options: ["6 cells", "12 cells", "64 cells", "120 cells"], answer: 2,
      why: "2 hours = 6 doublings; 2⁶ = 64.",
      whys: ["6 is the number of doublings, not the cell count", "12 would be linear growth (6 × 2), but growth is exponential", "Six doublings of one cell give 2⁶ = 64 cells", "120 confuses minutes with the exponential result"] },
    { tid: "biology-19", stem: "After conjugation between an F⁺ and an F⁻ bacterium, the typical outcome is:",
      options: ["The recipient receives chromosomal genes and stays F⁻", "The donor loses its chromosome to the recipient", "The recipient gains the F plasmid and becomes F⁺", "Both cells lyse after pilus contact"], answer: 2,
      why: "F⁺ × F⁻ crosses transfer the F plasmid itself via the pilus; chromosomal transfer requires Hfr donors.",
      whys: ["Chromosomal gene transfer is the Hfr scenario, not simple F⁺ crosses", "Transfer is replicative — the donor keeps its DNA", "A copy of the F plasmid moves across, converting the recipient to F⁺", "Conjugation is nonlethal to both partners"] },
    { tid: "biology-20", stem: "A bacteriophage integrates its genome into the host chromosome and is passively replicated for many generations before stress triggers virion production. The initial state describes:",
      options: ["Abortive infection of the host", "Transformation of the host cell", "Lysogeny, with the genome as a prophage", "The lytic cycle, with immediate lysis"], answer: 2,
      why: "Lysogeny is dormant integration as a prophage; induction (e.g., by UV or stress) flips the switch to the lytic program.",
      whys: ["Abortive infection produces no stable association at all", "Transformation is uptake of naked environmental DNA", "Integrated, silently inherited phage DNA is the definition of a prophage", "The lytic cycle is the productive, cell-bursting phase that comes later"] },
    { tid: "biology-20", stem: "A virus with a positive-sense single-stranded RNA genome can, upon entry into the cytoplasm:",
      options: ["Only replicate inside the nucleus", "Serve directly as a template for DNA synthesis by host polymerases", "Integrate into the host genome without any enzymes", "Be translated directly by host ribosomes"], answer: 3,
      why: "(+)ssRNA is effectively mRNA — ribosomes translate it immediately, producing the viral replicase.",
      whys: ["Most (+)ssRNA viruses replicate entirely in the cytoplasm", "Host cells have no RNA-dependent DNA polymerase; retroviruses must carry one", "Integration requires reverse transcriptase and integrase", "Positive-sense RNA has mRNA polarity and is read directly"] },
    { tid: "biology-21", stem: "Prion diseases propagate without any nucleic acid because the infectious agent is:",
      options: ["A naked circular RNA molecule", "A heat-stable bacterial exotoxin", "A defective virus requiring a helper virus", "A misfolded protein that templates refolding"], answer: 3,
      why: "PrPSc converts normal PrPC into the protease-resistant β-sheet-rich conformation, propagating the misfold protein-to-protein.",
      whys: ["Naked circular RNAs are viroids, plant pathogens", "Toxins poison cells but do not self-propagate", "Defective helper-dependent agents (like hepatitis D) still use nucleic acid", "Conformational templating by misfolded PrP is the prion mechanism"] },
    { tid: "biology-22", stem: "The sickle-cell allele remains at high frequency in malaria-endemic regions primarily because:",
      options: ["Heterozygotes are fitter than either homozygote", "The sickle allele arises by unusually frequent mutation", "Genetic drift favors the allele in large populations", "The sickle allele is dominant to the normal allele"], answer: 0,
      why: "Heterozygote advantage (overdominance) maintains both alleles: HbAS resists malaria without sickle-cell disease.",
      whys: ["Balancing selection through heterozygote advantage preserves the polymorphism", "Mutation pressure alone is far too weak to hold an allele at these frequencies", "Drift is strongest in small populations and is directionless", "Dominance describes expression, not why selection retains the allele"] },
    { tid: "biology-22", stem: "A river permanently divides a rodent population; over many generations the two groups become unable to interbreed. This is an example of:",
      options: ["Convergent evolution", "Sympatric speciation", "Artificial selection", "Allopatric speciation"], answer: 3,
      why: "Geographic isolation followed by independent divergence to reproductive isolation is allopatric speciation.",
      whys: ["Convergence is unrelated lineages evolving similar traits", "Sympatric speciation happens without a geographic barrier", "No human selective breeding is involved", "A physical barrier splitting the range is the allopatric mechanism"] },
    { tid: "biology-24", stem: "Immediately after a sperm fuses with the egg membrane, polyspermy is blocked most durably by:",
      options: ["The cortical reaction modifying the zona pellucida", "Fusion of all remaining sperm with one another", "Immediate ejection of the second polar body", "Depolarization of the egg membrane lasting for days"], answer: 0,
      why: "Cortical granule enzymes harden the zona and destroy sperm receptors — the slow, permanent block; membrane depolarization is only the fast, transient block.",
      whys: ["Cortical granule release remodels the zona so no further sperm can bind", "Sperm do not fuse with one another", "Polar body ejection completes meiosis and is unrelated to sperm entry", "The electrical fast block lasts seconds to minutes, not days"] },
    { tid: "biology-25", stem: "During gastrulation, cells migrating through the primitive streak establish the three germ layers. The notochord that subsequently forms is derived from:",
      options: ["Mesoderm", "Ectoderm", "Trophoblast", "Endoderm"], answer: 0,
      why: "The notochord is axial mesoderm; it later induces the overlying ectoderm to form the neural plate.",
      whys: ["Axial mesoderm condenses into the notochord along the midline", "Ectoderm forms epidermis and the nervous system, including what the notochord induces", "Trophoblast builds the placenta, not embryonic structures", "Endoderm lines the gut tube and its outgrowths"] },
    { tid: "biology-26", stem: "Transplanting the dorsal lip of the blastopore to the opposite side of an amphibian embryo induces a second body axis. This experiment demonstrates:",
      options: ["Induction: one tissue directs a neighbor's fate", "Genomic equivalence does not hold in embryos", "Gastrulation proceeds without any signaling", "Cytoplasmic determinants act cell-autonomously"], answer: 0,
      why: "Spemann and Mangold's organizer experiment showed that secreted signals from one region instruct surrounding cells — the paradigm of embryonic induction.",
      whys: ["The graft recruited host cells into a new axis — instruction between tissues", "Genomic equivalence (all cells share the genome) is supported, not refuted", "The result is direct evidence that signaling drives gastrulation patterning", "Cell-autonomous determinants cannot explain re-patterning of host tissue"] },
    { tid: "biology-27", stem: "Cells of the inner cell mass of a blastocyst can form every embryonic tissue but cannot alone form a viable embryo, because they cannot make trophoblast derivatives. They are therefore described as:",
      options: ["Totipotent", "Pluripotent", "Multipotent", "Unipotent"], answer: 1,
      why: "Pluripotent cells form all three germ layers but not extraembryonic placenta; only the zygote and early blastomeres are totipotent.",
      whys: ["Totipotency includes the trophoblast lineage — only the earliest cells qualify", "All-germ-layer potential minus extraembryonic tissue defines pluripotency", "Multipotent cells (like hematopoietic stem cells) are limited to one lineage family", "Unipotent cells produce a single cell type"] },
    { passage: "p3", tid: "biology-8", stem: "At the sandy flats site (frequency of D = 0.10), the expected frequency of heterozygous mice under Hardy–Weinberg equilibrium is:",
      options: ["0.01", "0.18", "0.81", "0.20"], answer: 1,
      why: "With p = 0.10 and q = 0.90, heterozygote frequency is 2pq = 2(0.10)(0.90) = 0.18; 0.01 is DD and 0.81 is dd.",
      whys: ["0.01 is p², the frequency of DD homozygotes", "2pq = 2 × 0.10 × 0.90 = 0.18", "0.81 is q², the sandy homozygotes", "0.20 double-counts without multiplying by q"] },
    { passage: "p3", tid: "biology-22", stem: "The difference in D-allele frequency between lava and sand sites is best explained by:",
      options: ["Higher mutation rates induced by the dark lava substrate", "Dark mice actively preferring to migrate onto the lava", "Selection by visually hunting predators favouring matching coats", "Genetic drift acting strongly in these very large populations"], answer: 2,
      why: "The owl-predation data supply the mechanism: mismatched coats are eaten at higher rates, so each substrate enriches the camouflaged allele. Mutation supplies variants but is far too rare to set frequencies at 0.86.",
      whys: ["Mutation rates do not differ by substrate; selection acts on existing variants", "Habitat choice is not supported by the data and cannot create the owl-kill pattern", "Differential predation on mismatched coats is selection in its textbook form", "Drift is weakest, not strongest, in large populations and is directionless"] },
    { passage: "p3", tid: "biology-23", stem: "The finding that Pinacate and Armendaris dark mice carry mutations in different genes shows that their dark coats are:",
      options: ["Convergent — similar phenotypes evolved independently", "Homologous, inherited intact from one dark ancestor", "The result of recent gene flow between the two flows", "Produced by the environment acting without any genes"], answer: 0,
      why: "Same selective problem, independent genetic solutions: the resemblance arose separately in each population, the molecular signature of convergent evolution rather than shared ancestry at that trait." },
    { passage: "p3", tid: "biology-8", stem: "Which observation about the flats population supports applying the Hardy–Weinberg model there?",
      options: ["Its dark allele is fully dominant to the sandy allele", "Owls hunt over the flats as intensely as over the lava", "The population lives near a highway corridor", "Genotype frequencies match p², 2pq and q² expectations"], answer: 3,
      why: "Agreement between observed genotype proportions and Hardy–Weinberg predictions is the operational test that, at this locus, the equilibrium assumptions approximately hold on the flats." },
    { tid: "biology-17", stem: "The oxygen released during photosynthesis is derived from:",
      options: ["Carbon dioxide fixed by RuBisCO", "Water split at photosystem II", "Glucose broken down in the stroma", "RuBisCO's carbamylated lysine"], answer: 1,
      why: "Photolysis of water at PSII replaces electrons lost by excited chlorophyll and releases O₂; isotope-labelling showed the O₂ comes from H₂O, not CO₂." },
    { tid: "biology-17", stem: "The light-dependent reactions and the Calvin cycle occur, respectively, in the:",
      options: ["Stroma and inner membrane", "Cytosol and matrix", "Thylakoid membrane and stroma", "Outer membrane and thylakoid lumen"], answer: 2,
      why: "Photosystems and the chloroplast electron chain are embedded in thylakoid membranes; the ATP and NADPH they make drive carbon fixation by stromal enzymes." },
    { tid: "biology-17", stem: "The immediate role of the ATP and NADPH produced by the light reactions is to:",
      options: ["Power the reduction of fixed CO₂ to sugar", "Split water molecules at photosystem II", "Excite chlorophyll electrons to higher orbitals", "Transport finished glucose out of the leaf"], answer: 0,
      why: "The Calvin cycle spends ATP and the reducing power of NADPH to convert 3-phosphoglycerate to G3P — the chemical bridge between light capture and carbohydrate." },
    { tid: "biology-23", stem: "A monophyletic group (clade) on a phylogenetic tree consists of:",
      options: ["All organisms sharing a habitat", "Species with similar appearance regardless of ancestry", "An ancestor and only some of its descendants", "A common ancestor together with all of its descendants"], answer: 3,
      why: "Clades are complete branches. Leaving out some descendants (as 'reptiles' excludes birds) makes a group paraphyletic; grouping by looks alone risks polyphyly." },
    { tid: "biology-23", stem: "The wings of insects and of birds perform the same function but differ completely in structure and development. They are:",
      options: ["Homologous structures from a winged common ancestor", "Analogous structures from convergent evolution", "Vestigial structures losing function in both lineages", "Serial homologs of one repeated body segment"], answer: 1,
      why: "Similar function without shared ancestry is analogy; homology (like a bat wing and a human arm) shows through shared underlying architecture even when function differs." },
    { tid: "biology-1", stem: "Eukaryotic mRNA gains a 5′ cap and a poly-A tail before export. Together these modifications chiefly:",
      options: ["Encode several additional amino acids at both ends", "Direct the spliceosome to excise the intron sequences", "Protect the transcript and promote translation initiation", "Attach the finished mRNA firmly to the nuclear lamina"], answer: 2,
      why: "The 7-methylguanosine cap and poly-A tail shield the ends from exonucleases and are both recognized by the initiation machinery; neither is ever translated." },
    { tid: "biology-2", stem: "A ribosome encounters the codon UAG, for which no tRNA exists. What happens next is:",
      options: ["Release factors bind and free the finished polypeptide", "The ribosome inserts a methionine at that position", "Translation reinitiates at the next downstream AUG", "The mRNA is spliced to remove the codon"], answer: 0,
      why: "UAG, UAA and UGA are stop codons read by protein release factors, which trigger hydrolysis of the peptidyl-tRNA bond and ribosome disassembly." },
    { tid: "biology-3", stem: "A mutation in the lac operator that prevents repressor binding would cause the operon to be transcribed:",
      options: ["Never, under any nutrient conditions", "Only in the simultaneous absence of glucose and lactose", "At a uniformly lower rate in all growth conditions", "Constitutively with respect to lactose, even without lactose"], answer: 3,
      why: "The operator is the repressor's binding site; without binding, lactose control is lost and transcription proceeds regardless of lactose (though CAP/glucose control still modulates its strength)." },
    { tid: "biology-5", stem: "Two carriers of an autosomal recessive allele have four children. The probability that NONE is affected is:",
      options: ["(3/4)⁴ ≈ 32%", "(1/4)⁴ ≈ 0.4%", "3/4, i.e. 75%", "Exactly zero"], answer: 0,
      why: "Each child independently has a 3/4 chance of being unaffected from an Aa × Aa cross, so all four unaffected is (3/4)⁴ ≈ 0.316 — each birth is an independent event." },
    { tid: "biology-6", stem: "During which process can crossing over create new combinations of alleles on a single chromosome?",
      options: ["Anaphase of mitosis, between sister chromatids", "Prophase I of meiosis, between homologous chromosomes", "DNA replication, during Okazaki fragment ligation", "Cytokinesis, when the cleavage furrow forms"], answer: 1,
      why: "Homologs synapse in prophase I and exchange segments at chiasmata; sister-chromatid exchange in mitosis swaps identical sequence and creates nothing new." },
    { tid: "biology-12", stem: "Epithelial sheets resist stretching because neighbouring cells are riveted together at their keratin intermediate filaments by:",
      options: ["Gap junctions", "Tight junctions", "Desmosomes", "Plasmodesmata"], answer: 2,
      why: "Desmosomes anchor intermediate filaments across cell–cell junctions, distributing mechanical stress through the tissue; tight junctions seal, gap junctions communicate." },
    { tid: "biology-14", stem: "Nondisjunction occurring in meiosis II of spermatogenesis produces, among the four sperm of that meiosis:",
      options: ["Four aneuploid sperm, two n+1 and two n−1", "Four sperm each carrying one extra chromosome", "Two normal sperm, one n+1 sperm and one n−1 sperm", "No functional sperm from that meiosis at all"], answer: 2,
      why: "Only one of the two secondary spermatocytes is affected: its sister chromatids fail to separate, giving one sperm with an extra copy and one missing it, while the unaffected cell yields two normal sperm. A meiosis I error would leave all four gametes abnormal." },
    { tid: "biology-18", stem: "In a growth curve of bacteria in fresh closed medium, cell division is fastest during the:",
      options: ["The initial lag phase", "The stationary phase", "The final death phase", "Exponential (log) phase"], answer: 3,
      why: "After the lag's metabolic gearing-up, cells divide at their maximal constant rate until nutrients deplete and wastes accumulate, which flattens the curve into stationary phase." },
    { tid: "biology-19", stem: "An Hfr strain transfers chromosomal genes to a recipient in a time-dependent order because:",
      options: ["The integrated F plasmid drags the chromosome across linearly", "The recipient cell selects which donor genes it will import", "Each transferred gene travels as its own independent plasmid", "The conjugation pilus digests the donor chromosome as it moves"], answer: 0,
      why: "In Hfr cells the integrated F factor initiates rolling transfer of the chromosome itself; interruption experiments exploited the constant transfer speed to map gene order in minutes." },
    { tid: "biology-21", stem: "A protein-only infectious agent would be expected to survive treatment with:",
      options: ["Protease enzymes", "Nucleases that destroy DNA and RNA", "Autoclaving at extreme temperature and pressure", "Protein denaturants"], answer: 1,
      why: "The defining evidence for prions: infectivity resists nuclease digestion (no genome to destroy) but is reduced by protease and harsh denaturation — the inverse of a virus's profile." },
    { tid: "biology-21", stem: "Viroids differ from viruses in that viroids:",
      options: ["Have substantially larger genomes than viruses", "Encode their own capsid proteins in a single gene", "Infect only bacteria rather than eukaryotes", "Are naked circular RNAs encoding no proteins"], answer: 3,
      why: "Viroids are a few hundred nucleotides of bare, non-coding, self-folding RNA that disrupt plant gene regulation; viruses by definition package their genome in protein." },
    { tid: "biology-22", stem: "A population of finches shows increased average beak size after a drought, with both very small and mid-sized beaks declining. The mode of selection is:",
      options: ["Disruptive", "Stabilizing", "Directional", "Sexual"], answer: 2,
      why: "The distribution's mean shifted one way — toward larger beaks that crack the remaining hard seeds — the signature of directional selection; stabilizing narrows around an unchanged mean." },
    { tid: "biology-24", stem: "The blastocyst that implants in the uterine wall consists of:",
      options: ["An inner cell mass and trophoblast around a cavity", "A solid ball of identical, uncommitted cells", "Three completed germ layers surrounding a gut tube", "A single large cell with many nuclei"], answer: 0,
      why: "By day five the morula cavitates: the trophoblast shell will build the placenta while the inner cell mass forms the embryo; germ layers come later, at gastrulation." },
    { tid: "biology-24", stem: "Identical (monozygotic) twins arise when:",
      options: ["Two separate eggs are fertilized by two separate sperm", "Cells of one early embryo separate into two embryos", "A single egg is fertilized by two sperm at once", "Two implanted blastocysts fuse into one"], answer: 1,
      why: "Splitting of one zygote's descendants yields genetically identical embryos; dizygotic twins, from two separate fertilizations, are ordinary siblings in utero together." },
    { tid: "biology-26", stem: "A skin cell and a neuron from the same person contain the same genome yet differ radically because they:",
      options: ["Carry different chromosomes", "Have deleted unused genes", "Acquired different mutations during development", "Express different subsets of the shared genome"], answer: 3,
      why: "Differentiation is differential gene expression — chromatin state and transcription-factor complements diverge while the DNA stays essentially identical (genomic equivalence)." },
    { tid: "biology-26", stem: "In amphibian embryos, cells transplanted early adopt the fate of their new location, but the same cells transplanted later keep their original fate. The later cells are said to be:",
      options: ["Totipotent", "Induced", "Determined", "Senescent"], answer: 2,
      why: "Determination is the internal commitment to a fate, made before overt differentiation is visible; before it, cells remain plastic and follow local cues." },
    { tid: "biology-27", stem: "Hematopoietic stem cells can produce every blood cell type but not, for example, neurons. They are classified as:",
      options: ["Multipotent", "Totipotent", "Pluripotent", "Unipotent"], answer: 0,
      why: "Restriction to one lineage family — all blood cells, nothing outside it — defines multipotency, one step narrower than the pluripotent inner cell mass." },
    { tid: "biology-27", stem: "In induced pluripotent stem cell (iPSC) technology, adult somatic cells are reprogrammed by:",
      options: ["Removing their nuclei and re-injecting them", "Introducing a small set of transcription factors", "Fusing them with enucleated egg cells only", "Irradiating them with ultraviolet light"], answer: 1,
      why: "Expression of defined factors (Oct4, Sox2, Klf4, c-Myc — Yamanaka's set) resets the somatic epigenome to a pluripotent state, no egg or embryo required." },
    { tid: "biology-25", stem: "The parathyroid glands and the adrenal medulla both derive from which embryonic sources, respectively?",
      options: ["Endoderm (pharyngeal pouches) and neural crest", "Lateral plate mesoderm and the gut endoderm", "Surface ectoderm and the paraxial mesoderm", "The neural tube wall and the yolk sac wall"], answer: 0,
      why: "Pharyngeal pouch endoderm forms parathyroids; neural crest cells — the 'fourth germ layer' — form the adrenal medulla's chromaffin cells, along with much of the peripheral nervous system." }
  ],
  genchem: [
    { tid: "genchem-18", stem: "A solution contains 0.20 M HA and 0.020 M A⁻. If the pKa of HA is 4.8, the pH is closest to:",
      options: ["2.8", "3.8", "4.8", "5.8"], answer: 1,
      why: "Henderson–Hasselbalch: pH = pKa + log([A⁻]/[HA]) = 4.8 + log(0.1) = 4.8 − 1 = 3.8." },
    { tid: "genchem-19", stem: "A weak diprotic acid is titrated with standardized NaOH. At the first half-equivalence point:",
      options: ["[H₂A] = [A²⁻]", "pH = 7.0", "pH = pKa1", "pH = pKa2"], answer: 2,
      why: "Half-way to the first equivalence point, [H₂A] = [HA⁻], so the log term vanishes and pH = pKa1 — the point of maximum buffering for the first proton." },
    { tid: "genchem-2", stem: "The first ionization energy of aluminum is lower than that of magnesium. The best explanation is that:",
      options: ["Al has a smaller atomic radius than Mg does", "Al has a larger effective nuclear charge than Mg", "Al loses a 3p electron; Mg loses one from a filled 3s", "Mg is a transition metal, and Al is a main-group metal"], answer: 2,
      why: "Removing the single 3p electron of Al is easier than breaking into Mg's stable filled 3s² subshell — one of the standard breaks in the left-to-right ionization energy trend." },
    { tid: "genchem-21", stem: "A reaction has ΔH = +30 kJ/mol and ΔS = +100 J/(mol·K), both temperature-independent. Above approximately what temperature does it become spontaneous?",
      options: ["3 K", "30 K", "300 K", "It is never spontaneous"], answer: 2,
      why: "ΔG = ΔH − TΔS < 0 requires T > ΔH/ΔS = 30,000 J / 100 J·K⁻¹ = 300 K. Watch the kJ→J conversion." },
    { tid: "genchem-10", stem: "For the reaction A + B → C, doubling [A] quadruples the initial rate while doubling [B] leaves it unchanged. The rate law is:",
      options: ["rate = k[A][B]", "rate = k[A][B]²", "rate = k[A]²", "rate = k[A]²[B]"], answer: 2,
      why: "Rate ∝ [A]² (2² = 4) and is zero order in B, so rate = k[A]². Overall order is 2." },
    { tid: "genchem-12", stem: "For N₂(g) + 3H₂(g) ⇌ 2NH₃(g), ΔH < 0. Which change shifts the equilibrium toward NH₃?",
      options: ["Increasing the temperature of the system", "Adding a finely divided platinum catalyst", "Adding an inert gas at constant volume", "Raising total pressure by reducing volume"], answer: 3,
      why: "Compression favors the side with fewer moles of gas (4 → 2), so NH₃ increases. Heating an exothermic reaction shifts it left; catalysts and inert gas at constant volume do not shift equilibrium." },
    { tid: "genchem-24", stem: "In a galvanic cell built from Zn/Zn²⁺ and Cu/Cu²⁺ half-cells (E°Zn²⁺/Zn = −0.76 V, E°Cu²⁺/Cu = +0.34 V), which statement is correct?",
      options: ["Electrons flow through the external circuit from the copper electrode to the zinc electrode", "Zinc is oxidized at the anode, which is the negative terminal", "Zinc is the cathode and gains mass", "The cell reaction has a positive ΔG°"], answer: 1,
      why: "The more negative reduction potential is oxidized: Zn → Zn²⁺ at the anode, which is negative in a galvanic cell. Electrons travel Zn → Cu externally and ΔG° = −nFE°cell < 0." },
    { tid: "genchem-14", stem: "The molar solubility of AgCl (Ksp = 1.8 × 10⁻¹⁰) in 0.10 M NaCl is approximately:",
      options: ["1.3 × 10⁻⁵ M", "1.8 × 10⁻⁹ M", "1.8 × 10⁻¹¹ M", "Unchanged from pure water"], answer: 1,
      why: "With [Cl⁻] fixed at 0.10 M by the common ion, s = Ksp/[Cl⁻] = 1.8 × 10⁻¹⁰ / 0.10 = 1.8 × 10⁻⁹ M — far below the 1.3 × 10⁻⁵ M solubility in pure water." },
    { tid: "genchem-23", stem: "Helium and oxygen gas are held at the same temperature. The ratio of the root-mean-square speed of He to that of O₂ is closest to:",
      options: ["8:1", "2.8:1", "1:1", "1:2.8"], answer: 1,
      why: "v_rms ∝ √(1/M), so the ratio is √(32/4) = √8 ≈ 2.8. Lighter gas, faster molecules at equal temperature." },
    { tid: "genchem-28", stem: "An unknown compound shows a strong IR absorption near 1710 cm⁻¹ and a very broad band spanning 2500–3300 cm⁻¹. The compound most likely contains:",
      options: ["A primary alcohol only", "A carboxylic acid", "A secondary amine", "An aldehyde"], answer: 1,
      why: "The C=O stretch near 1710 cm⁻¹ combined with the characteristically broad, low O–H stretch of a hydrogen-bonded dimer is the carboxylic acid signature." },
    { passage: "p4", tid: "genchem-19", stem: "From the data, pKa1 of H₂A is closest to:",
      options: ["1.9", "3.0", "4.6", "7.5"], answer: 1,
      why: "At the first half-equivalence point (12.5 mL, halfway to the 25.0 mL equivalence), [H₂A] = [HA⁻] and pH = pKa1 = 3.0.",
      whys: ["1.9 is the initial pH of the un-titrated acid", "Half-way to the first equivalence point, pH reads pKa1 directly", "4.6 is the pH at the first equivalence point, not a pKa", "7.5 sits on the second buffer plateau and reads pKa2"] },
    { passage: "p4", tid: "genchem-18", stem: "At 37.5 mL of base, the solution resists pH change most effectively because it contains:",
      options: ["Only the fully deprotonated A²⁻", "Excess strong base", "Comparable amounts of HA⁻ and A²⁻", "Only intact H₂A"], answer: 2,
      why: "37.5 mL is halfway between the two equivalence points: the second proton is half-removed, so the HA⁻/A²⁻ conjugate pair is at its 1:1 buffering maximum (pH = pKa2 = 7.5)." },
    { passage: "p4", tid: "genchem-19", stem: "The available indicator (colour change pH 9–11) is suited to detecting:",
      options: ["The midpoint of the first buffer region", "The initial pH of the untitrated acid", "The first equivalence point (pH ≈ 4.6)", "The second equivalence point (pH ≈ 10.8)"], answer: 3,
      why: "An indicator is chosen so its transition range brackets the steep jump being detected; pH 9–11 spans the second equivalence jump but would change colour far from the first." },
    { passage: "p4", tid: "genchem-16", stem: "At 55.0 mL of added NaOH, the pH of 12.0 is set principally by:",
      options: ["Excess hydroxide from the added base", "The Ka of H₂A", "Autoionization of water alone", "Carbonic acid from dissolved CO₂"], answer: 0,
      why: "Past the final equivalence point the acid is exhausted; pH follows the concentration of surplus strong base (≈0.006 M OH⁻ after dilution, pOH ≈ 2.2, pH ≈ 11.8–12)." },
    { tid: "genchem-0", stem: "Two neutral atoms are isotopes of the same element. They necessarily differ in their number of:",
      options: ["Protons", "Electrons", "Neutrons", "Valence orbitals"], answer: 2,
      why: "Isotopes share proton number (and, when neutral, electron number) but differ in neutrons, hence in mass number." },
    { tid: "genchem-0", stem: "The ground-state electron configuration of a neutral sulfur atom (Z = 16) is:",
      options: ["1s²2s²2p⁶3s²3p⁴", "1s²2s²2p⁶3s²3p⁶", "1s²2s²2p⁶3s¹3p⁵", "1s²2s²2p⁴3s²3p⁶"], answer: 0,
      why: "Sixteen electrons fill through 3p⁴ by the aufbau order; a full 3p⁶ would be argon, and promoting out of a filled subshell costs energy without gain." },
    { tid: "genchem-1", stem: "Which set of quantum numbers is IMPOSSIBLE for an electron?",
      options: ["n = 3, l = 2, ml = −2", "n = 2, l = 2, ml = 0", "n = 4, l = 0, ml = 0", "n = 2, l = 1, ml = +1"], answer: 1,
      why: "l runs only from 0 to n − 1, so an n = 2 electron cannot have l = 2 (there is no 2d subshell); the others obey all the rules." },
    { tid: "genchem-1", stem: "Hund's rule says that electrons entering a set of degenerate p orbitals will:",
      options: ["Pair up immediately in the lowest-energy orbital", "Skip directly to the next principal shell", "Enter a single orbital with opposite spins", "Occupy separate orbitals with parallel spins first"], answer: 3,
      why: "Spreading among degenerate orbitals with aligned spins minimizes electron–electron repulsion and exchange energy — why nitrogen's half-filled 2p³ is unusually stable." },
    { tid: "genchem-2", stem: "Moving down group 1 of the periodic table, atomic radius increases mainly because:",
      options: ["Each period adds a shell of higher quantum number", "Nuclear charge decreases going down the group", "Electronegativity increases toward the heavier atoms", "The atoms gain more protons than electrons downward"], answer: 0,
      why: "Added inner shells both place valence electrons farther out and shield them; nuclear charge actually rises but is outweighed by the new shell and shielding." },
    { tid: "genchem-2", stem: "Which atom has the highest electronegativity?",
      options: ["Cesium", "Fluorine", "Iodine", "Boron"], answer: 1,
      why: "Electronegativity rises toward the top right of the table; fluorine is its maximum (3.98 on the Pauling scale), cesium near the minimum." },
    { tid: "genchem-3", stem: "Solid sodium chloride does not conduct electricity, but molten NaCl does. The best explanation is that melting:",
      options: ["Breaks covalent bonds into free radicals", "Ionizes previously neutral atoms", "Frees the ions of the lattice to move", "Releases delocalized electrons"], answer: 2,
      why: "The ions exist in the solid but are locked in the lattice; conduction needs mobile charge carriers, which melting (or dissolving) provides. Metals conduct via electrons instead." },
    { tid: "genchem-3", stem: "The bond in HCl is best described as:",
      options: ["Nonpolar covalent", "Ionic", "Metallic", "Polar covalent"], answer: 3,
      why: "The electronegativity difference between H (2.2) and Cl (3.2) is large enough to polarize the shared pair toward chlorine but well short of full electron transfer." },
    { tid: "genchem-4", stem: "In the carbonate ion CO₃²⁻, all three carbon–oxygen bonds are found to be equal in length. This observation is explained by:",
      options: ["Resonance delocalization over three structures", "Rapid rotation of one localized double bond", "sp³ hybridization at the central carbon atom", "Hydrogen bonding among the three oxygens"], answer: 0,
      why: "The true ion is a resonance hybrid: the π electrons are delocalized over all three C–O linkages, giving each a bond order of 4/3 rather than one double and two single bonds." },
    { tid: "genchem-4", stem: "Assigning formal charges to the atoms of a Lewis structure, the preferred structure is generally the one that:",
      options: ["Places positive charge on the most electronegative atom", "Minimizes formal charge, negative on electronegative atoms", "Maximizes the number of separated formal charges", "Assigns every atom a formal charge of exactly −1"], answer: 1,
      why: "Structures with the least charge separation, and with any unavoidable negative charge on the atoms best able to hold it, best approximate the real electron distribution." },
    { tid: "genchem-5", stem: "Ammonia (NH₃) has bond angles of about 107°, slightly less than the tetrahedral 109.5°, because:",
      options: ["Nitrogen adopting pure sp hybridization instead", "A square planar arrangement of electron domains", "Its lone pair repelling bonding pairs more strongly", "Mutual attraction among the three hydrogen atoms"], answer: 2,
      why: "VSEPR: four electron domains adopt a tetrahedral arrangement, but the lone pair's greater repulsion compresses the N–H angles, giving trigonal pyramidal geometry." },
    { tid: "genchem-5", stem: "Carbon dioxide contains two polar C=O bonds yet has no net dipole moment because:",
      options: ["The oxygens carry no partial negative charge", "Its π bonds exactly cancel its σ bonds", "It is a resonance-stabilized free radical", "Its linear geometry makes the bond dipoles cancel"], answer: 3,
      why: "The two bond dipoles are equal and point in exactly opposite directions along the linear O=C=O axis, summing to zero; bent water, by contrast, keeps a large net dipole." },
    { tid: "genchem-6", stem: "Water boils far higher than H₂S despite its smaller mass. The dominant reason is that water molecules:",
      options: ["Hydrogen-bond to one another", "Are ionic", "Have stronger London forces", "Are heavier per atom"], answer: 0,
      why: "O–H bonds to a highly electronegative oxygen allow strong hydrogen bonding, an interaction sulfur is too large and too weakly electronegative to support well." },
    { tid: "genchem-6", stem: "Between nonpolar molecules, the only appreciable intermolecular attraction is:",
      options: ["Ion–dipole interactions with adventitious trace ions", "London dispersion from momentary induced dipoles", "Hydrogen bonding between neighbouring molecules", "Covalent networking extending across the liquid"], answer: 1,
      why: "Instantaneous fluctuations in electron distribution induce dipoles in neighbours; these dispersion forces grow with polarizability and explain why larger nonpolar substances boil higher." },
    { tid: "genchem-7", stem: "When 6.0 g of H₂ reacts with 32 g of O₂ (2H₂ + O₂ → 2H₂O), the limiting reagent is:",
      options: ["H₂, which is fully consumed first", "Water", "O₂, and 2.0 g of H₂ remains unreacted", "Neither — the amounts are exactly stoichiometric"], answer: 2,
      why: "6.0 g H₂ is 3.0 mol and 32 g O₂ is 1.0 mol. One mole of O₂ consumes only 2.0 mol of H₂, so O₂ runs out first and 1.0 mol (2.0 g) of H₂ is left over." },
    { tid: "genchem-8", stem: "Mixing aqueous silver nitrate with aqueous sodium chloride produces a white solid. This reaction is classified as:",
      options: ["Combustion", "Acid–base neutralization", "Disproportionation", "Precipitation"], answer: 3,
      why: "Ag⁺ and Cl⁻ combine to form insoluble AgCl, which leaves solution as a precipitate; no protons are transferred and no oxidation states change." },
    { tid: "genchem-9", stem: "In the reaction Zn + 2H⁺ → Zn²⁺ + H₂, the oxidation state of hydrogen changes from:",
      options: ["+1 to 0", "0 to +1", "−1 to 0", "+1 to −1"], answer: 0,
      why: "H⁺ (+1) gains electrons to form H₂ (0): hydrogen is reduced, and zinc (0 → +2) is the reducing agent being oxidized." },
    { tid: "genchem-11", stem: "A catalyst speeds a reaction by:",
      options: ["Shifting the position of equilibrium toward products", "Providing a pathway with lower activation energy", "Raising the temperature of the reaction mixture", "Making the overall ΔG of reaction more negative"], answer: 1,
      why: "Catalysts change kinetics only: a lower-Ea route accelerates forward and reverse rates equally, leaving ΔG, Keq and equilibrium position untouched." },
    { tid: "genchem-11", stem: "According to the Arrhenius equation, raising the temperature increases the rate constant chiefly because more collisions:",
      options: ["Occur in perfectly head-on orientations", "Involve the catalyst particles directly", "Carry energy at or above the activation energy", "Happen between already-formed product molecules"], answer: 2,
      why: "k = A·e^(−Ea/RT): the exponential Boltzmann factor — the fraction of encounters energetic enough to cross the barrier — is what grows steeply with T." },
    { tid: "genchem-13", stem: "To prepare 500 mL of 0.10 M NaCl from a 2.0 M stock, the volume of stock required is:",
      options: ["10 mL", "50 mL", "100 mL", "25 mL"], answer: 3,
      why: "M₁V₁ = M₂V₂: (2.0 M)(V₁) = (0.10 M)(500 mL) gives V₁ = 25 mL, then dilute to the mark." },
    { tid: "genchem-15", stem: "Dissolving a nonvolatile solute such as NaCl in water raises the boiling point because the solute:",
      options: ["Lowers the solvent's vapour pressure", "Strengthens the O–H covalent bonds", "Raises the water's heat capacity", "Reacts with dissolved oxygen"], answer: 0,
      why: "Colligative effects follow particle count: solute particles reduce the escaping tendency of solvent molecules, so a higher temperature is needed to bring vapour pressure up to atmospheric. NaCl's two ions count twice (van 't Hoff factor)." },
    { tid: "genchem-16", stem: "In the reaction NH₃ + H₂O ⇌ NH₄⁺ + OH⁻, water acts as:",
      options: ["A Brønsted–Lowry base", "A Brønsted–Lowry acid", "A spectator", "An oxidizing agent"], answer: 1,
      why: "Water donates a proton to ammonia, which makes it the Brønsted–Lowry acid of the pair — a reminder that water is amphoteric and that acid/base is defined per reaction." },
    { tid: "genchem-17", stem: "Acid HX has Ka = 1 × 10⁻⁵; acid HY has Ka = 1 × 10⁻⁹. Comparing equal concentrations:",
      options: ["HY is far more dissociated than HX at equilibrium", "Both acids are essentially fully dissociated", "HX is stronger and its conjugate X⁻ the weaker base", "HY is stronger and X⁻ is the stronger base"], answer: 2,
      why: "Larger Ka means more dissociation; and conjugate strength is reciprocal (Ka·Kb = Kw), so the stronger acid HX has the weaker conjugate base." },
    { tid: "genchem-20", stem: "Using Hess's law with ΔH₁ for C + O₂ → CO₂ and ΔH₂ for CO + ½O₂ → CO₂, the enthalpy of C + ½O₂ → CO equals:",
      options: ["ΔH₁ + ΔH₂", "ΔH₂ − ΔH₁", "ΔH₁ × ΔH₂", "ΔH₁ − ΔH₂"], answer: 3,
      why: "Target = equation 1 minus equation 2 (reversing the CO combustion): enthalpy, a state function, adds along any path, giving ΔH = ΔH₁ − ΔH₂." },
    { tid: "genchem-22", stem: "A 50.0 g metal sample absorbs 450 J and warms by 20.0 °C. Its specific heat capacity is:",
      options: ["0.45 J/(g·°C)", "9.0 J/(g·°C)", "2.2 J/(g·°C)", "0.90 J/(g·°C)"], answer: 0,
      why: "c = q/(mΔT) = 450 / (50.0 × 20.0) = 0.45 J·g⁻¹·°C⁻¹ — a typical value for a transition metal (iron is 0.449)." },
    { tid: "genchem-22", stem: "While an ice–water mixture absorbs heat at 0 °C, its temperature stays constant because the energy:",
      options: ["Escapes the mixture as emitted infrared light", "Breaks intermolecular attractions during melting", "Is destroyed outright by the change of phase", "Raises only the internal pressure of the ice"], answer: 1,
      why: "Latent heat of fusion does the work of disrupting the lattice rather than raising kinetic energy; temperature resumes climbing once one phase remains." },
    { tid: "genchem-25", stem: "By the Nernst equation, a galvanic cell's measured potential falls below E° when:",
      options: ["The cell operates at exactly standard conditions", "The temperature is lowered toward absolute zero", "Product ion concentrations exceed reactants' (Q > 1)", "A second salt bridge is added to the cell"], answer: 2,
      why: "E = E° − (RT/nF)·ln Q: as Q grows past 1 the logarithm turns positive and the potential drops, reaching zero at equilibrium (Q = Keq)." },
    { tid: "genchem-26", stem: "A radioisotope has a half-life of 8 days. After 24 days, the fraction of the original sample remaining is:",
      options: ["1/3", "1/16", "1/4", "1/8"], answer: 3,
      why: "24 days is three half-lives; (1/2)³ = 1/8 remains — decay is exponential in half-life counts, never linear." },
    { tid: "genchem-26", stem: "Beta-minus decay of an unstable nucleus converts:",
      options: ["A neutron into a proton, emitting an electron", "A proton into a neutron, emitting a positron", "Two protons and two neutrons into an alpha particle", "A neutron directly into a gamma-ray photon"], answer: 0,
      why: "β⁻ decay raises atomic number by one at constant mass number, moving neutron-rich nuclei toward stability; positron emission is the mirror process for proton-rich nuclei." },
    { tid: "genchem-27", stem: "Two miscible liquids boiling at 60 °C and 110 °C are best separated by:",
      options: ["Filtration", "Fractional distillation", "Liquid–liquid extraction", "Recrystallization"], answer: 1,
      why: "A 50-degree volatility difference is ideal for distillation, where repeated vaporization–condensation on the column enriches the vapour in the more volatile component; filtration needs a solid, extraction needs differing solubilities in immiscible solvents." }
  ],
  psych: [
    { tid: "psych-0", stem: "A participant can reliably detect a change in the weight of a 100 g object at 102 g, and a change in a 200 g object at 204 g. This pattern is described by:",
      options: ["Weber's law", "Signal detection theory", "Sensory adaptation", "The absolute threshold"], answer: 0,
      why: "Weber's law states the just-noticeable difference is a constant proportion of the original stimulus — here 2%." },
    { tid: "psych-12", stem: "In a free-recall task, participants remember the last few list items best when tested immediately, but this advantage disappears after a 30-second distractor task. This finding is most consistent with the recency effect depending on:",
      options: ["Long-term consolidation in the hippocampus", "Semantic encoding depth", "Proactive interference", "Short-term/working memory storage"], answer: 3,
      why: "Recency reflects items still held in short-term memory; a filled delay displaces them. Primacy, which survives delay, reflects rehearsal into long-term memory." },
    { tid: "psych-10", stem: "A rat receives food after an unpredictable number of lever presses. Its responding is rapid, steady, and highly resistant to extinction. The schedule is:",
      options: ["Fixed interval", "Fixed ratio", "Variable interval", "Variable ratio"], answer: 3,
      why: "Variable-ratio reinforcement produces the highest, steadiest response rates and the greatest resistance to extinction because reinforcement timing is unpredictable." },
    { tid: "psych-18", stem: "A student's heart pounds during an exam; noticing the racing heart and the exam context, she concludes she is anxious. Which theory of emotion best accounts for this sequence?",
      options: ["James–Lange theory of emotion", "Schachter–Singer two-factor theory", "Cannon–Bard theory of emotion", "The Yerkes–Dodson arousal law"], answer: 1,
      why: "Two-factor theory requires physiological arousal plus a cognitive label drawn from context. James–Lange omits the appraisal step; Cannon–Bard has arousal and emotion occur simultaneously and independently." },
    { tid: "psych-6", stem: "Which EEG finding characterizes REM sleep?",
      options: ["Dominant alpha activity with eyes closed", "Low-amplitude, high-frequency activity", "Sleep spindles and K-complexes", "High-amplitude delta waves throughout"], answer: 1,
      why: "REM is 'paradoxical sleep': cortical activity resembles waking (beta-like, with sawtooth waves) while skeletal muscle is atonic. Spindles/K-complexes mark stage 2; delta marks stage 3." },
    { tid: "psych-31", stem: "A driver is cut off in traffic and immediately concludes the other driver is reckless, without considering that the driver might be responding to an emergency. This illustrates:",
      options: ["Fundamental attribution error", "The self-serving bias", "The halo effect in impressions", "Cognitive dissonance"], answer: 0,
      why: "Attributing another person's behavior to disposition while discounting situational causes is the fundamental attribution error." },
    { tid: "psych-27", stem: "An 8-year-old understands that pouring water into a taller glass does not change its volume but cannot reason about a hypothetical world with different physical laws. She is best placed in which Piagetian stage?",
      options: ["Preoperational", "Sensorimotor", "Concrete operational", "Formal operational"], answer: 2,
      why: "Conservation marks the concrete operational stage (roughly 7–11); abstract and hypothetical reasoning emerges with formal operations." },
    { tid: "psych-15", stem: "After extensive news coverage of an airline crash, people overestimate the risk of flying relative to driving. This judgment error reflects:",
      options: ["The representativeness heuristic", "Belief perseverance", "Functional fixedness", "The availability heuristic"], answer: 3,
      why: "Availability substitutes ease of recall for actual frequency; vivid, well-publicized events feel more probable." },
    { tid: "psych-24", stem: "A researcher measures participants on conscientiousness, neuroticism, and openness to predict job performance. This approach belongs to which theoretical tradition?",
      options: ["Psychoanalytic", "Behaviorist", "Humanistic", "Trait"], answer: 3,
      why: "Quantifying stable dispositional dimensions (the Five Factor Model) is the trait approach. Humanistic theory emphasizes self-actualization; behaviorism rejects internal dispositions as explanations." },
    { tid: "psych-20", stem: "In Selye's general adaptation syndrome, which stage is characterized by depleted physiological resources and heightened susceptibility to illness?",
      options: ["Resistance", "Exhaustion", "Appraisal", "Alarm"], answer: 1,
      why: "Alarm is the initial sympathetic/HPA surge, resistance sustains elevated cortisol, and exhaustion follows when reserves are depleted — the stage linked to immunosuppression and disease." },
    { passage: "p6", tid: "psych-18", stem: "The study's central finding — identical arousal experienced as elation or anger depending on the room — most directly supports:",
      options: ["The James–Lange claim that each emotion has a unique bodily signature", "Schachter and Singer's two-factor theory", "The Cannon–Bard claim that arousal and emotion are independent", "Drive-reduction theory"], answer: 1,
      why: "Two-factor theory holds that emotion = physiological arousal + a cognitive label. Same arousal, different labels, different emotions — exactly what the uninformed groups showed.",
      whys: ["James–Lange predicts distinct bodily states for distinct emotions; here one state produced two emotions", "Arousal plus a situation-supplied label is the two-factor formula", "Cannon–Bard has emotion occurring with, not derived from, arousal — labels should not matter", "No biological drive is being reduced in either room"] },
    { passage: "p6", tid: "psych-18", stem: "Why did accurately informed participants show so little emotion with either confederate?",
      options: ["They already had a nonemotional label for their arousal", "The epinephrine produced no arousal in their bodies", "They could not perceive the confederate's behaviour", "Their baseline arousal was lower than other groups'"], answer: 0,
      why: "Told to expect a racing heart from the injection, they attributed the arousal to the drug and needed no emotional label — cutting the arousal-to-emotion link the theory proposes." },
    { passage: "p6", tid: "psych-18", stem: "The saline placebo group's role in the design was to:",
      options: ["Maximize emotional responding in both rooms", "Test whether the confederate's acting was convincing", "Show what the situation produces without drug arousal", "Keep the experimenters blind to the hypothesis"], answer: 2,
      why: "Placebo participants supply the baseline: any emotion they show comes from the social situation alone, letting the investigators isolate the added contribution of unexplained arousal." },
    { passage: "p6", tid: "psych-18", stem: "A modern replication finds that people frightened by crossing a high suspension bridge rate an interviewer as more attractive than people on a low bridge. This extends the passage's logic through:",
      options: ["Habituation to repeated danger cues", "Operant conditioning of attraction responses", "Perceptual constancy across viewing conditions", "Misattribution of arousal to the wrong source"], answer: 3,
      why: "The bridge study (Dutton & Aron) shows fear arousal being read as attraction when an attractive label is available — arousal is ambiguous and the label is borrowed from context, just as the passage argues." },
    { tid: "psych-0", stem: "A sound is played so softly that a listener detects it on exactly half of the trials. That intensity defines the listener's:",
      options: ["Absolute threshold", "Difference threshold", "Weber fraction", "Adaptation level"], answer: 0,
      why: "The absolute threshold is conventionally the stimulus intensity detected 50% of the time; the difference threshold concerns telling two stimuli apart." },
    { tid: "psych-0", stem: "In signal detection terms, a radiologist who reports a tumor when none is present has produced a:",
      options: ["Miss", "False alarm", "Hit", "Correct rejection"], answer: 1,
      why: "Signal absent, response 'present' is a false alarm; the framework separates true sensitivity (d′) from the response bias that trades false alarms against misses." },
    { tid: "psych-5", stem: "At a noisy party you follow one conversation, yet instantly notice your name spoken across the room. This shows that unattended input is:",
      options: ["Blocked completely at the level of the outer ears", "Stored permanently in long-term episodic memory", "Processed to some semantic depth despite attention", "Physically louder than the attended conversation"], answer: 2,
      why: "The cocktail-party effect: selective attention filters consciousness, but unattended streams still get enough processing for personally significant content to break through." },
    { tid: "psych-6", stem: "Across the night, the composition of sleep changes such that:",
      options: ["REM sleep dominates the first hour of the night", "Stage 3 slow-wave sleep fills the final cycles", "Sleep spindles disappear entirely after midnight", "REM lengthens toward morning; slow-wave sits early"], answer: 3,
      why: "Deep slow-wave sleep loads the first cycles; REM episodes grow longer and closer together toward waking — why late-morning dreams are the vivid, remembered ones." },
    { tid: "psych-6", stem: "The suprachiasmatic nucleus keeps circadian rhythms synchronized to the day–night cycle using light information carried from the:",
      options: ["Retina", "Cochlea", "Skin thermoreceptors", "Olfactory bulb"], answer: 0,
      why: "Specialized retinal ganglion cells project directly to the SCN (the retinohypothalamic tract), entraining the clock that gates melatonin release — the mechanism jet lag disrupts." },
    { tid: "psych-8", stem: "A regular user needs escalating doses of a drug for the original effect, and feels ill without it. These two phenomena are, respectively:",
      options: ["Sensitization and craving", "Tolerance and withdrawal", "Placebo response and relapse", "Priming and extinction"], answer: 1,
      why: "Tolerance is the diminished response to a constant dose (neuroadaptation); withdrawal is the rebound syndrome when the adapted system loses the drug — together they mark physiological dependence." },
    { tid: "psych-9", stem: "After chemotherapy sessions in one clinic, a patient feels nauseated just entering the building. In classical conditioning terms, the building is now a:",
      options: ["Unconditioned stimulus", "Unconditioned response", "Conditioned stimulus", "Negative reinforcer"], answer: 2,
      why: "The clinic, once neutral, was paired with the nausea-producing drugs (US) and now elicits nausea by itself — a conditioned stimulus producing a conditioned response." },
    { tid: "psych-9", stem: "A dog conditioned to salivate to a 1000 Hz tone also salivates, less strongly, to a 900 Hz tone. This is:",
      options: ["Spontaneous recovery", "Second-order conditioning", "Discrimination", "Stimulus generalization"], answer: 3,
      why: "Responding spreads to stimuli resembling the CS, in proportion to similarity; discrimination is the opposite process of learning to respond only to the trained stimulus." },
    { tid: "psych-10", stem: "A teenager's chore-avoidance whining stops when parents stop giving in. In operant terms, ceasing to reward the whining produces:",
      options: ["Extinction of the behaviour", "Positive punishment", "Negative reinforcement", "Shaping by approximation"], answer: 0,
      why: "Withholding the reinforcer that maintained a behaviour extinguishes it — often after a temporary burst of intensified whining, the classic extinction burst." },
    { tid: "psych-10", stem: "Taking aspirin removes a headache, making aspirin-taking more likely in future. This exemplifies:",
