<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Math Quest — Square Root Method</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>

<style>
/* ===== sq/sq-styles.css ===== */
/* ============================================================
   Math Quest — Square Root prototype
   Soft pastel + frosted-glass aesthetic
   ============================================================ */

:root {
  /* Background washes */
  --bg-cream:    #FFF5E4;
  --bg-peach:    #FFE3CC;
  --bg-lavender: #E8DCFB;
  --bg-mint:     #D8F2E2;
  --bg-pink:     #FFDFEB;

  /* Quint palette */
  --q-purple:  #7B47C7;
  --q-purple-2:#A876E8;
  --q-magenta: #D44C97;
  --q-pink:    #FF8DC7;
  --q-yellow:  #FFD93D;

  /* Ink */
  --ink:    #2A1A4A;
  --ink-2:  #5B4A82;
  --ink-3:  #8C7DAE;
  --ink-4:  #B7ACC9;

  /* Glass */
  --glass-bg:    rgba(255,255,255,0.55);
  --glass-bg-2:  rgba(255,255,255,0.38);
  --glass-stroke:rgba(255,255,255,0.75);
  --glass-edge:  rgba(123, 71, 199, 0.10);
  --glass-shadow:0 8px 28px rgba(123, 71, 199, 0.14),
                 0 1px 0 rgba(255,255,255,0.6) inset;

  /* Feedback (soft, never harsh) */
  --good:      #4DBE94;
  --good-soft: #DFF6EB;
  --warn:      #E89BB8;        /* peachy-pink, NOT red */
  --warn-soft: #FFE0EE;

  /* Radii */
  --r-sm: 14px;
  --r-md: 22px;
  --r-lg: 28px;
  --r-xl: 36px;

  /* Type */
  --font-display: "Quicksand", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --font-body:    "Nunito", ui-rounded, system-ui, sans-serif;
  --font-mono:    "JetBrains Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }

/* The phone canvas — all sq-app content sits in here */
.sq-app {
  font-family: var(--font-body);
  color: var(--ink);
  width: 100%;
  min-height: 100%;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse 60% 40% at 15% 8%,  var(--bg-peach)   0%, transparent 60%),
    radial-gradient(ellipse 55% 38% at 90% 18%, var(--bg-pink)    0%, transparent 60%),
    radial-gradient(ellipse 65% 45% at 12% 65%, var(--bg-lavender) 0%, transparent 60%),
    radial-gradient(ellipse 55% 40% at 92% 78%, var(--bg-mint)    0%, transparent 60%),
    radial-gradient(ellipse 70% 50% at 50% 100%,#FFE2C5 0%, transparent 65%),
    var(--bg-cream);
  background-attachment: local;
}

/* Floating math symbol decorations */
.sq-deco {
  position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0;
  font-family: "Times New Roman", serif;
  font-style: italic;
  font-weight: 500;
}
.sq-deco span {
  position: absolute;
  font-size: 56px;
  opacity: .22;
  animation: drift 18s ease-in-out infinite;
}
.sq-deco .s1 { top: 8%;  left: 78%; color: var(--q-purple); animation-delay: 0s; }
.sq-deco .s2 { top: 32%; left: 5%;  color: var(--q-magenta); animation-delay: -6s; font-size: 44px;}
.sq-deco .s3 { top: 60%; left: 85%; color: var(--q-purple); animation-delay: -3s; font-size: 38px;}
.sq-deco .s4 { top: 82%; left: 8%;  color: var(--q-magenta); animation-delay: -9s; font-size: 50px;}
.sq-deco .s5 { top: 48%; left: 50%; color: var(--q-purple-2); animation-delay: -12s; font-size: 32px;}

@keyframes drift {
  0%, 100% { transform: translateY(0) rotate(-4deg); }
  50%      { transform: translateY(-14px) rotate(4deg); }
}

/* Frosted-glass card */
.glass {
  background: var(--glass-bg);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  backdrop-filter: blur(20px) saturate(140%);
  border: 1px solid var(--glass-stroke);
  border-radius: var(--r-lg);
  box-shadow: var(--glass-shadow);
  position: relative;
}
.glass-2 {
  background: var(--glass-bg-2);
  border: 1px solid rgba(255,255,255,.65);
  border-radius: var(--r-md);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  backdrop-filter: blur(14px) saturate(140%);
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--ink-3);
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
  color: var(--ink);
}

p { margin: 0; line-height: 1.55; color: var(--ink-2); }

/* ============= Quint ============= */
.quint-wrap { display: inline-block; position: relative; }
.quint-wrap.idle .quint-svg { animation: quintBob 3.4s ease-in-out infinite; }
.quint-svg {
  filter: drop-shadow(0 12px 20px rgba(123,71,199,.18));
  animation: quintPop .5s cubic-bezier(.34,1.56,.64,1);
  transform-origin: 50% 90%;
}
@keyframes quintBob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-7px); }
}
@keyframes quintPop {
  0%   { transform: scale(.85); }
  60%  { transform: scale(1.06); }
  100% { transform: scale(1); }
}

.quint-sparkle { animation: sparklePop 1.4s ease-in-out infinite; }
@keyframes sparklePop {
  0%, 100% { opacity: 0; transform: scale(.6); }
  50%      { opacity: 1; transform: scale(1); }
}

.quint-confetti { animation: confettiFall 1.6s ease-out infinite; }
@keyframes confettiFall {
  0%   { transform: translateY(-10px) rotate(0); opacity: 1; }
  100% { transform: translateY(40px) rotate(180deg); opacity: 0; }
}

.quint-arm-l { animation: armWaveL 1.2s ease-in-out infinite; transform-origin: 52px 95px; }
.quint-arm-r { animation: armWaveR 1.2s ease-in-out infinite; transform-origin: 148px 95px; }
@keyframes armWaveL { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(-30deg); } }
@keyframes armWaveR { 0%,100% { transform: rotate(10deg); }  50% { transform: rotate(30deg); } }

.quint-thought { animation: thoughtFloat 2.6s ease-in-out infinite; }
@keyframes thoughtFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-4px); }
}

/* ============= Quint speech bubble ============= */
.bubble {
  background: white;
  border: 1.5px solid var(--ink);
  border-radius: 20px;
  padding: 12px 16px;
  font-size: 14.5px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.45;
  box-shadow: 0 4px 0 rgba(123,71,199,.12);
  position: relative;
  max-width: 240px;
  animation: bubblePop .35s cubic-bezier(.34,1.56,.64,1);
}
.bubble::after {
  content: "";
  position: absolute;
  left: -10px; top: 20px;
  width: 14px; height: 14px;
  background: white;
  border-left: 1.5px solid var(--ink);
  border-bottom: 1.5px solid var(--ink);
  transform: rotate(45deg);
  border-bottom-left-radius: 3px;
}
@keyframes bubblePop {
  0%   { opacity: 0; transform: translateX(-6px) scale(.92); }
  100% { opacity: 1; transform: translateX(0) scale(1); }
}

/* ============= Buttons ============= */
.btn {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  border: 1.5px solid var(--ink);
  border-radius: 999px;
  padding: 13px 22px;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .08s ease, box-shadow .15s ease;
  white-space: nowrap;
  min-height: 48px;
}
.btn:active { transform: translateY(2px); }
.btn-primary {
  background: linear-gradient(180deg, #A876E8 0%, #7B47C7 100%);
  color: white;
  box-shadow: 0 4px 0 #4A2A85, 0 0 0 1px rgba(255,255,255,.4) inset;
}
.btn-soft {
  background: white;
  color: var(--ink);
  box-shadow: 0 3px 0 var(--ink-4);
}
.btn-ghost {
  background: rgba(255,255,255,.5);
  border-color: transparent;
  color: var(--ink-2);
  box-shadow: none;
  font-weight: 600;
}
.btn-pill {
  background: var(--bg-lavender);
  border: 1.5px solid #C8B5F0;
  color: var(--q-purple);
  font-size: 13px;
  padding: 8px 14px;
  border-radius: 999px;
  font-weight: 700;
  font-family: var(--font-display);
  min-height: 36px;
  cursor: pointer;
}
.btn-pill:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ============= Top bar ============= */
.sq-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px 8px;
  position: relative; z-index: 2;
}
.sq-stats { display: flex; gap: 6px; }
.sq-stat {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 11px 6px 7px;
  border-radius: 999px;
  background: rgba(255,255,255,.7);
  border: 1px solid rgba(255,255,255,.8);
  font-weight: 800;
  font-size: 13px;
  color: var(--ink);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.sq-stat-ic { font-size: 14px; }
.sq-back {
  width: 38px; height: 38px;
  border-radius: 12px;
  background: rgba(255,255,255,.7);
  border: 1px solid rgba(255,255,255,.85);
  display: grid; place-items: center;
  cursor: pointer;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  font-size: 18px; color: var(--ink);
  font-weight: 700;
}

/* ============= Mastery rings ============= */
.ring-card {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px;
}
.ring-card-body { flex: 1; min-width: 0; }
.ring-card-body h3 { font-size: 16px; margin-bottom: 2px; }
.ring-card-body p { font-size: 12.5px; color: var(--ink-3); }
.ring-pct {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 12px;
  text-align: center;
}

/* Page content area */
.sq-page {
  padding: 8px 18px 28px;
  position: relative; z-index: 1;
  display: flex; flex-direction: column; gap: 14px;
}

.section-title {
  display: flex; align-items: baseline; justify-content: space-between;
  margin: 12px 4px 0;
}
.section-title h2 { font-size: 18px; }
.section-title .more { font-size: 12px; font-weight: 700; color: var(--q-purple); }

/* ============= Concept card ============= */
.concept-card { padding: 22px; }
.concept-card .formula-box {
  margin-top: 14px;
  padding: 18px 16px;
  border-radius: 18px;
  background: rgba(255,255,255,.65);
  border: 1px dashed rgba(123,71,199,.3);
  text-align: center;
}
.concept-card .formula-box .katex { font-size: 1.35em !important; }

/* Color-coded math changes */
.tok-pulse-purple {
  display: inline-block;
  animation: tokPulse 1s ease-out;
  color: var(--q-purple) !important;
  font-weight: 800;
}
.tok-pulse-pink {
  display: inline-block;
  animation: tokPulse 1s ease-out;
  color: var(--q-magenta) !important;
  font-weight: 800;
}
@keyframes tokPulse {
  0%   { transform: scale(.4); opacity: 0; }
  60%  { transform: scale(1.25); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

/* ============= Manipulative (slider widget) ============= */
.manip { padding: 16px; }
.manip-canvas {
  width: 100%; height: 200px;
  border-radius: 18px;
  background: linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,.4));
  border: 1px solid rgba(255,255,255,.7);
  overflow: hidden;
  position: relative;
}
.manip-readout {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 12px; gap: 12px;
}
.manip-readout .eq {
  background: rgba(255,255,255,.7);
  border-radius: 14px;
  padding: 10px 14px;
  flex: 1;
  text-align: center;
}
.manip-readout .eq .katex { font-size: 1.1em !important; }

.k-slider {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 8px;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--q-magenta) 0%, #E8DCFB 50%, var(--q-purple) 100%);
  outline: none;
  margin: 14px 0 6px;
}
.k-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 28px; height: 28px;
  border-radius: 50%;
  background: white;
  border: 2.5px solid var(--q-purple);
  box-shadow: 0 3px 8px rgba(123,71,199,.3);
  cursor: pointer;
}
.k-slider::-moz-range-thumb {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: white;
  border: 2.5px solid var(--q-purple);
  cursor: pointer;
}
.k-ticks {
  display: flex; justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 10.5px; font-weight: 700;
  color: var(--ink-3);
}

/* ============= Solver / steps ============= */
.solver-card { padding: 22px; }
.solver-prompt {
  background: rgba(255,255,255,.7);
  padding: 18px;
  border-radius: 18px;
  text-align: center;
  margin-bottom: 16px;
}
.solver-prompt .katex { font-size: 1.6em !important; }
.solver-q { font-size: 16px; font-weight: 700; color: var(--ink); margin: 14px 0 8px; }

.choice-grid { display: grid; gap: 8px; }
.choice {
  background: rgba(255,255,255,.75);
  border: 1.5px solid rgba(255,255,255,.85);
  border-radius: var(--r-md);
  padding: 14px 16px;
  text-align: left;
  font-weight: 600;
  font-size: 14.5px;
  cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  transition: all .15s;
  min-height: 50px;
}
.choice:active { transform: scale(.98); }
.choice .letter {
  width: 28px; height: 28px; border-radius: 9px;
  background: var(--bg-lavender);
  color: var(--q-purple);
  display: grid; place-items: center;
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 13px;
  flex-shrink: 0;
}
.choice.correct {
  background: var(--good-soft); border-color: var(--good);
}
.choice.correct .letter { background: var(--good); color: white; }
.choice.wrong {
  background: var(--warn-soft); border-color: var(--warn);
}
.choice.wrong .letter { background: var(--warn); color: white; }
.choice .body .katex { font-size: 1.05em !important; }

/* Hint stack */
.hint-stack { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.hint-card {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 14px;
  background: rgba(255,225,200,.6);
  border: 1px solid rgba(255,180,120,.4);
  border-radius: 18px;
  animation: bubblePop .35s cubic-bezier(.34,1.56,.64,1);
}
.hint-card .h-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #B8761B;
  background: white;
  padding: 4px 8px;
  border-radius: 999px;
  flex-shrink: 0;
}
.hint-card p { font-size: 13.5px; color: var(--ink); font-weight: 500; }

/* Revealed step row */
.step-row {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 12px;
  padding: 12px 14px;
  background: rgba(255,255,255,.75);
  border: 1px solid rgba(255,255,255,.85);
  border-radius: 18px;
  margin-bottom: 8px;
  animation: stepIn .4s ease both;
}
@keyframes stepIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.step-row .num {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--bg-lavender);
  color: var(--q-purple);
  display: grid; place-items: center;
  font-weight: 800; font-size: 13px;
  font-family: var(--font-mono);
}
.step-row .why { font-size: 13px; color: var(--ink-2); margin-bottom: 6px; font-weight: 500; }
.step-row .math { background: rgba(232,220,251,.4); padding: 8px 12px; border-radius: 12px; text-align: center; }
.step-row .math .katex { font-size: 1.15em !important; }

/* ============= Diff feedback ============= */
.diff-card {
  margin-top: 14px;
  background: var(--warn-soft);
  border: 1.5px solid #F4C5D9;
  border-radius: var(--r-md);
  padding: 16px;
  animation: bubblePop .35s cubic-bezier(.34,1.56,.64,1);
}
.diff-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 10px 0 6px;
}
.diff-col h4 {
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  font-family: var(--font-mono);
  margin-bottom: 6px;
}
.diff-col.you h4   { color: #B85284; }
.diff-col.right h4 { color: var(--good); }
.diff-col .row {
  background: white;
  padding: 8px 10px;
  border-radius: 10px;
  font-family: var(--font-mono);
  font-size: 13px;
  margin-bottom: 4px;
}
.diff-col .row.hl { background: #FCD5E2; }
.diff-col.right .row.hl { background: var(--good-soft); }

/* ============= Mini-lesson "why" ============= */
.why-toggle {
  background: transparent; border: 0;
  color: var(--q-purple);
  font-family: var(--font-display);
  font-weight: 700; font-size: 14px;
  cursor: pointer;
  padding: 6px 0;
  display: flex; align-items: center; gap: 8px;
  text-align: left;
  width: 100%;
  flex-wrap: wrap;
  line-height: 1.4;
}
.why-toggle .katex { font-size: 1em !important; }
.why-panel {
  margin-top: 10px;
  padding: 16px;
  border-radius: var(--r-md);
  background: rgba(232,220,251,.55);
  border: 1px solid rgba(168,118,232,.3);
  animation: bubblePop .3s ease;
}
.why-panel h4 { font-size: 14px; margin-bottom: 8px; color: var(--q-purple); }
.why-panel .convince {
  display: grid; gap: 6px; margin-top: 12px;
}
.convince-btn {
  background: white;
  border: 1.5px dashed var(--q-purple-2);
  border-radius: 14px;
  padding: 12px 14px;
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  cursor: pointer;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  text-align: left;
}
.convince-btn:active { transform: scale(.98); }
.convince-btn .res {
  color: var(--q-magenta);
  font-weight: 800;
  animation: tokPulse .5s ease-out;
}

/* ============= Input + math pad ============= */
.q-input {
  width: 100%;
  font-family: var(--font-mono);
  font-size: 18px; font-weight: 700;
  padding: 14px 16px;
  border: 2px solid rgba(123,71,199,.25);
  border-radius: 16px;
  background: rgba(255,255,255,.8);
  outline: none;
  color: var(--ink);
}
.q-input:focus { border-color: var(--q-purple); }
.math-pad {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-top: 10px;
}
.pad-key {
  font-family: var(--font-mono);
  font-size: 15px; font-weight: 800;
  background: white;
  border: 1.5px solid rgba(123,71,199,.2);
  border-radius: 12px;
  min-width: 44px;
  min-height: 44px;
  padding: 0 10px;
  cursor: pointer;
  color: var(--ink);
}
.pad-key:active { transform: translateY(1px); background: var(--bg-lavender); }

/* ============= Read-aloud chip ============= */
.audio-chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 700;
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(255,255,255,.7);
  border: 1px solid rgba(255,255,255,.85);
  color: var(--ink-2);
  cursor: pointer;
}
.audio-chip:active { transform: scale(.96); }
.audio-chip.on { color: var(--q-purple); background: var(--bg-lavender); }

/* ============= Bottom nav ============= */
.sq-nav {
  position: sticky;
  bottom: 0;
  margin: 0 -18px;
  padding: 10px 16px 16px;
  display: flex; justify-content: space-around;
  background: linear-gradient(180deg, rgba(255,245,228,0) 0%, rgba(255,245,228,.95) 30%);
  z-index: 3;
}
.nav-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 14px;
  border-radius: 16px;
  background: transparent;
  border: 0;
  cursor: pointer;
  color: var(--ink-3);
  font-family: var(--font-display);
  font-weight: 700; font-size: 11px;

<script type="text/babel" data-presets="react">
/* ===== sq/ios-frame.jsx ===== */

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>

        <svg width="27" height="13" viewBox="0 0 27 13">

          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,

<script type="text/babel" data-presets="react">
/* ===== sq/quint.jsx ===== */
/* global React */
// =====================================================================
// Quint — the Math Quest mascot
// One SVG, four moods. Smooth purple→magenta gradient orb, thin antennae
// with yellow dots, soft blush, kawaii eyes. Idle bob + pulse on mood
// change. Reference: the user-provided expression sheet.
// =====================================================================

const QUINT_MOODS = {
  encouraging: { mouth: "smile", eyes: "calm", extras: [],         tilt: 0 },
  excited:     { mouth: "open",  eyes: "sparkle", extras: ["sparkles"], tilt: -2 },
  thinking:    { mouth: "smirk", eyes: "calm", extras: ["question"], tilt: 4 },
  celebrating: { mouth: "open",  eyes: "happy", extras: ["confetti", "arms"], tilt: 0 },
};

function Quint({ mood = "encouraging", size = 120, idle = true }) {
  const m = QUINT_MOODS[mood] || QUINT_MOODS.encouraging;
  // Pulse key so transitions retrigger when mood swaps
  const [pulseKey, setPulseKey] = React.useState(0);
  const prevMood = React.useRef(mood);
  React.useEffect(() => {
    if (prevMood.current !== mood) {
      setPulseKey(k => k + 1);
      prevMood.current = mood;
    }
  }, [mood]);

  return (
    <div className={`quint-wrap ${idle ? 'idle' : ''}`} style={{ width: size, height: size }}>
      <svg
        key={pulseKey}
        className="quint-svg"
        viewBox="0 0 200 200"
        width={size}
        height={size}
        style={{ transform: `rotate(${m.tilt}deg)` }}
      >
        <defs>
          {/* Body gradient — purple top → magenta bottom, matching reference */}
          <radialGradient id="quintBody" cx="40%" cy="35%" r="75%">
            <stop offset="0%"  stopColor="#A876E8" />
            <stop offset="55%" stopColor="#7B47C7" />
            <stop offset="100%" stopColor="#D44C97" />
          </radialGradient>
          <radialGradient id="quintShine" cx="30%" cy="22%" r="22%">
            <stop offset="0%" stopColor="rgba(255,255,255,.85)" />
            <stop offset="100%" stopColor="rgba(255,255,255,0)" />
          </radialGradient>
          <radialGradient id="quintShadow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stopColor="rgba(80,40,120,.25)" />
            <stop offset="100%" stopColor="rgba(80,40,120,0)" />
          </radialGradient>
        </defs>

        {/* Soft ground shadow */}
        <ellipse cx="100" cy="180" rx="48" ry="7" fill="url(#quintShadow)" />

        {/* Antennae */}
        <g stroke="#1B1233" strokeWidth="2.5" strokeLinecap="round" fill="none">
          <path d="M 82 38 Q 78 22 75 18" />
          <path d="M 118 38 Q 122 22 125 18" />
        </g>
        <circle cx="75" cy="18"  r="4.5" fill="#FFD93D" stroke="#1B1233" strokeWidth="1.5" />
        <circle cx="125" cy="18" r="4.5" fill="#FFD93D" stroke="#1B1233" strokeWidth="1.5" />

        {/* Body */}
        <circle cx="100" cy="105" r="60" fill="url(#quintBody)" stroke="#1B1233" strokeWidth="2.5" />
        {/* Shine */}
        <ellipse cx="80" cy="80" rx="22" ry="14" fill="url(#quintShine)" />

        {/* Blush */}
        <ellipse cx="70" cy="118"  rx="9" ry="5" fill="#FF8DC7" opacity=".55" />
        <ellipse cx="130" cy="118" rx="9" ry="5" fill="#FF8DC7" opacity=".55" />

        {/* Eyes */}
        <QuintEyes kind={m.eyes} />
        {/* Mouth */}
        <QuintMouth kind={m.mouth} />

        {/* Arms (celebrating) */}
        {m.extras.includes("arms") && (
          <g fill="#7B47C7" stroke="#1B1233" strokeWidth="2" strokeLinecap="round">
            <g className="quint-arm-l">
              <ellipse cx="42" cy="92" rx="9" ry="11" />
            </g>
            <g className="quint-arm-r">
              <ellipse cx="158" cy="92" rx="9" ry="11" />
            </g>
          </g>
        )}

        {/* Sparkles (excited) */}
        {m.extras.includes("sparkles") && (
          <g fill="#FFD93D" stroke="#1B1233" strokeWidth="1.2">
            <Sparkle x={155} y={55} size={6} delay="0s" />
            <Sparkle x={45} y={70} size={4} delay=".25s" />
            <Sparkle x={170} y={110} size={5} delay=".5s" />
            <Sparkle x={35} y={140} size={4} delay=".15s" />
          </g>
        )}

        {/* Question bubble (thinking) */}
        {m.extras.includes("question") && (
          <g className="quint-thought">
            <circle cx="160" cy="50" r="14" fill="white" stroke="#1B1233" strokeWidth="2" />
            <circle cx="148" cy="65" r="4" fill="white" stroke="#1B1233" strokeWidth="1.5" />
            <text x="160" y="56" textAnchor="middle" fontSize="18" fontWeight="800" fill="#7B47C7" fontFamily="ui-rounded, system-ui, sans-serif">?</text>
          </g>
        )}

        {/* Confetti (celebrating) */}
        {m.extras.includes("confetti") && (
          <g>
            <Confetti x={55}  y={35} color="#FFD93D" delay="0s" />
            <Confetti x={145} y={28} color="#FF8DC7" delay=".1s" />
            <Confetti x={170} y={60} color="#7BCFB0" delay=".2s" />
            <Confetti x={30}  y={55} color="#A876E8" delay=".3s" />
            <Confetti x={100} y={20} color="#FFA15C" delay=".15s" />
          </g>
        )}
      </svg>
    </div>
  );
}

// ── Eyes ───────────────────────────────────────────────────────────────────
function QuintEyes({ kind }) {
  if (kind === "sparkle") {
    return (
      <g>
        {[78, 122].map((cx, i) => (
          <g key={i}>
            <ellipse cx={cx} cy="100" rx="9" ry="11" fill="#1B1233" />
            <circle cx={cx - 2} cy="96" r="3" fill="white" />
            <circle cx={cx + 4} cy="103" r="1.5" fill="white" />
          </g>
        ))}
      </g>
    );
  }
  if (kind === "happy") {
    return (
      <g fill="none" stroke="#1B1233" strokeWidth="3" strokeLinecap="round">
        <path d="M 70 100 Q 78 92 86 100" />
        <path d="M 114 100 Q 122 92 130 100" />
      </g>
    );
  }
  // calm — small dot eyes
  return (
    <g fill="#1B1233">
      <circle cx="78" cy="100" r="4" />
      <circle cx="122" cy="100" r="4" />
    </g>
  );
}

// ── Mouth ──────────────────────────────────────────────────────────────────
function QuintMouth({ kind }) {
  if (kind === "open") {
    return (
      <path d="M 88 128 Q 100 142 112 128 Q 100 134 88 128 Z"
            fill="#5C2A6E" stroke="#1B1233" strokeWidth="2" strokeLinejoin="round" />
    );
  }
  if (kind === "smirk") {
    return (
      <path d="M 88 130 Q 96 134 104 130" fill="none"
            stroke="#1B1233" strokeWidth="2.5" strokeLinecap="round" />
    );
  }
  // smile
  return (
    <path d="M 86 128 Q 100 140 114 128" fill="none"
          stroke="#1B1233" strokeWidth="2.5" strokeLinecap="round" />
  );
}

// ── Bits ───────────────────────────────────────────────────────────────────
function Sparkle({ x, y, size, delay }) {
  const s = size;
  return (
    <g className="quint-sparkle" style={{ animationDelay: delay, transformOrigin: `${x}px ${y}px` }}>
      <path d={`M ${x} ${y - s} L ${x + s * .4} ${y - s * .4} L ${x + s} ${y} L ${x + s * .4} ${y + s * .4} L ${x} ${y + s} L ${x - s * .4} ${y + s * .4} L ${x - s} ${y} L ${x - s * .4} ${y - s * .4} Z`} />
    </g>
  );
}

function Confetti({ x, y, color, delay }) {
  return (
    <rect
      className="quint-confetti"
      x={x} y={y} width="6" height="9" rx="1.5"
      fill={color} stroke="#1B1233" strokeWidth="1"
      style={{ animationDelay: delay, transformOrigin: `${x + 3}px ${y + 4.5}px` }}
    />
  );
}

window.Quint = Quint;

</script>

<script type="text/babel" data-presets="react">
/* ===== sq/manipulative.jsx ===== */
/* global React, Quint, katex */
// =====================================================================
// SqrtManipulative — u² = k slider widget
// Parabola y = u² overlaid with horizontal line y = k.
// Intersections drop onto a real number line below.
// When k goes negative, solutions migrate to a tiny complex plane and
// Quint changes mood from encouraging → excited.
// =====================================================================

function SqrtManipulative() {
  const [k, setK] = React.useState(16);
  const lastSign = React.useRef(Math.sign(k));
  const [signFlash, setSignFlash] = React.useState(null); // 'imaginary' | 'real' | null

  React.useEffect(() => {
    const s = Math.sign(k);
    if (s !== lastSign.current && s !== 0) {
      setSignFlash(s < 0 ? 'imaginary' : 'real');
      const t = setTimeout(() => setSignFlash(null), 2200);
      lastSign.current = s;
      return () => clearTimeout(t);
    }
  }, [k]);

  const positive = k > 0;
  const zero = k === 0;
  const root = Math.sqrt(Math.abs(k));
  const rootStr = root.toFixed(root % 1 === 0 ? 0 : 2);

  const W = 320, H = 200;
  const cx = W / 2;
  const yScale = 6;         // px per unit on y
  const xScale = 18;        // px per unit on x
  const cy = 30;            // origin offset from top, so most of parabola visible
  // Parabola points y = u² — clip to within the canvas
  const parabolaPoints = [];
  for (let u = -5; u <= 5; u += 0.1) {
    const px = cx + u * xScale;
    const py = cy + u * u * yScale * 0.3;
    parabolaPoints.push(`${px},${py}`);
  }
  // k line y position (clamped)
  const kY = cy + k * yScale * 0.3;
  const kYClamped = Math.max(20, Math.min(H - 16, kY));
  const showKLine = kY >= 0 && kY <= H - 8;

  // Quint mood from k
  const mood = signFlash === 'imaginary' ? 'excited'
             : signFlash === 'real'      ? 'excited'
             : zero                       ? 'thinking'
             : 'encouraging';

  return (
    <div className="glass manip">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
        <div>
          <div className="eyebrow">Play with it</div>
          <h3 style={{ fontSize: 17 }}>Slide <TeX tex="k" inline /> — see what changes</h3>
        </div>
        <div style={{ transform: 'translateY(-4px)' }}>
          <Quint mood={mood} size={64} />
        </div>
      </div>

      {/* SVG canvas */}
      <div className="manip-canvas">
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="parabolaG" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stopColor="#7B47C7" />
              <stop offset="100%" stopColor="#D44C97" />
            </linearGradient>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="3" result="b" />
              <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
            </filter>
          </defs>

          {/* Grid */}
          <g stroke="rgba(123,71,199,.12)" strokeWidth="1">
            {[-3,-2,-1,1,2,3].map(i => (
              <line key={`vg${i}`} x1={cx + i * xScale} y1="10" x2={cx + i * xScale} y2={H - 10} />
            ))}
          </g>
          {/* Axes */}
          <line x1="14" y1={cy} x2={W - 14} y2={cy} stroke="rgba(60,40,90,.4)" strokeWidth="1.2" />
          <line x1={cx} y1="10"  x2={cx} y2={H - 10} stroke="rgba(60,40,90,.4)" strokeWidth="1.2" />

          {/* Parabola y = u² */}
          <polyline
            points={parabolaPoints.join(' ')}
            fill="none"
            stroke="url(#parabolaG)"
            strokeWidth="3"
            strokeLinecap="round"
            strokeLinejoin="round"
          />

          {/* y = k horizontal line */}
          {showKLine && (
            <g>
              <line
                x1="14" y1={kYClamped} x2={W - 14} y2={kYClamped}
                stroke={positive ? '#4DBE94' : '#E89BB8'}
                strokeWidth="2.5"
                strokeDasharray="6 5"
                opacity={positive ? 1 : 0.4}
              />
              <rect
                x={W - 70} y={kYClamped - 11}
                width="56" height="22" rx="11"
                fill={positive ? '#4DBE94' : '#E89BB8'}
              />
              <text x={W - 42} y={kYClamped + 4} textAnchor="middle"
                    fill="white" fontFamily="JetBrains Mono, monospace" fontSize="12" fontWeight="700">
                y = {k}
              </text>
            </g>
          )}

          {/* Intersection markers (real roots) */}
          {positive && (
            <g filter="url(#glow)">
              <circle cx={cx - root * xScale} cy={kYClamped} r="6" fill="#FFD93D" stroke="#1B1233" strokeWidth="2" />
              <circle cx={cx + root * xScale} cy={kYClamped} r="6" fill="#FFD93D" stroke="#1B1233" strokeWidth="2" />
            </g>
          )}
          {zero && (
            <circle cx={cx} cy={cy} r="6" fill="#FFD93D" stroke="#1B1233" strokeWidth="2" filter="url(#glow)" />
          )}

          {/* Origin label */}
          <text x={cx - 8} y={cy - 5} fontSize="10" fill="rgba(60,40,90,.5)" fontFamily="JetBrains Mono, monospace">0</text>
        </svg>
      </div>

      {/* Solution readout */}
      <div className="manip-readout">
        <div className="eq">
          {positive && <TeX tex={`u = \\pm\\sqrt{${k}} = \\pm ${rootStr}`} inline />}
          {zero     && <TeX tex="u = 0 \\;(\\text{double root})" inline />}
          {!positive && !zero && <TeX tex={`u = \\pm i\\sqrt{${-k}} = \\pm ${rootStr}i`} inline />}
        </div>
      </div>

      {/* Number line / complex plane */}
      <div style={{ marginTop: 10 }}>
        {positive && <RealLine root={root} />}
        {zero && <RealLine root={0} />}
        {!positive && !zero && <ComplexPlane root={root} />}
      </div>

      {/* Slider */}
      <input
        className="k-slider"
        type="range" min={-25} max={25} step={1}
        value={k}
        onChange={(e) => setK(Number(e.target.value))}
      />
      <div className="k-ticks">
        <span>−25</span><span>−10</span><span>0</span><span>10</span><span>25</span>
      </div>

      {/* Quint speech reaction */}
      {signFlash && (
        <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start', marginTop: 12 }}>
          <div style={{ transform: 'translateY(2px)' }}>
            <Quint mood="excited" size={50} idle={false} />
          </div>
          <div className="bubble">
            {signFlash === 'imaginary'
              ? "Ooh — things just got imaginary! The parabola and the line don't touch anymore, so we slide into the complex plane."
              : "Back to the real number line! Two friendly solutions, one positive, one negative."}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Real number line with the two roots dropping onto it ───────────────────
function RealLine({ root }) {
  const W = 300, H = 50;
  const cx = W / 2;
  const scale = 22;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H}>
      <line x1="10" y1="28" x2={W - 10} y2="28" stroke="var(--ink-3)" strokeWidth="1.5" />
      {[-4,-3,-2,-1,0,1,2,3,4].map(i => (
        <g key={i}>
          <line x1={cx + i * scale} y1="24" x2={cx + i * scale} y2="32" stroke="var(--ink-3)" strokeWidth="1" />
          <text x={cx + i * scale} y="44" textAnchor="middle" fontSize="9.5" fontFamily="JetBrains Mono, monospace" fill="var(--ink-3)">{i}</text>
        </g>
      ))}
      {root > 0 ? (
        <>
          <circle cx={cx - root * scale} cy="28" r="7" fill="#FFD93D" stroke="#1B1233" strokeWidth="2" />
          <circle cx={cx + root * scale} cy="28" r="7" fill="#FFD93D" stroke="#1B1233" strokeWidth="2" />
        </>
      ) : (
        <circle cx={cx} cy="28" r="7" fill="#FFD93D" stroke="#1B1233" strokeWidth="2" />
      )}
    </svg>
  );
}

// ── Complex plane: 2D, roots show as ±i√|k| on imaginary axis ──────────────
function ComplexPlane({ root }) {
  const W = 220, H = 110;
  const cx = W / 2, cy = H / 2;
  const scale = 14;
  return (
    <div style={{ display: 'flex', justifyContent: 'center' }}>
      <svg viewBox={`0 0 ${W} ${H}`} width={W} height={H}>
        <defs>
          <radialGradient id="cplx" cx="50%" cy="50%" r="60%">
            <stop offset="0%" stopColor="#E8DCFB" />
            <stop offset="100%" stopColor="rgba(232,220,251,0)" />
          </radialGradient>
        </defs>
        <rect x="0" y="0" width={W} height={H} fill="url(#cplx)" rx="12" />
        {/* Axes */}
        <line x1="10" y1={cy} x2={W - 10} y2={cy} stroke="var(--ink-3)" strokeWidth="1.2" />
        <line x1={cx} y1="6"  x2={cx} y2={H - 6}  stroke="var(--ink-3)" strokeWidth="1.2" />
        {/* Labels */}
        <text x={W - 12} y={cy - 4} fontSize="9" fill="var(--ink-3)" fontFamily="JetBrains Mono, monospace" textAnchor="end">Re</text>
        <text x={cx + 6} y="14" fontSize="9" fill="var(--ink-3)" fontFamily="JetBrains Mono, monospace">Im</text>
        {/* Roots on imaginary axis */}
        <circle cx={cx} cy={cy - root * scale} r="6.5" fill="#FFD93D" stroke="#1B1233" strokeWidth="2" />
        <circle cx={cx} cy={cy + root * scale} r="6.5" fill="#FFD93D" stroke="#1B1233" strokeWidth="2" />
        {/* Tiny arrows from origin */}
        <line x1={cx} y1={cy} x2={cx} y2={cy - root * scale + 5} stroke="var(--q-magenta)" strokeWidth="1.5" strokeDasharray="3 2" />
        <line x1={cx} y1={cy} x2={cx} y2={cy + root * scale - 5} stroke="var(--q-magenta)" strokeWidth="1.5" strokeDasharray="3 2" />
      </svg>
    </div>
  );
}

// ── tiny KaTeX helper ──────────────────────────────────────────────────────
function TeX({ tex, inline = false }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (ref.current && window.katex) {
      try {
        window.katex.render(tex, ref.current, { displayMode: !inline, throwOnError: false });
      } catch (e) { ref.current.textContent = tex; }
    }
  }, [tex, inline]);
  return <span ref={ref} />;
}

window.SqrtManipulative = SqrtManipulative;
window.SQMath = TeX;

</script>

<script type="text/babel" data-presets="react">
/* ===== sq/why.jsx ===== */
/* global React, Quint, SQMath */
// =====================================================================
// WhyDoesThisWork — 60-90s micro-lesson explaining WHY \sqrt{-k} = i\sqrt{k}.
// Three parts:
//   1. A short narrated animation (visual: -1 spinning to become i*i)
//   2. A worked numerical example
//   3. "Convince yourself" interactive — tap to compute i*i, 2i*3i, (8i)^2
//      and watch the result poof in.
// =====================================================================

const CONVINCE = [
  { a: "i \\times i", result: "-1",
    why: "i is defined as \\sqrt{-1}\\;, so squaring it gives back the −1." },
  { a: "2i \\times 3i", result: "-6",
    why: "(2 \\cdot 3)(i \\cdot i) = 6 \\cdot (-1) = -6\\;. The i's collapse to −1." },
  { a: "(8i)^2", result: "-64",
    why: "8^2 \\cdot i^2 = 64 \\cdot (-1) = -64\\;. So \\sqrt{-64} = 8i\\;." },
];

function WhyDoesThisWork() {
  const [open, setOpen] = React.useState(false);
  const [revealed, setRevealed] = React.useState([false, false, false]);

  const reveal = (i) => {
    setRevealed(prev => prev.map((v, j) => j === i ? true : v));
    try { window.playChime && window.playChime(true); } catch (e) {}
  };

  return (
    <div>
      <button className="why-toggle" onClick={() => setOpen(o => !o)}>
        <span style={{ fontSize: 12 }}>{open ? '▾' : '▸'}</span>
        <span>Why does this even work?</span>
      </button>

      {open && (
        <div className="why-panel">
          <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start', marginBottom: 10 }}>
            <div style={{ flexShrink: 0 }}><Quint mood="encouraging" size={50} /></div>
            <div className="bubble" style={{ background: 'white', maxWidth: '100%' }}>
              <strong>Quick story:</strong> The square root of a negative number doesn't fit on the number line — so mathematicians built a new place for it called the <em>imaginary axis</em>. We just call <SQMath tex="\sqrt{-1}" inline /> by the letter <SQMath tex="i" inline />.
            </div>
          </div>

          {/* Animated visual: −1 flipping into i*i */}
          <FlipScene />

          <h4 style={{ marginTop: 14 }}>Convince yourself — tap to compute</h4>
          <div className="convince">
            {CONVINCE.map((c, i) => (
              <ConvinceButton key={i} item={c} revealed={revealed[i]} onClick={() => reveal(i)} />
            ))}
          </div>

          {revealed.every(Boolean) && (
            <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start', marginTop: 14 }}>
              <Quint mood="excited" size={50} idle={false} />
              <div className="bubble" style={{ background: 'white' }}>
                See it? <SQMath tex="i" inline /> is the secret ingredient. Whenever you see <SQMath tex="\sqrt{\text{negative}}" inline />, pull the <SQMath tex="i" inline /> out front and the rest is just a regular square root.
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function ConvinceButton({ item, revealed, onClick }) {
  return (
    <button className="convince-btn" onClick={revealed ? null : onClick}>
      <span style={{ flex: 1 }}>
        <SQMath tex={item.a} inline /> <span style={{ color: 'var(--ink-3)' }}>=</span>{' '}
        {revealed ? (
          <>
            <span className="res"><SQMath tex={item.result} inline /></span>
            <div style={{ fontFamily: 'var(--font-body)', fontWeight: 500, fontSize: 12, color: 'var(--ink-2)', marginTop: 4 }}>
              <SQMath tex={`\\text{${item.why}}`} inline />
            </div>
          </>
        ) : <span style={{ color: 'var(--ink-3)' }}>?</span>}
      </span>
      {!revealed && <span style={{ fontSize: 18 }}>✨</span>}
    </button>
  );
}

// Small animated SVG: shows −1 floating, then i appearing twice and multiplying back to −1
function FlipScene() {
  const [t, setT] = React.useState(0);
  React.useEffect(() => {
    const id = setInterval(() => setT(x => (x + 1) % 3), 1800);
    return () => clearInterval(id);
  }, []);

  return (
    <div style={{
      background: 'white',
      borderRadius: 18,
      padding: '14px 12px',
      marginTop: 4,
      border: '1px solid rgba(168,118,232,.2)',
      textAlign: 'center',
    }}>
      <svg viewBox="0 0 280 80" width="100%" height="80">
        <defs>
          <linearGradient id="ig" x1="0" x2="1">
            <stop offset="0%" stopColor="#7B47C7" />
            <stop offset="100%" stopColor="#D44C97" />
          </linearGradient>
        </defs>
        {/* Frame 0: -1 */}

          <text x="110" y="50" textAnchor="middle" fontSize="36" fontWeight="800" fill="url(#ig)" fontStyle="italic" fontFamily="Quicksand, sans-serif">i</text>
          <text x="140" y="50" textAnchor="middle" fontSize="26" fontWeight="600" fill="var(--ink-2)" fontFamily="Quicksand, sans-serif">×</text>
          <text x="170" y="50" textAnchor="middle" fontSize="36" fontWeight="800" fill="url(#ig)" fontStyle="italic" fontFamily="Quicksand, sans-serif">i</text>

          <text x="124" y="38" textAnchor="middle" fontSize="20" fontWeight="800" fill="url(#ig)" fontFamily="Quicksand, sans-serif">2</text>
          <text x="150" y="50" textAnchor="middle" fontSize="26" fontWeight="600" fill="var(--ink-2)" fontFamily="Quicksand, sans-serif">=</text>

}
