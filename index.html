      options: ["Positive punishment", "Negative reinforcement", "Positive reinforcement", "Latent learning"], answer: 1,
      why: "The behaviour is strengthened by removal of an aversive state. Reinforcement always strengthens; the negative/positive distinction is only whether something is taken away or added." },
    { tid: "psych-12", stem: "Chunking the digit string 1-9-4-5-2-0-0-1 into the years 1945 and 2001 aids recall because chunking:",
      options: ["Bypasses the need for attention entirely", "Transfers the items straight to procedural memory", "Repackages items into fewer units within capacity", "Doubles the duration of the sensory register"], answer: 2,
      why: "Working memory holds roughly 7 ± 2 units regardless of unit size; recoding digits into meaningful chunks spends that limited capacity more efficiently." },
    { tid: "psych-12", stem: "Deciding whether words fit meaningfully into sentences produces better recall than judging their font. This advantage for semantic processing illustrates:",
      options: ["The serial position effect operating at work", "State-dependent learning of the studied words", "Iconic memory persistence across the delay", "Levels of processing: deeper encoding, stronger traces"], answer: 3,
      why: "Craik and Lockhart's principle: memory strength tracks depth of processing at encoding — meaning beats appearance — independent of intent to memorize." },
    { tid: "psych-13", stem: "After moving, you keep typing your old address. Interference of this kind — old learning disrupting new — is called:",
      options: ["Proactive interference", "Retroactive interference", "Repression", "Decay"], answer: 0,
      why: "Proactive interference runs old-onto-new; retroactive runs new-onto-old (the new address making the old one hard to recall). Both implicate competition, not erasure." },
    { tid: "psych-15", stem: "Told that a quiet, detail-oriented person is more likely to be a librarian than a farmer — despite farmers vastly outnumbering librarians — a judge is relying on:",
      options: ["The availability heuristic driven by vivid recall", "The representativeness heuristic, ignoring base rates", "Anchoring on the personality description given", "Framing effects in how the question was posed"], answer: 1,
      why: "Judging category membership by resemblance to a stereotype while ignoring how common each category is defines representativeness with base-rate neglect." },
    { tid: "psych-15", stem: "Negotiators exposed to an arbitrary opening figure settle nearer to it, whatever its merit. This bias is:",
      options: ["Hindsight bias about the settlement", "The sunk-cost fallacy in negotiation", "Anchoring with insufficient adjustment", "Belief perseverance despite evidence"], answer: 2,
      why: "Initial numbers anchor subsequent estimates; adjustments away from the anchor are typically too small even when the anchor is known to be arbitrary." },
    { tid: "psych-20", stem: "Lazarus's transactional model holds that a situation produces stress only after:",
      options: ["Cortisol is secreted by the adrenal cortex", "Heart rate exceeds a fixed physiological threshold", "The alarm stage of the general adaptation syndrome ends", "It is appraised as a threat exceeding one's resources"], answer: 3,
      why: "Primary appraisal asks 'is this a threat?' and secondary appraisal 'can I cope?'; stress arises from the appraisals, which is why the same exam panics one student and energizes another." },
    { tid: "psych-20", stem: "Reframing a layoff as a chance to change careers is which coping style?",
      options: ["Emotion-focused coping by cognitive reappraisal", "Problem-focused coping applied to the stressor", "Avoidant coping through deliberate distraction", "Learned helplessness following repeated failure"], answer: 0,
      why: "Reappraisal changes the emotional meaning of the stressor rather than the stressor itself; problem-focused coping would be updating the résumé and applying." },
    { tid: "psych-24", stem: "Bandura's reciprocal determinism describes personality as the ongoing interaction of:",
      options: ["The id, the ego and the superego in conflict", "Personal factors, behaviour and environment", "Genotype and phenotype interacting alone", "Stable traits and bodily humours"], answer: 1,
      why: "In social-cognitive theory, beliefs (like self-efficacy), actions, and situations each shape the others continuously — against both pure trait and pure situational accounts." },
    { tid: "psych-24", stem: "Across adulthood, scores on which Big Five trait most consistently predict job performance across occupations?",
      options: ["Extraversion", "Openness to experience", "Conscientiousness", "Agreeableness"], answer: 2,
      why: "Meta-analyses find conscientiousness the most general predictor of performance and academic achievement; other traits matter more narrowly (extraversion for sales, openness for training)." },
    { tid: "psych-25", stem: "For two weeks a patient shows depressed mood, anhedonia, insomnia, poor concentration and feelings of worthlessness. This picture is most consistent with:",
      options: ["Generalized anxiety disorder", "Bipolar I disorder", "Schizophrenia", "Major depressive disorder"], answer: 3,
      why: "Two or more weeks of depressed mood or anhedonia plus several vegetative and cognitive symptoms meets the major depression pattern; mania, chronic worry, or psychosis would point elsewhere." },
    { tid: "psych-27", stem: "An infant delights in a peek-a-boo cloth being lifted from a toy she reaches for. By managing to search for the hidden toy at all, she demonstrates:",
      options: ["Object permanence", "Conservation of number", "Egocentrism", "Formal operations"], answer: 0,
      why: "Searching for an out-of-sight object shows she represents it as continuing to exist — the sensorimotor stage's landmark achievement, emerging around 8 months." },
    { tid: "psych-27", stem: "Vygotsky's zone of proximal development is the gap between what a child can do:",
      options: ["Working quickly versus working slowly", "Alone versus with a skilled partner's scaffolding", "Performing at home versus performing at school", "Abilities before versus after puberty"], answer: 1,
      why: "Vygotsky located learning socially: instruction works best pitched just beyond solo ability, where guidance (scaffolding) lets the child succeed and then internalize the skill." },
    { tid: "psych-29", stem: "In the strange situation procedure, a securely attached toddler typically:",
      options: ["Ignores the mother's departure and return alike", "Clings and cannot be soothed even before separation", "Protests separation and is comforted quickly at reunion", "Avoids the stranger and the mother equally"], answer: 2,
      why: "Security shows at reunion: the child seeks the caregiver and settles. Avoidant children ignore the return; resistant children seek contact yet cannot be soothed." },
    { tid: "psych-31", stem: "Students attribute their exam successes to ability and their failures to unfair questions. This pattern is:",
      options: ["The fundamental attribution error", "The actor–observer effect applied to others", "Deindividuation", "The self-serving bias"], answer: 3,
      why: "Crediting the self for success and the situation for failure protects self-esteem; the fundamental attribution error concerns judging other people's behaviour." },
    { tid: "psych-32", stem: "In Milgram's obedience studies, the proportion of participants delivering the maximum shock dropped most sharply when:",
      options: ["Commands came remotely while the learner sat close by", "Payment for participation was increased substantially", "Participants were drawn from older age groups", "The laboratory moved to a more prestigious building"], answer: 0,
      why: "Obedience tracked the authority's closeness and the victim's distance: an absent experimenter and a visible victim cut compliance dramatically, while prestige of setting mattered less." },
    { tid: "psych-33", stem: "A commuter collapses on a crowded platform and no one helps for minutes. Bystander intervention research attributes this chiefly to:",
      options: ["Crowds selecting for unusually callous individuals", "Diffusion of responsibility among the many witnesses", "Fear of infection from the collapsed stranger", "Reciprocal altruism favouring known partners"], answer: 1,
      why: "With many witnesses, responsibility feels divided and inaction becomes the norm others confirm — helping is more likely from a lone bystander than from a crowd." },
    { tid: "psych-35", stem: "Reminded of a negative stereotype about their group just before a test, capable students underperform. This effect is called:",
      options: ["The halo effect", "Groupthink", "Stereotype threat", "Social loafing"], answer: 2,
      why: "Anxiety about confirming a stereotype consumes working memory and depresses performance — an effect on the stereotyped, distinct from prejudice in the perceiver." }
  ],
  anatphys: [
    { tid: "anatphys-1", stem: "Tetrodotoxin selectively blocks voltage-gated Na⁺ channels. In a treated axon, the most direct consequence is:",
      options: ["Failure to reach threshold or propagate", "Prolonged depolarization from delayed repolarization", "Continuous neurotransmitter release at the terminal", "Immediate loss of the resting membrane potential"], answer: 0,
      why: "The rising phase of the action potential requires Na⁺ influx. Blocking those channels prevents depolarization and propagation; the resting potential, set largely by K⁺ leak and the Na⁺/K⁺ ATPase, persists." },
    { tid: "anatphys-10", stem: "During isovolumetric ventricular contraction, which valves are closed?",
      options: ["Only the atrioventricular valves", "Only the aortic and pulmonary valves", "Both the AV and the semilunar valves", "Neither the AV nor the semilunar valves"], answer: 2,
      why: "All four valves are shut, so ventricular volume is constant while pressure rises. The semilunar valves open only once ventricular pressure exceeds aortic/pulmonary pressure." },
    { tid: "anatphys-24", stem: "Increased secretion of antidiuretic hormone raises urine osmolarity primarily by:",
      options: ["Inhibiting the Na⁺/K⁺/2Cl⁻ cotransporter", "Dilating the afferent arteriole to raise GFR", "Increasing Na⁺ reabsorption in the distal tubule", "Inserting aquaporin-2 into the collecting duct"], answer: 3,
      why: "ADH acts on V2 receptors to traffic aquaporin-2 to the collecting duct apical membrane, permitting water reabsorption down the medullary osmotic gradient. Aldosterone drives distal Na⁺ reabsorption; loop diuretics block NKCC2." },
    { tid: "anatphys-13", stem: "Which change shifts the oxygen–hemoglobin dissociation curve to the right?",
      options: ["Increased 2,3-bisphosphoglycerate", "Hypothermia", "Replacement of adult hemoglobin with fetal hemoglobin", "Respiratory alkalosis"], answer: 0,
      why: "2,3-BPG stabilizes the T (deoxy) state, lowering O₂ affinity and promoting unloading in tissue. Alkalosis, cold, and HbF all increase affinity (left shift)." },
    { tid: "anatphys-8", stem: "A patient takes high-dose exogenous glucocorticoids for several weeks. Expected laboratory findings include:",
      options: ["Unchanged ACTH with adrenal hypertrophy", "Elevated ACTH and elevated CRH", "Elevated ACTH with low cortisol", "Suppressed ACTH and adrenal cortical atrophy"], answer: 3,
      why: "Exogenous glucocorticoid feeds back negatively on the hypothalamus and anterior pituitary, suppressing CRH and ACTH; without ACTH trophic support the adrenal cortex atrophies." },
    { tid: "anatphys-25", stem: "In the cross-bridge cycle, binding of a new ATP molecule to myosin causes:",
      options: ["Troponin to shift tropomyosin off the actin binding site", "Detachment of the myosin head from actin", "The power stroke", "Ca²⁺ release from the sarcoplasmic reticulum"], answer: 1,
      why: "ATP binding releases myosin from actin; its hydrolysis then re-cocks the head. Pi release drives the power stroke, and Ca²⁺ binding to troponin — not ATP — exposes the binding sites." },
    { tid: "anatphys-17", stem: "Which cell type presents exogenous antigen on MHC class II to activate a naïve CD4⁺ T cell?",
      options: ["Dendritic cell", "Erythrocyte", "Cytotoxic CD8⁺ T cell", "Platelet"], answer: 0,
      why: "Professional antigen-presenting cells — dendritic cells, macrophages, and B cells — express MHC II. All nucleated cells present endogenous peptide on MHC I; erythrocytes lack MHC entirely." },
    { tid: "anatphys-20", stem: "Acidic chyme entering the duodenum triggers S cells to release secretin, which primarily stimulates:",
      options: ["Pancreatic bicarbonate secretion", "Pepsinogen release from chief cells", "Gastric parietal cell acid secretion", "Gallbladder contraction and bile release"], answer: 0,
      why: "Secretin drives pancreatic ductal HCO₃⁻ secretion to neutralize duodenal acid and inhibits gastric acid secretion. CCK, not secretin, is the main stimulus for gallbladder contraction." },
    { tid: "anatphys-4", stem: "Which response is mediated by sympathetic activation?",
      options: ["Increased salivary secretion", "Bronchiolar dilation", "Pupillary constriction", "Increased gastric motility"], answer: 1,
      why: "β2 receptors relax bronchiolar smooth muscle. The other three are parasympathetic effects mediated largely by muscarinic receptors." },
    { tid: "anatphys-30", stem: "The mid-cycle luteinizing hormone surge is most directly responsible for:",
      options: ["Endometrial proliferation", "Maintenance of pregnancy after implantation", "Ovulation and formation of the corpus luteum", "Follicular recruitment at the start of the cycle"], answer: 2,
      why: "Rising estradiol switches to positive feedback, producing the LH surge that ruptures the dominant follicle and converts the remnant into the corpus luteum. FSH recruits follicles; hCG maintains early pregnancy." },
    { passage: "p5", tid: "anatphys-11", stem: "The tachycardia and cool, pale skin recorded on arrival are most directly produced by:",
      options: ["Parasympathetic activation of the sinoatrial node", "Baroreceptor unloading raising sympathetic outflow", "Histamine release from degranulating mast cells", "Direct traumatic injury to the myocardium"], answer: 1,
      why: "Falling arterial pressure reduces baroreceptor firing from the carotid sinus and aortic arch; the brainstem answers with sympathetic tone — faster heart rate, stronger contraction, and constriction of skin and splanchnic vessels that preserves pressure and produces pallor.",
      whys: ["Vagal activity slows the heart — the opposite of what is seen", "Less stretch on baroreceptors means less inhibition of sympathetic drive", "No allergic trigger is present, and histamine dilates vessels", "Nothing suggests cardiac trauma; the pattern is systemic compensation"] },
    { passage: "p5", tid: "anatphys-24", stem: "The near-absent urine output at one hour chiefly reflects:",
      options: ["Aldosterone and ADH driving salt and water retention", "Bilateral obstruction of both ureters by clot", "Osmotic diuresis caused by stress hyperglycemia", "Washout of the renal medullary solute gradient"], answer: 0,
      why: "Hypovolemia triggers ADH release and, through renin–angiotensin, aldosterone secretion; together they maximize water and sodium reclamation, concentrating what little filtrate becomes urine.",
      whys: ["Both hormone systems are volume-conserving — oliguria is their intended effect", "Obstruction is anatomical and unrelated to hemorrhage", "Osmotic diuresis would raise urine output, not abolish it", "Washout impairs concentration; the kidney here is concentrating maximally"] },
    { passage: "p5", tid: "anatphys-22", stem: "Despite the falling blood pressure, glomerular filtration is initially defended because angiotensin II:",
      options: ["Dilates the afferent arteriole", "Increases the permeability of the filtration barrier", "Preferentially constricts the efferent arteriole", "Stimulates erythropoietin release"], answer: 2,
      why: "Efferent constriction raises upstream glomerular capillary pressure, holding GFR up even as renal plasma flow falls — the reason ACE inhibitors can drop GFR in volume-depleted patients." },
    { passage: "p5", tid: "anatphys-9", stem: "Which additional hormonal change is expected in this patient during the first hour?",
      options: ["Cortisol secretion suppressed by the hemorrhage", "Elevated insulin producing frank hypoglycemia", "Increased atrial natriuretic peptide release", "Elevated epinephrine and cortisol mobilizing glucose"], answer: 3,
      why: "Hemorrhage is a textbook stressor: adrenal medullary epinephrine and HPA-axis cortisol rise, driving glycogenolysis and gluconeogenesis; ANP falls with reduced atrial stretch, and insulin is suppressed rather than raised." },
    { tid: "anatphys-0", stem: "The resting membrane potential of a neuron (about −70 mV) is set chiefly by:",
      options: ["The membrane's high resting permeability to K⁺", "Voltage-gated Na⁺ channels standing open", "Active chloride pumping", "The negative charge of DNA in the nucleus"], answer: 0,
      why: "Leak channels make the resting membrane far more permeable to K⁺ than Na⁺, so the potential sits near the K⁺ equilibrium potential; the Na⁺/K⁺ pump maintains the gradients but contributes only a few millivolts directly." },
    { tid: "anatphys-0", stem: "Raising extracellular K⁺ concentration (hyperkalemia) shifts a neuron's resting potential:",
      options: ["Toward substantially more negative values", "Toward depolarization, closer to threshold", "Nowhere — the potential is unaffected", "To exactly 0 mV immediately"], answer: 1,
      why: "A smaller K⁺ gradient makes the K⁺ equilibrium potential less negative, depolarizing the cell — the basis of hyperkalemia's dangerous effects on cardiac excitability." },
    { tid: "anatphys-1", stem: "Action potentials travel faster along myelinated axons because myelin:",
      options: ["Widens the effective diameter of the axon", "Increases sodium channel density along the whole axon", "Makes current jump node to node (saltatory conduction)", "Warms the axoplasm and speeds diffusion"], answer: 2,
      why: "Myelin insulates internodal membrane, so depolarization regenerates only at the nodes, where Na⁺ channels cluster; the impulse effectively leaps node to node." },
    { tid: "anatphys-1", stem: "During the absolute refractory period, a second action potential cannot be fired because:",
      options: ["The membrane is at its resting potential", "The Na⁺/K⁺ pump is saturated", "All neurotransmitter is depleted", "Voltage-gated Na⁺ channels are inactivated"], answer: 3,
      why: "The inactivation gates of Na⁺ channels remain closed until the membrane repolarizes; no stimulus, however strong, can open them — which also enforces one-way propagation." },
    { tid: "anatphys-2", stem: "At a chemical synapse, neurotransmitter release is triggered most directly by:",
      options: ["Ca²⁺ influx through voltage-gated terminal channels", "K⁺ efflux hyperpolarizing the terminal", "Transmitter binding to presynaptic autoreceptors", "Sudden depletion of terminal ATP"], answer: 0,
      why: "Terminal depolarization opens voltage-gated Ca²⁺ channels; the Ca²⁺ influx drives SNARE-mediated fusion of transmitter vesicles with the presynaptic membrane." },
    { tid: "anatphys-2", stem: "Acetylcholine's action at the neuromuscular junction is terminated primarily by:",
      options: ["Slow diffusion of intact ACh into the bloodstream", "Hydrolysis by acetylcholinesterase in the cleft", "Reuptake of the intact molecule into the neuron", "Endocytosis of ACh by the muscle fibre"], answer: 1,
      why: "Acetylcholinesterase hydrolyzes ACh within milliseconds — why its inhibitors (nerve agents, some insecticides) cause sustained depolarization and paralysis." },
    { tid: "anatphys-4", stem: "A patient's heart rate falls when the vagus nerve is stimulated. The receptor mediating this response on cardiac pacemaker cells is:",
      options: ["A ganglionic nicotinic acetylcholine receptor", "A β1 adrenergic receptor of the node", "A muscarinic (M2) acetylcholine receptor", "An α1 adrenergic receptor on the node"], answer: 2,
      why: "Parasympathetic postganglionic fibres release ACh onto muscarinic M2 receptors at the SA node, slowing diastolic depolarization; nicotinic receptors act in ganglia and at skeletal muscle." },
    { tid: "anatphys-8", stem: "In primary hypothyroidism (a failing thyroid gland), the expected hormone pattern is:",
      options: ["Low TSH, high T4", "High TSH, high T4", "Low TSH, low T4", "High TSH, low T4"], answer: 3,
      why: "Low thyroid output removes negative feedback on the pituitary, so TSH climbs while T4 stays low — the same axis logic as the glucocorticoid case, applied in reverse." },
    { tid: "anatphys-9", stem: "Falling plasma calcium is corrected mainly by parathyroid hormone, which acts to:",
      options: ["Resorb bone, reclaim renal calcium, activate vitamin D", "Deposit the circulating calcium into the bone matrix", "Increase calcium excretion by the distal kidney", "Inhibit all calcium absorption in the intestine"], answer: 0,
      why: "PTH liberates calcium from bone, reclaims it in the distal nephron, and drives 1α-hydroxylation of vitamin D for intestinal absorption; calcitonin opposes it weakly." },
    { tid: "anatphys-10", stem: "The correct path of an electrical impulse through the cardiac conduction system is:",
      options: ["AV node → SA node → Purkinje fibres → bundle of His", "SA node → AV node → bundle of His → Purkinje fibres", "Purkinje fibres → bundle branches → AV node → atria", "SA node → Purkinje fibres → AV node → ventricles"], answer: 1,
      why: "The sinoatrial pacemaker fires first; the AV node delays the impulse so atria finish contracting, then the His–Purkinje system sweeps excitation through the ventricles from apex upward." },
    { tid: "anatphys-10", stem: "The 'lub' (S1) heart sound marks:",
      options: ["Opening of the aortic valve during ejection", "Contraction of the atria against full ventricles", "Closure of the mitral and tricuspid valves", "Closure of the aortic and pulmonary valves"], answer: 2,
      why: "Rising ventricular pressure snaps the AV valves shut at systole's onset (S1); S2 is the semilunar valves closing when ejection ends. Valve openings are normally silent." },
    { tid: "anatphys-12", stem: "The common final step of the clotting cascade, shared by intrinsic and extrinsic pathways, is:",
      options: ["Adhesion of platelets to exposed collagen", "Reflexive vasoconstriction of the injured vessel", "Release of tissue factor from the endothelium", "Thrombin converting fibrinogen into fibrin"], answer: 3,
      why: "Both pathways converge on factor X, generating thrombin, which cleaves soluble fibrinogen into fibrin monomers that polymerize and are cross-linked (factor XIII) into the stable clot." },
    { tid: "anatphys-13", stem: "Most carbon dioxide is carried from tissues to lungs:",
      options: ["As plasma bicarbonate, via carbonic anhydrase", "Dissolved unchanged in the plasma water", "Bound to the oxygen-binding sites of hemoglobin", "As carbonic acid carried inside platelets"], answer: 0,
      why: "About 70% travels as HCO₃⁻ (red-cell carbonic anhydrase, chloride shift), ~20% as carbamino-Hb bound to globin amino groups — not the O₂ sites — and ~10% dissolved." },
    { tid: "anatphys-13", stem: "Carbon monoxide poisoning starves tissues of oxygen primarily because CO:",
      options: ["Paralyzes the diaphragm's motor endplates directly", "Outcompetes O₂ for heme and left-shifts the curve", "Destroys circulating red blood cells by lysis", "Physically obstructs airflow in the upper airway"], answer: 1,
      why: "CO outcompetes O₂ for heme and makes the remaining sites hold O₂ tighter, so both loading and unloading fail — while PaO₂ and respiratory drive stay deceptively normal." },
    { tid: "anatphys-14", stem: "The volume of air remaining in the lungs after a maximal exhalation is the:",
      options: ["Tidal volume", "Vital capacity", "Residual volume", "Inspiratory reserve"], answer: 2,
      why: "Residual volume cannot be exhaled — it keeps alveoli from collapsing — and because it never leaves, it cannot be measured by simple spirometry." },
    { tid: "anatphys-15", stem: "Under normal conditions, the strongest minute-to-minute drive to breathe is:",
      options: ["Arterial O₂ tension sensed in the aortic arch", "Beat-to-beat pressure at the carotid sinus", "Stretch receptors in the airway walls", "Rising CO₂, read as pH by central chemoreceptors"], answer: 3,
      why: "Central chemoreceptors in the medulla respond to CSF acidification as CO₂ diffuses across; hypoxic drive through peripheral chemoreceptors takes over only when PaO₂ falls quite low." },
    { tid: "anatphys-16", stem: "Hours after a splinter wound, the site is red, warm and swollen. The redness and heat result mainly from:",
      options: ["Histamine-driven dilation raising local blood flow", "Fibrin deposition within the wound", "Loss of sympathetic tone throughout the whole limb", "Antibody secretion by resident plasma cells"], answer: 0,
      why: "Mast-cell histamine and other mediators dilate local arterioles and open capillary beds (rubor, calor) and increase permeability (tumor — the swelling); antibodies belong to the slower adaptive response." },
    { tid: "anatphys-17", stem: "Vaccination protects against later infection chiefly by generating:",
      options: ["A permanently elevated neutrophil count", "Long-lived memory B and T lymphocytes", "Thicker mucosal barriers", "Constitutive interferon secretion"], answer: 1,
      why: "Primary exposure leaves clonally expanded memory cells that mount a faster, stronger, class-switched secondary response — the cellular basis of immunological memory." },
    { tid: "anatphys-19", stem: "Coordinated waves of contraction that propel a food bolus along the esophagus are called:",
      options: ["Segmentation", "Mass movements", "Peristalsis", "Emesis"], answer: 2,
      why: "Peristalsis is sequential circular-muscle contraction behind the bolus with relaxation ahead of it; segmentation is the intestine's mixing (not propulsive) pattern." },
    { tid: "anatphys-20", stem: "Fat digestion depends on bile salts primarily because they:",
      options: ["Hydrolyze the ester bonds of triglycerides directly", "Neutralize the acidic chyme arriving from the stomach", "Convert inactive pepsinogen into active pepsin", "Emulsify fat into droplets, multiplying lipase's surface"], answer: 3,
      why: "Bile salts are detergents, not enzymes: by dispersing fat into micelle-sized droplets they give pancreatic lipase the surface area it needs, and later ferry products to the brush border." },
    { tid: "anatphys-21", stem: "After absorption, most nutrients reach the liver before the general circulation via the:",
      options: ["Hepatic portal vein", "Hepatic artery", "Thoracic duct", "Inferior vena cava"], answer: 0,
      why: "The portal vein drains the intestinal capillary beds directly into hepatic sinusoids for first-pass processing; dietary fat is the exception, entering lymph as chylomicrons via the thoracic duct." },
    { tid: "anatphys-23", stem: "The loop of Henle's countercurrent multiplier makes the medullary interstitium hypertonic because the ascending limb:",
      options: ["Is freely permeable to water along its length", "Pumps out NaCl while staying watertight", "Secretes urea into the tubular fluid", "Reabsorbs the filtered glucose load"], answer: 1,
      why: "Active salt extrusion from the water-tight ascending limb concentrates the interstitium; the water-permeable descending limb then equilibrates, multiplying the gradient that ADH later exploits." },
    { tid: "anatphys-25", stem: "The functional overlap of thick and thin filaments explains why a skeletal muscle stretched far beyond its resting length generates:",
      options: ["Maximal active tension at that length", "Tetanic contraction at lower stimulation rates", "Less tension, since fewer cross-bridges can form", "The same tension as at its resting length"], answer: 2,
      why: "The length–tension relationship: overstretching pulls actin away from myosin heads, reducing possible cross-bridges; resting length sits near the optimal overlap." },
    { tid: "anatphys-25", stem: "A single motor neuron and every muscle fibre it innervates is termed:",
      options: ["A sarcomere", "A myofibril", "A fascicle", "A motor unit"], answer: 3,
      why: "The motor unit is the nervous system's quantum of force: fine-control muscles have few fibres per unit, postural muscles thousands, and force is graded by recruiting units." },
    { tid: "anatphys-26", stem: "Unlike skeletal muscle, cardiac muscle cannot be tetanized because its:",
      options: ["A plateau keeps it refractory nearly the whole twitch", "Its fibres lack voltage-gated calcium channels entirely", "Its contractions proceed without consuming any ATP", "Its fibres are never electrically coupled to neighbours"], answer: 0,
      why: "The L-type Ca²⁺ plateau stretches the cardiac action potential to ~250 ms, so the muscle cannot be re-excited until relaxation is underway — protecting the pump from fused, filling-less contraction." },
    { tid: "anatphys-28", stem: "On a hot day, the body's principal mechanism for shedding heat once air temperature approaches body temperature is:",
      options: ["Radiation to the surroundings", "Evaporation of sweat", "Shivering thermogenesis", "Cutaneous vasoconstriction"], answer: 1,
      why: "Radiation and convection fail as the thermal gradient vanishes; evaporative cooling still extracts ~0.58 kcal per gram of sweat vaporized, which is why humidity makes heat dangerous." },
    { tid: "anatphys-30", stem: "In the first half of the menstrual cycle, the dominant follicle's rising estradiol causes the endometrium to:",
      options: ["Shed its functional layer", "Become secretory under progesterone", "Proliferate and thicken", "Atrophy"], answer: 2,
      why: "Estrogen drives the proliferative phase; only after ovulation does the corpus luteum's progesterone convert the endometrium to its secretory, implantation-ready state." },
    { tid: "anatphys-31", stem: "In the fetal circulation, most oxygenated blood bypasses the lungs through the:",
      options: ["The coronary sinus and cardiac veins", "The pulmonary veins and left atrium", "The hepatic portal vein and liver", "The foramen ovale and ductus arteriosus"], answer: 3,
      why: "With fluid-filled lungs offering high resistance, blood shunts right atrium → left atrium (foramen ovale) and pulmonary artery → aorta (ductus arteriosus); both normally close after the first breaths." }
  ],
  cars: [
    { passage: "p1", tid: "cars-0", stem: "The central thesis of the passage is that:",
      options: ["Reversible materials should be required in all conservation work henceforth", "Cleaning artworks damages them far more often than conservators admit", "Museums today should intervene much more aggressively than they currently do", "Every preservation decision embodies an unstated view of what the object is for"], answer: 3,
      why: "The final paragraph states it directly: every act of preservation contains a theory of what the object is for. The author's complaint is that this prior question goes unasked, not that cleaning is destructive." },
    { passage: "p1", tid: "cars-6", stem: "The author's attitude toward the ethic of reversibility is best described as:",
      options: ["Fully persuaded by its explicit claim to neutrality", "Indifferent to it, since it rarely affects practice", "Sympathetic to its modesty, critical of its deferral", "Dismissive of it as mere professional self-flattery"], answer: 2,
      why: "'Reads as modesty, and largely it is' concedes the virtue; 'postponement is not neutral' registers the criticism. Neither dismissal nor full endorsement fits." },
    { passage: "p1", tid: "cars-5", stem: "The phrase 'chosen the side that requires no defense' most nearly implies that:",
      options: ["Darkened canvases are more valuable to scholars than cleaned ones", "Museums today lack the technical expertise to justify cleaning", "Non-intervention is treated as a default and escapes scrutiny", "Conservators disagree widely about which solvents are reversible"], answer: 2,
      why: "The author argues inaction is itself an interpretive choice, but one that is not perceived as needing justification — its cost is invisibility, not incompetence." },
    { passage: "p1", tid: "cars-3", stem: "The clause 'Pigments have shifted; the ground has darkened' functions primarily to:",
      options: ["Contrast oil painting with fresco technique", "Support the claim that the original is unrecoverable", "Illustrate the technical difficulty of cleaning", "Concede a point the author later refutes"], answer: 1,
      why: "The list of irreversible physical changes grounds the assertion two sentences later that 'conservation cannot be a return.'" },
    { passage: "p1", tid: "cars-8", stem: "Suppose a survey found that most conservators believe cleaning restores an artist's original intent. This finding would most likely be used by the author to:",
      options: ["Revise the claim that conservation cannot be a return", "Show that reversibility has been abandoned in practice", "Demonstrate that the technical literature is more rigorous than claimed", "Argue that the profession holds a theory of the object without examining it"], answer: 3,
      why: "A widely held but unexamined belief is exactly what the author's closing sentence predicts: the field acts on an answer to a question it is reluctant to ask." },
    { passage: "p2", tid: "cars-0", stem: "The passage is primarily concerned with arguing that:",
      options: ["The reliability of written records must itself be argued", "Memory decays too quickly to serve historical research", "Oral testimony is a more reliable source than documents", "Tax rolls are the least trustworthy administrative record"], answer: 0,
      why: "The final sentence names the thesis: the reliability of paper is 'a claim to be argued rather than a premise.' The author explicitly denies the stronger claim in option A." },
    { passage: "p2", tid: "cars-1", stem: "In context, 'Its stillness is not accuracy but finality' means that documents:",
      options: ["Are produced more slowly than oral accounts", "Cannot be reinterpreted by later historians", "Grow more accurate as they age in archives", "Preserve their errors rather than avoid them"], answer: 3,
      why: "Stillness is reframed: the record does not improve or self-correct, so a mistake made at the moment of writing is fixed permanently — 'the error, once made, stops moving.'" },
    { passage: "p2", tid: "cars-4", stem: "The author concedes which point to the traditional view?",
      options: ["That administrative categories are convenient", "That memory revises itself over time", "That documents record neutral information", "That oral tradition is unsupervised"], answer: 1,
      why: "'The objection was never wrong about memory' grants the decay premise, then denies the comparison by attacking the assumed reliability of documents." },
    { passage: "p2", tid: "cars-5", stem: "The author would most likely agree that the strength of oral tradition lies in:",
      options: ["Preservation of visible disagreement", "Its independence from community values", "Its greater age relative to written records", "The absence of error in oral transmission"], answer: 0,
      why: "Testimony 'gives us several with the disagreement intact' — the contest between versions is audible evidence, whereas the archive hides its assumptions in a single account." },
    { passage: "p2", tid: "cars-8", stem: "A study finds that oral genealogies in one region agree with parish registers in 90% of cases. This finding would:",
      options: ["Weaken it, by showing documents are reliable after all", "Contradict the claim that memory revises itself over time", "Leave it intact, since it concerns how errors arise, not how often", "Strengthen it, by showing oral sources are accurate after all"], answer: 2,
      why: "The author's case is about the structure of error and the burden of proof, not about rates of agreement; two sources agreeing does not establish that either one's reliability may be presumed." },
    { passage: "p8", tid: "cars-0", stem: "The central claim of the passage is that translation is best understood as:",
      options: ["A reading made public, valuable in its impermanence", "A regrettable subtraction from a fixed original sum", "An act of ventriloquism upon the author", "A technical problem awaiting one final solution"], answer: 0,
      why: "The author rejects the ledger metaphor (subtraction), condemns free invention as ventriloquism, and argues against any definitive version — leaving translation as candid, generation-bound reading." },
    { passage: "p8", tid: "cars-2", stem: "The author's tone toward the claim that 'something is lost' in translation is:",
      options: ["Flatly dismissive — no real losses ever occur", "Conceding its truth while rejecting its framework", "Anguished agreement that the art is doomed", "Ironic mockery of translators' pretensions"], answer: 1,
      why: "The losses 'are real,' the author grants — but the 'ledger metaphor itself deserves suspicion.' The concession is genuine and the target is the frame, not the fact." },
    { passage: "p8", tid: "cars-5", stem: "From the second paragraph, it can be inferred that the author believes an ordinary reader of an untranslated classic:",
      options: ["Receives the work exactly as its first audience did", "Needs no interpretive instruments at all to read", "Is also producing an interpretation, just unrecorded", "Necessarily understands less than a translator would"], answer: 2,
      why: "If the translator differs from other readers 'not in kind but in candor,' then every reader performs an interpretation; the translator merely writes hers down." },
    { passage: "p8", tid: "cars-3", stem: "The sentence 'The original endures precisely because its translations keep dying' functions in the argument as:",
      options: ["A concession granted to the definitive-translation view", "Evidence that classics ought not to be translated", "A stipulated definition of the word 'original'", "A paradox reframing translations' aging as their function"], answer: 3,
      why: "The author has just converted the standard indictment (translations age) into a function; this compressed paradox caps that reversal, tying each generation's reading to the original's continued life." },
    { passage: "p8", tid: "cars-7", stem: "Which finding would most WEAKEN the author's argument against a single definitive translation?",
      options: ["One translation stays most faithful and alive across generations", "A brand-new translation of Homer outsells all its predecessors", "Two respected translators disagree sharply about one passage", "Some celebrated translations contain demonstrable outright errors"], answer: 0,
      why: "The argument rests on readings being generation-bound. A translation that stays authoritative across generations would undercut the claim that fixing one 'silences every generation after it.' Sales, disagreement and error are all compatible with the author's view." },
    { passage: "p8", tid: "cars-8", stem: "A musician argues that historically informed performances of Bach should not drive modern-instrument performances from the stage, since each era must hear the music with its own ears. The author of the passage would most likely regard this argument as:",
      options: ["Mistaken, because music possesses no original text", "A parallel application of its view of interpretation", "Irrelevant to questions about written language", "Proof that Bach's scores need no interpreters at all"], answer: 1,
      why: "The musician treats performances as era-bound readings answerable to a surviving original — the passage's exact structure transposed to music; the author generalizes over readers and performers alike." },
    { passage: "p9", tid: "cars-0", stem: "The passage as a whole argues that formalization policy fails when it is treated as:",
      options: ["A project simply too expensive for poor governments", "A bargain to be struck between state and enterprise", "A policy chronically unpopular with the vendors themselves", "A conversion conferred rather than an exchange earned"], answer: 3,
      why: "The closing metaphor — 'a bargain, not a baptism' — names the thesis: registration succeeds only when the state's package is worth the price of visibility, not by decree." },
    { passage: "p9", tid: "cars-4", stem: "The second paragraph's account of failed registration drives serves the argument primarily as:",
      options: ["Proof that microenterprise owners act against their interests", "A digression from the passage's main line of argument", "Evidence against informality as merely delayed formality", "An implicit endorsement of stronger enforcement drives"], answer: 2,
      why: "The drives applied the symptom-to-be-cured theory and disappointed; the calculated retreat into informality is the datum the author's alternative theory is built to explain." },
    { passage: "p9", tid: "cars-1", stem: "In context, calling the informal economy 'perfectly legible to participants' means that its rules are:",
      options: ["Written down in simplified legal language", "Understood and relied upon by those inside it", "Posted publicly at the entrance to each market", "Formally approved by the development agencies"], answer: 1,
      why: "Legible here is figurative: the pitch-holding arrangements are invisible to official records yet clearly readable — known, stable, enforceable — to the vendors who live by them." },
    { passage: "p9", tid: "cars-5", stem: "The passage implies that a vendor who declines to register her stall is most likely:",
      options: ["Weighing visibility's costs against real state benefits", "Simply unaware that registration is available", "Acting from principled opposition to the state itself", "Planning to abandon commerce for wage work"], answer: 0,
      why: "Researchers found the retreat into informality 'calculated rather than ignorant,' and the final paragraph models the decision as a bargain — implying an assessment, not ignorance or ideology." },
    { passage: "p9", tid: "cars-7", stem: "Which observation would most STRENGTHEN the author's closing claim?",
      options: ["A country doubles registration fees and formality falls", "Vendors everywhere prefer dealing in cash transactions", "Fast courts and real credit drew registration unforced", "Informal enterprises exist in wealthy countries too"], answer: 2,
      why: "The claim predicts that a genuine state package draws voluntary formalization. A case where improved services produced registration without coercion is that prediction confirmed; the fee case fits but tests only the price side." },
    { passage: "p9", tid: "cars-11", stem: "The Lima street-vendor example functions in the third paragraph to show that:",
      options: ["Peru's property law being unusually weak", "That vendor associations deserve state authority", "That informal economies are chaotic and transient", "Property-like institutions enforced without the state"], answer: 3,
      why: "Pitches bought, sold, inherited and enforced by associations demonstrate 'an alternative system of rules' — the paragraph's claim that 'unregulated' mistakes whose regulations count." }
  ],
  biochem: [
    { passage: "p7", tid: "biochem-4", stem: "Based on the table, the Km of the uninhibited enzyme indicates that:",
      options: ["Half-maximal velocity occurs at 1.0 mM substrate", "The enzyme is fully saturated at 1.0 mM substrate", "The turnover number equals 1.0 per minute exactly", "Velocity falls to zero below 1.0 mM substrate"], answer: 0,
      why: "Km is the substrate concentration at which v = Vmax/2. It says nothing directly about saturation, turnover, or a threshold below which the enzyme is idle.",
      whys: ["Km is defined as the [S] giving Vmax/2", "Saturation requires [S] far above Km, roughly 10× or more", "Turnover (kcat) needs enzyme concentration, which the table does not give", "Michaelis–Menten velocity is hyperbolic — nonzero at any [S] above zero"] },
    { passage: "p7", tid: "biochem-5", stem: "Compound A is best classified as which type of inhibitor?",
      options: ["Irreversible covalent", "Competitive and reversible", "Noncompetitive and reversible", "Uncompetitive"], answer: 1,
      why: "Raised Km with unchanged Vmax is the competitive signature, and recovery on dialysis shows the binding is reversible.",
      whys: ["Dialysis would not reverse a covalent modification", "Km up, Vmax unchanged, removable by dialysis — the competitive profile", "A noncompetitive inhibitor lowers Vmax and leaves Km alone", "An uncompetitive inhibitor lowers both Km and Vmax"] },
    { passage: "p7", tid: "biochem-5", stem: "Which experimental change would most nearly restore the velocity of the Compound A sample to uninhibited values without removing the compound?",
      options: ["Lowering the assay temperature by about 10 °C", "Adding a further portion of Compound A", "Raising substrate concentration far above 4 mM", "Diluting the enzyme stock about tenfold"], answer: 2,
      why: "Competitive inhibition is outcompeted by substrate: at [S] far above the apparent Km, velocity approaches the same Vmax.",
      whys: ["Cooling slows the enzyme; it does not displace a competitive inhibitor", "More inhibitor deepens the inhibition", "Saturating substrate outcompetes an inhibitor that shares the active site", "Diluting enzyme lowers velocity in every condition"] },
    { passage: "p7", tid: "biochem-5", stem: "The behaviour of Compound B — reduced Vmax, unchanged Km, no recovery on dialysis — is most consistent with:",
      options: ["A reversible competitive inhibitor in the active site", "A substrate analogue consumed during the assay itself", "An allosteric activator of the hydrolase", "An irreversible inhibitor bound away from the active site"], answer: 3,
      why: "Unchanged Km with lower Vmax means substrate binding is intact while catalysis is impaired — a noncompetitive pattern — and failure of dialysis to restore activity marks the binding as effectively irreversible.",
      whys: ["Competitive inhibition raises apparent Km and is outcompeted by substrate", "A consumed analogue would give recovery over time and on dialysis", "An activator would raise velocity, not cut it to a quarter", "Catalysis down, binding unchanged, not removable — irreversible and away from the active site"] },
    { passage: "p7", tid: "biochem-20", stem: "The assay measured initial velocity from absorbance at 405 nm. This depends most directly on:",
      options: ["The Bradford reagent binding the enzyme's arginines", "Beer's law tying absorbance to product concentration", "Fluorescence quenching by the unreacted substrate", "The pH optimum of the hydrolase being 405-appropriate"], answer: 1,
      why: "A = εlc: with a fixed path length and extinction coefficient, absorbance tracks product concentration, so its slope over time is the reaction velocity.",
      whys: ["Bradford measures total protein, not activity", "Absorbance proportional to concentration is exactly Beer's law", "The assay is absorbance-based; no fluorophore is involved", "pH affects the rate itself, not the optical readout"] },
    { tid: "biochem-0", stem: "At physiological pH (7.4), the side chains of aspartate and lysine carry, respectively:",
      options: ["A negative and a positive charge", "A positive and a negative charge", "No charge and a positive charge", "A negative charge and no charge"], answer: 0,
      why: "Aspartate's carboxylate (pKa ~4) is deprotonated and negative at pH 7.4; lysine's amino group (pKa ~10.5) is protonated and positive." },
    { tid: "biochem-0", stem: "A dipeptide is at a pH equal to its isoelectric point. Its net charge is:",
      options: ["+1", "Zero", "−1", "Dependent on temperature only"], answer: 1,
      why: "The isoelectric point is defined as the pH at which the molecule's average net charge is zero, so it does not migrate in an electric field." },
    { tid: "biochem-0", stem: "Which amino acid's side chain has a pKa near 6, letting it serve as a physiological proton shuttle in enzyme active sites?",
      options: ["Serine", "Glycine", "Histidine", "Leucine"], answer: 2,
      why: "The imidazole of histidine (pKa ≈ 6) can gain or lose a proton near physiological pH, which is why it appears in catalytic triads and in hemoglobin's buffering." },
    { tid: "biochem-1", stem: "The partial double-bond character of the peptide bond most directly explains why:",
      options: ["Finished proteins being freely soluble in water", "Peptide bonds hydrolyzing spontaneously in water", "Side chains being locked against all rotation", "The six atoms around each peptide bond lying flat"], answer: 3,
      why: "Resonance between the carbonyl and the C–N bond restricts rotation about it, holding the amide group planar and usually trans." },
    { tid: "biochem-1", stem: "The hydrogen bonds that stabilize an α-helix form between:",
      options: ["Backbone C=O and N–H groups four residues apart", "Adjacent side chains along the helix face", "The helix backbone and the surrounding water", "Pairs of cysteine sulfhydryls along one face"], answer: 0,
      why: "Helical H-bonds run along the backbone from the carbonyl of residue i to the amide H of residue i+4; side chains point outward and are not required." },
    { tid: "biochem-1", stem: "A single polypeptide folds into two compact, independently stable regions connected by a flexible linker. Interactions BETWEEN two separate polypeptide chains in a complex would instead be described as:",
      options: ["Secondary structure", "Quaternary structure", "Primary structure", "Domain swapping"], answer: 1,
      why: "Quaternary structure is the arrangement of multiple chains (subunits); the two regions within one chain are domains of its tertiary structure." },
    { tid: "biochem-2", stem: "A denatured enzyme regains full activity when the denaturant is removed, without any cellular machinery. This classic result (Anfinsen) shows that:",
      options: ["That chaperones are required for all protein folding", "That denaturation had broken the peptide backbone", "That the native fold is encoded in the sequence", "That productive folding requires ATP hydrolysis"], answer: 2,
      why: "Spontaneous refolding to the active conformation means the primary sequence contains the information for the native structure; chaperones assist kinetics in the crowded cell but are not always required." },
    { tid: "biochem-2", stem: "The dominant driving force burying nonpolar side chains in a folded protein's core is:",
      options: ["Covalent cross-linking", "The hydrophobic effect", "Electrostatic attraction to the backbone", "Coordination of metal ions"], answer: 1,
      why: "Releasing ordered water from around nonpolar groups raises entropy; this hydrophobic effect, not any bond the nonpolar groups form, drives core formation." },
    { tid: "biochem-3", stem: "An enzyme that transfers a phosphoryl group from ATP to a serine hydroxyl on a substrate protein is classified as a:",
      options: ["A hydrolase acting on phosphoesters", "An isomerase of the substrate protein", "A ligase joining two substrates", "A kinase, one of the transferases"], answer: 3,
      why: "Kinases are transferases that move phosphoryl groups from ATP to acceptors. Hydrolases cleave with water; ligases join substrates using ATP; isomerases rearrange within one molecule." },
    { tid: "biochem-3", stem: "Many dehydrogenases cannot function without NAD⁺. In enzyme terminology, NAD⁺ is best described as a:",
      options: ["Cosubstrate (coenzyme) that is reduced and released", "Prosthetic group covalently fixed in the active site", "Zymogen", "Competitive inhibitor"], answer: 0,
      why: "NAD⁺ binds, accepts a hydride to become NADH, and leaves — a dissociable coenzyme acting as cosubstrate, unlike a permanently attached prosthetic group such as heme." },
    { tid: "biochem-4", stem: "Enzyme X has Km = 0.1 mM for its substrate; enzyme Y has Km = 10 mM for the same substrate. At low substrate concentrations:",
      options: ["Y works at a higher fraction of its Vmax than X", "Both work at the same fraction of Vmax", "Neither enzyme can bind substrate", "X works at a higher fraction of its Vmax than Y"], answer: 3,
      why: "Lower Km means higher apparent affinity: X approaches half-maximal velocity at concentrations where Y has barely begun." },
    { tid: "biochem-6", stem: "Trypsinogen is secreted by the pancreas and activated only in the intestinal lumen. The biological logic of synthesizing it as a zymogen is to:",
      options: ["To increase its eventual catalytic rate", "To keep the protease from digesting its own gland", "To let the enzyme fold without chaperone help", "To target the enzyme to the mitochondrion"], answer: 1,
      why: "Storing proteases as inactive precursors, activated by cleavage only at their site of action, protects the secreting organ — which is why premature activation causes pancreatitis." },
    { tid: "biochem-6", stem: "The end product of a five-step biosynthetic pathway inhibits the enzyme catalyzing the first committed step. This arrangement is called:",
      options: ["Feedback inhibition", "Covalent activation", "Substrate-level phosphorylation", "Induced fit"], answer: 0,
      why: "Allosteric inhibition of the committed step by the pathway's product shuts synthesis off when supply is adequate, wasting neither intermediates nor energy." },
    { tid: "biochem-7", stem: "Per molecule of glucose, glycolysis yields a net gain of:",
      options: ["4 ATP and 4 NADH", "1 ATP and 1 NADH", "2 ATP and 2 NADH", "36 ATP"], answer: 2,
      why: "Four ATP are made but two are invested, netting 2 ATP, plus 2 NADH at the glyceraldehyde-3-phosphate step. Larger totals require mitochondrial oxidation." },
    { tid: "biochem-7", stem: "Phosphofructokinase-1, the rate-limiting enzyme of glycolysis, is allosterically activated by:",
      options: ["Citrate exported from the mitochondrion", "AMP and fructose-2,6-bisphosphate", "ATP binding at its allosteric site", "NADH from the cytosolic pool"], answer: 1,
      why: "AMP signals low energy charge and F2,6BP signals fed-state liver; both stimulate PFK-1. ATP and citrate are its inhibitors — signs that energy and biosynthetic precursors are plentiful." },
    { tid: "biochem-7", stem: "In red blood cells, which lack mitochondria, glycolysis can continue only because:",
      options: ["They import fresh NAD⁺ across their membranes", "They switch to oxidizing fatty acids instead", "They run the citric acid cycle within the cytosol", "Lactate dehydrogenase regenerates their NAD⁺"], answer: 3,
      why: "Without oxidative phosphorylation, the NADH made at the G3P dehydrogenase step must be reoxidized by reducing pyruvate to lactate, or glycolysis stalls for want of NAD⁺." },
    { tid: "biochem-8", stem: "Pyruvate dehydrogenase connects glycolysis to the citric acid cycle by converting pyruvate to:",
      options: ["Acetyl-CoA, CO₂ and NADH", "Oxaloacetate and GTP", "Lactate and NAD⁺", "Citrate and FADH₂"], answer: 0,
      why: "The PDH complex oxidatively decarboxylates pyruvate to acetyl-CoA, releasing CO₂ and reducing NAD⁺ — an irreversible, committed entry to aerobic metabolism." },
    { tid: "biochem-8", stem: "Each turn of the citric acid cycle, starting from one acetyl-CoA, produces:",
      options: ["2 NADH, 2 FADH₂ and 2 ATP", "1 NADH, 3 FADH₂ and 3 GTP", "3 NADH, 1 FADH₂ and 1 GTP", "6 NADH and 2 GTP"], answer: 2,
      why: "The cycle's three dehydrogenases yield 3 NADH, succinate dehydrogenase yields 1 FADH₂, and succinyl-CoA synthetase yields 1 GTP, with two carbons leaving as CO₂." },
    { tid: "biochem-9", stem: "Electrons from cytosolic-independent FADH₂ (via succinate) yield less ATP than those from NADH because they:",
      options: ["Are handed off directly to molecular oxygen", "Enter at complex II, skipping complex I's pumping", "Uncouple the inner membrane as they pass through", "Reduce every cytochrome c molecule exactly twice"], answer: 1,
      why: "Complex II transfers electrons to CoQ without pumping protons, so the FADH₂ pathway drives fewer protons across the membrane (~1.5 ATP versus ~2.5 per NADH)." },
    { tid: "biochem-9", stem: "Oligomycin blocks the proton channel of ATP synthase. In treated mitochondria, oxygen consumption:",
      options: ["Rises sharply, as with an uncoupling agent", "Continues entirely unchanged from baseline", "Becomes independent of the ADP supply", "Falls as the unspent proton gradient backs up"], answer: 3,
      why: "With no proton re-entry through the synthase, the gradient builds until pumping — and therefore electron flow and O₂ reduction — slows: respiratory control. (Contrast an uncoupler, which raises O₂ use.)" },
    { tid: "biochem-10", stem: "During gluconeogenesis, the liver bypasses pyruvate kinase using:",
      options: ["Pyruvate carboxylase with PEP carboxykinase", "Hexokinase acting together with PFK-1", "Glycogen phosphorylase acting in reverse", "Citrate synthase exporting oxaloacetate"], answer: 0,
      why: "Pyruvate is carboxylated to oxaloacetate (biotin-dependent) and then decarboxylated and phosphorylated to PEP — the two-step, GTP-consuming detour around glycolysis's irreversible last step." },
    { tid: "biochem-10", stem: "Skeletal muscle glycogen cannot raise blood glucose directly because muscle lacks:",
      options: ["Glycogen phosphorylase", "Glucose-6-phosphatase", "Phosphoglucomutase", "GLUT transporters"], answer: 1,
      why: "Muscle frees G6P from glycogen but has no glucose-6-phosphatase to dephosphorylate it for export, so the glucose stays for the muscle's own glycolysis; the liver, which has the enzyme, exports glucose." },
    { tid: "biochem-10", stem: "A cell synthesizing large amounts of fatty acids runs the pentose phosphate pathway chiefly to supply:",
      options: ["Ribose-5-phosphate for nucleotide synthesis", "ATP for the synthase reactions", "NADPH for reductive biosynthesis", "Acetyl-CoA for the growing chains"], answer: 2,
      why: "The oxidative arm's product NADPH is the electron donor for fatty acid synthase (and for glutathione reduction); ribose-5-P is the other product, needed mainly by dividing cells." },
    { tid: "biochem-11", stem: "Immediately after a fatty meal, dietary triacylglycerols travel from the intestine to peripheral tissues primarily in:",
      options: ["Chylomicrons", "LDL particles", "Albumin-bound free fatty acids", "HDL particles"], answer: 0,
      why: "Enterocytes package dietary fat into chylomicrons, which enter the lymph and deliver triacylglycerol to tissues via lipoprotein lipase; LDL mainly ferries cholesterol, HDL runs reverse transport." },
    { tid: "biochem-12", stem: "Long-chain fatty acids require carnitine to be oxidized because carnitine:",
      options: ["Activates them to acyl-CoA thioesters in the cytosol", "Shuttles their acyl groups across the inner membrane", "Serves as coenzyme for the acyl dehydrogenases", "Keeps them from clustering into micelles"], answer: 1,
      why: "The inner membrane is impermeable to long-chain acyl-CoA; the carnitine acyltransferase shuttle carries the acyl group in, and its inhibition (or carnitine deficiency) blocks β-oxidation." },
    { tid: "biochem-12", stem: "After several days of fasting, the brain increasingly meets its energy needs from:",
      options: ["Fatty acids crossing the blood–brain barrier", "Muscle glycogen", "Dietary protein", "Ketone bodies made by the liver"], answer: 3,
      why: "Hepatic mitochondria convert fatty-acid-derived acetyl-CoA into acetoacetate and β-hydroxybutyrate, which the brain oxidizes — sparing glucose and muscle protein. Fatty acids themselves cross the barrier poorly." },
    { tid: "biochem-13", stem: "The nitrogen atoms excreted in urea derive most directly from:",
      options: ["Degradation of purine rings exclusively", "Phosphate transfer from creatine phosphate", "Free ammonia plus aspartate entering the cycle", "Breakdown of pyrimidine ring nitrogens"], answer: 2,
      why: "Carbamoyl phosphate synthetase I fixes NH₄⁺ as one nitrogen, and aspartate donates the second within argininosuccinate; the liver-only cycle detoxifies the ammonia from amino acid catabolism." },
    { tid: "biochem-14", stem: "Two hours after a carbohydrate-rich meal, the liver's metabolic posture is dominated by:",
      options: ["Glucagon-driven glycogenolysis in the liver", "Ketogenesis from fatty acid flux", "Cortisol-driven muscle proteolysis", "Insulin-driven glycogen and fat synthesis"], answer: 3,
      why: "High insulin:glucagon pushes the fed program — glucose uptake, glycogen synthase on, phosphorylase off, and excess carbon exported as lipid; the counter-regulatory programs belong to fasting." },
    { tid: "biochem-15", stem: "Sucrose does not react in reducing-sugar tests because:",
      options: ["Its glycosidic bond ties up both anomeric carbons", "It contains no glucose residue anywhere in it", "It is actually a branched storage polysaccharide", "Neither of its two rings can open at any position"], answer: 0,
      why: "The α-1,β-2 linkage ties up the anomeric carbons of both glucose and fructose, leaving no free anomeric carbon to open into the reactive aldehyde form; lactose, with a free anomeric carbon, does reduce." },
    { tid: "biochem-16", stem: "A DNA duplex with a higher proportion of G–C pairs melts at a higher temperature chiefly because G–C pairs:",
      options: ["Are physically longer than A–T pairs", "Form three hydrogen bonds and stack strongly", "Carry more phosphates in the backbone", "Exclude water entirely from the major groove"], answer: 1,
      why: "Each G–C pair contributes three H-bonds (versus two for A–T) and stronger stacking interactions, so more thermal energy is needed to separate the strands." },
    { tid: "biochem-17", stem: "Glucose-6-phosphate synthesis from glucose and Pi is endergonic, yet cells perform it readily. They do so by:",
      options: ["Raising the temperature at the active site locally", "Using a different, spontaneously reacting glucose isomer", "Coupling the phosphorylation to ATP hydrolysis", "Removing product the instant it is formed"], answer: 2,
      why: "Hexokinase couples phosphoryl transfer to ATP cleavage, making the summed ΔG°' negative (~−17 kJ/mol) — the standard strategy of driving unfavourable steps with ATP." },
    { tid: "biochem-18", stem: "Replacing several membrane phospholipids' saturated tails with cis-unsaturated tails will:",
      options: ["Increase fluidity by kinking the tail packing", "Decrease fluidity by tightening tail packing", "Leave the bilayer's properties unchanged", "Convert the whole bilayer into micelles"], answer: 0,
      why: "Cis double bonds put permanent kinks in the acyl chains, preventing tight packing and lowering the melting temperature — the same reason cold-adapted membranes are more unsaturated." },
    { tid: "biochem-19", stem: "In SDS-PAGE, proteins separate essentially by size because SDS:",
      options: ["Preserves each protein's native surface charge", "Coats proteins uniformly negative and unfolds them", "Cross-links the proteins into the gel matrix", "Binds detectably only to the largest proteins"], answer: 1,
      why: "SDS denatures proteins and swamps intrinsic charge in proportion to length, so electrophoretic mobility through the sieving gel reflects mass alone; native charge separations need isoelectric focusing instead." },
    { tid: "biochem-19", stem: "In size-exclusion chromatography, the protein that elutes FIRST from the column is the one that:",
      options: ["Binds the column's beads the most tightly", "Carries the greatest net negative charge", "Is smallest, entering every pore", "Is largest, excluded from the beads' pores"], answer: 3,
      why: "Large molecules are excluded from the porous beads and travel the short path between them; small ones wander into the pores and elute late. The order is the reverse of SDS-PAGE migration." },
    { tid: "biochem-20", stem: "A researcher follows NADH consumption in a coupled assay by absorbance. The appropriate wavelength is:",
      options: ["600 nm", "495 nm", "340 nm", "260 nm"], answer: 2,
      why: "NADH absorbs at 340 nm while NAD⁺ does not, so dehydrogenase reactions are followed as absorbance change at 340 nm; 260 nm is nucleic acids, 280 nm aromatic residues." }
  ]
};
</script>

<script>

   Constants
   ------------------------------------------------------------------ */

  biology:  { a: '#D4436B', deep: '#B03A5E', soft: '#FDEFF4', bd: '#F5D3DF' },
  genchem:  { a: '#7C6BD6', deep: '#6656BE', soft: '#F1EFFB', bd: '#DFD9F4' },

};
var NEUTRAL = { a: '#B8A0AE', deep: '#9C8797', soft: '#F6F2F4', bd: '#E9E1E5' };
function acc(id) { return ACCENTS[id] || NEUTRAL; }

var SPECIAL = { final: 'Full syllabus', review: 'Review queue', misses: 'Error log', carsdaily: 'Daily CARS' };
function isSpecial(id) { return !!SPECIAL[id]; }
function homeOf(id) { return id === 'final' ? 'subjects' : 'today'; }

var KEY = 'hnoo-mcat-v1';
var PER_Q = 95;                    // seconds per question in timed sittings
var MIN_ROUND = 3;                 // fewest questions that can honestly be called a round
var REVIEW_INTERVALS = [1, 3, 7, 14, 28];   // spaced-repetition ladder, in days
/* Why a question was missed. The five causes have five different remedies,
   which is why the score report insists on one. */
var CAUSES = [
  ['gap', "Didn't know it"],
  ['misread', 'Misread it'],
  ['trap', 'Fell for a trap'],
  ['careless', 'Careless slip'],
  ['time', 'Ran out of time']
];
function causeLabel(key) {
  for (var i = 0; i < CAUSES.length; i++) if (CAUSES[i][0] === key) return CAUSES[i][1];
  return '';
}

/* ------------------------------------------------------------------
   State
   ------------------------------------------------------------------ */

var state = {
  view: 'today', subjectId: null, session: null, report: null,
  save: null, calView: 'month', calCursor: 0, ed: null
};

function setState(patch) { for (var k in patch) state[k] = patch[k]; render(); syncHash(); }

/* ------------------------------------------------------------------
   URL routing
   The five stable screens live in the hash so the browser's Back button
   moves between screens instead of leaving the app. Rounds and reports are
   transient and stay under their parent's URL — Back during a round returns
   to the screen it was started from.
   ------------------------------------------------------------------ */

var STABLE_VIEWS = ['today', 'subjects', 'calendar', 'stats'];

function hashFor() {
  if (state.view === 'subject' && state.subjectId) return '#/subject/' + state.subjectId;
  if (STABLE_VIEWS.indexOf(state.view) > -1) return '#/' + state.view;
  return null;
}
function parseHash(h) {
  var p = String(h || '').replace(/^#\/?/, '').split('/');
  if (p[0] === 'subject' && subject(p[1])) return { view: 'subject', subjectId: p[1] };
  if (STABLE_VIEWS.indexOf(p[0]) > -1) return { view: p[0], subjectId: null };
  return { view: 'today', subjectId: null };
}
var expectedHash = null;
function syncHash() {
  var h = hashFor();
  if (h && location.hash !== h) { expectedHash = h; location.hash = h; }
}
window.addEventListener('hashchange', function () {
  if (location.hash === expectedHash) { expectedHash = null; return; }
  var t = parseHash(location.hash);
  stopTimer();
  setState({ view: t.view, subjectId: t.subjectId, session: null, report: null, ed: null });
});

/* ------------------------------------------------------------------
   Persistence
   ------------------------------------------------------------------ */

function blank() {
  return { schema: 2, startedOn: dateKey(new Date()), done: {}, rounds: {}, log: {}, events: {}, misses: {}, topicStats: {}, history: [], carsLog: {}, plan: { h: 14, days: [1, 1, 1, 1, 1, 1, 1] } };
}
function load() {
  try {
    var r = JSON.parse(localStorage.getItem(KEY));
    if (r && r.done) {
      var wasOld = r.schema !== 2 || r.startedOn === undefined;
      r = migrate(r);                       // before defaults are filled in, or
      var b = blank();                      // blank()'s schema marker would mask it
      if (r.startedOn === undefined) r.startedOn = earliestDay(r) || CONFIG.prepStart;
      Object.keys(b).forEach(function (k) { if (r[k] === undefined) r[k] = b[k]; });
      if (wasOld) { try { localStorage.setItem(KEY, JSON.stringify(r)); } catch (e) {} }
      return r;
    }
  } catch (e) {}
  /* Write the fresh save out now rather than on her first action, so startedOn
     records the day she opened the tracker, not the day she first used it. */
  var fresh = blank();
  try { localStorage.setItem(KEY, JSON.stringify(fresh)); } catch (e2) {}
  return fresh;
}

/* Saves written before questions carried syllabus topic ids tagged their
   analytics with free-text topic names. Misses can be re-tagged exactly, since

    var m = d.misses[k];

    m.tid = q ? q.tid : '';
    delete m.topic;
  });
  var kept = {};
  Object.keys(d.topicStats || {}).forEach(function (k) {
