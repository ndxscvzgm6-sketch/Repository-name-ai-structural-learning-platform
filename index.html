}
function save() { return state.save || blank(); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function persist(next) {
  try { localStorage.setItem(KEY, JSON.stringify(next)); } catch (e) {}
  setState({ save: next });
}

/* ------------------------------------------------------------------
   Dates
   ------------------------------------------------------------------ */

function dateKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseDate(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function examDate() { return parseDate(CONFIG.examDate || '2027-05-29'); }
/* The countdown bar fills from the day she actually started, which a fresh save
   stamps for itself. Saves made before that field existed are back-dated to the
   oldest day they have a record of, so nobody's bar jumps back to empty. */
function earliestDay(d) {
  var days = Object.keys(d.log || {}).concat(Object.keys(d.events || {}).map(function (k) {
    return (d.events[k] || {}).d;
  })).filter(Boolean).sort();
  return days[0] || '';
}
function prepStart() { return parseDate(save().startedOn || CONFIG.prepStart || '2026-08-27'); }
function passMark() { return CONFIG.passMark || 70; }
function roundLen() { return CONFIG.roundLength || 10; }
function fmtTime(m) {
  m = parseInt(m, 10);
  var h12 = ((Math.floor(m / 60) + 11) % 12) + 1, mm = m % 60;
  return h12 + (mm ? ':' + String(mm).padStart(2, '0') : '') + (m < 720 ? ' AM' : ' PM');
}

/* ------------------------------------------------------------------
   Syllabus lookups
   ------------------------------------------------------------------ */

var TOPIC_NAME = {};       // syllabus topic id -> its name
var GROUP_OF = {};         // syllabus topic id -> the concept group it sits in

SUBJECTS.forEach(function (s) {
  var n = 0;
  s.groups.forEach(function (g, gi) {
    g.id = s.id + '-g' + gi;
    g.items = g.topics.map(function (t) { return { id: s.id + '-' + (n++), name: t }; });
    g.items.forEach(function (t) { TOPIC_NAME[t.id] = t.name; GROUP_OF[t.id] = g.id; });
  });
  s.topicCount = n;
});
function topicName(tid) { return TOPIC_NAME[tid] || tid || 'Untagged'; }
function short(str, n) { str = String(str == null ? '' : str); return str.length > n ? str.slice(0, n - 1).trim() + '\u2026' : str; }
function isGroupScope(scopeId) { return /-g\d+$/.test(scopeId); }
function isExamScope(scopeId) { return scopeId.indexOf('#exam') > -1; }

function subject(id) { return SUBJECTS.find(function (s) { return s.id === id; }); }
function allTopics(s) { var out = []; s.groups.forEach(function (g) { (g.items || []).forEach(function (t) { out.push(t); }); }); return out; }

var _banks = {};
function bankOf(id) {
  if (!_banks[id]) {
    var b = (window.MCAT_BANK || {})[id];
    if (!b) return [];
    _banks[id] = b.map(function (q, i) {
      var copy = { _k: id + '#' + i, _subj: id };
      for (var f in q) copy[f] = q[f];
      return copy;
    });
  }
  return _banks[id];
}

/* A round draws from a scope: one syllabus topic, one concept group, or the
   whole subject (the subject exam). Anything narrower than MIN_ROUND questions
   does not get offered at all — serving another topic's questions under this
   topic's name is what the old build did, and it made every per-topic score
   meaningless. */
var _pools = {};
function poolFor(subjId, scopeId) {
  var key = subjId + '|' + scopeId;
  if (!_pools[key]) {
    var bank = bankOf(subjId);
    _pools[key] = isExamScope(scopeId) ? bank
      : isGroupScope(scopeId) ? bank.filter(function (q) { return GROUP_OF[q.tid] === scopeId; })
      : bank.filter(function (q) { return q.tid === scopeId; });
  }
  return _pools[key];
}
function roundsFor(n) {
  var len = roundLen();
  if (n >= len) return Math.min(5, Math.floor(n / len));
  return n >= MIN_ROUND ? 1 : 0;
}
function scopeRounds(subjId, scopeId) { return roundsFor(poolFor(subjId, scopeId).length); }

function roundRec(tid, r) { return save().rounds[tid + '#' + r]; }
function topicRounds(subjId, scopeId) {
  var sv = save(), n = 0, best = 0;
  var avail = scopeRounds(subjId, scopeId);
  for (var r = 1; r <= avail; r++) {
    var rec = sv.rounds[scopeId + '#' + r];
    if (rec) { n++; best = Math.max(best, Math.round(rec.c / rec.t * 100)); }
  }
  return { n: n, best: best, avail: avail };
}
/* every round the bank can currently support for a subject */
function availableRounds(s) {
  var total = 0;
  s.groups.forEach(function (g) {
    g.items.forEach(function (t) { total += scopeRounds(s.id, t.id); });
    total += scopeRounds(s.id, g.id);
  });
  return total;
}
/* A topic is mastered when every round its questions support has been passed.
   That is the earned number; the self-ticked "covered in class" checkbox is
   kept, but only as a coursework marker — it no longer drives any headline. */
function topicMastered(subjId, tid) {
  var avail = scopeRounds(subjId, tid);
  if (!avail) return false;
  for (var r = 1; r <= avail; r++) {
    var rec = roundRec(tid, r);
    if (!rec || Math.round(rec.c / rec.t * 100) < passMark()) return false;
  }
  return true;
}
function subjStats(s) {
  var topics = allTopics(s), sv = save();
  var done = 0, mast = 0, rounds = 0, c = 0, t = 0;
  topics.forEach(function (tp) {
    if (sv.done[tp.id]) done++;
    if (topicMastered(s.id, tp.id)) mast++;
  });
  Object.keys(sv.rounds).forEach(function (k) {
    if (k.indexOf(s.id + '-') === 0 || k.indexOf(s.id + '#exam') === 0) {
      var r = sv.rounds[k]; rounds++; c += r.c; t += r.t;
    }
  });
  var total = topics.length || 1;
  return { done: done, mast: mast, total: topics.length, pct: Math.round(mast / total * 100), rounds: rounds, acc: t ? Math.round(c / t * 100) : null };
}
/* the next thing she can actually practise in this subject: an unfinished
   topic first, then an unfinished concept-group mix. null when the bank
   cannot support anything yet. */
function nextScopeFor(s) {
  var scopes = [];
  s.groups.forEach(function (g) {
    g.items.forEach(function (t) { scopes.push({ id: t.id, name: t.name, kind: 'topic' }); });
  });
  s.groups.forEach(function (g) { scopes.push({ id: g.id, name: g.concept, kind: 'group' }); });
  var fallback = null;
  for (var i = 0; i < scopes.length; i++) {
    var sc = scopes[i], tr = topicRounds(s.id, sc.id);
    if (!tr.avail) continue;
    if (tr.n < tr.avail) return { scope: sc, round: tr.n + 1, avail: tr.avail };
    if (!fallback) fallback = { scope: sc, round: tr.avail, avail: tr.avail };
  }
  return fallback;   // everything cleared — offer the first scope again
}
function streakDays() {
  var log = save().log, n = 0, d = new Date();
  if (!log[dateKey(d)]) d.setDate(d.getDate() - 1);
  while (log[dateKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function totals() {
  var sv = save(), c = 0, t = 0, n = 0;
  Object.keys(sv.rounds).forEach(function (k) { var r = sv.rounds[k]; c += r.c; t += r.t; n++; });
  return { c: c, t: t, n: n, acc: t ? Math.round(c / t * 100) : null };
}
function isDue(m, todayKey) {
  var d = parseDate(m.last);
  d.setDate(d.getDate() + REVIEW_INTERVALS[Math.min(m.streak || 0, 4)]);
  return dateKey(d) <= todayKey;
}

/* ------------------------------------------------------------------
   Round engine
   ------------------------------------------------------------------ */

/* Seeded Fisher-Yates, so a given topic + round always deals the same
   questions in the same order — a retake is a genuine retake. */
function seedShuffle(arr, seedStr) {
  var h = 2166136261;
  for (var i = 0; i < seedStr.length; i++) { h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619); }
  var out = arr.slice();
  for (var j = out.length - 1; j > 0; j--) {
    h = (Math.imul(h, 1103515245) + 12345) & 0x7fffffff;
    var k = h % (j + 1), tmp = out[j]; out[j] = out[k]; out[k] = tmp;
  }
  return out;
}

/* Questions sharing a passage sit together, the way the real exam sets them.
   Clusters keep the position of their first member; standalone questions keep
   their dealt order. */
function groupByPassage(qs) {
  var buckets = {}, order = [];
  qs.forEach(function (q, i) {
    var key = q.passage || '#' + i;
    if (!buckets[key]) { buckets[key] = []; order.push(key); }
    buckets[key].push(q);
  });
  var out = [];
  order.forEach(function (key) { out.push.apply(out, buckets[key]); });
  return out;
}

var qTimer = null;
function stopTimer() { if (qTimer) { clearInterval(qTimer); qTimer = null; } }
function startTimer() { stopTimer(); qTimer = setInterval(tickQ, 1000); }
function tickQ() {
  var s = state.session;
  if (!s || !s.timed) { stopTimer(); return; }
  if (s.remaining > 1) {
    s.remaining--;
    paintClock();          // patch the clock in place; a full repaint every
    return;                // second would fight the user's scroll position
  }
  if (s.i + 1 < s.qs.length) setState({ session: assign(s, { i: s.i + 1, remaining: PER_Q }) });
  else finish(s);
}
function paintClock() {
  var s = state.session, el = document.getElementById('dc-clock');
  if (!el || !s) return;
  el.textContent = Math.floor(s.remaining / 60) + ':' + String(s.remaining % 60).padStart(2, '0');
  el.style.background = s.remaining <= 15 ? '#FDF2F5' : '#F7F1F4';
  el.style.color = s.remaining <= 15 ? '#C33F68' : '#6E5266';
}
function assign(a, b) { var o = {}; for (var k in a) o[k] = a[k]; for (var k2 in b) o[k2] = b[k2]; return o; }

function launch(part, subjectId) {
  stopTimer();
  var sess = assign({ i: 0, picks: {}, revealed: false, flags: {}, elim: {}, remaining: PER_Q }, part);
  setState({ view: 'round', subjectId: subjectId, report: null, session: sess });
  if (sess.timed) startTimer();
}

function startRound(subjId, scopeId, scopeName, round) {
  var pool = poolFor(subjId, scopeId);
  if (round < 1 || round > roundsFor(pool.length)) return;
  var len = Math.min(roundLen(), pool.length);
  var qs = pool.length >= len * 2
    ? seedShuffle(pool, subjId + scopeId).slice((round - 1) * len, round * len)
    : seedShuffle(pool, subjId + scopeId + round).slice(0, len);
  qs = groupByPassage(qs);
  launch({ subjId: subjId, topicId: scopeId, topicName: scopeName, round: round, qs: qs, timed: isExamScope(scopeId) }, subjId);
}

function startSpecial(kind) {
  var sv = save(), tk = dateKey(new Date());
  if (kind === 'carsdaily') {
    var bank = bankOf('cars');
    if (!bank.length) return;
    var daily = groupByPassage(seedShuffle(bank, 'cars' + tk).slice(0, 3));
    launch({ subjId: 'carsdaily', topicId: 'carsdaily', topicName: 'Daily CARS', round: 1, qs: daily, timed: false }, null);
    return;
  }
  var items = Object.keys(sv.misses || {}).map(function (k) { return assign({ k: k }, sv.misses[k]); });
  var pick = kind === 'review' ? items.filter(function (m) { return isDue(m, tk); }) : items;
  pick.sort(function (a, b) { return (a.last || '').localeCompare(b.last || ''); });
  // serve the concept, not the memorised card: rotate to a different question
  // sharing the missed item's topic when the bank has one
  var used = {};
  var qs = pick.slice(0, 10).map(function (m) {
    var bank = bankOf(m.subj);
    var orig = bank[parseInt(m.k.split('#')[1], 10)];
    if (!orig) return null;
    var mates = bank.filter(function (b) { return b.tid === orig.tid; });
    var start = mates.indexOf(orig) + 1 + (m.streak || 0);
    var served = orig;
    for (var j = 0; j < mates.length; j++) {
      var cand = mates[(start + j) % mates.length];
      if (!used[cand._k]) { served = cand; break; }
    }
    if (used[served._k]) return null;
    used[served._k] = 1;
    return assign(served, { _for: m.k });
  }).filter(Boolean);
  if (!qs.length) return;
  launch({ subjId: kind, topicId: kind, topicName: SPECIAL[kind], round: 1, qs: qs, timed: false }, null);
}

function startFinal(round) {
  var active = SUBJECTS.filter(function (s) { return s.status === 'active'; });
  var qs = [];
  active.forEach(function (s) { qs = qs.concat(seedShuffle(bankOf(s.id), 'final' + round + s.id).slice(0, 4)); });
  if (!qs.length) return;
  qs = groupByPassage(seedShuffle(qs, 'finalmix' + round));
  launch({ subjId: 'final', topicId: 'final', topicName: 'Final exam ' + round, round: round, qs: qs, timed: true }, null);
}

function choose(i) {
  var s = state.session;
  if (!s || s.revealed) return;
  var picks = assign(s.picks, {}); picks[s.i] = i;
  var elim = assign(s.elim, {});
  if (elim[s.i] && elim[s.i][i]) { var e2 = assign(elim[s.i], {}); delete e2[i]; elim[s.i] = e2; }
  setState({ session: assign(s, { picks: picks, elim: elim }) });
}
function toggleElim(i) {
  var s = state.session;
  if (!s || s.revealed) return;
  var elim = assign(s.elim, {}), cur = assign(elim[s.i] || {}, {});
  if (cur[i]) delete cur[i]; else cur[i] = 1;
  elim[s.i] = cur;
  var picks = assign(s.picks, {});
  if (cur[i] && picks[s.i] === i) delete picks[s.i];
  setState({ session: assign(s, { elim: elim, picks: picks }) });
}
function toggleFlag() {
  var s = state.session;
  if (!s) return;
  var flags = assign(s.flags, {});
  if (flags[s.i]) delete flags[s.i]; else flags[s.i] = 1;
  setState({ session: assign(s, { flags: flags }) });
}
function primary() {
  var s = state.session;
  if (!s) return;
  if (s.timed) {
    if (s.i + 1 < s.qs.length) { setState({ session: assign(s, { i: s.i + 1, remaining: PER_Q }) }); return; }
    finish(s); return;
  }
  if (!s.revealed) {
    if (s.picks[s.i] === undefined) return;
    setState({ session: assign(s, { revealed: true }) }); return;
  }
  if (s.i + 1 < s.qs.length) { setState({ session: assign(s, { i: s.i + 1, revealed: false }) }); return; }
  finish(s);
}
function exitRound() {
  var s = state.session;
  var touched = s && (s.i > 0 || Object.keys(s.picks).length > 0);
  if (touched && !window.confirm('Leave this round? Its answers are discarded.')) return;
  stopTimer();
  setState({
    view: isSpecial(s.subjId) ? homeOf(s.subjId) : 'subject',
    subjectId: isSpecial(s.subjId) ? null : s.subjId,
    session: null

}
function finish(s) {
  stopTimer();
  var c = 0;

  var k = dateKey(new Date());
  var next = clone(save());
  // the review queue and the error log are drills, not scored rounds
  if (s.subjId !== 'review' && s.subjId !== 'misses') next.rounds[s.topicId + '#' + s.round] = { c: c, t: s.qs.length, at: k };
  next.log[k] = (next.log[k] || 0) + 1;
  if (s.subjId === 'carsdaily') { next.carsLog = next.carsLog || {}; next.carsLog[k] = 1; }
  next.misses = next.misses || {}; next.topicStats = next.topicStats || {}; next.history = next.history || [];
  var causes = {};
  s.qs.forEach(function (q, i) {
    if (!q._k) return;

    // a review-queue stand-in credits the concept it was served for
    var key = q._for || q._k;
    var m = next.misses[key];

      // retire a miss after three clears on separate days — the review queue's
      // spacing means those days sit at least one interval apart, and rotation
      // means they are usually different questions on the same concept
      if (m && m.lastClear !== k) {
        m.streak = (m.streak || 0) + 1; m.last = k; m.lastClear = k;

  if (next.history.length > 60) next.history = next.history.slice(-60);
  try { localStorage.setItem(KEY, JSON.stringify(next)); } catch (e) {}
  setState({ save: next, view: 'report', report: { session: s, correct: c, causes: causes } });
}

/* Tag why question i of the reported round was missed. Writes through to the
   miss record so the error log can aggregate remedies. */
function setCause(i, key) {
  var rep = state.report;
  if (!rep) return;
  var q = rep.session.qs[i];
  var causes = assign(rep.causes || {}, {});
  causes[i] = key;
  var next = clone(save());
  var mk = q._for || q._k;
  if (next.misses[mk]) {
    next.misses[mk].cause = key;
    try { localStorage.setItem(KEY, JSON.stringify(next)); } catch (e) {}
    state.save = next;
  }
  setState({ report: assign(rep, { causes: causes }) });
}
function toggleTopic(tid) {

  persist(next);
}

var dataNote = '';
var showBackupText = false;

/* When this page runs inside the claude.ai artifact viewer it is sandboxed and
   cannot start its own download; the host mediates saves instead. Resolve that
   namespace if it exists — it arrives asynchronously and stays null everywhere
   else (a local file, static hosting), where the plain anchor works fine. */
var downloadsNS = null;
try {
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(function (ns) { downloadsNS = ns || null; }, function () {});
  }
} catch (e) {}
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

function backupPayload() {
  return JSON.stringify({ app: 'mcat-tracker', version: 1, exportedAt: new Date().toISOString(), data: save() }, null, 2);
}

/* Applies a parsed backup over the current save, asking first. Shared by the
   file and text restore paths. */
function applyBackup(incoming, sourceLabel) {
  var d = incoming && incoming.data ? incoming.data : incoming;
  if (!d || typeof d !== 'object' || !d.rounds || !d.done) {
    dataNote = 'That does not look like an MCAT Tracker backup.'; render(); return false;
  }
  var counts = plural(Object.keys(d.rounds).length, 'round', 'rounds') + ', ' +
               plural(Object.keys(d.done).length, 'topic', 'topics') + ' marked ready';
  if (!window.confirm('Replace all current progress with this backup (' + counts + ')?\n\nThis cannot be undone.')) {
    dataNote = 'Restore cancelled \u2014 nothing changed.'; render(); return false;
  }
  var b = blank();
  if (d.startedOn === undefined) d.startedOn = earliestDay(d) || CONFIG.prepStart;
  Object.keys(b).forEach(function (k) { if (d[k] === undefined) d[k] = b[k]; });
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (err) {}
  dataNote = 'Restored ' + counts + (sourceLabel ? ' from ' + sourceLabel : '') + '.';
  setState({ save: d });
  return true;
}

function toggleBackupText() { showBackupText = !showBackupText; dataNote = ''; render(); }

function restoreFromText() {
  var el = document.getElementById('dc-backup-text');
  if (!el || !el.value.trim()) { dataNote = 'Paste a backup into the box first.'; render(); return; }
  var incoming;
  try { incoming = JSON.parse(el.value); }
  catch (err) { dataNote = 'That text is not valid JSON.'; render(); return; }
  applyBackup(incoming, 'pasted text');
}

/* Three routes out, in order of preference: the host's mediated save, a plain
   anchor download, and failing both the text panel — so the save is always
   recoverable somewhere. */
function exportSave() {
  var name = 'mcat-tracker-' + dateKey(new Date()) + '.json';

  if (downloadsNS) {
    downloadsNS.save({ filename: name, data: backupPayload() }).then(function () {
      dataNote = 'Backup saved as ' + name + '.';
      render();
    }, function (err) {
      if (err && err.code === 'declined') {
        dataNote = 'Save cancelled \u2014 nothing was written.';
      } else {
        showBackupText = true;
        dataNote = 'A file could not be saved here \u2014 copy the text below instead.';
      }
      render();
    });
    dataNote = 'Confirm the save when your browser asks\u2026';
    render();
    return;
  }

  var ok = false;
  try {
    var url = URL.createObjectURL(new Blob([backupPayload()], { type: 'application/json' }));
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    ok = true;
  } catch (e) {}
  if (ok) {
    dataNote = 'Backup downloaded as ' + name + '. If no file appeared, use Backup as text below.';
  } else {
    showBackupText = true;
    dataNote = 'Downloads are blocked here \u2014 copy the text below instead.';
  }
  render();
}

function importSave(e) {
  var file = e.target.files && e.target.files[0];
  e.target.value = '';                       // so the same file can be picked twice
  if (!file) return;
  var reader = new FileReader();
  reader.onerror = function () { dataNote = 'Could not read that file.'; render(); };
  reader.onload = function () {
    var incoming;
    try { incoming = JSON.parse(reader.result); }
    catch (err) { dataNote = 'That file is not valid JSON.'; render(); return; }
    applyBackup(incoming, file.name);
  };
  reader.readAsText(file);
}

/* ------------------------------------------------------------------
   Derived view model
   One pass over state produces everything the screens draw.
   ------------------------------------------------------------------ */

/* One pip per round the scope can actually support — never five by default. */
function pipsFor(s, scopeId, scopeName, tr, A, titlePrefix) {
  var locked = s.status === 'locked';
  var out = [];
  for (var r = 1; r <= tr.avail; r++) {
    (function (r) {
      var rec = roundRec(scopeId, r);
      var pctv = rec ? Math.round(rec.c / rec.t * 100) : null;
      var passed = pctv !== null && pctv >= passMark();
      out.push({
        label: r,
        bg: locked ? '#F6F2F4' : passed ? A.a : rec ? A.soft : '#FFFFFF',
        fg: locked ? '#968D92' : passed ? '#FFFFFF' : rec ? A.deep : '#776A73',
        bd: locked ? '#EFE9EC' : passed ? A.a : rec ? A.bd : '#E9DFE4',
        title: locked ? 'Unlocks with the course' : rec ? titlePrefix + r + ' · ' + pctv + '%' : titlePrefix + r,
        start: function () { if (!locked) startRound(s.id, scopeId, scopeName, r); }
      });
    })(r);
  }
  return out;
}

function computeVals() {

  var tot = totals();

  var tDone = 0, tMast = 0, tAll = 0;

  var cursor = calCursorDate();

  var calLabel = '', cells = [], wk = { days: [], hours: [] };

  if (isMonth) {

    for (var ci = 0; ci < 42; ci++) {
      (function (ci) {
        var d = new Date(gs); d.setDate(gs.getDate() + ci);
        var k = dateKey(d);
        var inMonth = d.getMonth() === cursor.getMonth();
        var isT = k === todayKey;
        var list = byDay[k] || [];
        var cnt = sv.log[k] || 0;
        cells.push({
          num: d.getDate(),
          fg: isT ? '#FFFFFF' : inMonth ? '#2A1622' : '#787074',
          fw: isT ? 700 : 500,
          numBg: isT ? '#D4436B' : 'transparent',
          bg: inMonth ? '#FFFFFF' : '#FBF8F9',
          add: function () { openEditor(k, 'all'); },
          events: list.slice(0, 3).map(function (e) {
            var A2 = acc(e.subjId);
            return {
              title: (e.time === 'all' ? '' : fmtTime(e.time) + ' · ') + e.title,
              bg: A2.soft, fg: A2.deep, bar: A2.a,

            };
          }),

          chip: cnt ? '✓ ' + cnt + (cnt === 1 ? ' round' : ' rounds') : ''
        });
      })(ci);
    }
  } else {
    var wm = new Date(cursor); wm.setDate(wm.getDate() - ((wm.getDay() + 6) % 7));
    var we = new Date(wm); we.setDate(wm.getDate() + 6);
    calLabel = wm.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' – ' +
               we.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    for (var hh = 7; hh <= 21; hh++) wk.hours.push({ label: fmtTime(hh * 60) });
    for (var di = 0; di < 7; di++) {
      (function (di) {
        var d = new Date(wm); d.setDate(wm.getDate() + di);

        var isT = k === todayKey;

        }

          dow: d.toLocaleDateString('en-US', { weekday: 'short' }), num: d.getDate(),

            var A2 = acc(e.subjId);
            return { title: e.title, bg: A2.soft, fg: A2.deep, open: function () { openEditor(e.d, 'all', e.id); } };
          }),
          chip: cnt ? '✓ ' + cnt : '',
          slots: slots,
          events: list.filter(function (e) { return e.time !== 'all'; }).map(function (e) {
            var A2 = acc(e.subjId), t = parseInt(e.time, 10), dur = e.dur || 60;
            var top = Math.max(0, Math.min(636, (t - 420) / 60 * 44));
            var height = Math.max(24, Math.min(660 - top, dur / 60 * 44 - 3));

            };

      })(di);
    }
  }

  var agList = (byDay[todayKey] || []).map(function (e) {
    var A2 = acc(e.subjId);
    return { time: e.time === 'all' ? 'All day' : fmtTime(e.time), title: e.title, color: A2.a,

  vals.cal = {
    label: calLabel, isMonth: isMonth, isWeek: !isMonth,

      };
    }),

    plan: planTopics.map(function (p) {

    })

  // ---- session editor ----
  var edd = S.ed;
  vals.ed = edd ? {
    open: true,
    heading: edd.id ? 'Edit session' : 'New study session',

    dateLabel: parseDate(edd.dateKey).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }),
    title: edd.title,

    subjects: [{ id: '', name: 'General' }].concat(active.map(function (x) { return { id: x.id, name: x.name }; })).map(function (o) {
      var on = (edd.subjId || '') === o.id, A2 = acc(o.id);
      return {
        name: o.name, bg: on ? A2.a : '#FFFFFF', fg: on ? '#FFFFFF' : '#6E5266', bd: on ? A2.a : '#E9DFE4',
        pick: function () { setState({ ed: assign(edd, { subjId: o.id }) }); }

  var heat = [];
  for (var w = 11; w >= 0; w--) {
    var hcells = [];
    for (var dd = 0; dd < 7; dd++) {
      var d3 = new Date(mon); d3.setDate(mon.getDate() - w * 7 + dd);
      var cnt3 = sv.log[dateKey(d3)] || 0;
      hcells.push({
        bg: cnt3 >= 3 ? '#B03A5E' : cnt3 === 2 ? '#D4436B' : cnt3 === 1 ? '#F2AEC4' : '#F6F0F3',

  });

    .filter(Boolean)

      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px">' +
        '<div>' +
          '<div style="font-size:11.5px;font-weight:600;color:#6E5266;margin-bottom:7px">Time</div>' +
          selectEl(onChange(ed.setTime), ed.time, ed.timeOptions) +
        '</div>' +
        '<div>' +
          '<div style="font-size:11.5px;font-weight:600;color:#6E5266;margin-bottom:7px">Duration</div>' +
          selectEl(onChange(ed.setDur), ed.dur, ed.durOptions) +

      '</div>' +
      '<div style="display:flex;align-items:center;gap:10px;margin-top:24px">' +
        (ed.isEdit ? '<button ' + h(ed.del) + ' class="hv-rose" style="border:0;border-radius:9px;background:none;color:#C33F68;font-size:13px;font-weight:600;padding:10px 12px;transition:background .15s">Delete</button>' : '') +

      '</div>' +
    '</div>' +
  '</div>';
}

function viewStats(V) {
  var st = V.st;
  return '' +
  '<section class="scr" style="padding:52px 60px 88px;max-width:1060px;animation:rise .4s ease">' +

        return '<div class="statbar" style="display:grid;grid-template-columns:190px 1fr 58px;align-items:center;gap:18px">' +
          '<div style="font-size:13.5px;letter-spacing:-0.01em;color:#40293A">' + esc(b.name) + '</div>' +
          '<div style="height:8px;border-radius:99px;background:#F5EBEF">' +

    '<div style="border:1px solid #EFE6EA;border-radius:20px;background:#FFFFFF;padding:24px 26px">' +

      '<svg viewBox="0 0 560 110" style="width:100%;height:auto;display:block">' +
        '<line x1="8" y1="8" x2="552" y2="8" stroke="#F6F0F3" stroke-width="1"></line>' +

        '<line x1="8" y1="102" x2="552" y2="102" stroke="#F6F0F3" stroke-width="1"></line>' +
        (st.hasTrend ? '<polyline points="' + st.trendPts + '" fill="none" stroke="#4E2140" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.45"></polyline>' : '') +
        map(st.trendDots, function (p) {
          return '<circle cx="' + p.x + '" cy="' + p.y + '" r="4" fill="' + p.fill + '"><title>' + esc(p.title) + '</title></circle>';

    '</div>' +

    '<h2 style="font-family:\'Bricolage Grotesque\',serif;font-size:20px;font-weight:600;letter-spacing:-0.03em;margin:44px 0 18px">Weakest topics</h2>' +
    (st.hasWeak ?
      '<div style="border:1px solid #EFE6EA;border-radius:20px;background:#FFFFFF;padding:22px 26px;display:flex;flex-direction:column;gap:14px">' +
        map(st.weak, function (w) {
          return '<div class="statbar" style="display:grid;grid-template-columns:minmax(0,1fr) 130px 52px;align-items:center;gap:16px">' +
            '<div style="min-width:0">' +
              '<div style="font-size:13.5px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(w.topic) + '</div>' +
              '<div style="font-size:11.5px;color:#776A73;margin-top:2px">' + esc(w.meta) + '</div>' +
            '</div>' +
            '<div style="height:7px;border-radius:99px;background:#F5EBEF"><div style="height:7px;border-radius:99px;background:' + w.acc + ';width:' + w.pct + '%"></div></div>' +
            '<div style="font-size:13px;font-weight:700;text-align:right;color:' + w.acc + '">' + esc(w.label) + '</div>' +
          '</div>';
        }) +
      '</div>' : '') +
    (st.noWeak ? '<div style="border:1px dashed #E4DBE0;border-radius:16px;padding:18px 22px;font-size:13px;color:#7D6774;background:#FBF8F9">Shows once a topic has 3+ answered questions — the six lowest-accuracy topics land here.</div>' : '') +

    '<div style="display:flex;align-items:flex-end;justify-content:space-between;margin:44px 0 18px">' +
      '<h2 style="font-family:\'Bricolage Grotesque\',serif;font-size:20px;font-weight:600;letter-spacing:-0.03em;margin:0">Error log <span style="font-size:13px;font-weight:500;color:#776A73">· ' + esc(st.missCount) + '</span></h2>' +
      (st.hasMisses ? '<button ' + h(st.redoMisses) + ' class="hv-b93" style="border:0;border-radius:10px;background:linear-gradient(135deg,#D4436B,#A83057);color:#FFF;font-size:12.5px;font-weight:600;padding:9px 16px;transition:filter .15s">Redo my misses</button>' : '') +
    '</div>' +
    (st.hasMisses ?
      '<div style="border:1px solid #EFE6EA;border-radius:20px;background:#FFFFFF;padding:6px 26px">' +
        (st.causeSummary ? '<div style="font-size:12px;color:#776A73;padding:12px 0;border-bottom:1px solid #F8F3F5">Why they were missed: <span style="color:#40293A;font-weight:600">' + esc(st.causeSummary) + '</span></div>' : '') +
        map(st.missList, function (m) {
          return '<div class="mwrap" style="display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid #F8F3F5">' +
            '<span style="font-size:10px;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap;color:' + m.acc + ';background:' + m.soft + '">' + esc(m.topic) + '</span>' +
            '<div style="flex:1;min-width:0;font-size:13px;color:#40293A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(m.stem) + '</div>' +
            (m.cause ? '<span style="font-size:10.5px;font-weight:600;color:#776A73;background:#F6F2F4;padding:3px 8px;border-radius:6px;white-space:nowrap">' + esc(m.cause) + '</span>' : '') +
            '<span style="font-size:11.5px;font-weight:600;color:#C33F68;white-space:nowrap">' + esc(m.meta) + '</span>' +
          '</div>';
        }) +
      '</div>' : '') +
    (st.noMisses ? '<div style="border:1px dashed #E4DBE0;border-radius:16px;padding:18px 22px;font-size:13px;color:#7D6774;background:#FBF8F9">Missed questions land here, then their concepts resurface in the review queue at 1, 3, 7, 14 and 28-day intervals — a different question on the same topic when the bank has one — until cleared three times on separate days.</div>' : '') +

    '<h2 style="font-family:\'Bricolage Grotesque\',serif;font-size:20px;font-weight:600;letter-spacing:-0.03em;margin:44px 0 18px">Study history</h2>' +
    '<div style="border:1px solid #EFE6EA;border-radius:20px;background:#FFFFFF;padding:28px 30px">' +
      '<div style="display:grid;grid-template-columns:repeat(12,1fr);gap:6px">' +
        map(st.heat, function (w) {
          return '<div style="display:flex;flex-direction:column;gap:6px">' +
            map(w.cells, function (c) { return '<div title="' + esc(c.title) + '" style="height:14px;border-radius:4px;background:' + c.bg + '"></div>'; }) +
          '</div>';
        }) +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:10px;margin-top:18px;font-size:11.5px;color:#776A73">' +
        '<span>12 weeks ago</span><div style="flex:1;height:1px;background:#F3EAEE"></div><span>Today</span>' +
      '</div>' +
    '</div>' +

    '<h2 style="font-family:\'Bricolage Grotesque\',serif;font-size:20px;font-weight:600;letter-spacing:-0.03em;margin:44px 0 18px">Your data</h2>' +
    '<div style="border:1px solid #EFE6EA;border-radius:20px;background:#FFFFFF;padding:26px 30px">' +
      '<div style="font-size:13.5px;color:#6E5266;line-height:1.6;max-width:60ch">Everything lives in this browser only. Download a backup now and again \u2014 clearing site data, switching browsers or changing device wipes it otherwise.</div>' +
      '<div style="font-size:12.5px;color:#776A73;margin-top:10px">Currently saved: ' + esc(V.data.summary) + '</div>' +
      '<div style="display:flex;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap">' +
        '<button ' + h(V.data.exportSave) + ' class="hv-deep" style="border:0;border-radius:11px;background:#D4436B;color:#FFF;font-size:13.5px;font-weight:600;padding:12px 22px;transition:background .15s">Download backup</button>' +
        '<label class="hv-outline" style="display:inline-flex;align-items:center;border:1.5px solid #EFE6EA;border-radius:11px;background:#FFF;color:#4E2140;font-size:13.5px;font-weight:600;padding:12px 22px;cursor:pointer;transition:all .15s">Restore from file' +
          '<input type="file" accept="application/json,.json" ' + onChange(V.data.importSave) + ' style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" />' +
        '</label>' +
        '<button ' + h(V.data.toggleText) + ' class="hv-outline" style="border:1.5px solid #EFE6EA;border-radius:11px;background:#FFF;color:#4E2140;font-size:13.5px;font-weight:600;padding:12px 22px;transition:all .15s">' + (V.data.showText ? 'Hide backup text' : 'Backup as text') + '</button>' +
        (V.data.note ? '<span style="font-size:12.5px;color:#3F7F63">' + esc(V.data.note) + '</span>' : '') +
      '</div>' +
      (V.data.showText ?
        '<div style="margin-top:18px;border-top:1px solid #F6F0F3;padding-top:18px">' +
          '<div style="font-size:12.5px;color:#6E5266;line-height:1.6;max-width:62ch">Select all and copy this to save it anywhere \u2014 a note, an email to yourself. Pasting a backup in here and pressing Restore brings it back, on any device.</div>' +
          '<textarea id="dc-backup-text" spellcheck="false" style="width:100%;height:150px;margin-top:12px;border:1.5px solid #E9DFE4;border-radius:10px;padding:11px 13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.5;color:#40293A;background:#FCFAF9;resize:vertical">' + esc(V.data.payload) + '</textarea>' +
          '<button ' + h(V.data.restoreText) + ' class="hv-b93" style="margin-top:12px;border:0;border-radius:11px;background:linear-gradient(135deg,#D4436B,#A83057);color:#FFF;font-size:13.5px;font-weight:600;padding:11px 20px;transition:filter .15s">Restore from this text</button>' +
        '</div>' : '') +
    '</div>' +
  '</section>';
}
function tile(label, big, sub) {
  return '<div style="border:1px solid #EFE6EA;border-radius:18px;background:#FFFFFF;padding:22px 24px">' +
    '<div style="font-size:11.5px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#776A73">' + label + '</div>' +
    '<div style="font-family:\'Bricolage Grotesque\',serif;font-size:34px;font-weight:600;letter-spacing:-0.04em;margin-top:8px">' + esc(big) + '</div>' +
    '<div style="font-size:12px;color:#7D6774">' + esc(sub) + '</div>' +
  '</div>';
}

function viewApp(V) {
  var screen = V.isToday ? viewToday(V)
    : V.isSubjects ? viewSubjects(V)
    : (V.isSubject && V.subj) ? viewSubject(V)
    : (V.isRound && V.q) ? viewRound(V)
    : (V.isReport && V.rep) ? viewReport(V)
    : V.isCalendar ? viewCalendar(V)
    : V.isStats ? viewStats(V)
    : viewToday(V);
  return '<div class="app" style="display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;background:transparent;font-family:\'Public Sans\',system-ui,sans-serif;color:#2A1622">' +
    viewSidebar(V) +
    '<main style="min-width:0">' + screen + '</main>' +
  '</div>';
}

/* ------------------------------------------------------------------
   Render + event wiring
   The whole app repaints on every state change; handlers are looked up by
   index so the markup can stay a plain string.
   ------------------------------------------------------------------ */

var lastScreen = null;
function screenKey() {
  return [state.view, state.subjectId, state.session ? state.session.i : '', state.report ? 'r' : ''].join('|');
}
function render() {
  var y = window.scrollY;
  handlers = []; inputs = []; changes = [];
  root.innerHTML = viewApp(computeVals());
  var k = screenKey();
  // ticking a topic shouldn't fling the page back to the top; moving to a
  // different screen should. The repeat on the next frame covers the browser
  // clamping the first call against a not-yet-laid-out document.
  var target = k === lastScreen ? y : 0;
  lastScreen = k;
  window.scrollTo(0, target);
  requestAnimationFrame(function () { window.scrollTo(0, target); });
}

function fire(bank, attr, e) {
  var el = e.target.closest ? e.target.closest('[' + attr + ']') : null;
  if (!el || !root.contains(el)) return;
  var fn = bank[+el.getAttribute(attr)];
  if (fn) fn(e);
}
root.addEventListener('click', function (e) { fire(handlers, 'data-h', e); });
root.addEventListener('input', function (e) { fire(inputs, 'data-in', e); });
root.addEventListener('change', function (e) { fire(changes, 'data-ch', e); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && state.ed) { setState({ ed: null }); return; }
  // answer with the keyboard inside a round: A-D or 1-4 pick, F flags, Enter advances
  if (state.view !== 'round' || !state.session || state.ed) return;
  var t = e.target;
  if (t && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key.toLowerCase();
  var idx = 'abcd'.indexOf(k);
  if (idx === -1 && e.key >= '1' && e.key <= '4') idx = +e.key - 1;
  if (idx > -1) { e.preventDefault(); choose(idx); return; }
  if (k === 'f') { e.preventDefault(); toggleFlag(); return; }
  // preventDefault here also stops a focused button from double-firing on Enter
  if (e.key === 'Enter') { e.preventDefault(); primary(); }
});

/* ------------------------------------------------------------------
   Boot
   ------------------------------------------------------------------ */

var initialRoute = parseHash(location.hash);
state.view = initialRoute.view;
state.subjectId = initialRoute.subjectId;
state.save = load();
render();
try { history.replaceState(null, '', hashFor() || '#/today'); } catch (e) {}

// the countdown and the "today" highlights are day-grained, so only repaint
// when the date actually rolls over
var lastDay = dateKey(new Date());
setInterval(function () {
  var k = dateKey(new Date());
  if (k !== lastDay) { lastDay = k; render(); }
}, 60000);

})();
</script>
