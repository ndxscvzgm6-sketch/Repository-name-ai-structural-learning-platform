<script type="text/babel" data-presets="react">
/* ===== sq/practice.jsx ===== */
/* global React, Quint, SQMath */
// =====================================================================
// Practice — mistake-aware. Each wrong answer triggers a diagnostic
// based on which slip the student actually made (forgot ±, sign error,
// dropped i, etc.) — Quint never says "wrong", just "ooh, look here ↓"
// and shows side-by-side correct vs. their attempt.
// =====================================================================

const PRACTICE = [
  {
    id: "p1",
    prompt: "Solve. Type all answers, separated by commas.",
    math: "(d + 7)^2 - 4 = 0",
    accept: ["-5,-9", "-9,-5", "-5, -9", "-9, -5"],
    correctMath: ["(d+7)^2 = 4", "d + 7 = \\pm 2", "d = -5,\\, -9"],
    // Each slip detector: a regex/predicate + diag
    slips: [
      { match: (s) => /^[\s-]*5\s*$/.test(s) || /^[\s-]*9\s*$/.test(s),
        title: "You're only writing one answer.",
        diag: "When you square root, you get TWO solutions — one for +2 and one for −2. Don't lose the ±.",
        theirWork: ["d + 7 = 2", "d = -5"], correctWork: ["d + 7 = \\pm 2", "d = -5\\;\\text{ OR }\\;d = -9"] },
      { match: (s) => /^[\s]*5\s*,?\s*9\s*$/.test(s),
        title: "Signs flipped.",
        diag: "When you isolate \\;d\\;, you subtract 7 from both sides. \\;-7 \\pm 2\\; gives −5 and −9, not 5 and 9.",
        theirWork: ["d + 7 = \\pm 2", "d = 7 \\pm 2 = 5, 9"], correctWork: ["d + 7 = \\pm 2", "d = -7 \\pm 2 = -5, -9"] },
      { match: (s) => /^[\s]*2\s*,?\s*-2\s*$/.test(s),
        title: "Stopped one step too soon.",
        diag: "You found \\;d + 7 = \\pm 2\\;, but the question asks for \\;d\\;. Keep going!",
        theirWork: ["d + 7 = \\pm 2", "d = 2,\\, -2"], correctWork: ["d + 7 = \\pm 2", "d = -7 \\pm 2 = -5,\\, -9"] },
    ],
    explain: "Add 4: \\((d+7)^2 = 4\\). Square root: \\(d + 7 = \\pm 2\\). Subtract 7: \\(d = -5, -9\\).",
    hint: "First move: add 4 to both sides to isolate the square.",
  },
  {
    id: "p2",
    prompt: "Solve. Use \\(i\\) for \\(\\sqrt{-1}\\).",
    math: "c^2 + 36 = 0",
    accept: ["6i,-6i", "-6i,6i", "±6i", "+-6i", "6i, -6i", "-6i, 6i"],
    correctMath: ["c^2 = -36", "c = \\pm 6i"],
    slips: [
      { match: (s) => /^[\s±+\-]*6\s*$/.test(s) || /^[\s]*6\s*,\s*-?6\s*$/.test(s),
        title: "Forgot the imaginary part.",
        diag: "\\;c^2 = -36\\;, so you need \\;\\sqrt{-36}\\; — that's where \\;i\\; sneaks in: \\;\\sqrt{-36} = 6i\\;.",
        theirWork: ["c^2 = -36", "c = \\pm 6"], correctWork: ["c^2 = -36", "c = \\pm\\sqrt{-36} = \\pm 6i"] },
      { match: (s) => /no\s*solution/i.test(s) || /none/i.test(s),
        title: "There IS a solution — in the complex world.",
        diag: "In real numbers, you're right — no real \\;c\\; squares to give −36. But with \\;i = \\sqrt{-1}\\;, we get \\;c = \\pm 6i\\;.",
        theirWork: ["c^2 = -36", "(no real solution)"], correctWork: ["c^2 = -36", "c = \\pm 6i"] },
    ],
    explain: "Subtract 36: \\(c^2 = -36\\). Square root: \\(c = \\pm\\sqrt{-36} = \\pm 6i\\).",
    hint: "Move 36 first → then square root → \\(\\sqrt{-1} = i\\).",
  },
];

function PracticeDeck({ onDone }) {
  const [idx, setIdx] = React.useState(0);
  const [val, setVal] = React.useState("");
  const [feedback, setFeedback] = React.useState(null); // null | { kind, slip? }
  const [hintShown, setHintShown] = React.useState(false);
  const [xp, setXp] = React.useState(0);
  const item = PRACTICE[idx];

  const normalize = (s) => s.replace(/\s/g, "").toLowerCase();

  const submit = () => {
    if (!val.trim()) return;
    const v = normalize(val);
    if (item.accept.map(normalize).includes(v)) {
      setFeedback({ kind: 'correct' });
      setXp(x => x + 15);
      try { playChime(true); } catch (e) {}
      return;
    }
    const slip = item.slips.find(s => s.match(val));
    setFeedback({ kind: 'slip', slip: slip || {
      title: "Almost there.",
      diag: "Take another look — try working it step by step.",
      theirWork: [val], correctWork: item.correctMath,
    }});
    try { playChime(false); } catch (e) {}
  };

  const next = () => {
    if (idx < PRACTICE.length - 1) {
      setIdx(idx + 1);
      setVal(""); setFeedback(null); setHintShown(false);
    } else {
      onDone && onDone(xp);
    }
  };

  const padKey = (k) => {
    if (k === "⌫") setVal(v => v.slice(0, -1));
    else setVal(v => v + k);
  };

  const mood = feedback?.kind === 'correct' ? 'celebrating'
            : feedback?.kind === 'slip'    ? 'thinking'
            : 'encouraging';

  return (
    <div className="glass solver-card">
      {/* Progress */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14 }}>
        <div style={{ flex: 1, height: 10, borderRadius: 999, background: 'rgba(255,255,255,.5)', overflow: 'hidden' }}>
          <div style={{
            height: '100%',
            width: `${((idx + (feedback?.kind === 'correct' ? 1 : 0)) / PRACTICE.length) * 100}%`,
            background: 'linear-gradient(90deg, #A876E8, #D44C97)',
            borderRadius: 999,
            transition: 'width .4s'
          }} />
        </div>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12, fontWeight: 700, color: 'var(--ink-3)' }}>
          {idx + 1}/{PRACTICE.length}
        </div>
      </div>

      <div className="eyebrow">Practice</div>
      <h3 style={{ fontSize: 18, marginBottom: 4 }}>Your turn</h3>
      <p style={{ fontSize: 14, marginBottom: 10 }}>{item.prompt}</p>

      <div className="solver-prompt"><SQMath tex={item.math} /></div>

      <input
        className="q-input"
        value={val}
        onChange={(e) => setVal(e.target.value)}
        onKeyDown={(e) => { if (e.key === 'Enter' && val.trim() && !feedback) submit(); }}
        placeholder="type your answer"
        disabled={feedback?.kind === 'correct'}
        style={{ borderColor: feedback?.kind === 'correct' ? 'var(--good)' :
                              feedback?.kind === 'slip'    ? 'var(--warn)' : undefined,
                 background: feedback?.kind === 'correct' ? 'var(--good-soft)' :
                             feedback?.kind === 'slip'    ? 'var(--warn-soft)' : undefined }}
      />

      <div className="math-pad">
        {["±","√","i","(",")","-",",","⌫"].map(k => (
          <button key={k} className="pad-key" disabled={feedback?.kind === 'correct'} onClick={() => padKey(k)}>{k}</button>
        ))}
      </div>

      {/* Hint chip + Check answer */}
      {!feedback && (
        <div style={{ marginTop: 12, display: 'flex', gap: 8, alignItems: 'center' }}>
          <button className="btn-pill" onClick={() => setHintShown(true)} disabled={hintShown}>
            💡 Hint
          </button>
          <button className="btn btn-primary" style={{ flex: 1, minHeight: 44 }}
                  disabled={!val.trim()} onClick={submit}>
            Check answer
          </button>
        </div>
      )}
      {hintShown && !feedback && (
        <div className="hint-card" style={{ marginTop: 10 }}>
          <span className="h-tag">Hint</span>
          <p><SQMath tex={`\\text{${item.hint}}`} inline /></p>
        </div>
      )}

      {/* Feedback area */}
      {feedback?.kind === 'correct' && (
        <div style={{ marginTop: 16, display: 'flex', gap: 12, alignItems: 'center',
                      padding: 16, borderRadius: 22, background: 'var(--good-soft)',
                      border: '1.5px solid #B8E3CE' }}>
          <Quint mood="celebrating" size={56} idle={false} />
          <div style={{ flex: 1 }}>
            <h4 style={{ fontSize: 15, color: '#1F7A56' }}>Hooray, you did it!</h4>
            <p style={{ fontSize: 13.5, color: '#2D5A44', marginTop: 2 }}>+15 XP · streak safe</p>
          </div>
        </div>
      )}

      {feedback?.kind === 'slip' && (
        <div className="diff-card">
          <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start' }}>
            <Quint mood="thinking" size={50} idle={false} />
            <div className="bubble" style={{ background: 'white' }}>
              <strong style={{ color: '#B85284' }}>{feedback.slip.title}</strong><br />
              <span style={{ fontWeight: 500, fontSize: 13.5 }}>
                <SQMath tex={`\\text{${feedback.slip.diag}}`} inline />
              </span>
            </div>
          </div>

          <div className="diff-grid">
            <div className="diff-col you">
              <h4>YOUR PATH</h4>
              {feedback.slip.theirWork.map((line, i) => (
                <div key={i} className={`row ${i === feedback.slip.theirWork.length - 1 ? 'hl' : ''}`}>
                  <SQMath tex={line} inline />
                </div>
              ))}
            </div>
            <div className="diff-col right">
              <h4>BETTER PATH</h4>
              {feedback.slip.correctWork.map((line, i) => (
                <div key={i} className={`row ${i === feedback.slip.correctWork.length - 1 ? 'hl' : ''}`}>
                  <SQMath tex={line} inline />
                </div>
              ))}
            </div>
          </div>

          <button className="btn btn-soft" style={{ width: '100%', marginTop: 6 }}
                  onClick={() => { setFeedback(null); setVal(""); }}>
            Try again →
          </button>
        </div>
      )}

      {/* Bottom action */}
      {feedback?.kind === 'correct' && (
        <button className="btn btn-primary" style={{ width: '100%', marginTop: 12 }} onClick={next}>
          {idx < PRACTICE.length - 1 ? 'Next problem →' : 'Finish round ✓'}
        </button>
      )}
    </div>
  );
}

// Soft Tone-like chime via WebAudio (no library needed)
let _audioCtx = null;
function playChime(good) {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const ctx = _audioCtx;
  if (ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime;
  const freqs = good ? [523.25, 659.25, 783.99] : [392.0, 466.16];
  freqs.forEach((f, i) => {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, now + i * 0.06);
    g.gain.exponentialRampToValueAtTime(0.18, now + i * 0.06 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.06 + 0.35);
    o.connect(g).connect(ctx.destination);
    o.start(now + i * 0.06);
    o.stop(now + i * 0.06 + 0.4);
  });
}

window.PracticeDeck = PracticeDeck;
window.playChime = playChime;

</script>

<script type="text/babel" data-presets="react">
/* ===== sq/solver.jsx ===== */
/* global React, Quint, SQMath */
// =====================================================================
// AdaptiveSolver — walks the learner through a problem one step at a time.
// For each step: a "what's the first move?" prompt → optional nudge →
// optional hint → finally reveal the step (math + plain-English why).
// Color-coded tokens pulse purple/pink when something new appears.
// =====================================================================

const PROBLEM = {
  prompt: "q^2 - 169 = 0",
  steps: [
    {
      q: "What's the first move?",
      choices: [
        { text: "Move \\;-169\\; to the other side", correct: true,
          diag: null },
        { text: "Take the square root immediately", correct: false,
          diag: "Almost — we need the squared term alone first. Otherwise the \\sqrt\\, won't undo what we want." },
        { text: "Factor as a difference of squares", correct: false,
          diag: "That works too, but the Square Root Method is faster — let's isolate the squared term first." },
      ],
      nudge: "Notice the squared term isn't alone yet — what's next to it?",
      hint:  "Add 169 to both sides. The \\;-169\\; will cancel on the left.",
      reveal: {
        why:  "Move the constant so the squared term is by itself.",
        math: "q^2 = \\colorpur{169}",
      },
    },
    {
      q: "Now what?",
      choices: [
        { text: "Take the square root of both sides", correct: true, diag: null },
        { text: "Divide by 2",     correct: false, diag: "Dividing by 2 won't undo the square. We need its inverse — the square root." },
        { text: "Subtract 169",    correct: false, diag: "We just isolated the squared term — undoing it now would put us back where we started." },
      ],
      nudge: "What's the inverse of squaring something?",
      hint:  "Take \\;\\sqrt{\\phantom{x}}\\; on both sides — and don't forget the ± !",
      reveal: {
        why:  "Square root both sides. Remember: a square equals a positive number → two solutions, ±.",
        math: "q = \\colorpur{\\pm}\\sqrt{169}",
      },
    },
    {
      q: "Simplify:",
      choices: [
        { text: "q = \\pm 13", correct: true, diag: null },
        { text: "q = 13",     correct: false, diag: "Don't lose the ± — squaring either +13 or −13 gives 169." },
        { text: "q = \\pm \\sqrt{13}", correct: false, diag: "\\sqrt{169}\\; is 13 exactly, not \\sqrt{13}." },
      ],
      nudge: null,
      hint:  "What's \\;\\sqrt{169}\\;?",
      reveal: {
        why:  "13 × 13 = 169, so √169 = 13. Keep the ±.",
        math: "q = \\colorpur{\\pm 13}",
      },
    },
  ],
};

function AdaptiveSolver({ onComplete }) {
  const [stepIdx, setStepIdx] = React.useState(0);
  // Per-step state: { picked, hintLevel (0=none,1=nudge,2=hint), revealed }
  const [stepState, setStepState] = React.useState(() => PROBLEM.steps.map(() => ({ picked: null, wrongs: [], hintLevel: 0, revealed: false })));
  const [strategy, setStrategy] = React.useState("");
  const [strategyFeedback, setStrategyFeedback] = React.useState(null);
  const [strategyLoading, setStrategyLoading] = React.useState(false);

  const step = PROBLEM.steps[stepIdx];
  const st = stepState[stepIdx];
  const allDone = stepState.every(s => s.revealed);

  const updateStep = (patch) => {
    setStepState(prev => prev.map((s, i) => i === stepIdx ? { ...s, ...patch } : s));
  };

  const pick = (idx) => {
    const c = step.choices[idx];
    if (c.correct) {
      updateStep({ picked: idx, revealed: true });
    } else {
      updateStep({ picked: idx, wrongs: [...st.wrongs, idx] });
    }
  };

  const showHint = () => {
    if (st.hintLevel < 2) updateStep({ hintLevel: st.hintLevel + 1 });
    else updateStep({ revealed: true });
  };

  const nextStep = () => {
    if (stepIdx < PROBLEM.steps.length - 1) setStepIdx(stepIdx + 1);
  };

  // Quint mood: thinking if user struggling, excited on correct, encouraging otherwise
  let mood = 'encouraging';
  if (st.revealed) mood = 'excited';
  else if (st.wrongs.length > 0 || st.hintLevel > 0) mood = 'thinking';

  const submitStrategy = async () => {
    if (!strategy.trim()) return;
    setStrategyLoading(true);
    try {
      const text = await window.claude.complete({
        messages: [{
          role: 'user',
          content: `You are Quint, a warm, playful math mascot who never says anyone is wrong. A student just solved q² − 169 = 0 using the Square Root Method. They described the strategy in their own words:

"${strategy}"

Reply in 2 short, encouraging sentences. Acknowledge what they got right specifically, then gently add one tiny detail if they missed something (don't repeat their whole answer back). Be warm, lowercase, conversational. No exclamation marks before encouragement.`,
        }],
      });
      setStrategyFeedback(text.trim());
    } catch (e) {
      setStrategyFeedback("Love it — you nailed the big idea: isolate the squared term, square root both sides, and keep the ±. That's the whole method right there.");
    }
    setStrategyLoading(false);
  };

  return (
    <div className="glass solver-card">
      <div className="eyebrow">Worked example</div>
      <h3 style={{ fontSize: 18, marginBottom: 12 }}>Solve together</h3>

      <div className="solver-prompt">
        <SQMath tex={PROBLEM.prompt} />
      </div>

      {/* Show all previously revealed steps */}
      {stepState.slice(0, stepIdx).map((s, i) => (
        s.revealed && <RevealedStep key={i} num={i + 1} step={PROBLEM.steps[i]} />
      ))}

      {/* Current step */}
      {!allDone && (
        <div>
          <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10, margin: '8px 0 12px' }}>
            <div style={{ flexShrink: 0 }}><Quint mood={mood} size={56} /></div>
            <div className="bubble" style={{ marginTop: 2 }}>
              {st.hintLevel === 0 && step.q}
              {st.hintLevel === 1 && step.nudge && <SQMath tex={`\\text{${step.nudge}}`} inline />}
              {st.hintLevel === 1 && !step.nudge && <SQMath tex={`\\text{${step.hint}}`} inline />}
              {st.hintLevel === 2 && <SQMath tex={`\\text{${step.hint}}`} inline />}
            </div>
          </div>

          {!st.revealed && (
            <div className="choice-grid">
              {step.choices.map((c, i) => {
                const picked = st.picked === i;
                const wrong = st.wrongs.includes(i);
                const cls = wrong ? 'choice wrong' : picked && c.correct ? 'choice correct' : 'choice';
                return (
                  <button key={i} className={cls} disabled={wrong} onClick={() => pick(i)}>
                    <span className="letter">{String.fromCharCode(65 + i)}</span>
                    <span className="body"><SQMath tex={c.text} inline /></span>
                  </button>
                );
              })}
            </div>
          )}

          {/* Diagnostic for the latest wrong attempt */}
          {st.wrongs.length > 0 && !st.revealed && (() => {
            const w = st.wrongs[st.wrongs.length - 1];
            const diag = step.choices[w].diag;
            return diag && (
              <div className="hint-card" style={{ marginTop: 10 }}>
                <span className="h-tag">Look here</span>
                <p><SQMath tex={`\\text{${diag}}`} inline /></p>
              </div>
            );
          })()}

          {/* Hint stack — show progressive hints */}
          {/* (hint message already lives in Quint bubble) */}

          {!st.revealed && (
            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 12, gap: 8 }}>
              <button className="btn-pill" onClick={showHint}>
                {st.hintLevel === 0 && step.nudge ? '💡 Nudge me' :
                 st.hintLevel < 2 ? '💡 Bigger hint' : 'Show this step'}
              </button>
              <button className="btn-ghost btn" style={{ minHeight: 36, padding: '6px 14px', fontSize: 13 }}
                      onClick={() => updateStep({ revealed: true })}>
                Just show me →
              </button>
            </div>
          )}

          {st.revealed && (
            <div style={{ marginTop: 14 }}>
              <RevealedStep num={stepIdx + 1} step={step} fresh />
              <button className="btn btn-primary" style={{ width: '100%', marginTop: 10 }} onClick={nextStep}>
                {stepIdx < PROBLEM.steps.length - 1 ? 'Next step →' : 'Finish ✓'}
              </button>
            </div>
          )}
        </div>
      )}

      {/* Strategy reflection */}
      {allDone && (
        <div style={{ marginTop: 14, padding: 16, borderRadius: 22, background: 'rgba(232,220,251,.5)', border: '1px solid rgba(168,118,232,.3)' }}>
          <div style={{ display: 'flex', gap: 10, alignItems: 'center', marginBottom: 10 }}>
            <Quint mood="celebrating" size={48} />
            <h3 style={{ fontSize: 16 }}>Nice — you got it!</h3>
          </div>
          <p style={{ fontSize: 14, marginBottom: 10 }}>In your own words: what's the trick to the Square Root Method?</p>
          <textarea
            className="q-input"
            value={strategy}
            placeholder="e.g. get the squared part alone, then square root both sides with ±..."
            style={{ minHeight: 70, fontFamily: 'var(--font-body)', fontSize: 14, fontWeight: 500 }}
            onChange={(e) => setStrategy(e.target.value)}
          />
          {!strategyFeedback && (
            <button className="btn btn-primary" style={{ marginTop: 10, width: '100%' }}
                    disabled={strategyLoading || !strategy.trim()} onClick={submitStrategy}>
              {strategyLoading ? 'Quint is reading…' : 'Show Quint'}
            </button>
          )}
          {strategyFeedback && (
            <div style={{ marginTop: 12, display: 'flex', gap: 10, alignItems: 'flex-start' }}>
              <Quint mood="encouraging" size={48} />
              <div className="bubble">{strategyFeedback}</div>
            </div>
          )}
          {onComplete && strategyFeedback && (
            <button className="btn btn-soft" style={{ width: '100%', marginTop: 12 }} onClick={onComplete}>
              On to practice →
            </button>
          )}
        </div>
      )}
    </div>
  );
}

function RevealedStep({ num, step, fresh = false }) {
  // Replace \colorpur and \colorpink with spans (KaTeX color macros don't animate)
  const renderMathWithPulses = (tex) => {
    // Strip the macro for now; the pulse class will be applied via a wrapping span
    // We render plain tex and let the user 'see' the change via fresh: true highlight
    return tex.replace(/\\colorpur\{([^}]+)\}/g, '$1').replace(/\\colorpink\{([^}]+)\}/g, '$1');
  };
  return (
    <div className="step-row">
      <div className="num">{num}</div>
      <div>
        <div className="why">{step.reveal.why}</div>
        <div className={`math ${fresh ? 'tok-pulse-purple' : ''}`}>
          <SQMath tex={renderMathWithPulses(step.reveal.math)} inline />
        </div>
      </div>
    </div>
  );
}

window.AdaptiveSolver = AdaptiveSolver;

</script>

<script type="text/babel" data-presets="react">
/* ===== sq/app.jsx ===== */
/* global React, Quint, SQMath, SqrtManipulative, AdaptiveSolver, PracticeDeck, WhyDoesThisWork */
// =====================================================================
// App shell + Home + screens for the Square Root Method prototype.
// Screens: home → lesson → solver → practice → celebrate
// =====================================================================

const STORAGE_KEY = "mq-sqrt-v1";

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return {
    xp: 80,
    gems: 4,
    streak: 3,
    lastActiveISO: new Date().toISOString().slice(0, 10),
    mastery: { 'sqrt-method': 0.35 },  // 0..1
    completedToday: false,
    reviewQueue: [],  // [{ topicId, dueISO }]
  };
}
function saveState(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {}
}

function App() {
  const [screen, setScreen] = React.useState("home");
  const [state, setState] = React.useState(loadState);
  const [toast, setToast] = React.useState(null);
  React.useEffect(() => saveState(state), [state]);

  const showToast = React.useCallback((msg) => {
    setToast(msg);
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => setToast(null), 2200);
  }, []);

  // TTS read-aloud
  const speak = React.useCallback((text) => {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.95; u.pitch = 1.1;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }, []);

  const goto = (s) => { window.scrollTo(0, 0); setScreen(s); };

  const onCompletePractice = (gainedXp) => {
    setState(s => ({
      ...s,
      xp: s.xp + gainedXp,
      gems: s.gems + 1,
      mastery: { ...s.mastery, 'sqrt-method': Math.min(1, (s.mastery['sqrt-method'] || 0) + 0.25) },
      streak: s.streak + (s.completedToday ? 0 : 1),
      completedToday: true,
    }));
    goto("celebrate");
  };

  return (
    <div className="sq-app">
      <div className="sq-deco" aria-hidden="true">
        <span className="s1">∑</span>
        <span className="s2">∫</span>
        <span className="s3">π</span>
        <span className="s4">√</span>
        <span className="s5">∞</span>
      </div>

      {screen === "home" && <HomeScreen state={state} goto={goto} speak={speak} showToast={showToast} />}
      {screen === "lesson" && <LessonScreen state={state} goto={goto} speak={speak} showToast={showToast} />}
      {screen === "solver" && <SolverScreen goto={goto} showToast={showToast} />}
      {screen === "practice" && <PracticeScreen goto={goto} onDone={onCompletePractice} showToast={showToast} />}
      {screen === "celebrate" && <CelebrateScreen state={state} goto={goto} />}

      {toast && (
        <div style={{
          position: 'absolute', left: '50%', bottom: 88,
          transform: 'translateX(-50%)',
          background: 'rgba(42,26,74,.92)', color: 'white',
          padding: '10px 16px', borderRadius: 999,
          fontFamily: 'Quicksand, sans-serif', fontWeight: 700, fontSize: 13,
          boxShadow: '0 8px 24px rgba(0,0,0,.2)',
          zIndex: 100, animation: 'bubblePop .25s ease',
        }}>{toast}</div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────
function TopBar({ state, back }) {
  return (
    <div className="sq-topbar">
      {back ? (
        <button className="sq-back" onClick={back}>←</button>
      ) : (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <div style={{ width: 38, height: 38, borderRadius: 12, background: 'linear-gradient(135deg,#A876E8,#D44C97)', display: 'grid', placeItems: 'center', boxShadow: '0 3px 8px rgba(123,71,199,.25)' }}>
            <span style={{ color: 'white', fontFamily: 'Quicksand, sans-serif', fontWeight: 800, fontSize: 18 }}>√</span>
          </div>
          <div style={{ fontFamily: 'Quicksand, sans-serif', fontWeight: 800, fontSize: 17, color: 'var(--ink)' }}>
            Math Quest
          </div>
        </div>
      )}
      <div className="sq-stats">
        <div className="sq-stat" style={{ background: 'rgba(255,217,61,.3)' }}>
          <span className="sq-stat-ic">⚡</span><span>{state.xp}</span>
        </div>
        <div className="sq-stat" style={{ background: 'rgba(255,141,199,.3)' }}>
          <span className="sq-stat-ic">🔥</span><span>{state.streak}</span>
        </div>
        <div className="sq-stat" style={{ background: 'rgba(77,190,148,.3)' }}>
          <span className="sq-stat-ic">💎</span><span>{state.gems}</span>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────
function MasteryRing({ pct, size = 56, color = "#7B47C7" }) {
  const stroke = 6;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  return (
    <svg width={size} height={size}>
      <defs>
        <linearGradient id={`ring-${pct}`} x1="0" x2="1" y1="0" y2="1">
          <stop offset="0%" stopColor="#A876E8" />
          <stop offset="100%" stopColor="#D44C97" />
        </linearGradient>
      </defs>
      <circle cx={size/2} cy={size/2} r={r} fill="none"
              stroke="rgba(123,71,199,.15)" strokeWidth={stroke} />
      <circle cx={size/2} cy={size/2} r={r} fill="none"
              stroke={`url(#ring-${pct})`} strokeWidth={stroke}
              strokeDasharray={`${c * pct} ${c}`}
              strokeLinecap="round"
              transform={`rotate(-90 ${size/2} ${size/2})`} />
      <text x={size/2} y={size/2 + 4} textAnchor="middle"
            fontFamily="Quicksand, sans-serif" fontSize="13" fontWeight="800" fill="var(--ink)">
        {Math.round(pct * 100)}%
      </text>
    </svg>
  );
}

// ─────────────────────────────────────────────────────────────────────────
function HomeScreen({ state, goto, speak, showToast }) {
  const pct = state.mastery['sqrt-method'] || 0;
  return (
    <>
      <TopBar state={state} />
      <div className="sq-page" style={{ paddingTop: 4 }}>
        {/* Hero greeting with Quint */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, margin: '8px 4px 4px' }}>
          <Quint mood="encouraging" size={86} />
          <div style={{ flex: 1 }}>
            <div className="eyebrow" style={{ color: 'var(--q-purple)' }}>Good morning, friend</div>
            <h1 style={{ fontSize: 22, lineHeight: 1.15, marginTop: 2 }}>Let's solve some squares today.</h1>
          </div>
        </div>

        {/* Daily review (spaced repetition) */}
        <div className="glass" style={{ padding: 14, display: 'flex', gap: 12, alignItems: 'center' }}>
          <div style={{ width: 44, height: 44, borderRadius: 14, background: 'linear-gradient(135deg,#FFE3CC,#FFDFEB)', display: 'grid', placeItems: 'center', fontSize: 22 }}>👋</div>
          <div style={{ flex: 1 }}>
            <h3 style={{ fontSize: 14 }}>Quick review — 60 sec</h3>
            <p style={{ fontSize: 12.5, color: 'var(--ink-3)' }}>2 questions from yesterday's <em>Square Roots</em></p>
          </div>
          <button className="btn-pill" onClick={() => goto("practice")}>Start</button>
        </div>

        {/* Today's lesson card */}
        <div className="glass" style={{ padding: 18, position: 'relative', overflow: 'hidden' }}>
          <div style={{ position: 'absolute', right: -20, top: -10, fontSize: 90, opacity: .14, fontStyle: 'italic', color: 'var(--q-purple)', fontFamily: 'serif' }}>√</div>
          <div className="eyebrow">Continue</div>
          <h2 style={{ fontSize: 22, marginTop: 4 }}>The Square Root Method</h2>
          <p style={{ fontSize: 14, marginTop: 6, maxWidth: 280 }}>
            When a quadratic looks like <SQMath tex="\Box^2 = k" inline />, you can skip the long methods.
          </p>
          <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginTop: 16 }}>
            <MasteryRing pct={pct} size={58} />
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 12, color: 'var(--ink-3)', fontWeight: 700, fontFamily: 'JetBrains Mono, monospace', textTransform: 'uppercase', letterSpacing: '.1em' }}>
                Mastery
              </div>
              <div style={{ fontSize: 13.5, color: 'var(--ink-2)', fontWeight: 600 }}>
                {pct < .5 ? 'Just getting going' : pct < .8 ? 'Halfway there' : 'Almost mastered'}
              </div>
            </div>
            <button className="btn btn-primary" onClick={() => goto("lesson")} style={{ padding: '12px 20px' }}>
              Let's go →
            </button>
          </div>
        </div>

        {/* Skills grid (other units, faded) */}
        <div className="section-title">
          <h2>Up next</h2>
          <button className="more" style={{ background: 'transparent', border: 0, cursor: 'pointer', font: 'inherit', padding: 0 }}
                  onClick={() => showToast && showToast('Skill tree — coming soon')}>See path →</button>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
          {[
            { title: 'Completing the Square', emoji: '□', tone: 'peach' },
            { title: 'Equations of Lines',    emoji: '∕', tone: 'mint' },
            { title: 'Trig Sum & Difference', emoji: '∠', tone: 'pink' },
            { title: 'Partial Fractions',     emoji: '⁄', tone: 'lavender' },
          ].map((s, i) => (
            <button key={i} className="glass-2"
                    onClick={() => showToast && showToast(`${s.title} — coming soon`)}
                    style={{ padding: 14, opacity: .85, textAlign: 'left',
                             border: '1px solid rgba(255,255,255,.65)', cursor: 'pointer',
                             fontFamily: 'inherit', color: 'inherit' }}>
              <div style={{
                width: 38, height: 38, borderRadius: 12, marginBottom: 8,
                background:
                  s.tone === 'peach' ? 'linear-gradient(135deg,#FFE3CC,#FFD0AC)' :
                  s.tone === 'mint'  ? 'linear-gradient(135deg,#D8F2E2,#A8E5C2)' :
                  s.tone === 'pink'  ? 'linear-gradient(135deg,#FFDFEB,#FFB8D6)' :
                                       'linear-gradient(135deg,#E8DCFB,#C8B5F0)',
                display: 'grid', placeItems: 'center',
                fontSize: 20, fontWeight: 800, color: 'var(--ink)',
                fontFamily: 'Quicksand, sans-serif',
              }}>{s.emoji}</div>
              <div style={{ fontFamily: 'Quicksand, sans-serif', fontWeight: 700, fontSize: 13, lineHeight: 1.2 }}>{s.title}</div>
            </button>
          ))}
        </div>

        <BottomNav active="home" goto={goto} onComingSoon={showToast} />
      </div>
    </>
  );
}

// ─────────────────────────────────────────────────────────────────────────
function LessonScreen({ state, goto, speak, showToast }) {
  const [audioOn, setAudioOn] = React.useState(false);

  const conceptIntro = "When a quadratic looks like something squared equals a number, you can skip the long methods. Just isolate the square, then take the square root of both sides, and remember the plus or minus.";

  const toggleAudio = () => {
    if (audioOn) { window.speechSynthesis.cancel(); setAudioOn(false); }
    else { speak(conceptIntro); setAudioOn(true);
      try { window.speechSynthesis.addEventListener('end', () => setAudioOn(false)); } catch (e) {} }
  };

  return (
    <>
      <TopBar state={state} back={() => goto("home")} />
      <div className="sq-page">
        {/* Concept card */}
        <div className="glass concept-card">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 6 }}>
            <div className="eyebrow">Concept</div>
            <button className={`audio-chip ${audioOn ? 'on' : ''}`} onClick={toggleAudio}>
              <span style={{ fontSize: 14 }}>🔊</span>
              {audioOn ? 'Stop' : 'Read aloud'}
            </button>
          </div>
          <h2 style={{ fontSize: 22 }}>The Square Root Method</h2>
          <p style={{ marginTop: 8, fontSize: 14.5 }}>{conceptIntro}</p>

          <div className="formula-box">
            <SQMath tex="u^2 = k \quad\Longrightarrow\quad u = \pm\sqrt{k}" />
          </div>

          {/* Quint mascot row */}
          <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start', marginTop: 14 }}>
            <div style={{ flexShrink: 0 }}><Quint mood="encouraging" size={64} /></div>
            <div className="bubble">
              The <SQMath tex="\pm" inline /> is the most-forgotten step. Even pros write it on a sticky note. We'll keep reminding you.
            </div>
          </div>

          <div style={{ marginTop: 14 }}>
            <WhyDoesThisWork />
          </div>
        </div>

        {/* Manipulative */}
        <SqrtManipulative />

        {/* Try it together CTA */}
        <div className="glass" style={{ padding: 18, textAlign: 'center' }}>
          <Quint mood="excited" size={72} />
          <h3 style={{ fontSize: 17, marginTop: 6 }}>Ready to solve one together?</h3>
          <p style={{ fontSize: 13.5, marginTop: 4 }}>I'll walk you through, one tiny step at a time.</p>
          <button className="btn btn-primary" style={{ marginTop: 14, width: '100%' }} onClick={() => goto("solver")}>
            Let's solve together →
          </button>
        </div>

        <BottomNav active="learn" goto={goto} onComingSoon={showToast} />
      </div>
    </>
  );
}

// ─────────────────────────────────────────────────────────────────────────
function SolverScreen({ goto, showToast }) {
  return (
    <>
      <div className="sq-topbar">
        <button className="sq-back" onClick={() => goto("lesson")}>←</button>
        <div style={{ fontFamily: 'Quicksand, sans-serif', fontWeight: 800, fontSize: 15, color: 'var(--ink-2)' }}>
          Walk through
        </div>
        <div style={{ width: 38 }} />
      </div>
      <div className="sq-page">
        <AdaptiveSolver onComplete={() => goto("practice")} />
        <BottomNav active="learn" goto={goto} onComingSoon={showToast} />
      </div>
    </>
  );
}

// ─────────────────────────────────────────────────────────────────────────
function PracticeScreen({ goto, onDone, showToast }) {
  return (
    <>
      <div className="sq-topbar">
        <button className="sq-back" onClick={() => goto("home")}>←</button>
        <div style={{ fontFamily: 'Quicksand, sans-serif', fontWeight: 800, fontSize: 15, color: 'var(--ink-2)' }}>
          Your turn
        </div>
        <div style={{ width: 38 }} />
      </div>
      <div className="sq-page">
        <PracticeDeck onDone={onDone} />
        <BottomNav active="practice" goto={goto} onComingSoon={showToast} />
      </div>
    </>
  );
}

// ─────────────────────────────────────────────────────────────────────────
function CelebrateScreen({ state, goto }) {
  return (
    <div style={{ padding: '40px 22px', textAlign: 'center', position: 'relative', zIndex: 1 }}>
      <Quint mood="celebrating" size={150} idle={false} />
      <h1 style={{ fontSize: 28, marginTop: 16 }}>Hooray, you did it!</h1>
      <p style={{ marginTop: 8, fontSize: 15 }}>That's another lesson in the bag. Streak safe. Squares conquered.</p>

      <div style={{ display: 'flex', gap: 10, justifyContent: 'center', marginTop: 22 }}>
        {[
          { v: '+30', l: 'XP', bg: 'rgba(255,217,61,.3)' },
          { v: '+1',  l: 'Gem', bg: 'rgba(77,190,148,.3)' },
          { v: state.streak, l: 'Streak', bg: 'rgba(255,141,199,.3)' },
        ].map((r, i) => (
          <div key={i} style={{ background: r.bg, border: '1px solid rgba(255,255,255,.7)', borderRadius: 18, padding: '14px 16px', minWidth: 80 }}>
            <div style={{ fontFamily: 'Quicksand, sans-serif', fontWeight: 800, fontSize: 22 }}>{r.v}</div>
            <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 9.5, fontWeight: 700, letterSpacing: '.14em', textTransform: 'uppercase', color: 'var(--ink-3)' }}>{r.l}</div>
          </div>
        ))}
      </div>

      <div style={{ display: 'flex', gap: 10, marginTop: 30, justifyContent: 'center' }}>
        <button className="btn btn-soft" onClick={() => goto("home")}>Home</button>
        <button className="btn btn-primary" onClick={() => goto("lesson")}>One more →</button>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────
function BottomNav({ active, goto, onComingSoon }) {
  const map = { home: 'home', learn: 'lesson', practice: 'practice' };
  return (
    <div className="sq-nav">
      {[
        { id: 'home',    ic: '🏠', label: 'Home' },
        { id: 'learn',   ic: '📖', label: 'Learn' },
        { id: 'practice',ic: '🎯', label: 'Practice' },
        { id: 'profile', ic: '👤', label: 'Me' },
      ].map(n => (
        <button key={n.id} className={`nav-btn ${active === n.id ? 'active' : ''}`}
                onClick={() => {
                  if (n.id === 'profile') { onComingSoon && onComingSoon('Profile — coming soon'); return; }
                  goto && goto(map[n.id]);
                }}>
          <span className="ic">{n.ic}</span>
          {n.label}
        </button>
      ))}
    </div>
  );
}

window.SQApp = App;

</script>

<script type="text/babel" data-presets="react">
function Stage() {
  const [ready, setReady] = React.useState(!!(window.SQApp && window.IOSDevice));
  React.useEffect(() => {
    if (ready) return;
    const id = setInterval(() => {
      if (window.SQApp && window.IOSDevice) { setReady(true); clearInterval(id); }
    }, 50);
    return () => clearInterval(id);
  }, [ready]);

  if (!ready) {
    return <div style={{ padding: 40, color: '#5B4A82', fontFamily: 'Quicksand, sans-serif' }}>Loading Math Quest…</div>;
  }

  const SQApp = window.SQApp;
  const IOSDevice = window.IOSDevice;
  const isMobile = window.matchMedia('(max-width: 500px)').matches;

  if (isMobile) {
    return <SQApp />;
  }
  return (
    <div className="phone-stage">
      <div className="stage-strip ios-stage-strip">
        <div className="mark">√</div>
        <div style={{ fontSize: 15 }}>Math Quest — Square Root Method prototype</div>
        <div className="pill">v2 · pastel + Quint</div>
      </div>
      <IOSDevice width={402} height={830} dark={false}>
        <div className="ios-device-inner" style={{ height: '100%', overflow: 'auto', paddingTop: 46 }}>
          <SQApp />
        </div>
      </IOSDevice>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Stage />);
</script>

</body>
</html>
